<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日复习计划 · 艾宾浩斯遗忘曲线 · 十天搞定考研词汇</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:#f4f6f8;color:#222;line-height:1.6;}
.wrap{max-width:1000px;margin:0 auto;padding:20px 20px 70px;}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.top h1{font-size:23px;color:#1f3a5f;}
.top a{padding:7px 14px;border-radius:18px;background:#fff;border:1px solid #d7dee8;color:#2b5797;text-decoration:none;font-size:13px;margin-left:6px;display:inline-block;}
.top a:hover{background:#2b7cdd;color:#fff;border-color:#2b7cdd;}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 3px 12px rgba(31,58,95,.07);border-top:4px solid #2b7cdd;text-align:center;}
.stat b{font-size:24px;color:#1f3a5f;display:block;}
.stat span{font-size:12.5px;color:#7a8799;}
.stat.o{border-top-color:#e6a23c;}.stat.o b{color:#c87f10;}
.stat.g{border-top-color:#1c9e63;}.stat.g b{color:#138a55;}
.stat.p{border-top-color:#7a67d8;}.stat.p b{color:#5b48c0;}
.box{background:#fff;border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:0 3px 12px rgba(31,58,95,.07);}
.box h2{font-size:16px;color:#1f3a5f;margin-bottom:10px;}
.box h2 small{font-weight:normal;color:#8a96a5;font-size:12.5px;margin-left:8px;}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 4px;border-bottom:1px solid #f0f3f7;}
.row:last-child{border-bottom:none;}
.tag{font-size:12px;background:#eef4fc;color:#2b5797;border-radius:10px;padding:2px 10px;}
.tag.o{background:#fdf3e0;color:#c87f10;}
.tag.g{background:#eaf7f0;color:#138a55;}
.btn{border:none;border-radius:18px;padding:8px 20px;font-size:13.5px;cursor:pointer;color:#fff;background:#2b7cdd;}
.btn:hover{background:#1f66c2;}
.btn.g{background:#1c9e63;}.btn.g:hover{background:#138a55;}
.btn.p{background:#7a67d8;}.btn.p:hover{background:#6552c4;}
.mini{border:1px solid #d7dee8;background:#fff;border-radius:14px;padding:4px 12px;font-size:12px;color:#2b5797;cursor:pointer;}
.mini:hover{border-color:#2b7cdd;}
.muted{color:#9aa8b8;font-size:12.5px;}
.uprow{padding:7px 4px;border-bottom:1px dashed #eef1f5;font-size:13px;color:#7a8799;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
table.plan{width:100%;border-collapse:collapse;font-size:13px;}
table.plan td{border-top:1px solid #f0f3f7;padding:7px 6px;vertical-align:middle;}
table.plan td:first-child{color:#c87f10;font-weight:bold;white-space:nowrap;width:110px;}
/* session */
#sess{position:fixed;inset:0;background:linear-gradient(160deg,#eef4fc,#f8fbff);z-index:900;overflow:auto;padding:16px 14px 46px;}
.sess-top{max-width:640px;margin:0 auto 8px;display:flex;align-items:center;gap:10px;}
#sExit{border:1px solid #d7dee8;background:#fff;border-radius:16px;padding:6px 14px;font-size:13px;color:#5a6a7d;cursor:pointer;}
#sExit:hover{border-color:#2b7cdd;color:#2b7cdd;}
.sprog{flex:1;font-size:13px;color:#5a6f88;}
.smode{font-size:12px;color:#fff;background:#2b7cdd;border-radius:10px;padding:2px 10px;white-space:nowrap;}
.sbar{max-width:640px;margin:0 auto 18px;height:5px;background:#dbe6f2;border-radius:4px;overflow:hidden;}
#sBarFill{height:100%;width:0;background:linear-gradient(90deg,#2b7cdd,#56a3f0);transition:width .2s;}
.shead{max-width:640px;margin:0 auto 10px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:13px;color:#5a6f82;background:rgba(255,255,255,.78);border:1px solid #e2e8f0;border-radius:12px;padding:7px 12px;}
.aspbtn{background:#eef4fc;border:1px solid #d7e5f7;border-radius:10px;padding:2px 10px;font-size:12.5px;color:#2b5797;cursor:pointer;}
.aspbtn:active{transform:scale(.95);}
.shead b{color:#1f66c2;font-variant-numeric:tabular-nums;}
/* 5分钟/30分钟复习阶段：背景与学习界面区分开 */
#sess.ph-r5{background:linear-gradient(160deg,#fdf3dc,#fef9ec);}
#sess.ph-r5 .card{background:#fffdf3;border:1px solid #eed9a4;}
#sess.ph-r5 .smode{background:#e6a23c;}
#sess.ph-r5 #sBarFill{background:linear-gradient(90deg,#e6a23c,#f0c060);}
#sess.ph-r5 .shead{background:rgba(255,255,255,.88);border-color:#ecd9a3;color:#8a6d2b;}
#sess.ph-r30{background:linear-gradient(160deg,#fdeadd,#fef4ea);}
#sess.ph-r30 .card{background:#fffaf2;border:1px solid #f0c9a0;}
#sess.ph-r30 .smode{background:#e0803c;}
#sess.ph-r30 #sBarFill{background:linear-gradient(90deg,#e0803c,#e6a23c);}
#sess.ph-r30 .shead{background:rgba(255,255,255,.88);border-color:#ecc9a3;color:#9c5e1e;}
.card{max-width:640px;margin:0 auto;background:#fff;border-radius:18px;box-shadow:0 10px 34px rgba(31,58,95,.14);padding:30px 32px 22px;min-height:400px;display:flex;flex-direction:column;}
.cfront{display:flex;flex-direction:column;gap:10px;}
.ctimer{text-align:center;font-size:14px;color:#7a93ad;font-variant-numeric:tabular-nums;letter-spacing:.5px;}
.ctimer b{color:#1f66c2;font-weight:bold;}
.cw{font-size:40px;font-weight:bold;color:#1f3a5f;text-align:center;line-height:1.25;}
.cph{text-align:center;color:#5a83b8;font-size:16px;margin-top:2px;}
.csp{display:block;margin:6px auto 0;background:#eef4fc;border:none;border-radius:16px;padding:6px 18px;font-size:14px;color:#2b5797;cursor:pointer;}
.flipHint{text-align:center;color:#b3c2d4;font-size:12.5px;margin-top:4px;}
.cfront .cbtns{margin:14px 0 0;}
.cback{display:none;flex-direction:column;gap:9px;}
.card.flip .cfront{display:none;}
.card.flip .cback{display:flex;}
.cdef{font-size:17px;color:#333;text-align:center;line-height:1.7;}
.croot{font-size:13px;color:#138a55;background:#f2fbf6;border:1px dashed #bfe8d4;border-radius:8px;padding:6px 12px;text-align:center;}
.cex{background:#f8fafd;border-left:3px solid #b9d4f5;border-radius:0 8px 8px 0;padding:8px 12px;}
.cex .en{font-size:14.5px;color:#2b2b2b;line-height:1.75;}
.cex .zh{font-size:12.5px;color:#7a8799;margin-top:3px;line-height:1.6;}
mark.thl{background:#dff0ff;color:#1f66c2;font-weight:bold;padding:0 2px;border-radius:3px;}
.kbd{text-align:center;font-size:11.5px;color:#a9b8c9;margin-top:4px;}
.cused{text-align:center;font-size:12.5px;color:#8a96a5;margin-top:6px;}
.cnext{display:block;margin:10px auto 0;border:none;border-radius:18px;padding:9px 34px;font-size:14.5px;cursor:pointer;color:#fff;background:#2b7cdd;}
.cnext:hover{background:#1f66c2;}
.cbtns{display:flex;gap:10px;width:100%;}
.cbtns button{border:none;border-radius:18px;padding:10px 0;flex:1;font-size:13.5px;cursor:pointer;color:#fff;}
#bNo{background:#e08b6f;}#bNo:hover{background:#cf6f4f;}
#bMid{background:#e6a23c;}#bMid:hover{background:#cf8a1c;}
#bQuiz{background:#2b7cdd;}#bQuiz:hover{background:#1f66c2;}
#bYes{background:#37b37c;}#bYes:hover{background:#2c9866;}
.cbtns button:disabled{opacity:.35;cursor:not-allowed;}
/* 4-choice quiz overlay */
#quizMask{display:none;position:fixed;inset:0;background:rgba(20,30,45,.7);z-index:3100;align-items:center;justify-content:center;padding:18px;}
#quizMask.show{display:flex;}
.qbox{background:#fff;border-radius:18px;width:min(560px,94vw);padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.qbox .qh{font-size:15px;color:#5a6f82;margin-bottom:6px;}
.qbox .qw{font-size:30px;font-weight:bold;color:#1f3a5f;text-align:center;margin-bottom:4px;}
.qbox .qph{text-align:center;color:#7a93ad;font-size:14px;margin-bottom:14px;}
.qbox .qask{text-align:center;font-size:13.5px;color:#8a96a5;margin-bottom:14px;}
.qopts{display:flex;flex-direction:column;gap:9px;}
.qopt{border:1.5px solid #e2e8f0;border-radius:12px;padding:12px 16px;font-size:14.5px;color:#333;background:#fafcff;cursor:pointer;text-align:left;line-height:1.5;transition:border-color .12s,background .12s;}
.qopt:hover{border-color:#2b7cdd;background:#eef4fc;}
.qopt.correct{border-color:#37b37c;background:#eafaf1;color:#138a55;font-weight:bold;}
.qopt.wrong{border-color:#e08b6f;background:#fdeeec;color:#c0392b;}
.qopt.disabled{cursor:default;opacity:.6;}
.qfb{text-align:center;margin-top:12px;font-size:13.5px;min-height:20px;}
.qfb.ok{color:#138a55;}.qfb.no{color:#c0392b;}
.qnext{display:block;margin:14px auto 0;border:none;border-radius:18px;padding:8px 26px;font-size:14px;cursor:pointer;color:#fff;background:#2b7cdd;}
.qnext:hover{background:#1f66c2;}
.qnext:disabled{opacity:.35;cursor:not-allowed;}
.done{max-width:640px;margin:40px auto;text-align:center;background:#fff;border-radius:18px;padding:40px 30px;box-shadow:0 10px 34px rgba(31,58,95,.14);}
.done h2{color:#138a55;font-size:22px;margin-bottom:12px;}
.done p{color:#5a6f82;font-size:14.5px;line-height:2;}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 22px;border-radius:22px;font-size:13.5px;opacity:0;transition:opacity .25s;z-index:2000;pointer-events:none;}
#toast.show{opacity:.94;}
/* countdown card */
#cdBox .cdtime{font-size:32px;font-weight:bold;color:#1f66c2;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.2;}
#cdBox .cdlab{font-size:13px;color:#8a96a5;margin-top:3px;}
#cdBox .cdnext{font-size:14.5px;color:#456;margin-bottom:4px;}
.cdurgent{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(90deg,#fff3e0,#ffe9d2);border:1px solid #f0c48a;border-radius:12px;padding:13px 18px;animation:cdpulse 1.3s infinite;}
.cdurgent .cdn{font-size:20px;font-weight:bold;color:#c87f10;}
@keyframes cdpulse{0%,100%{box-shadow:0 0 0 0 rgba(230,162,60,.45);}50%{box-shadow:0 0 0 10px rgba(230,162,60,0);}}
/* 40天经典计划表 */
.ptbl{width:100%;border-collapse:collapse;font-size:13px;}
.ptbl th,.ptbl td{border:1px solid #e2e8f0;padding:4px 3px;text-align:center;min-width:50px;}
.ptbl th{background:#f4f8ff;color:#5a6f82;font-weight:normal;font-size:12px;}
.ptbl td.rowlab{background:#fafbfd;color:#8a96a5;font-size:12px;white-space:nowrap;min-width:40px;}
.ptbl td.today,.ptbl th.today{background:#fff3da;box-shadow:inset 0 0 0 2px #e6a23c;}
.pchip{display:inline-block;margin:1px 2px;padding:2px 8px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:13px;border:1px solid transparent;}
.pchip.new{background:#eaf3ff;color:#2b7cdd;border-color:#c3d9f5;}
.pchip.new:hover{background:#2b7cdd;color:#fff;}
.pchip.chk{background:#eafaf1;color:#1c9e63;border-color:#bfe8d2;}
.pchip.chk:hover{background:#1c9e63;color:#fff;}
.pchip.done{background:#f0f1f3;color:#a9b3bd;text-decoration:line-through;border-color:#e2e8f0;}
@media (max-width:640px){.statrow{grid-template-columns:repeat(2,1fr);}.card{padding:22px 18px;min-height:340px;}.cw{font-size:32px;}.cbtns button{font-size:13px;}}
</style>
</head>

0], "dists": [852, 1577, 1956]}], "sents": [{"en": "The rent of my tiny flat was almost [[unaffordable]] on a trainee's [[allowance]], so I walked to the office every morning to save money.", "zh": "实习生微薄的津贴几乎付不起我那间小公寓的房租，所以我每天早上步行去办公室省钱。"}, {"en": "Our editor, Ms. Chen, had spent thirty years in journalism and treated young reporters with respect rather than [[contempt]].", "zh": "我们的主编陈女士在新闻行业干了三十年，对年轻记者从不轻蔑，而是尊重。"}, {"en": "She said that a good reporter must never [[ignore]] a small voice, because the [[ultimate]] test of a story is whether ordinary people recognize their own lives in it.", "zh": "她说，好记者绝不能忽视微弱的声音，因为一篇报道最终的检验标准，是普通人能否在其中看见自己的生活。"}, {"en": "Every fact needs a [[context]], and every number hides a human story.", "zh": "每个事实都需要放在具体的语境里，每个数字背后都藏着一个人的故事。"}, {"en": "Her first lesson was to [[highlight]] the human detail instead of the official statement.", "zh": "她教我的第一课，是突出人的细节，而不是官方声明。"}, {"en": "She asked me to cover a public [[controversy]] over a new waste plant and warned me that official statements often [[contradict]] what residents actually experience.", "zh": "她派我去采访一座新垃圾处理厂引发的公众争议，并提醒我，官方说法常常与居民的真实感受相矛盾。"}, {"en": "Some reporters [[contend]] that facts speak for themselves; she disagreed.", "zh": "有些记者主张事实自会说话，她不同意。"}, {"en": "The assignment [[obliged|oblige]] me to [[transmit]] facts, not rumours.", "zh": "这项任务要求我传递事实，而不是传闻。"}, {"en": "I spent the morning checking [[statistical]] data from the [[council]].", "zh": "我花了一上午核对市政委员会提供的统计数据。"}, {"en": "The [[provision]] of basic services, I learned, depends on residents who [[contribute]] time and patience.", "zh": "我了解到，基本服务的供给依赖于愿意贡献时间和耐心的居民。"}, {"en": "Numbers rarely [[yield]] quick answers, and you should not [[overestimate]] a single interview.", "zh": "数字很少能立刻给出答案，也不该高估一次采访的作用。"}, {"en": "Being [[illiterate]] had made her dependent on others, yet she could [[deduce]] more from a meeting than many graduates.", "zh": "不识字让她处处依赖别人，但她从一场会议里推断出的东西，比许多大学毕业生还多。"}, {"en": "She pointed out a [[distinction]] the official report had missed: the plant would sit beside the only playground.", "zh": "她指出了官方报告遗漏的一个区别：处理厂就建在唯一的操场旁边。"}, {"en": "Her [[abstract]] worries became concrete when she [[illustrated|illustrate]] them with a hand-drawn map.", "zh": "她用手绘地图说明情况时，那些抽象的担忧一下子变得具体了。"}, {"en": "A [[capable]] official should [[elaborate]] such details instead of hiding behind jargon.", "zh": "一名称职的官员应当详细说明这些细节，而不是躲在术语后面。"}, {"en": "A [[coalition]] of parents and shop owners had formed, and every [[constituent]] group wanted to speak.", "zh": "一个由家长和店主组成的联盟已经形成，每个构成群体都想发言。"}, {"en": "People demanded [[transparency]], and the council had to [[coordinate]] the discussion so that one loud voice did not [[saturate]] the room.", "zh": "人们要求信息公开透明，委员会必须协调讨论，免得一个大嗓门淹没了整个会场。"}, {"en": "Their [[claims|claim]] were not [[irrational]]; the data had been [[manipulated|manipulate]], and no [[flattering]] speech could [[appease]] the crowd.", "zh": "他们的诉求并非不理性；数据被人操纵过，再奉承的讲话也安抚不了人群。"}, {"en": "A [[disruptive]] minority tried to shout others down.", "zh": "少数捣乱的人试图用喊声压过别人。"}, {"en": "It was a small victory, but it earned public [[acclaim]].", "zh": "这是一场小小的胜利，却赢得了公众的赞誉。"}, {"en": "The plan was not [[radical]]; it simply asked for clean water and honest answers.", "zh": "这个方案并不激进，它只是要求干净的水和诚实的回答。"}, {"en": "The council could not [[abdicate]] its duty to answer questions.", "zh": "委员会不能放弃回答问题的职责。"}, {"en": "I realized that a [[fancy]] slogan cannot solve an [[immediate]] crisis, and that we often [[underestimate]] the power of a calm question.", "zh": "我意识到，花哨的口号解决不了眼前的危机，而我们常常低估一个平静提问的力量。"}, {"en": "Fear can [[paralyse|paralyse]] or [[paralyze|paralyze]] a whole community; honest information can restore its confidence.", "zh": "恐惧会让整个社区陷入瘫痪，而诚实的信息能恢复它的信心。"}, {"en": "A sudden [[strike]] by truck drivers had already shown how quickly daily life can stop.", "zh": "卡车司机突然罢工，已经让人看到日常生活可以多快停摆。"}, {"en": "Back home, my roommate, a medical student, was reading about [[psychiatry]] and [[neurology]].", "zh": "回到家，我的室友——一名医学生——正在读精神病学和神经病学。"}, {"en": "She explained how stress can produce a [[syndrome]] that no scan can detect, and how a good doctor must [[convey]] bad news with [[sympathy]].", "zh": "她解释说，压力可能引发任何扫描都查不出的综合征；好医生必须以同理心传达坏消息。"}, {"en": "Her words seemed to [[correlate]] with everything I had seen that day.", "zh": "她的话似乎与我那天看到的一切相互印证。"}, {"en": "A [[temporary]] counselor at the office, she said, could [[eliminate]] more suffering than a pile of reports.", "zh": "她说，办公室里一位临时的心理咨询师，能消除的痛苦比一摞报告还多。"}, {"en": "Young workers are especially [[susceptible]] to burnout, and many [[encounter]] it before anyone notices.", "zh": "年轻员工尤其容易受影响而倦怠，很多人在被人察觉之前就已经遇上它了。"}, {"en": "On Friday a senior [[scholar]] from the local [[academy]] joined our review.", "zh": "周五，当地学院的一位资深学者参加了我们的评稿会。"}, {"en": "His [[submission]] was full of [[hierarchical]] rules and [[subsidiary]] notes that [[fascinated|fascinate]] me.", "zh": "他提交的稿件满是层级规则和辅助注释，让我着迷。"}, {"en": "He spoke about [[decision-making]] under pressure and about the [[glamor|glamor]] or [[glamour|glamour]] that surrounds awards.", "zh": "他谈到压力下的决策，也谈到奖项周围的光环。"}, {"en": "He told me to [[accustom|accustom]] myself to small, [[sufficient]] steps.", "zh": "他让我习惯一小步一小步、足够扎实地前进。"}, {"en": "A good policy, he added, is hard to [[implement]] and even harder to [[regulate]].", "zh": "他还说，好政策难以实施，更难监管。"}, {"en": "On Saturday I visited the university's [[magnificent]] old library.", "zh": "周六，我去参观了大学那座宏伟的老图书馆。"}, {"en": "Its [[ornaments|ornament]] and paintings had a [[supreme]] beauty, and a student [[orchestra]] was rehearsing on the lawn.", "zh": "它的装饰和绘画有一种至高的美，一支学生管弦乐队正在草坪上排练。"}, {"en": "The music seemed to [[embrace]] the whole square.", "zh": "音乐仿佛拥抱了整个广场。"}, {"en": "I thought about the [[stereotype]] people hold about journalists, and promised myself to [[dedicate]] my work to something more [[legitimate]].", "zh": "我想到人们对记者的刻板印象，并暗下决心，要把工作献给更有正当意义的事。"}, {"en": "A good story must go beyond the [[surface]]; there is no [[patent]] for honesty.", "zh": "好报道必须超越表面，而诚实从来不是谁的专利。"}, {"en": "Honesty is a quiet [[virtue]].", "zh": "诚实是一种安静的美德。"}, {"en": "A [[coherent]] story needs more than facts; it needs [[instinct]] and empathy.", "zh": "一篇连贯的报道不只需要事实，还需要直觉和共情。"}, {"en": "From a single sentence you can deduce a [[character]], and from a small detail you can infer a whole life.", "zh": "从一句话里能推断出一个人的性格，从一个小细节里能看出他的一生。"}, {"en": "A story that insults the reader's [[intellect]] will not last.", "zh": "一篇侮辱读者智力的报道不会长久。"}, {"en": "Modern life [[adapts|adapt]] quickly, yet many of our habits are [[nondurable]].", "zh": "现代生活适应得很快，可我们的许多习惯却并不持久。"}, {"en": "Social media can [[encompass]] almost every side of a debate, but algorithms usually [[recommend]] what we already believe.", "zh": "社交媒体几乎能涵盖一场争论的方方面面，但算法通常只推荐我们已经相信的东西。"}, {"en": "True [[collaboration]] begins when we meet an opposing view.", "zh": "真正的合作，始于我们面对相反观点的时候。"}, {"en": "No [[indefensible]] argument survives an honest question, and some decisions are better to [[defer]] until we are [[mature]] enough to face them.", "zh": "站不住脚的论点经不起一个诚实的提问；有些决定，最好推迟到我们足够成熟再面对。"}, {"en": "The light from the stage began as a [[blaze]] and then softened; the [[rhythm]] was so precise that I wanted to [[recite]] the melody aloud.", "zh": "舞台的灯光起初像一团烈火，随后柔和下来；节奏精准得让我想把旋律大声背诵出来。"}, {"en": "The stage lights [[emitted|emit]] a warm glow.", "zh": "舞台灯光发出温暖的光。"}, {"en": "The [[deadline]] for my next article was Monday, but I felt no [[impatience]].", "zh": "下一篇稿子的截稿日是周一，可我一点也不急躁。"}, {"en": "The [[predominance]] of calm in that hall was a lesson in itself.", "zh": "那个大厅里占主导地位的宁静，本身就是一堂课。"}, {"en": "On the bus home I [[calculated|calculate]] my monthly budget.", "zh": "回家的公交车上，我计算了每月的预算。"}, {"en": "A [[robot]] vacuum cleaner had caught my eye in a shop window, but it was an [[artificial]] need created by advertising; the [[sophisticated]] version cost more than my rent.", "zh": "橱窗里一台扫地机器人吸引了我的目光，可那是广告制造出来的人造需求；功能复杂的那款比我的房租还贵。"}, {"en": "I decided to [[appease]] my desire with a cheap notebook instead.", "zh": "我决定用一本便宜的笔记本安抚自己的欲望。"}, {"en": "I made a small [[donation]] to the community centre.", "zh": "我给社区中心捐了一点钱。"}, {"en": "An [[anonymous]] donor had paid for the concert tickets, and a small [[token]] of [[gratitude]] seemed the right response.", "zh": "音乐会门票是一位匿名捐赠者付的钱，送上一点象征性的感谢似乎才合适。"}, {"en": "I felt [[optimistic]] about the week ahead.", "zh": "我对接下来的一周感到乐观。"}, {"en": "The paper's next [[feature]] would be about [[agricultural]] land on the edge of the city, where prices are [[volatile]].", "zh": "报社下一篇特写写的是城郊的农业用地，那里的价格起伏不定。"}, {"en": "The work was hard, the pay was low, and my name might remain [[unrecognized]] for years.", "zh": "工作辛苦，报酬微薄，我的名字也许许多年都不会被人记住。"}, {"en": "Yet I was beginning to understand the [[nucleus]] of the job: to [[regard]] every reader as a [[peer]], to [[demonstrate]] facts rather than opinions, and to [[ensure]] that a reasonable [[timescale]] is [[set]] for every promise.", "zh": "但我开始明白这份工作的核心：把每位读者当作同辈，展示事实而不是观点，并确保每个承诺都有合理的时间表。"}, {"en": "One Friday a leaked report caused public [[outrage]].", "zh": "某个周五，一份泄露的报告引发了公众的愤怒。"}, {"en": "Our editor had to [[forecast]] how readers would react and to [[enforce]] a simple rule: verify before publishing.", "zh": "主编必须预测读者的反应，并执行一条简单的规则：先核实，再发表。"}, {"en": "A [[license]] (or [[licence]]) to publish is also a duty to be accurate; without it, [[diffused|diffuse]] rumours can spread [[extraordinarily]] fast.", "zh": "出版许可是权利，也是准确报道的责任；没有它，流散的谣言会传播得异常迅速。"}, {"en": "We must [[adhere]] to that rule even when a story is urgent.", "zh": "即使新闻很紧急，我们也必须坚持这条规则。"}, {"en": "Facts should [[accompany]] every opinion, and a good reporter must [[guarantee]] that names and numbers are correct.", "zh": "每个观点都该有事实相伴，好记者必须保证人名和数字准确无误。"}, {"en": "That night I wrote an [[apology]] to Mrs. Zhou for a careless sentence in my draft.", "zh": "那天夜里，我为一处草率的句子给周阿姨写了道歉信。"}, {"en": "Her reply was [[appreciative]]; she said my correction had [[gratified|gratify]] her more than the article itself.", "zh": "她的回信充满感激；她说我的更正比文章本身更让她欣慰。"}, {"en": "The [[sacred]] part of this work, I realized, is not the acclaim but the trust.", "zh": "我明白，这份工作神圣的部分不是赞誉，而是信任。"}, {"en": "An [[adult]] can [[withdraw]] from public life, but a [[democratic]] community must keep talking.", "zh": "成年人可以从公共生活中退场，但一个民主的社区必须继续对话。"}, {"en": "The whole [[endeavor]] (or [[endeavour]]) felt worthwhile.", "zh": "这整份努力让人觉得值得。"}, {"en": "[[Throughout]] the year, I hope to keep listening.", "zh": "这一年里，我希望能一直倾听。"}, {"en": "My editor asked me to [[acknowledge]] a mistake in print, a move that would [[enhance]] the paper's reputation.", "zh": "主编让我在报上公开承认一处错误，这一举动提升了报社的声誉。"}, {"en": "She believed that [[empirical]] evidence should guide policy, and that [[lenient]] rules work better than a [[perpetual]] [[prohibition]] that only [[perplexes|perplex]] readers.", "zh": "她相信经验证据应当指导政策，而宽松的规则比一条只会让读者困惑的永久禁令更有效。"}, {"en": "The [[entire]] staff agreed.", "zh": "全体员工都同意。"}, {"en": "Seen from a wider [[perspective]], an [[ineffective]] law damages trust more than an [[unprecedented]] one.", "zh": "从更广阔的视角看，一条无效的法律比一条前所未有的法律更损害信任。"}, {"en": "[[Admission]] of error is a [[deliberate]] choice, not a weakness.", "zh": "承认错误是一种深思熟虑的选择，而不是软弱。"}, {"en": "The city [[granted|grant]] us access to the records, and an [[international]] news agency quoted our story.", "zh": "市政府批准我们查阅档案，一家国际通讯社还引用了我们的报道。"}, {"en": "A [[famous]] poet once wrote a [[poem]] about a city that forgot its own river.", "zh": "一位著名诗人曾写过一首诗，讲一座城市忘记了自己的河流。"}, {"en": "One [[notable]] detail stayed with me: the poet never named the river.", "zh": "有一个值得注意的细节留在我心里：诗人始终没有写出那条河的名字。"}, {"en": "Reading it, I could [[envision]] a better paper, one that listens first and writes second.", "zh": "读着它，我仿佛看见一份更好的报纸——先倾听，再写作。"}]}, {"key": "五星词汇 Day 01 List 2", "words": [{"w": "humble", "phon": "[ˈhʌmb(ə)l]", "def": "adj.谦逊的；虚心的；卑微的v.感到谦卑；感到自惭", "si": [0, 60], "r": "hum(泥土)+ble(性质)→低到泥土里", "dists": [870, 3229, 3205]}, {"w": "instru mn I had been a research assistant in a big city, and I had told everyone that small towns had nothing to offer.", "zh": "前一年秋天，我还在大城市做研究助理，逢人便说小地方没什么可给的。"}, {"en": "The bus dropped me two streets from the [[clinic]], and the rain had already [[upset]] my timetable.", "zh": "大巴在离诊所两条街的地方把我放下，而雨已经把我的时间安排打乱了。"}, {"en": "A delay was [[inevitable]] on that road, so I had learned to stay [[flexible]].", "zh": "在那条路上误点是必然的，所以我早就学会了随机应变。"}, {"en": "My mother's [[primary]] concern, as always, was not the rain but the queue of patients outside her door.", "zh": "母亲最关心的从来不是雨，而是门口排队等着的病人。"}, {"en": "Her [[instrument]]s were old but clean, and she kept them in a case that had belonged to her own teacher.", "zh": "她的器械旧但干净，收在一只属于她老师的箱子里。"}, {"en": "A thin woman in a [[stiff]] coat sat by the window, her face full of [[wrinkle]]s that the grey light made deeper.", "zh": "一位穿硬挺外套的瘦女人坐在窗边，脸上的皱纹被灰白光映得更深。"}, {"en": "My mother [[prescribed|prescribe]] a small [[dose]] of a cheap drug and then explained, in a [[compassionate]] voice, why the fever would pass.", "zh": "母亲开了一小剂便宜药，然后用温和体贴的语气解释烧为什么会退。"}, {"en": "She never [[exaggerate]]d a [[diagnosis]], and she never let a frightened farmer feel [[inferior]].", "zh": "她从不夸大诊断，也从不让一个害怕的农民觉得自己低人一等。"}, {"en": "That evening, [[exhaust]]ed, she fell asleep in her chair with her glasses still on.", "zh": "那天晚上，她筋疲力尽地睡在椅子上，眼镜都忘了摘。"}, {"en": "Two days later a boy came in with a cough that would not stop, and by then something had begun to [[infect]] half the village.", "zh": "两天后，一个男孩来了，咳嗽停不下来；那时有东西已经开始感染半个村子。"}, {"en": "The [[initial]] results were [[ambiguous]], and the technician's [[terminology]] meant nothing to the family.", "zh": "最初的结果模棱两可，技术员说的术语那家人一句也听不懂。"}, {"en": "My mother had to [[undergo]] a long argument with the county hospital before they sent a second team.", "zh": "母亲跟县医院争论了很久，对方才派出第二支小队。"}, {"en": "The drug would [[alleviate]] the fever but not the cause, and I tried to [[concentrate]] on the numbers while she talked to the mother.", "zh": "药能减轻高烧却治不了病因；她跟孩子母亲说话时，我努力把注意力放在数字上。"}, {"en": "An old doctor from the health [[bureau]] arrived to [[instruct]] us in the [[preliminary]] steps.", "zh": "卫生局的一位老医生赶来，指导我们做最初的几步处置。"}, {"en": "He said the water was the most [[plausible]] source, though he could not [[confirm]] it yet.", "zh": "他说水是最像样的源头，尽管他还无法证实。"}, {"en": "The family's insurer refused to pay, citing a [[clause]] on page nine.", "zh": "这家的保险公司拒赔，援引的是第九页上的一条条款。"}, {"en": "The wording was [[ambiguous]], and the [[representative]] on the phone read it in a tone that made us sound like [[alien]] intruders.", "zh": "措辞含糊不清，电话里的代表念条款的语气，仿佛我们是闯入的外人。"}, {"en": "Their [[advisory]] letter said the policy was [[conditional]] on a report we did not have, and that we should [[comply]] with a form that had never been sent.", "zh": "他们的告知信说保单以一份我们没有的报告为条件，还要求我们填一张从未寄来的表格。"}, {"en": "My mother asked whether the refusal was [[relevant]] to the boy's treatment; the woman said it was policy.", "zh": "母亲问拒赔与孩子的治疗有没有关系；对方说这是规定。"}, {"en": "In law, my mother told me, a rule that cannot be explained to a patient is not [[equivalent]] to justice.", "zh": "母亲说，在法律上，一条无法向病人解释清楚的规则并不等于公正。"}, {"en": "No family should [[deserve]] to be treated as a file number, and no clinic should [[assume]] that a small claim will be dropped.", "zh": "没有哪个家庭活该被当成一个卷宗号，也没有哪家诊所该假定小额的索赔会被放弃。"}, {"en": "We drove to the county seat to see Wei, a lawyer who had once worked [[undercover]] in a drug company.", "zh": "我们开车去县城见魏律师，他曾在药企做过暗访。"}, {"en": "He could [[anticipate]] every argument the insurer would make, but he was [[reluctant]] to promise a [[client]] with no money anything.", "zh": "他能预料保险公司的每一种说法，却不愿对一个没钱的委托人做任何承诺。"}, {"en": "He said he could not [[prosecute]] on this evidence, though he could [[allege]] a pattern of delay; a [[conviction]] was rare, and an [[appeal]] was cheaper than a trial and far more likely to [[expedite]] a payment.", "zh": "他说凭这些证据无法起诉，但可以指称存在一套拖延的做法；这类案子很少能定罪，而申诉比打官司便宜，也更能加快赔款。"}, {"en": "He also said the director could not be [[arrest]]ed over a civil [[dispute]], however dishonest his letters were.", "zh": "他还说，哪怕对方的信写得再不老实，一场民事纠纷也不能逮捕公司负责人。"}, {"en": "Then he showed us a [[duplicate]] of a 1998 [[statute]] with a clause about rural clinics that almost nobody used, and after one afternoon of [[deliberation]] he took the case for a fee that was almost [[dirt-cheap]].", "zh": "接着他给我们看了一份1998年法规的副本，里面有条关于乡村诊所的条款，几乎没人用过；考虑了一个下午后，他以近乎便宜到不像话的收费接下了案子。"}, {"en": "The town had been built around a mine, and its [[ethos]] still belonged to another century.", "zh": "这座镇子围着矿场建起来，它的精神气质仍属于另一个世纪。"}, {"en": "In the assembly hall a [[portrait]] of a [[monarch]] hung above the door, and beside it a photograph of a [[sovereign]] who had never visited.", "zh": "礼堂门上挂着一幅君主的肖像，旁边是一位从未到访过的元首的照片。"}, {"en": "The town had a [[democracy]] of sorts, but the mine owner's word carried more [[prestige]] than any vote.", "zh": "镇子勉强算有民主，可矿主一句话的声望胜过任何一张选票。"}, {"en": "Owning land here was a [[privilege]] that came with an unwritten [[commitment]]: you did not sell to strangers.", "zh": "在这里拥有土地是一种特权，也附带一个不成文的承诺：不卖给外人。"}, {"en": "My grandfather used to say that a [[statute]] on paper and a custom in the square were two different animals.", "zh": "祖父常说，纸上的法规和广场上的习俗是两种完全不同的东西。"}, {"en": "He also said that a bad decision, once made in public, is very hard to [[overturn]].", "zh": "他还说，一个糟糕的决定一旦当众作出，就很难再推翻。"}, {"en": "I spent three afternoons in the [[archive]] behind the library, a [[repository]] of maps, letters and ledgers.", "zh": "我在图书馆后面的档案馆待了三个下午，那里存放着地图、信件和账本。"}, {"en": "The [[format]] of the old registers was beautiful and useless, every entry written in a different hand.", "zh": "旧登记册的版式漂亮却没用，每一笔都是不同的字迹。"}, {"en": "I tried to [[track]] each plot through ninety years of sales with [[rigorous]] notes, and I drew an [[approximate]] map of the old mine.", "zh": "我靠着严谨的笔记追查每一块地九十年间的转手记录，还画了一张老矿区的粗略地图。"}, {"en": "Some chains were [[traceable]], others vanished into a [[rough]] notebook, and one file held the [[autobiography]] of a mine engineer written in [[terminology]] and silence.", "zh": "有些链条可以追溯，有些则消失在一本粗糙的笔记本里；还有一份档案是一位矿山工程师的自传，用的是术语和沉默的语言。"}, {"en": "The paper was [[authentic]]; it held an [[outline]] of a 1958 town plan, the most [[concrete]] thing in the place, and its pencil marks were still [[discernible]] after sixty years.", "zh": "那张纸是真品，里面有一份1958年城镇规划的纲要，是整个档案室里最实在的东西，上面的铅笔痕迹过了六十年仍可辨认。"}, {"en": "We started with an [[integer]] and ended with the [[infinite]], a strange distance to cross in forty minutes.", "zh": "我们从整数讲起，讲到无穷，四十分钟里跨过这样一段距离实在奇怪。"}, {"en": "The children wrote their [[hypotheses]] on the board, and I asked them to [[articulate]] what they expected to see; one girl insisted the [[geo-centric]] model was obviously wrong, and she was right, though not for the reason she gave.", "zh": "孩子们把假设写在黑板上，我让他们清楚地说出预期看到什么；一个女孩坚持说地心模型显然错了，她是对的，尽管理由不是她说的那个。"}, {"en": "We built a [[compound]] from two [[component]]s and watched a [[catalyst]] turn a cloudy liquid clear, a small [[phenomenon]] more convincing than any lecture.", "zh": "我们用两种成分合成一种化合物，看着催化剂把浑浊的液体变清，这个小现象比任何讲解都有说服力。"}, {"en": "The [[atmosphere]] in the room changed at once, and my mother joked that my [[lingual]] skills were better than my medical ones, since I could explain a word but not a lung.", "zh": "教室里的气氛立刻变了；母亲开玩笑说我的语言本事比医术强，因为我讲得清一个词，却讲不清一片肺。"}, {"en": "A travelling [[troupe]] came to the hall in November with a play about a miner's widow.", "zh": "十一月，一个巡回剧团来到礼堂，演一出关于矿工遗孀的戏。"}, {"en": "The actress could [[portray]] grief without a single false note, and her voice was [[mournful]] and [[exquisitely]] controlled.", "zh": "那位女演员演悲伤没有一处虚假，声音哀戚，控制得极为精细。"}, {"en": "The play was a [[tribute]] to the people who had stayed, and the audience [[appreciate|appreciate]]d it more than any [[display]] of fireworks.", "zh": "这出戏是写给留下来的人的颂词，观众对它的欣赏胜过任何一场烟花。"}, {"en": "My mother [[commend]]ed the young actor afterwards, and his [[reputation]] in the town was made that night.", "zh": "母亲事后称赞了那位年轻演员，那一晚他在镇上的名声就立住了。"}, {"en": "She said the theatre did not [[entitle]] anyone to a living, but it did keep a place honest.", "zh": "她说戏剧并不能给谁一份生计的资格，却能让一个地方保持诚实。"}, {"en": "In December a [[multinational]] firm wrote offering to buy the mine and the land around it.", "zh": "十二月，一家跨国公司来信，提出收购矿场和周边土地。"}, {"en": "Its [[annual]] [[revenue]] was larger than the town's whole budget, and its [[subscription]] to the local paper had bought it friendly headlines for years.", "zh": "它的年收入比全镇预算还多，而它给本地报纸的订阅费多年买来了友善的标题。"}, {"en": "The firm was [[upfront]] about one thing: it wanted the water rights, and it would pay for them.", "zh": "这家公司在一点上很坦率：它要水权，也愿意为此付钱。"}, {"en": "They offered a [[mortgage]] deal so generous that it looked almost [[implausible]]; a [[predecessor]] of the present manager had made the same offer and then [[retreat]]ed when the price of coal fell.", "zh": "他们提供的按揭条件优厚得几乎让人难以相信；现任经理的前任提过同样的条件，煤价一跌就退走了。"}, {"en": "This time the company was patient and [[promising]], and it had already begun to [[extend]] its [[possession]]s along the river.", "zh": "这一次公司既有耐心又给人以希望，而且已开始沿河扩展它的地产。"}, {"en": "Villagers were told the offer would [[diminish]] after March, a claim that sounded like a threat dressed as a favour.", "zh": "村民被告知三月之后报价就会减少，这话听着像把威胁装扮成恩惠。"}, {"en": "The assembly hall was full on a cold Tuesday, and someone put a [[motion]] on the table.", "zh": "一个寒冷的周二，礼堂坐满了人，有人提出了动议。"}, {"en": "After two hours of [[dispute]] the room reached a [[consensus]] that surprised everyone, though the company's lawyer made one [[concession]] after another, and each [[compromise]] cost the town something it could not name.", "zh": "争论两小时后，会场达成了令所有人意外的共识，尽管公司律师一再让步，而每一次妥协都让镇子失去一些说不清的东西。"}, {"en": "There was real [[discontent]] in the back rows, and a young man tried to [[disrupt]] the vote.", "zh": "后排是真实的不满，一个年轻人试图搅乱表决。"}, {"en": "By nine o'clock there was a [[discernible]] change in the room and the chairman had to [[command]] silence; the [[intervention]] of two old miners did more than any threat.", "zh": "到九点，屋里出现了可察觉的变化，主席不得不大声要求安静；两位老矿工的介入比任何威胁都管用。"}, {"en": "The motion passed by a narrow margin, nobody applauded, and the result [[frustrate|frustrate]]d almost everyone, which is usually the sign of a real compromise.", "zh": "动议以微弱优势通过，没人鼓掌，结果几乎让所有人都不满意——这通常才是真正妥协的标志。"}, {"en": "For a week I could not sleep, and I began to [[speculate]] about what I would do if the clinic closed.", "zh": "有一个星期我睡不着，反复揣测诊所关门后自己该怎么办。"}, {"en": "The [[potential]] loss frightened me more than the company did, and I [[resent]]ed the town for making me choose before I [[condemn]]ed myself for resenting it.", "zh": "那种可能的失去比公司更让我害怕；我怨恨这座镇子逼我做选择，随后又因这份怨恨而谴责自己。"}, {"en": "My mother, who had every reason to be [[arrogant]] about thirty years of service, stayed [[humble]] and [[loyal]] to her patients.", "zh": "母亲完全有理由为三十年的服务而自傲，她却始终谦逊，忠于病人。"}, {"en": "Her [[conscience]] was a [[constant]] [[companion]] that never let her [[retreat]] into easy cynicism, and she said a [[commitment]] made in public has to be kept in private.", "zh": "她的良知是始终如一的同伴，从不许她退缩到轻松的冷嘲里去；她说当众许下的承诺必须私下守住。"}, {"en": "For the first time I understood that a place can [[determine]] a life without ever asking permission.", "zh": "我第一次明白，一个地方能决定一个人的一生，而从不问你是否同意。"}, {"en": "In January the mine's owners began to [[exploit]] the confusion, [[assert]]ing that the clinic was [[irregular]] and that its records were incomplete.", "zh": "一月，矿主们开始利用这场混乱，断言诊所有不规范的经营，记录也不完整。"}, {"en": "A firm of auditors arrived to [[confine]] the staff to one room and to [[inventory]] every bottle on the shelves.", "zh": "一家审计公司来了，把员工都限制在一个房间里，还清点架上每一只瓶子。"}, {"en": "They found nothing that could [[devastate]] us, though a single missing page was enough for a headline.", "zh": "他们没找到能摧毁我们的东西，可缺了一页纸就足够登上头条。"}, {"en": "The company's [[external]] advisers called my mother an amateur, a claim so [[implausible]] that even the editor laughed.", "zh": "公司的外部顾问说我母亲是外行，这话假得连编辑都笑了。"}, {"en": "Their [[intelligence]] on our case was poor; they had assumed that a rural clinic would never find a lawyer.", "zh": "他们对我们案子的情报很差，以为乡下诊所永远找不到律师。"}, {"en": "In the end they took the [[extreme]] step of asking the county to [[overrule]] our lease, and the county refused.", "zh": "最后他们使出极端的一招，请县里否决我们的租约，县里拒绝了。"}, {"en": "In February the insurer paid, quietly, without a [[tribute]] or an apology.", "zh": "二月，保险公司悄悄赔付了，没有颂词也没有道歉。"}, {"en": "Wei said we could [[conclude]] the case there, and that a second appeal would only waste the family's money.", "zh": "魏律师说案子可以就此了结，再申诉只会浪费那家人的钱。"}, {"en": "I began to [[contemplate]] staying for another year.", "zh": "我开始考虑再留一年。"}, {"en": "It was a decision that demanded [[deliberation]], and for once I did not [[associate]] it with failure.", "zh": "这是个需要仔细权衡的决定，而我头一次没把它和失败联系在一起。"}, {"en": "I had been [[preoccupied|preoccupy]] with my own career; now the town occupied me.", "zh": "我曾经满脑子是自己的事业，如今占据我的是这座镇子。"}, {"en": "The school asked me to stay until the [[eclipse]] in March, when the science club would watch the moon cover the sun.", "zh": "学校请我留到三月的日食，那时科学社团要一起看月亮遮住太阳。"}, {"en": "I said yes, mostly because the [[tougher]] questions came from the children, not from the company.", "zh": "我答应了，主要是因为更难的问题来自孩子而不是公司。"}, {"en": "We built a [[frame]] of cardboard and a lens, and the whole class fell silent at the first bite of shadow.", "zh": "我们用纸板做了个框，装上镜片，阴影刚咬住太阳边，全班就安静下来。"}, {"en": "The head teacher, who had once been a [[counselor]] and still spelled the word [[counsellor]] on the old sign, said my [[engagement]] with the children mattered more than my degree.", "zh": "校长从前做过顾问，学校旧牌子上至今拼作 counsellor，她说我和孩子们的相处比我的学位更重要。"}, {"en": "She also [[overrule|overrule]]d my plan to cancel the trip when the bus broke down.", "zh": "大巴抛锚时，她还否决了我取消行程的计划。"}, {"en": "A [[domestic]] quarrel over seats lasted ten minutes and then dissolved into laughter.", "zh": "一场为座位而起的家庭争吵持续了十分钟，然后化成了笑声。"}, {"en": "That night she said home has a [[connotation]] she could not explain, and that an [[authentic]] life is usually a small one.", "zh": "那天夜里她说，“家”这个词有一种她解释不清的隐含意味，而真实的生活通常很小。"}, {"en": "I told her I wanted to [[consolidate]] what I had learned before going back to the city, and we agreed to stay in [[contact]] with the lawyer, the school and the boy's family.", "zh": "我告诉她，我想在回城之前把学到的东西巩固下来；我们约好和律师、学校以及男孩家保持联系。"}, {"en": "I would [[associate]] that winter with antiseptic, wet wool and a [[frequent]] bus leaving at six.", "zh": "以后我想到那个冬天，就会想到消毒水、湿羊毛和六点那班频繁驶出的车。"}, {"en": "Nothing had been solved completely, but the town and I had begun to [[collaborate]] on something modest and real.", "zh": "没有什么被彻底解决，但镇子和我已经开始在一件朴素而真实的事情上合作。"}, {"en": "Every building on the street had to [[conform]] to the same grey rules, yet the people inside were anything but identical.", "zh": "街上每栋房子都得遵守同样灰扑扑的规则，可住在里面的人却各不相同。"}]}, {"key": "四星词汇 Day 02 List 3", "words": [{"w": "abide", "phon": "[əˈbaɪd]", "def": "v.遵守；忍受；居住；逗留", "si": [45], "dists": [3224, 2394, 1526]}, {"w": "eager", "phon": "[ˈɡər]", "def": "adj.热切的；渴望的", "si": [1], "dists": [2139, 2009, 2836]}, {"w": "machine", "phon": "[məˈʃin]", "def": "n.机器；机械", "si": [33], "dists": [1403, 1998, 930]}, {"w": "vaccine", "phon": "[vækˈn]", "def": "n.疫苗", "si": [0], "dists": [2923, 2424, 315]}, {"w": "facile", "phon": "[ˈfæs(ə)l]", "def": "adj.轻率的；肤浅的；易做到的", "si": [67], "r": "fac(做)+ile(易于)→容易做到的", "dists": [742, 2585, 1071]}, {"w": "habitat", "phon": "[ˈhæbɪtæt]", "def": "n.栖息地；居留地；产地", "si": [16], "dists": [884, 3262, 2515]}, {"w": "ideal", "phon": "[aɪˈdiəl]", "def": "adj.理想的n.理想；典范", "si": [65], "dists": [885, 1280, 665]}, {"w": "tactic", "phon": "[ˈtæktɪk]", "def": "n.战术；策略", "si": [19, 22], "dists": [321, 895, 808]}, {"w": "tactics", "phon": "[ˈtæktɪks]", "def": "n.策略；战术", "si": [22], "dists": [320, 895, 808]}, {"w": "contest", "phon": "[ˈkɑntest]", "def": "n.比赛；竞赛v.竞争；争夺；争辩；辩驳", "si": [23], "r": "con(一起)+test(测试)→一起比拼", "dists": [3478, 7, 351]}, {"w": "identify", "phon": "[aɪˈdentɪfaɪ]", "def": "v.鉴定；识别；确认", " d something of an [[innovator]]; he had spent ten years in shipping before he [[propose]]d a plant that would make [[protein]] for a [[vaccine]].", "zh": "创始人是一位移民企业家，也算个革新者；他在航运业干了十年，才提出建一座为疫苗生产蛋白质的工厂。"}, {"en": "I was [[eager]] to join, even though the building was cold, damp and deeply [[unattractive]].", "zh": "我很想加入，尽管那栋楼又冷又潮，实在不好看。"}, {"en": "He said the plan was [[straightforward]]: turn an empty shell into a clean, [[efficient]] facility by spring.", "zh": "他说计划很简单：到春天把一座空壳变成干净高效的厂房。"}, {"en": "I liked that he was [[straight]] with me about the money, because the company was almost [[illiquid]].", "zh": "我喜欢他在钱的事上跟我直说，因为公司几乎没什么流动资金。"}, {"en": "My first task was a survey of the [[conversion]] itself.", "zh": "我的第一项任务是勘察这次改建本身。"}, {"en": "The roof leaked, the [[insulation]] was gone, the walls had to be [[insulated|insulate]] twice over, and the old [[ventilation]] shafts carried more snow than air.", "zh": "屋顶漏水，保温层早就没了，墙得做两遍保温，而旧的通风管道里装的雪比空气还多。"}, {"en": "We would need new [[heating]], an [[electric]] boiler and a [[battery]] big enough to carry the freezers through a storm.", "zh": "我们需要新的供暖、一台电锅炉，以及一块足以让冷库熬过风暴的电池。"}, {"en": "The quotes were [[immense]], the price of copper had begun to [[soar]], and the [[technology]] was newer than anything in the town.", "zh": "报价高得惊人，铜价开始飙升，而那套技术比镇上任何东西都新。"}, {"en": "The founder wanted to [[recoup]] the money in four years, which struck me as [[prudent]] only if nothing went wrong.", "zh": "创始人想在四年内收回成本，我觉得这只有在一切顺利时才算谨慎。"}, {"en": "Before we could [[install]] anything, the state regulator sent a [[consultant]] to [[verify]] our plans.", "zh": "我们还没开始安装，州监管机构就派了一位顾问来核实方案。"}, {"en": "He was [[impartial]] and rather [[bureaucratic]], and he asked for a [[valid]], [[unbiased]] [[account]] of every process.", "zh": "他公正而颇为官僚，要求我们对每道工序给出有效且不带偏见的说明。"}, {"en": "A [[panel]] of three would [[judge]] the application, and [[disclosure]] of all suppliers was mandatory.", "zh": "由三人组成的专家组将评审申请，而且必须披露所有供应商。"}, {"en": "We had to [[subscribe]] to a national register and [[correspond]] with it monthly, which nobody had mentioned.", "zh": "我们得订阅一个国家登记系统并每月与它通信，这事此前没人提过。"}, {"en": "He warned us that a [[vague]] answer would be read as a [[deceptive]] one.", "zh": "他警告我们，含糊的回答会被当成欺骗性的回答。"}, {"en": "The neighbours in the [[residential]] street behind us were less enthusiastic.", "zh": "我们后面那条住宅街上的邻居没那么热情。"}, {"en": "For them the plant was an [[unwanted]] [[intrusion]], and a few [[oppose]]d it openly at the first public meeting.", "zh": "在他们看来，这座工厂是不受欢迎的闯入者，有几个人在第一次公开会上公开反对。"}, {"en": "One woman [[accuse]]d us of [[invading|invade]] a [[habitat]] that belonged to birds, children and old people.", "zh": "一位女士指责我们侵占了属于鸟、孩子和老人的栖息地。"}, {"en": "They saw themselves as the [[victim]]s of a decision made in another city, and a man [[scold]]ed me for ten minutes without once [[glancing|glance]] at the plans.", "zh": "他们觉得自己是别的城市做出的决定的受害者；有位男士训了我十分钟，一次也没看图纸。"}, {"en": "A single [[instance]] of rudeness can set the tone for a year, and some of their fears were [[undesirable]] for us yet entirely reasonable.", "zh": "一次无礼就足以定下一年的基调；他们有些担忧对我们不利，却完全合理。"}, {"en": "Our opponents used a [[familiar]] [[tactic]]: a series of small [[provocation]]s until someone lost his [[temper]].", "zh": "对手用了老一套策略：一连串小挑衅，直到有人发脾气。"}, {"en": "The chair, a woman of steady [[temperament]], [[handled|handle]]d it better than I did.", "zh": "主席是位性情沉稳的女士，处理得比我好。"}, {"en": "She refused to answer [[random]] questions and insisted on one subject at a time.", "zh": "她拒绝回答东一句西一句的问题，坚持一次只谈一个主题。"}, {"en": "I learned that [[tactics]] matter more than volume, and that [[panic]] is often a decision.", "zh": "我明白了战术比嗓门重要，而恐慌往往是一种选择。"}, {"en": "By the end of that summer the project had become a legal [[contest]] rather than a technical one.", "zh": "到那个夏天结束时，项目已变成一场法律较量，而不是技术问题。"}, {"en": "Our opponents made a [[lame]] argument about property values, and the [[judge]] gave it little weight.", "zh": "对手拿房产价值做了个站不住脚的论证，法官几乎没给它分量。"}, {"en": "The real [[obstacle]] was not the law but the [[strain]] on the town's narrow roads.", "zh": "真正的障碍不是法律，而是镇子狭窄道路承受的压力。"}, {"en": "[[Contrary]] to what the local paper printed, we won, though by a narrow [[margin]].", "zh": "与本地报纸所写相反，我们赢了，尽管优势微弱。"}, {"en": "The [[bargain]] we struck was simple: we would pay for the road repairs ourselves.", "zh": "我们达成的交易很简单：修路的钱我们自己出。"}, {"en": "My roommate is a [[neuroscientist]] who studies [[stress]] and the [[immune]] system.", "zh": "我的室友是研究压力与免疫系统的神经科学家。"}, {"en": "She says the [[psychology]] of a town under pressure is no [[illusion]]: people [[absorb]] the mood of their neighbours.", "zh": "她说，一个压力之下的镇子的心理并非错觉：人会吸收邻居的情绪。"}, {"en": "A [[gene]] may set a threshold, but the environment decides when it is crossed.", "zh": "基因也许设定了阈值，但是否越线由环境决定。"}, {"en": "Her favourite [[paradox]] is that the more we [[obsess]] over risk, the worse we [[judge]] it.", "zh": "她最喜欢的悖论是：我们越痴迷于风险，就越判断不准。"}, {"en": "At work I began to [[automate]] the sample line, wearing the same white [[garment]] as the operators.", "zh": "工作中我开始把取样线自动化，穿的和操作工一样的白工作服。"}, {"en": "One [[machine]] could do the work of three technicians, and its [[capacity]] doubled our output.", "zh": "一台机器能顶三个技术员，其产能让我们的产量翻倍。"}, {"en": "We had to [[obtain]] clean data before we could [[identify]] the [[target]] protein.", "zh": "我们得先取得干净的数据，才能确认目标蛋白质。"}, {"en": "Every batch [[varied|vary]] slightly, which made [[accurate]] measurement the whole game.", "zh": "每批都略有不同，所以精确测量成了全部关键。"}, {"en": "By March we could [[accomplish]] in a day what had taken a week, and I began to [[deploy]] the spare staff on quality checks.", "zh": "到三月，我们一天就能干完过去一周的活，我开始把多余的人手派去做质量检查。"}, {"en": "In April an investor flew in from the capital, a man of [[immense]] energy and [[vast]] ambitions.", "zh": "四月，一位投资人从首都飞来，精力旺盛，野心极大。"}, {"en": "He was [[eligible]] for a [[substantial]] tax break, and he wanted a [[bonus]] if we met the deadline.", "zh": "他有资格享受一笔可观的税收减免，还想在我们按期完工时拿奖金。"}, {"en": "He asked for a [[version]] of the plan he could show his board, so we [[designate]]d one page as the summary.", "zh": "他要一份能拿给董事会的方案版本，于是我们把其中一页指定为摘要。"}, {"en": "I spent a weekend building a [[catalog]] of equipment, and he barely looked at it.", "zh": "我花了一个周末做设备目录，他几乎没看。"}, {"en": "His [[purpose]] was obvious: he wanted a story he could sell, not a plant he could run.", "zh": "他的目的很明显：他要一个能卖出去的故事，而不是一座能运转的工厂。"}, {"en": "Water ran down the new [[insulation]], and the freezers switched to the [[battery]] just in time.", "zh": "水顺着新保温层往下流，冷库及时切换到了电池。"}, {"en": "The lane to the plant [[vanished|vanish]]ed under water, and for two days we worked by torchlight.", "zh": "通往工厂的小路消失在水下，我们靠手电干了两个白天。"}, {"en": "The [[strain]] on everyone was [[obvious]], and the repairs were [[gradual]] and expensive.", "zh": "每个人身上的压力都显而易见，修复工作缓慢而昂贵。"}, {"en": "That week taught me to [[abide]] by the weather forecast as much as by the protocol.", "zh": "那一周教会我，遵守天气预报和遵守规程一样重要。"}, {"en": "The hall could [[accommodate]] sixty people, and forty came.", "zh": "大厅能容纳六十人，来了四十个。"}, {"en": "I spoke on [[behalf]] of the company and asked them to [[participate]] in a monitoring group.", "zh": "我代表公司发言，请他们参加一个监督小组。"}, {"en": "It took an hour to [[convince]] the angriest man that we would not [[neglect]] the street.", "zh": "我花了一小时才让最愤怒的那位相信我们不会忽略这条街。"}, {"en": "A [[rebellious]] teenager asked the best question of the afternoon, and the room [[cooperate]]d in a way it never had before.", "zh": "一个叛逆的少年问出了当天下午最好的问题，屋里的人以前所未有的方式配合起来。"}, {"en": "By the end one woman said she could [[forgive]] the noise, though not the trucks.", "zh": "结束时，一位女士说她可以原谅噪音，但卡车不行。"}, {"en": "The regulator's [[counterpart]] in the health ministry sent a young engineer who [[seldom]] spoke.", "zh": "监管方在卫生部的对应部门派来一位很少说话的年轻工程师。"}, {"en": "She asked about the colour-coded [[stripe]]s on every pipe and the [[vessel]] that held the culture.", "zh": "她问起每根管子上按颜色区分的条纹，以及装培养基的容器。"}, {"en": "She tested the [[nerve]] of the operator on duty by asking him to explain a failed batch from memory.", "zh": "她考了值班操作员的胆量，让他凭记忆解释一批失败的原因。"}, {"en": "Her report was [[accurate]] and [[straightforward]], and it [[elevate]]d our standing with the ministry.", "zh": "她的报告准确而直白，提升了我们在部里的地位。"}, {"en": "That autumn I began to wonder whether this was the [[pursuit]] I wanted.", "zh": "那年秋天，我开始怀疑这是否是我想要的追求。"}, {"en": "The plant was [[subject]] to every fashion in the industry, and each [[transition]] cost us a month.", "zh": "工厂受行业里每一种风潮的影响，每次转型都要花掉我们一个月。"}, {"en": "I had [[autonomy]] on paper, yet my days were full of [[distraction]] and [[odd]] hours.", "zh": "纸面上我有自主权，可日子全是分心的事和零碎的工时。"}, {"en": "A friend said such doubts were [[inappropriate]] for someone with my [[academic]] record.", "zh": "一个朋友说，以我的学术履历，这种怀疑很不合适。"}, {"en": "In [[contrast]] to him, I thought the doubts were not [[transient]], and that they deserved the [[utmost]] attention.", "zh": "与他相反，我认为这些怀疑并非一时情绪，值得最大的重视。"}, {"en": "The founder had left a country where the [[regime]] could change overnight.", "zh": "创始人来自一个政权可能一夜之间更替的国家。"}, {"en": "He had learned to [[navigate]] customs offices and to keep his [[allegiance]] to nothing but the work.", "zh": "他学会了在海关周旋，也学会了只忠于工作本身。"}, {"en": "He said the [[magic]] of a factory is that it makes an idea something you can [[capture]] and share.", "zh": "他说工厂的魔力在于，它把想法变成可以把握、可以分享的东西。"}, {"en": "People [[elect]] to stay because they can see what they have built.", "zh": "人们选择留下，是因为能看见自己建起来的东西。"}, {"en": "There was no [[dazzle]] in that, only a slow accumulation of small decisions.", "zh": "这其中没有耀眼之处，只有一个个小决定慢慢累积。"}, {"en": "It was not the [[ideal]] outcome: two of the five targets failed, and the [[range]] of tests we could run was still narrow.", "zh": "结果并不理想：五个目标中有两个失败，我们能做的检测范围也仍然很窄。"}, {"en": "The [[general]] conclusion was that the plant would survive, though not in the shape we had imagined.", "zh": "总体的结论是工厂能够存活，只是不是我们当初设想的样子。"}, {"en": "The founder's answer was [[facile]] and also true: we had [[protect]]ed the thing we set out to build.", duate program, and I needed a [[platform]] for my fieldwork.", "zh": "九月我搬到这个地区读研究生，需要一个开展田野调查的平台。"}, {"en": "A community centre offered me a desk on condition that I [[supervise]] the evening homework room twice a week.", "zh": "一家社区中心给了我一张桌子，条件是我每周有两个晚上要看管作业室。"}, {"en": "It was a [[casual]] arrangement, never written into a [[contract]].", "zh": "这是个随口的安排，从没写进合同。"}, {"en": "The building was a converted [[warehouse]] with a [[peculiar]] smell of chalk and oranges.", "zh": "那栋楼是由仓库改建的，有股粉笔和橙子混在一起的怪味。"}, {"en": "The director, a woman of great [[wisdom]] and little patience, said the centre was [[independent]] but always short of money.", "zh": "主任是位极有智慧却没什么耐心的女士，她说中心虽独立，却总是缺钱。"}, {"en": "My study looked at [[prosocial]] and [[altruistic]] behaviour in [[adolescent]]s.", "zh": "我的研究考察青少年的亲社会与利他行为。"}, {"en": "We wanted to know whether kindness can be [[cultivate]]d, or whether it is a fixed [[figure]] in a [[sequence]] of development.", "zh": "我们想知道善意能否被培养，还是它在发展序列中只是一个固定数值。"}, {"en": "The [[underlying|underlie]] question is simple: what makes a teenager [[sacrifice]] an afternoon for someone else?", "zh": "背后的问题很简单：是什么让一个青少年为别人牺牲一个下午？"}, {"en": "We had to [[acquire]] consent from every parent, which proved harder than the [[biology]].", "zh": "我们得取得每位家长的同意，这比生物学本身还难。"}, {"en": "The ethics committee asked us to [[certify]] that no child would be [[swamp]]ed by questionnaires.", "zh": "伦理委员会要求我们保证不会有孩子被问卷淹没。"}, {"en": "I had to [[acquaint]] myself with a dozen names on the first afternoon, and I forgot half of them by Friday.", "zh": "第一个下午我得熟悉十几个名字，到周五忘了一半。"}, {"en": "We measured [[visual]] attention, heart rate and a [[binary]] choice: keep the money or share it.", "zh": "我们测量视觉注意、心率和二选一的选择：留下钱还是分出去。"}, {"en": "Every [[particle]] of data was [[encode]]d and stored on a server that no volunteer could open.", "zh": "每一点数据都被编码，存在志愿者打不开的服务器上。"}, {"en": "The [[incidence]] of sharing was higher than the literature predicted, which was a small [[marvel]].", "zh": "分享的发生率高于文献预测，这算一个小小的奇迹。"}, {"en": "A [[deficiency]] in sleep, we found, could [[reduce]] generosity by half.", "zh": "我们发现睡眠不足会让慷慨减半。"}, {"en": "Even a [[casual]] remark from a teacher seemed to [[affect]] the [[outcome]].", "zh": "连老师随口的一句话似乎都影响结果。"}, {"en": "Each child had a [[switch]] to [[donate]] privately, which removed the pressure of [[surround]]ing eyes.", "zh": "每个孩子都有一个私下捐赠的开关，这消除了周围目光的压力。"}, {"en": "By November the numbers looked too good, and I began a [[cursory]] check of the files.", "zh": "到十一月，数据好得可疑，我开始粗略检查档案。"}, {"en": "A [[redundant]] column of entries turned out to have been copied by hand.", "zh": "一列多余的记录原来是手工抄出来的。"}, {"en": "The error [[implicate]]d a volunteer who had meant no harm, and I had to [[withhold]] my anger.", "zh": "这个错误牵涉到一位并无恶意的志愿者，我只好压住怒火。"}, {"en": "The [[critical]] point was not the mistake but the habit that produced it.", "zh": "关键不在错误本身，而在造成错误的习惯。"}, {"en": "I decided to [[rethink]] the whole [[sequence]] and to [[impose]] a rule: every entry verified twice.", "zh": "我决定重新梳理整个序列，并立下规矩：每条记录核实两次。"}, {"en": "[[Scrutiny]] of my own work was the hardest part, and I had to [[critique]] my [[profile]] as a careful researcher.", "zh": "细查自己的工作是最难的部分，我不得不批判自己那个“严谨研究者”的形象。"}, {"en": "In December the city announced that the centre's building would be sold to a [[third-party]] developer.", "zh": "十二月，市里宣布中心的楼将卖给一家第三方开发商。"}, {"en": "A 1972 [[charter]] protected the site, but the council's [[declaration]] of intent suggested otherwise.", "zh": "一份1972年的特许状保护着这块地，但议会的意向声明暗示并非如此。"}, {"en": "The plan would [[violate]] the charter, according to our lawyer, though the [[penalty]] for that was unclear.", "zh": "按我们律师的说法，这一计划违反特许状，尽管处罚并不明确。"}, {"en": "The council argued that the centre was [[inadequate]] for modern needs and that its costs were [[swell]]ing.", "zh": "议会称中心已不足以满足现代需求，开支也在膨胀。"}, {"en": "The director called the decision [[cruel]] and [[unrepresentative]] of the neighbourhood.", "zh": "主任称这个决定既冷酷又不能代表这个街区。"}, {"en": "I was [[indignant]], but I had learned that anger is a poor [[substitute]] for a plan.", "zh": "我很愤慨，但也明白愤怒是计划最糟糕的替代品。"}, {"en": "The public meeting was held in a [[chamber]] with bad lighting.", "zh": "公开会在一间灯光很差的议事厅举行。"}, {"en": "A councillor [[administer]]ed the questions and [[indicate]]d that the vote was already decided.", "zh": "一位议员主持提问，并暗示表决早有结果。"}, {"en": "The meeting was [[chaos]] for twenty minutes until someone found the agenda.", "zh": "会议混乱了二十分钟，直到有人找到议程。"}, {"en": "The mood turned when a [[caregiver]] asked who would look after the children if the centre closed.", "zh": "一位照护者问中心若关闭谁来照看孩子，气氛就此转变。"}, {"en": "Her [[sentiment]] was shared by most of the room, and the [[current]] of opinion shifted within an hour.", "zh": "她的情绪得到大多数人共鸣，舆论在一小时内转向。"}, {"en": "The council's [[mandate]] was to save money, but the [[merit]] of the centre was obvious to everyone there.", "zh": "议会的授权是省钱，可在场每个人都看得见中心的价值。"}, {"en": "That winter the news was full of [[violence]]: a [[hostage]] case two towns away, a [[widespread]] fear of strangers.", "zh": "那年冬天新闻里满是暴力：两个镇外的一起人质事件，还有普遍的陌生人恐惧。"}, {"en": "Coverage of a single [[incident]] can [[swell]] into a [[series]] of stories with no new facts.", "zh": "对一起事件的报道能膨胀成一系列没有新事实的故事。"}, {"en": "A single [[transgression]] can come to [[denote]] a whole generation, the university's [[chancellor]] warned.", "zh": "校长警告说，一次越轨就能被用来代表整整一代人。"}, {"en": "I tried to [[differentiate]] between a [[credible]] risk and a [[virtual]] one.", "zh": "我试着区分可信的风险和几乎只是名义上的风险。"}, {"en": "Fear, I wrote in my notes, is easy to [[impose]] and hard to [[withstand]].", "zh": "我在笔记里写道，恐惧容易施加，却难以抵抗。"}, {"en": "A [[critical]] reading of the coverage showed how quickly a [[particular]] case becomes a [[symbol]].", "zh": "批判性地读这些报道就能看出，一个个案多快会变成符号。"}, {"en": "The teenagers decided to answer with a [[rap]] performance and a [[platform]] of their own.", "zh": "青少年们决定用自己的说唱演出和一个自己的平台来回应。"}, {"en": "They wrote a [[biography]] of the centre in verse, listing the [[lineage]] of families who had passed through it.", "zh": "他们用韵文给中心写了部传记，列出在这里来来去去的各家谱系。"}, {"en": "Their [[critique]] of the council was sharper than mine, and far more [[credible]] to the neighbours.", "zh": "他们对议会的批评比我尖锐，对邻居也更有说服力。"}, {"en": "They asked me to [[advise]] them on facts, and I had to [[select]] which numbers mattered.", "zh": "他们请我在事实方面给建议，我得挑出哪些数字要紧。"}, {"en": "The performance [[emerge]]d from six weeks of argument and [[acquire]]d a life of its own.", "zh": "这场演出从六周的争论中浮现出来，渐渐有了自己的生命。"}, {"en": "They [[perform]]ed in the square, and the [[conversation]] afterwards was [[inclusive]] in a way the council's never was.", "zh": "他们在广场上演出，之后的谈话有一种议会从未有过的包容。"}, {"en": "In January a [[pension]] fund offered to [[finance]] the purchase of the building.", "zh": "一月，一家养老基金提出为中心买下这栋楼提供资金。"}, {"en": "The offer required a [[definite]] commitment and a [[transparent]] [[record]] of our accounts.", "zh": "这笔钱要求明确的承诺和透明的账目记录。"}, {"en": "A [[third-party]] auditor would [[certify]] the figures [[annually]].", "zh": "将由第三方审计每年核证这些数字。"}, {"en": "The [[upside]] was obvious, but the [[deduction]] from our independence was not small.", "zh": "好处显而易见，但我们独立性的折损也不小。"}, {"en": "The director said she would rather [[remain]] poor than be [[indifferent]] to who paid.", "zh": "主任说她宁可继续穷，也不愿对钱来自谁漠不关心。"}, {"en": "We had to [[employ]] an accountant to [[organize]] the files, and he was calmer than all of us.", "zh": "我们只得雇了个会计来整理档案，他比我们所有人都沉得住气。"}, {"en": "By February I was [[swamp]]ed with teaching, data and letters.", "zh": "到了二月，我被教学、数据和信件淹没了。"}, {"en": "My [[mental]] state was poor, and I began to [[incline]] towards quitting.", "zh": "我的精神状态很差，开始倾向于退出。"}, {"en": "A [[caregiver]] at the centre noticed before I did.", "zh": "中心的照护者比我自己先察觉了。"}, {"en": "She said the [[advantage]] of a [[delicate]] constitution is that you learn to [[adjust]] early.", "zh": "她说身体娇弱的好处是，你很早学会调节自己。"}, {"en": "She [[advised|advise]] me to cut my hours, which felt like a [[penalty]] at the time.", "zh": "她建议我减少工时，当时我觉得这像一种惩罚。"}, {"en": "I began to [[reflect]] on why I had [[suppose]]d I could do everything alone.", "zh": "我开始反思，自己当初为什么以为能独自做完一切。"}, {"en": "My friend studies [[biology]], and she says the [[nutrient]] cycle in a small pond is a [[marvel]] of [[nurture]].", "zh": "我朋友学生物学，她说小池塘里的养分循环是养育的奇观。"}, {"en": "Every organism is a [[channel]] for energy, and none of it is [[redundant]].", "zh": "每个生物都是能量的通道，没有一样是多余的。"}, {"en": "Under the microscope, the [[acute]] problem is never one organism but the balance between all of them.", "zh": "在显微镜下，尖锐的问题从来不是某个生物，而是它们之间的平衡。"}, {"en": "She said a [[deficiency]] in one [[nutrient]] can [[threaten]] a whole [[region]].", "zh": "她说某一种养分的缺乏能威胁整个区域。"}, {"en": "The [[universe]] of a pond, she insisted, is as complete as any other.", "zh": "她坚持认为，池塘的宇宙和其他宇宙一样完整。"}, {"en": "In March the first [[series]] of results was ready.", "zh": "三月，第一批结果出来了。"}, {"en": "The data [[indicate]]d that [[unselfishly]] helping others [[peak]]s at fifteen and then levels off.", "zh": "数据表明，无私助人在十五岁达到高峰，之后趋于平稳。"}, {"en": "The [[figure]]s were [[adequate]] to support a modest paper, though not a [[tremendous]] claim.", "zh": "这些数字足以支撑一篇小论文，却撑不起一个惊人的论断。"}, {"en": "I [[emphasize]]d the limits of the sample, which was small and [[unrepresentative]].", "zh": "我强调了样本的局限：它既小又不具代表性。"}, {"en": "The [[outcome]] was [[non-controversial]], which is a rare pleasure in this field.", "zh": "结论没有争议，在这个领域里这是难得的愉快。"}, {"en": "In April the city offered a deal: the centre could stay if it [[sustain]]ed itself for three years.", "zh": "四月，市里提出一个方案：只要能自负盈亏三年，中心就可以留下。"}, {"en": "A [[charter]] amendment would [[secure]] the building, and a [[penalty]] clause would protect it from resale.", "zh": "一份特许状修正案将保障这栋楼，一条罚则能防止它被转卖。"}, {"en": "The council's lawyers tried to [[impose]] conditions that would [[violate]] the spirit of the deal.", "zh": "议会的律师试图强加一些违背协议精神的条件。"}, {"en": "We asked them to [[withstand]] the temptation to add footnotes and to publish the [[contract]] in full.", "zh": "我们要求他们顶住加注的诱惑，把合同全文公布。"}, {"en": "Two [[affiliate]]d groups [[enlist]]ed volunteers, and the [[demand]] for places [[stretch]]ed the timetable.", "zh": "两个附属团体招募了志愿者，报名人数把时间表拉得越来越长。"}, {"en": "The whole [[affair]] taught me that a [[merge]]d budget is easier to defend than a promise.", "zh": "整件事让我明白，合并后的预算比一句承诺更容易辩护。"}, {"en": "A local paper ran a [[profile]] of the director, and the [[feedback]] was warm.", "zh": "本地报纸登了一篇主任的人物特写，反馈很温暖。"}, {"en": "But a rival column published a [[cursory]] [[critique]] that [[insult]]ed her age.", "zh": "但一家对手专栏发了篇草率的评论，侮辱她的年纪。"}, {"en": "The [[insult]] was [[peculiar]]: it accused her of [[sentiment]] rather than judgement.", "zh": "这种侮辱很古怪：它指责她凭感情而非判断行事。"}, {"en": "I wrote a reply that tried to [[defend]] her, and the editor cut it to two paragraphs.", "zh": "我写了篇为她辩护的回信，编辑砍成了两段。"}, {"en": "She became the [[recipient]] of an award she had never applied for.", "zh": "她成了一个自己从未申请过的奖项的获得者。"}, {"en": "The episode [[impel]]led me to [[prioritize]] the centre over my own thesis for a while.", "zh": "这件事促使我有一段时间把中心排在自己的论文之前。"}, {"en": "In June the centre signed a five-year [[contract]] with the city.", "zh": "六月，中心与市里签了五年合同。"}, {"en": "The [[warehouse]] was [[decorate]]d with the teenagers' paintings, and the room where we met became a studio.", "zh": "仓库被青少年们的画装饰起来，我们开会的那间屋子成了画室。"}, {"en": "My study was published in a small journal, and the [[feedback]] was kind.", "zh": "我的研究发表在一家小期刊上，反馈很友善。"}, {"en": "I [[realise]] (or [[realize]]) that the data could not show what mattered most.", "zh": "我意识到，数据无法显示最重要的东西。"}, {"en": "Kindness is not a [[symbol]] on a questionnaire; it is a habit built by [[nurture]].", "zh": "善意不是问卷上的一个符号，而是由养育慢慢养成的习惯。"}, {"en": "The [[upside]] of such a year is that you [[marvel]] at how much a small place can [[sustain]], and I still [[admire]] the director enough to [[include]] her in every [[conversation]] about the study.", "zh": "这样一年的好处在于，你会惊叹一个小地方能承载多少；而我仍然钦佩主任，凡是谈到这项研究，我都会把她算进去。"}]}, {"key": "四星词汇 Day 03 List 5", " h": "我离开那座城市时比我预想的更伤心，至今仍在为放弃的那份工作难过。"}, {"en": "There was [[regret]], too, for the colleagues I never properly thanked.", "zh": "我也感到遗憾，因为有些同事我从未好好道谢。"}, {"en": "My cousin met me in a [[rental]] car, the only vehicle we could [[afford]] that week.", "zh": "表弟开着一辆租来的车来接我，那是我们那周唯一租得起的车。"}, {"en": "On Monday I started at a small [[firm]] that had spent twenty years repairing old buildings.", "zh": "周一，我开始在一家小公司上班，这家公司二十年来一直在修缮老建筑。"}, {"en": "It was not a famous [[establishment]], but the local [[agency]] trusted it, and the culture [[department]] sent work our way.", "zh": "它算不上有名的机构，但当地那家代理机构信任它，文化部门也把活儿交给我们。"}, {"en": "My [[commute]] was a [[regular]] twelve-minute walk along the river.", "zh": "我通勤只需沿着河走十二分钟，天天如此。"}, {"en": "The pay was [[modest]], and I could only [[present]] a trainee's portfolio, but I was glad to be home.", "zh": "薪水不高，我能拿出的也只是实习生的作品集，但我为回家而高兴。"}, {"en": "The [[prime]] reason I took the job was the old theater at the end of the street.", "zh": "我接受这份工作最主要的原因，是街尾那座老剧院。"}, {"en": "The theater was a [[compact]] brick [[structure]] with a leaking roof and an empty stage.", "zh": "剧院是一座紧凑的砖砌建筑，屋顶漏水，舞台空空荡荡。"}, {"en": "Half of its [[material]] was original timber, and the [[cement]] in the back wall had [[sunk|sink]] in places.", "zh": "它一半的材料是原始木料，后墙的水泥有几处已经下陷。"}, {"en": "[[Moisture]] had crept into the basement, and the damp had [[aggravated|aggravate]] every crack.", "zh": "湿气渗进了地下室，潮气让每一道裂缝都更加严重。"}, {"en": "A [[severe]] winter two years earlier had done [[disastrous]] damage to the north wing.", "zh": "两年前的一个严冬给北翼造成了灾难性的破坏。"}, {"en": "Rubble [[obstructed|obstruct]] the side entrance, so we had to [[fend]] our way through the yard.", "zh": "碎石堵住了侧门，我们只好在院子里艰难地开路。"}, {"en": "The [[renovation]] would be expensive, and nobody wanted to [[overstate]] what we could finish by June.", "zh": "这次翻修会很花钱，也没人愿意夸大我们六月底前能完成的部分。"}, {"en": "The caretaker, Mr. Gu, had a [[literary]] way of speaking and a thick local [[dialect]].", "zh": "看管人顾先生说话带着文学腔，还讲一口浓重的本地话。"}, {"en": "He could [[relate]] every crack in the wall to an [[episode]] in the theater's history.", "zh": "墙上每一道裂缝，他都能讲出剧院历史上的一段往事。"}, {"en": "His storytelling was a kind of [[worship]] of the old actors, and I began to [[trace]] their names on the dressing-room wall.", "zh": "他讲故事像是崇敬那些老演员，我也开始在化妆间的墙上描摹他们的名字。"}, {"en": "That habit was an old [[tradition]] in this town, he said, and it mattered more than any official record.", "zh": "他说，这个习惯是镇上由来已久的传统，比任何官方记录都重要。"}, {"en": "On one door a child had written the [[alphabet]] in chalk, and he kept an [[analogue]] tape recorder beside it to save the songs.", "zh": "有一扇门上，一个孩子用粉笔写下了字母表，他在旁边放了一台模拟磁带录音机来保存那些歌。"}, {"en": "He refused to let anyone [[destruct]] the old projector, and he [[remarked|remark]] that the town had once been famous for its [[classical]] music.", "zh": "他不许任何人拆毁那台老放映机，还说这个镇子曾以古典音乐闻名。"}, {"en": "In February the heating pipes [[flared|flare]] and then burst, which was completely [[unexpected]].", "zh": "二月里暖气管突然烧旺随即爆裂，完全出乎意料。"}, {"en": "The flood [[induced|induce]] a wave of doubt among the volunteers.", "zh": "这场水灾在志愿者中引发了一阵怀疑。"}, {"en": "The most [[desperate]] ones worked all night to [[relieve]] the pressure on the pumps.", "zh": "最拼命的那几个人整夜工作，给水泵减压。"}, {"en": "I [[tolerated|tolerate]] the cold for six hours before going home to sleep in my coat.", "zh": "我在寒冷里忍了六个小时，才回家穿着外套睡觉。"}, {"en": "The volunteers needed [[intensive]] training before they could handle the pumps alone.", "zh": "志愿者要经过密集培训，才能独自操作水泵。"}, {"en": "There is a particular [[misery]] in watching water rise over work you have just finished.", "zh": "眼看着水淹过自己刚做完的活儿，有一种特别的痛苦。"}, {"en": "Before we could touch the facade, we needed [[permission]] from the city.", "zh": "在动立面之前，我们需要市里的许可。"}, {"en": "The [[procedure]] was slow: an [[enquiry]] at the planning office, a formal [[inquiry]] into the building's status, and weeks of waiting.", "zh": "程序很慢：先去规划部门询问，再对建筑身份正式调查，然后是好几周的等待。"}, {"en": "New [[legislation]] protected historic sites, but the [[agency]] that enforced it was short of staff.", "zh": "新法规保护历史建筑，可执行它的机构人手不足。"}, {"en": "Mr. Gu [[insisted|insist]] that we [[uphold]] the original design, and his argument [[prevailed|prevail]].", "zh": "顾先生坚持要维护原来的设计，他的意见最终占了上风。"}, {"en": "The theater had a [[monopoly]] on memories in this town, he said, and that counted for something.", "zh": "他说，这座剧院垄断着这个镇子的记忆，这一点很有分量。"}, {"en": "Then a letter from a major [[shareholder]] arrived: the developer wanted to [[convert]] the hall into a car park.", "zh": "接着一位大股东来信：开发商想把大厅改成停车场。"}, {"en": "Their lawyer was [[aggressive]] and [[overstated|overstate]] the [[proceeds]] of a new shopping centre.", "zh": "他们的律师口气强硬，还夸大了新建购物中心的收益。"}, {"en": "The glossy brochures [[inflated|inflate]] the value of the developer's [[brand]] and ignored the town entirely.", "zh": "那些光鲜的宣传册吹高了开发商的品牌价值，却完全无视这个镇子。"}, {"en": "They [[misinterpreted|misinterpret]] the heritage report, or perhaps they only [[pretended|pretend]] to.", "zh": "他们曲解了文物报告，或者只是假装曲解。"}, {"en": "The company tried to [[induce]] the council to sell, and I grew [[pessimistic]] about our chances.", "zh": "公司试图诱使议会出售，我对我们的胜算越来越悲观。"}, {"en": "The [[circumstances|circumstance]] looked hopeless, every [[ally]] seemed tired, and I began to see the whole affair as a [[dilemma]] with no clean answer.", "zh": "情况看起来毫无希望，每个盟友都显得疲惫，我开始把整件事看作一个没有干净答案的窘境。"}, {"en": "The [[press]] came to the emergency meeting, and a local station agreed to [[broadcast]] it live.", "zh": "媒体来了紧急会议，当地一家电视台同意直播。"}, {"en": "Each speaker had to [[affirm]] the [[intention]] behind the plan, which raised awkward questions of [[ethics]].", "zh": "每位发言人都得申明方案背后的意图，这引出了令人尴尬的伦理问题。"}, {"en": "One councillor questioned the [[integrity]] of the developer's figures, and the room went quiet.", "zh": "一位议员质疑开发商数据的真实性，会场一下子安静了。"}, {"en": "Given the [[amount]] of public support, the council voted to [[safeguard]] the building.", "zh": "考虑到公众支持的数量，议会投票决定保护这座建筑。"}, {"en": "[[Propaganda]] had filled the room for weeks, but in the end the facts won.", "zh": "几周来会场里充斥着宣传，但最后是事实赢了。"}, {"en": "That night I [[estimated|estimate]] the cost of repairs and [[allocated|allocate]] the work among three teams.", "zh": "那天夜里我估算修缮费用，把工作分配给三个小组。"}, {"en": "From the old photographs I could [[infer]] how the stage once looked, and I [[analysed|analyse]] the paint samples.", "zh": "从老照片里我能推断出舞台当年的样子，我还分析了油漆样本。"}, {"en": "My colleague chose to [[analyze|analyze]] the sound records instead.", "zh": "我的同事则选择去分析声音记录。"}, {"en": "The report had [[multiple]] appendices: a [[chronology]] of repairs, an [[updated]] list of donors, and every [[detail]] of the damaged roof.", "zh": "报告有多个附录：一份修缮年表、一份更新的捐赠者名单，还有受损屋顶的每一处细节。"}, {"en": "Above all, it was [[essential]] to [[prevent]] water from reaching the archive, and we had to [[finalize]] the budget before Friday.", "zh": "最重要的是必须防止水浸到档案室，我们还得在周五前把预算定下来。"}, {"en": "On Sundays I helped in the community garden, where [[moisture]] in the soil decided what would grow.", "zh": "周日我去社区花园帮忙，土壤里的水分决定什么能长起来。"}, {"en": "The children recorded every [[insect]] they found and [[hunted|hunt]] for beetles under the stones.", "zh": "孩子们记录下发现的每一种昆虫，还在石头底下找甲虫。"}, {"en": "The old bus in town ran on [[biofuel]] made from used cooking oil.", "zh": "镇上的老巴士烧的是用废食用油制成的生物燃料。"}, {"en": "A single [[molecule]] of detergent can poison a pond, the teacher said, so we washed our tools in a bucket.", "zh": "老师说，一个洗涤剂分子就能毒死一池水，所以我们只在桶里洗工具。"}, {"en": "The garden was our only [[recreation]], and it kept us sane through the spring.", "zh": "花园是我们唯一的消遣，它让我们整个春天都保持清醒。"}, {"en": "My aunt had waited two years for a kidney [[transplant]].", "zh": "姑姑等肾移植已经等了两年。"}, {"en": "The local [[institute]] ran a small dialysis unit with four beds.", "zh": "当地的研究所运行着一个只有四张床的小透析室。"}, {"en": "A [[shortage]] of nurses meant she was often still waiting at midnight.", "zh": "护士短缺意味着她常常到半夜还在等。"}, {"en": "Her file was thick with [[correspondence]] between two hospitals that never read each other's notes.", "zh": "她的病历里塞满了两家医院之间的往来信件，而双方从不看彼此的记录。"}, {"en": "Some of her treatment was still [[undocumented]] because the clinic had no digital system.", "zh": "她的一部分治疗至今没有书面记录，因为诊所没有电子系统。"}, {"en": "I spent an afternoon trying to [[rectify]] a mistake in her record, and a [[drastic]] change of diet had kept her alive.", "zh": "我花了一个下午去纠正她病历里的一处错误，而大幅改变饮食让她活了下来。"}, {"en": "In the studio we [[persisted|persist]] with the original plan, even when the money ran low.", "zh": "在工作室里，即使资金紧张，我们也坚持原方案。"}, {"en": "A [[prominent]] architect visited and said the hall was [[unsurpassed]] as an example of small-town Art Deco.", "zh": "一位知名建筑师来访，说这个大厅作为小城装饰艺术的范例无可匹敌。"}, {"en": "Her [[philosophy]] was simple: repair first, replace last.", "zh": "她的理念很简单：先修，最后才换。"}, {"en": "We would [[replace]] only the beams that could not be [[rendered|render]] safe.", "zh": "我们只更换那些无法被处理到安全的梁。"}, {"en": "A [[substance]] in the old paint turned out to be poisonous, which made the work slower.", "zh": "旧油漆里的一种物质后来发现有毒，这让进度变慢了。"}, {"en": "We [[equipped|equip]] every team with masks and gloves, and had to [[modify]] the schedule and [[alter]] the roof pitch.", "zh": "我们给每个小组配了口罩和手套，还必须修改进度、改动屋顶坡度。"}, {"en": "The [[innovation]] was to [[establish]] a small workshop where local teenagers could learn carpentry.", "zh": "这项创新是建立一个让当地青少年学木工的小作坊。"}, {"en": "The workshop proved more [[beneficial]] than any lecture about heritage.", "zh": "事实证明，这个作坊比任何遗产讲座都有益。"}, {"en": "Old skills [[derive]] from practice, not from slogans.", "zh": "老手艺源于实践，而不是口号。"}, {"en": "The change would [[transform]] the way the town thought about its own past.", "zh": "这一变化将改变这个镇子看待自身过去的方式。"}, {"en": "At first the change was [[intangible]], a matter of pride rather than money.", "zh": "起初这种变化是无形的，关乎自尊而非金钱。"}, {"en": "In May the city [[philharmonic]] agreed to play a [[charity]] concert in the unfinished hall.", "zh": "五月，市交响乐团同意在这座未完工的大厅里举办慈善音乐会。"}, {"en": "My [[desire]] to hear a full orchestra in that dusty space was almost childish.", "zh": "我想在那个满是灰尘的空间里听一整支管弦乐队，这愿望几乎有些孩子气。"}, {"en": "We set up a [[lounge]] in the foyer with borrowed sofas, and someone ran a [[quiz]] at the interval.", "zh": "我们在门厅用借来的沙发布置了一个休息区，中场休息时还有人主持了小测验。"}, {"en": "The concert had a [[mass]] appeal that no advertisement could buy.", "zh": "这场音乐会有着任何广告都买不来的大众吸引力。"}, {"en": "The [[proceeds]] from the tickets paid for half the roof.", "zh": "门票收益付了半个屋顶的钱。"}, {"en": "On the last free weekend we drove to the coast, where I tried to [[surf]] on a borrowed board.", "zh": "最后一个空闲的周末，我们开车去了海边，我用借来的板子试着冲浪。"}, {"en": "We [[offloaded|offload]] the boards from the van and carried them down the beach.", "zh": "我们把冲浪板从车上卸下来，搬到海滩上。"}, {"en": "For an hour I did nothing but [[lounge]] on the sand and watch the water.", "zh": "有一个小时我什么也没做，只是懒洋洋地躺在沙滩上看海。"}, {"en": "The [[release]] from tension was [[prompt]] and complete.", "zh": "那种紧张的释放既迅速又彻底。"}, {"en": "I felt [[bound]] to return to the theater, though, before dark.", "zh": "不过我觉得天黑前必须回剧院一趟。"}, {"en": "That evening my aunt showed me a box of photographs of our [[ancestors|ancestor]].", "zh": "那天晚上，姑姑给我看了一盒我们祖先的照片。"}, {"en": "[[Prior]] to the war, one of them had been a stagehand at the very same theater.", "zh": "战前，其中一位就在同一座剧院当舞台工作人员。"}, {"en": "That story [[represented|represent]] everything the renovation was about.", "zh": "那个故事代表了这次翻修的全部意义。"}, {"en": "A town that forgets its people, she said, has no [[substance]].", "zh": "她说，一个忘记自己人的镇子没有实质可言。"}, {"en": "[[Humanity]] survives in small acts of repair.", "zh": "人性就存活于一次次小小的修补之中。"}, {"en": "The [[recession]] had hit the region hard, and the [[environment]] for small projects was poor.", "zh": "经济衰退严重打击了这一地区，小项目的环境很糟。"}, {"en": "Yet the council [[deputed|depute]] my supervisor to [[inform]] the developer that the plan was dead.", "zh": "然而议会委派我的主管去通知开发商：那个方案已经作废。"}, {"en": "The decision would [[pave]] the way for slower, more careful growth.", "zh": "这一决定将为更缓慢、更谨慎的发展铺平道路。"}, {"en": "It would [[influence]] other towns facing the same choice.", "zh": "它会影响其他面临同样选择
