<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日复习计划 · 艾宾浩斯遗忘曲线 · 十天搞定考研词汇</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:#f4f6f8;color:#222;line-height:1.6;}
.wrap{max-width:1000px;margin:0 auto;padding:20px 20px 70px;}
.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.top h1{font-size:23px;color:#1f3a5f;}
.top a{padding:7px 14px;border-radius:18px;background:#fff;border:1px solid #d7dee8;color:#2b5797;text-decoration:none;font-size:13px;margin-left:6px;display:inline-block;}
.top a:hover{background:#2b7cdd;color:#fff;border-color:#2b7cdd;}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 3px 12px rgba(31,58,95,.07);border-top:4px solid #2b7cdd;text-align:center;}
.stat b{font-size:24px;color:#1f3a5f;display:block;}
.stat span{font-size:12.5px;color:#7a8799;}
.stat.o{border-top-color:#e6a23c;}.stat.o b{color:#c87f10;}
.stat.g{border-top-color:#1c9e63;}.stat.g b{color:#138a55;}
.stat.p{border-top-color:#7a67d8;}.stat.p b{color:#5b48c0;}
.box{background:#fff;border-radius:14px;padding:16px 20px;margin-bottom:16px;box-shadow:0 3px 12px rgba(31,58,95,.07);}
.box h2{font-size:16px;color:#1f3a5f;margin-bottom:10px;}
.box h2 small{font-weight:normal;color:#8a96a5;font-size:12.5px;margin-left:8px;}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 4px;border-bottom:1px solid #f0f3f7;}
.row:last-child{border-bottom:none;}
.tag{font-size:12px;background:#eef4fc;color:#2b5797;border-radius:10px;padding:2px 10px;}
.tag.o{background:#fdf3e0;color:#c87f10;}
.tag.g{background:#eaf7f0;color:#138a55;}
.btn{border:none;border-radius:18px;padding:8px 20px;font-size:13.5px;cursor:pointer;color:#fff;background:#2b7cdd;}
.btn:hover{background:#1f66c2;}
.btn.g{background:#1c9e63;}.btn.g:hover{background:#138a55;}
.btn.p{background:#7a67d8;}.btn.p:hover{background:#6552c4;}
.mini{border:1px solid #d7dee8;background:#fff;border-radius:14px;padding:4px 12px;font-size:12px;color:#2b5797;cursor:pointer;}
.mini:hover{border-color:#2b7cdd;}
.muted{color:#9aa8b8;font-size:12.5px;}
.uprow{padding:7px 4px;border-bottom:1px dashed #eef1f5;font-size:13px;color:#7a8799;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
table.plan{width:100%;border-collapse:collapse;font-size:13px;}
table.plan td{border-top:1px solid #f0f3f7;padding:7px 6px;vertical-align:middle;}
table.plan td:first-child{color:#c87f10;font-weight:bold;white-space:nowrap;width:110px;}
/* session */
#sess{position:fixed;inset:0;background:linear-gradient(160deg,#eef4fc,#f8fbff);z-index:900;overflow:auto;padding:16px 14px 46px;}
.sess-top{max-width:640px;margin:0 auto 8px;display:flex;align-items:center;gap:10px;}
#sExit{border:1px solid #d7dee8;background:#fff;border-radius:16px;padding:6px 14px;font-size:13px;color:#5a6a7d;cursor:pointer;}
#sExit:hover{border-color:#2b7cdd;color:#2b7cdd;}
.sprog{flex:1;font-size:13px;color:#5a6f88;}
.smode{font-size:12px;color:#fff;background:#2b7cdd;border-radius:10px;padding:2px 10px;white-space:nowrap;}
.sbar{max-width:640px;margin:0 auto 18px;height:5px;background:#dbe6f2;border-radius:4px;overflow:hidden;}
#sBarFill{height:100%;width:0;background:linear-gradient(90deg,#2b7cdd,#56a3f0);transition:width .2s;}
.shead{max-width:640px;margin:0 auto 10px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:13px;color:#5a6f82;background:rgba(255,255,255,.78);border:1px solid #e2e8f0;border-radius:12px;padding:7px 12px;}
.aspbtn{background:#eef4fc;border:1px solid #d7e5f7;border-radius:10px;padding:2px 10px;font-size:12.5px;color:#2b5797;cursor:pointer;}
.aspbtn:active{transform:scale(.95);}
.shead b{color:#1f66c2;font-variant-numeric:tabular-nums;}
/* 5分钟/30分钟复习阶段：背景与学习界面区分开 */
#sess.ph-r5{background:linear-gradient(160deg,#fdf3dc,#fef9ec);}
#sess.ph-r5 .card{background:#fffdf3;border:1px solid #eed9a4;}
#sess.ph-r5 .smode{background:#e6a23c;}
#sess.ph-r5 #sBarFill{background:linear-gradient(90deg,#e6a23c,#f0c060);}
#sess.ph-r5 .shead{background:rgba(255,255,255,.88);border-color:#ecd9a3;color:#8a6d2b;}
#sess.ph-r30{background:linear-gradient(160deg,#fdeadd,#fef4ea);}
#sess.ph-r30 .card{background:#fffaf2;border:1px solid #f0c9a0;}
#sess.ph-r30 .smode{background:#e0803c;}
#sess.ph-r30 #sBarFill{background:linear-gradient(90deg,#e0803c,#e6a23c);}
#sess.ph-r30 .shead{background:rgba(255,255,255,.88);border-color:#ecc9a3;color:#9c5e1e;}
.card{max-width:640px;margin:0 auto;background:#fff;border-radius:18px;box-shadow:0 10px 34px rgba(31,58,95,.14);padding:30px 32px 22px;min-height:400px;display:flex;flex-direction:column;}
.cfront{display:flex;flex-direction:column;gap:10px;}
.ctimer{text-align:center;font-size:14px;color:#7a93ad;font-variant-numeric:tabular-nums;letter-spacing:.5px;}
.ctimer b{color:#1f66c2;font-weight:bold;}
.cw{font-size:40px;font-weight:bold;color:#1f3a5f;text-align:center;line-height:1.25;}
.cph{text-align:center;color:#5a83b8;font-size:16px;margin-top:2px;}
.csp{display:block;margin:6px auto 0;background:#eef4fc;border:none;border-radius:16px;padding:6px 18px;font-size:14px;color:#2b5797;cursor:pointer;}
.flipHint{text-align:center;color:#b3c2d4;font-size:12.5px;margin-top:4px;}
.cfront .cbtns{margin:14px 0 0;}
.cback{display:none;flex-direction:column;gap:9px;}
.card.flip .cfront{display:none;}
.card.flip .cback{display:flex;}
.cdef{font-size:17px;color:#333;text-align:center;line-height:1.7;}
.croot{font-size:13px;color:#138a55;background:#f2fbf6;border:1px dashed #bfe8d4;border-radius:8px;padding:6px 12px;text-align:center;}
.cex{background:#f8fafd;border-left:3px solid #b9d4f5;border-radius:0 8px 8px 0;padding:8px 12px;}
.cex .en{font-size:14.5px;color:#2b2b2b;line-height:1.75;}
.cex .zh{font-size:12.5px;color:#7a8799;margin-top:3px;line-height:1.6;}
mark.thl{background:#dff0ff;color:#1f66c2;font-weight:bold;padding:0 2px;border-radius:3px;}
.kbd{text-align:center;font-size:11.5px;color:#a9b8c9;margin-top:4px;}
.cused{text-align:center;font-size:12.5px;color:#8a96a5;margin-top:6px;}
.cnext{display:block;margin:10px auto 0;border:none;border-radius:18px;padding:9px 34px;font-size:14.5px;cursor:pointer;color:#fff;background:#2b7cdd;}
.cnext:hover{background:#1f66c2;}
.cbtns{display:flex;gap:10px;width:100%;}
.cbtns button{border:none;border-radius:18px;padding:10px 0;flex:1;font-size:13.5px;cursor:pointer;color:#fff;}
#bNo{background:#e08b6f;}#bNo:hover{background:#cf6f4f;}
#bMid{background:#e6a23c;}#bMid:hover{background:#cf8a1c;}
#bQuiz{background:#2b7cdd;}#bQuiz:hover{background:#1f66c2;}
#bYes{background:#37b37c;}#bYes:hover{background:#2c9866;}
.cbtns button:disabled{opacity:.35;cursor:not-allowed;}
/* 4-choice quiz overlay */
#quizMask{display:none;position:fixed;inset:0;background:rgba(20,30,45,.7);z-index:3100;align-items:center;justify-content:center;padding:18px;}
#quizMask.show{display:flex;}
.qbox{background:#fff;border-radius:18px;width:min(560px,94vw);padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.qbox .qh{font-size:15px;color:#5a6f82;margin-bottom:6px;}
.qbox .qw{font-size:30px;font-weight:bold;color:#1f3a5f;text-align:center;margin-bottom:4px;}
.qbox .qph{text-align:center;color:#7a93ad;font-size:14px;margin-bottom:14px;}
.qbox .qask{text-align:center;font-size:13.5px;color:#8a96a5;margin-bottom:14px;}
.qopts{display:flex;flex-direction:column;gap:9px;}
.qopt{border:1.5px solid #e2e8f0;border-radius:12px;padding:12px 16px;font-size:14.5px;color:#333;background:#fafcff;cursor:pointer;text-align:left;line-height:1.5;transition:border-color .12s,background .12s;}
.qopt:hover{border-color:#2b7cdd;background:#eef4fc;}
.qopt.correct{border-color:#37b37c;background:#eafaf1;color:#138a55;font-weight:bold;}
.qopt.wrong{border-color:#e08b6f;background:#fdeeec;color:#c0392b;}
.qopt.disabled{cursor:default;opacity:.6;}
.qfb{text-align:center;margin-top:12px;font-size:13.5px;min-height:20px;}
.qfb.ok{color:#138a55;}.qfb.no{color:#c0392b;}
.qnext{display:block;margin:14px auto 0;border:none;border-radius:18px;padding:8px 26px;font-size:14px;cursor:pointer;color:#fff;background:#2b7cdd;}
.qnext:hover{background:#1f66c2;}
.qnext:disabled{opacity:.35;cursor:not-allowed;}
.done{max-width:640px;margin:40px auto;text-align:center;background:#fff;border-radius:18px;padding:40px 30px;box-shadow:0 10px 34px rgba(31,58,95,.14);}
.done h2{color:#138a55;font-size:22px;margin-bottom:12px;}
.done p{color:#5a6f82;font-size:14.5px;line-height:2;}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 22px;border-radius:22px;font-size:13.5px;opacity:0;transition:opacity .25s;z-index:2000;pointer-events:none;}
#toast.show{opacity:.94;}
/* countdown card */
#cdBox .cdtime{font-size:32px;font-weight:bold;color:#1f66c2;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1.2;}
#cdBox .cdlab{font-size:13px;color:#8a96a5;margin-top:3px;}
#cdBox .cdnext{font-size:14.5px;color:#456;margin-bottom:4px;}
.cdurgent{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(90deg,#fff3e0,#ffe9d2);border:1px solid #f0c48a;border-radius:12px;padding:13px 18px;animation:cdpulse 1.3s infinite;}
.cdurgent .cdn{font-size:20px;font-weight:bold;color:#c87f10;}
@keyframes cdpulse{0%,100%{box-shadow:0 0 0 0 rgba(230,162,60,.45);}50%{box-shadow:0 0 0 10px rgba(230,162,60,0);}}
/* 40天经典计划表 */
.ptbl{width:100%;border-collapse:collapse;font-size:13px;}
.ptbl th,.ptbl td{border:1px solid #e2e8f0;padding:4px 3px;text-align:center;min-width:50px;}
.ptbl th{background:#f4f8ff;color:#5a6f82;font-weight:normal;font-size:12px;}
.ptbl td.rowlab{background:#fafbfd;color:#8a96a5;font-size:12px;white-space:nowrap;min-width:40px;}
.ptbl td.today,.ptbl th.today{background:#fff3da;box-shadow:inset 0 0 0 2px #e6a23c;}
.pchip{display:inline-block;margin:1px 2px;padding:2px 8px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:13px;border:1px solid transparent;}
.pchip.new{background:#eaf3ff;color:#2b7cdd;border-color:#c3d9f5;}
.pchip.new:hover{background:#2b7cdd;color:#fff;}
.pchip.chk{background:#eafaf1;color:#1c9e63;border-color:#bfe8d2;}
.pchip.chk:hover{background:#1c9e63;color:#fff;}
.pchip.done{background:#f0f1f3;color:#a9b3bd;text-decoration:line-through;border-color:#e2e8f0;}
@media (max-width:640px){.statrow{grid-template-columns:repeat(2,1fr);}.card{padding:22px 18px;min-height:340px;}.cw{font-size:32px;}.cbtns button{font-size:13px;}}
</style>
</head>

1577, 1956]}], "sents": [{"en": "Human [[intellect]] must not [[ignore]] public [[controversy]] or treat ordinary voices with [[contempt]].", "zh": "人类的理智绝不能忽视公众争议，也不能以轻蔑的态度对待普通人的声音。"}, {"en": "The [[ultimate]] goal of social research will not [[yield]] quick answers, and many scholars [[contend]] that external pressure can [[oblige]] people to adopt [[radical]] ideas within this social [[context]].", "zh": "社会研究的最终目标不会迅速给出答案；许多学者主张，在这种社会环境下，外部压力会迫使人们接受激进的思想。"}, {"en": "When housing becomes [[unaffordable]], some officials may even [[abdicate]] their duty to [[transmit]] truthful information.", "zh": "当住房变得难以负担时，一些官员甚至可能放弃传递真实信息的职责。"}, {"en": "[[disruptive]] and [[flattering]] comments often mislead the public; raw [[statistical]] data should never [[contradict]] real‑world experience.", "zh": "制造混乱的言论与谄媚之辞常常误导公众；原始统计数据绝不应与现实世界的经验相矛盾。"}, {"en": "The [[provision]] of public services requires citizens to [[contribute]].", "zh": "公共服务的提供需要公民作出贡献。"}, {"en": "We cannot leave [[illiterate]] groups behind; small monthly [[allowance]] cannot erase the social [[distinction]].", "zh": "我们不能落下文盲群体；每月微薄的津贴无法消除这种社会差别。"}, {"en": "New ideas [[diffuse]] [[extraordinarily]] fast in this digital era.", "zh": "在这个数字时代，新思想传播得异常迅速。"}, {"en": "Scholars try to translate [[abstract]] theories into readable reports.", "zh": "学者们努力把抽象的理论转化为通俗易懂的报告。"}, {"en": "Experts in [[psychiatry]] [[convey]] mental‑health knowledge and [[illustrate]] real‑life cases.", "zh": "精神病学专家传播心理健康知识，并讲解真实生活中的案例。"}, {"en": "A [[capable]] researcher can [[elaborate]] arguments and [[manipulate]] raw datasets.", "zh": "有能力的研究者能够详尽阐述论点，并熟练处理原始数据集。"}, {"en": "A sudden social [[strike]] may push a [[coalition]] of different [[constituent]] groups to push for greater [[transparency]].", "zh": "一场突如其来的社会罢工，可能促使由不同群体组成的联盟去推动更高的透明度。"}, {"en": "Departments must [[coordinate]] efforts and not [[saturate]] public space with useless ads.", "zh": "各部门必须协调行动，而不应让无用的广告充斥公共空间。"}, {"en": "Good policy will earn public [[acclaim]].", "zh": "好的政策将赢得公众的赞誉。"}, {"en": "Mere [[fancy]] ideas cannot solve [[immediate]] crises that may [[paralyse]] or [[paralyze]] the whole system.", "zh": "仅凭花哨的想法无法解决可能使整个系统陷入瘫痪的紧迫危机。"}, {"en": "Never [[underestimate]] hidden risks; solid evidence should [[accompany]] and [[correlate]] with real‑life outcomes.", "zh": "绝不要低估隐患；确凿的证据应当与现实生活中的结果相伴，并彼此关联。"}, {"en": "Within the field of [[neurology]], a research [[council]] hires [[temporary]] assistants to [[eliminate]] experimental mistakes.", "zh": "在神经病学领域，一个研究委员会雇用临时助理，以消除实验错误。"}, {"en": "A senior [[scholar]]’s [[submission]] must obey [[hierarchical]] rules; its [[subsidiary]] notes can [[fascinate]] ordinary readers.", "zh": "资深学者的投稿必须遵守等级规则；文中的辅助注释却能令普通读者着迷。"}, {"en": "Smart [[decision-making]] does not rely on superficial [[glamor]] or [[glamour]], but solid facts.", "zh": "明智的决策依靠的不是表面的魅力，而是确凿的事实。"}, {"en": "Policymakers [[implement]] new policies and help residents [[accustom]] to fresh lifestyles to guarantee [[sufficient]] supplies.", "zh": "政策制定者实施新政策，帮助居民适应崭新的生活方式，以保证充足的供应。"}, {"en": "At a local [[academy]], students enjoy a [[magnificent]] campus and fight against old [[stereotype]].", "zh": "在当地的一所学院里，学生们享受着宏伟的校园，并与陈旧的刻板印象作斗争。"}, {"en": "Being [[optimistic]], we [[acknowledge]] existing challenges, [[embrace]] objective truth, and [[dedicate]] ourselves to building [[legitimate]] social systems.", "zh": "我们保持乐观，承认现存的挑战，拥抱客观真理，并致力于建设合法的社会制度。"}, {"en": "We need [[coherent]] logic and basic human [[instinct]] to [[deduce]] core cultural [[feature]].", "zh": "我们需要连贯的逻辑和基本的人类本能，以推断出核心的文化特征。"}, {"en": "An [[orchestra]] displays the [[supreme]] art hidden beneath the [[surface]].", "zh": "管弦乐队展现出隐藏在表面之下的至高艺术。"}, {"en": "True [[virtue]] deserves deep respect, not empty [[patent]] praise.", "zh": "真正的美德值得深深敬重，而非空洞、昭然若揭的吹捧。"}, {"en": "Human beings quickly [[adapt]] to surroundings, even though many consumer goods are [[nondurable]].", "zh": "人类能很快适应周围环境，尽管许多消费品并不耐用。"}, {"en": "People [[susceptible]] to outside pressure can [[encompass]] many sides of one public debate.", "zh": "容易受外界压力影响的人，能够兼顾一场公共辩论的多个方面。"}, {"en": "Different groups [[claim]] their rights and [[recommend]] closer [[collaboration]].", "zh": "不同群体主张各自的权利，并建议开展更密切的合作。"}, {"en": "No [[indefensible]] argument can deny a medical [[syndrome]] we often [[encounter]].", "zh": "任何站不住脚的论点，都无法否认一种我们经常遇到的医学综合征。"}, {"en": "Reporters [[highlight]] cultural [[ornament]] and [[adhere]] to objective truth.", "zh": "记者们突出文化装饰，并坚持客观真理。"}, {"en": "Some people choose to [[defer]] major decisions until they become [[mature]].", "zh": "有些人选择把重大决定推迟到自己成熟以后再作。"}, {"en": "With sincere [[sympathy]], our common [[endeavor]] (or [[endeavour]]) aims for a better community.", "zh": "怀着真诚的同情，我们的共同努力旨在建设一个更美好的社区。"}, {"en": "It is [[notable]] that you need a [[license]] (or [[licence]]) to run such social projects.", "zh": "值得注意的是，运营这类社会项目需要取得执照。"}, {"en": "Public [[outrage]] may break out if experts [[forecast]] poorly and fail to [[enforce]] basic rules.", "zh": "如果专家预测拙劣且未能执行基本规则，公众的愤怒可能会爆发。"}, {"en": "This [[unprecedented]] reform needs formal [[admission]].", "zh": "这场前所未有的改革需要得到正式认可。"}, {"en": "A [[deliberate]] plan can [[grant]] support from every [[peer]] and [[enhance]] our capacity.", "zh": "一项深思熟虑的计划能够赢得每位同伴的支持，并提升我们的能力。"}, {"en": "Every [[adult]] should grasp the [[nucleus]] of social contracts and offer an [[apology]] when making mistakes.", "zh": "每个成年人都应掌握社会契约的核心，并在犯错时道歉。"}, {"en": "We show sincere [[gratitude]] toward [[sacred]] values, and small victories [[gratify]] us.", "zh": "我们对神圣的价值观怀有真诚的感激，而小小的胜利也会让我们感到满足。"}, {"en": "One’s personal [[character]] may make them [[withdraw]] from or join [[democratic]] movements [[throughout]] the whole year.", "zh": "一个人的性格，可能使他在整整一年中退出或加入民主运动。"}, {"en": "Do not [[overestimate]] your own power; you need to [[demonstrate]] facts and [[regard]] evidence seriously.", "zh": "不要高估自己的力量；你需要摆出事实，并认真对待证据。"}, {"en": "We must [[ensure]] the whole [[timescale]] and [[set]] measurable goals.", "zh": "我们必须确保整个时间进程，并设定可衡量的目标。"}, {"en": "[[appreciative]] citizens make voluntary [[donation]] and reject [[irrational]] demands.", "zh": "心存感激的公民自愿捐款，并拒绝不合理的要求。"}, {"en": "Such [[prohibition]] rule is not [[perpetual]].", "zh": "这样的禁令并非永久有效。"}, {"en": "Some voices remain [[unrecognized]].", "zh": "仍有一些声音未被认可。"}, {"en": "Complex rules may [[perplex]] ordinary readers; experts must [[regulate]] and revise the [[entire]] framework.", "zh": "复杂的规则可能令普通读者困惑；专家必须规范并修订整个框架。"}, {"en": "An [[ineffective]] plan requires a fresh [[perspective]].", "zh": "无效的计划需要全新的视角。"}, {"en": "We [[envision]] brighter days and [[guarantee]] basic fairness; a mere [[token]] reward will never suffice.", "zh": "我们憧憬更美好的日子，并保障基本公平；仅仅象征性的奖励永远不够。"}, {"en": "[[empirical]] research tends to support [[lenient]] policies instead of harsh ones.", "zh": "实证研究往往支持宽松的政策，而非严厉的政策。"}, {"en": "[[artificial]] light lit up the midnight [[blaze]].", "zh": "人造光照亮了午夜的火焰。"}, {"en": "Public [[impatience]] can damage sound judgement.", "zh": "公众的不耐烦会损害理性的判断。"}, {"en": "The [[predominance]] of big data helps us [[calculate]] social‑change trends; a [[robot]] can assist heavy‑load work.", "zh": "大数据的主导地位帮助我们测算社会变革的趋势；机器人可以协助完成重负荷的工作。"}, {"en": "[[sophisticated]] tools boost [[international]] communication.", "zh": "精密的工具促进了国际交流。"}, {"en": "Political leaders try to [[appease]] public anger.", "zh": "政治领导人试图平息公众的愤怒。"}, {"en": "An [[anonymous]] source may [[emit]] useful signals.", "zh": "匿名消息来源可能释放出有用的信号。"}, {"en": "[[agricultural]] writers and [[famous]] poets compose a [[poem]] describing [[volatile]] market shifts.", "zh": "农业题材作家和著名诗人创作了一首诗，描述变幻莫测的市场波动。"}, {"en": "The social [[rhythm]] pushes people to [[recite]] plans before the firm [[deadline]].", "zh": "社会节奏促使人们在铁定的最后期限到来之前，反复诵记各项计划。"}]}, {"key": "五星词汇 Day 01 List 2", "words": [{"w": "humble", "phon": "[ˈhʌmb(ə)l]", "def": "adj.谦逊的；虚心的；卑微的v.感到谦卑；感到自惭", "si": [1], "r": "hum(泥土)+ble(性质)→低到泥土里", "dists": [870, 3229, 3205]}, {"w": "instrument", "phon": "[ˈɪnstrəmənt]", tion to artificial [[intelligence]] was a mixture of fascination and fear, and even the most [[humble]] laboratory could sense that something [[inevitable]] had begun.", "zh": "人们对人工智能最初的反应，既着迷又恐惧；即便是最不起眼的实验室，也能察觉到某种不可避免的事情已经拉开序幕。"}, {"en": "No single [[instrument]] of policy, however elegant, could [[confine]] the technology within national borders, because its most important [[component]]—mathematical knowledge—remains [[relevant]] and travels invisibly across the [[atmosphere]] of a connected world.", "zh": "任何单一的政策手段，无论设计得多么精巧，都无法把这项技术封锁在国界之内，因为它最重要的组成部分——数学知识——始终具有现实意义，并在互联互通的世界中无形地穿行于天地之间。"}, {"en": "The [[phenomenon]] first became visible in medicine.", "zh": "这一现象最初是在医学领域显现出来的。"}, {"en": "An algorithm that could [[infect]] public debate as quickly as it processed images began to outperform junior doctors in reading scans, and every [[clinic]] wanted access.", "zh": "一种算法既能以处理图像般的速度浸染公共讨论，又开始在解读扫描影像方面胜过初级医生，于是每家诊所都希望获得使用权限。"}, {"en": "Yet the [[diagnosis]] produced by a machine carried an [[ambiguous]] legal status: if the software erred, who would [[undergo]] the consequences?", "zh": "然而，由机器给出的诊断在法律上地位模糊：倘若软件出错，后果将由谁来承受？"}, {"en": "Hospitals were [[reluctant]] to act as the testing ground, while patient groups continued to [[allege]] that unaccountable systems would [[devastate]] trust in care.", "zh": "医院不愿充当试验场，而患者团体则不断声称，那些无人担责的系统会摧毁人们对医疗服务的信任。"}, {"en": "Regulators responded with a [[preliminary]] framework.", "zh": "监管者以一个初步框架作为回应。"}, {"en": "A parliamentary [[motion]] proposed that any medical model must [[comply]] with a demanding auditing regime, and an [[advisory]] panel was asked to [[outline]] standards within a [[frame]] of accountability.", "zh": "一项议会动议提出，任何医疗模型都必须遵守一套严苛的审计制度；一个顾问小组则受命在问责框架之内拟定标准纲要。"}, {"en": "One contested [[clause]] would [[entitle]] patients to demand a human second opinion whenever an automated system issued a [[plausible]] but uncertain result.", "zh": "其中一项备受争议的条款规定，每当自动化系统给出看似合理却并不确定的结果时，患者都有权要求由人类医生再次诊断。"}, {"en": "Critics called the draft a [[compromise]] that satisfied nobody; defenders replied that compromise is precisely how a [[democracy]] metabolizes disruption.", "zh": "批评者称这份草案是谁都不满意的折中产物；支持者则回应说，民主制度恰恰是靠妥协来消化种种冲击的。"}, {"en": "Behind the legal debate lay a deeper question of [[ethos]].", "zh": "法律争论的背后，潜藏着一个更深层的精神气质问题。"}, {"en": "Engineers trained to [[exaggerate]] neither risk nor promise found themselves [[upset]] by headlines that seemed designed to [[frustrate]] careful work.", "zh": "工程师所受的训练要求他们既不夸大风险、也不夸大前景，可他们却发现自己被那些似乎存心要阻挠严谨工作的新闻标题弄得心烦意乱。"}, {"en": "Many came to [[resent]] the suggestion that their profession lacked a [[conscience]], pointing out that every [[authentic]] researcher they knew would [[contemplate]] failure modes before release.", "zh": "许多人逐渐反感那种暗示其行业缺乏良知的说法，他们指出，自己认识的每一位真正的研究者，在成果发布前都会深思各种失败模式。"}, {"en": "Their [[conviction]] was simple: safety is not a marketing slogan but a discipline, as [[constant]] and unglamorous as checking that each [[integer]] in a dosage table is correct before a nurse administers a [[dose]], and as attentive to every [[wrinkle]] in the protocol as to the protocol itself.", "zh": "他们的信念很简单：安全不是营销口号，而是一种纪律；它如同护士给药前核对剂量表上每一个整数是否正确那般，恒久不变、毫不光鲜，又对规程中每一处细微褶皱都倾注与对规程本身同样多的关注。"}, {"en": "Meanwhile, the economics of the industry grew [[tougher]].", "zh": "与此同时，这个行业的经济生态变得愈发艰难。"}, {"en": "A [[multinational]] firm could [[consolidate]] its position by buying any [[promising]] startup, and its [[revenue]] from a single [[subscription]] product might [[eclipse]] the budget of a small state.", "zh": "跨国公司可以收购任何一家有前途的初创企业来巩固自身地位，而它仅凭一款订阅产品获得的收入，就可能让一个小国的预算相形见绌。"}, {"en": "Critics warned that such concentration would [[diminish]] competition and eventually [[disrupt]] the [[domestic]] labor market; enthusiasts countered that scale can [[expedite]] [[primary]] research and [[alleviate]] shortages of expertise.", "zh": "批评者警告说，这种集中会削弱竞争，并最终扰乱国内劳动力市场；热衷者则反驳道，规模能够加快基础研究，缓解专业技能的短缺。"}, {"en": "The [[dispute]], often conducted in [[rough]] language online, resisted easy resolution, because both sides could [[assert]] supporting evidence.", "zh": "这场在网上常以粗鄙言辞展开的争论，迟迟难以轻易化解，因为双方都能举出支持自己的证据。"}, {"en": "One [[bureau]] created a public [[repository]] where any citizen could inspect training data in a standardized [[format]]; another required that every high-stakes system remain [[traceable]] to an accountable human operator.", "zh": "某局建立了一个公共资料库，任何公民都能以标准化格式查看其中的训练数据；另一个机构则要求，每一个高风险系统都必须可追溯到一名承担责任的人类操作员。"}, {"en": "A [[sovereign]] wealth fund announced it would [[exploit]] its market weight to reward firms that [[collaborate]] with independent auditors, while a neighboring country's [[statute]] threatened to [[prosecute]] executives whose models caused foreseeable harm.", "zh": "一只主权财富基金宣布，将利用其市场影响力奖励那些与独立审计机构合作的公司；而邻国的一项法规则威胁要起诉其模型造成可预见损害的高管。"}, {"en": "Some companies chose to [[retreat]] from the most sensitive sectors rather than accept such [[conditional]] licenses without [[concrete]] safeguards.", "zh": "一些公司选择从最敏感的行业撤出，也不愿在缺乏具体保障措施的情况下接受这类附条件的许可。"}, {"en": "The public conversation remained [[mournful]] at times and triumphant at others.", "zh": "公众的讨论时而哀伤，时而振奋。"}, {"en": "A celebrated [[portrait]] of an AI pioneer hung in the national academy beside that of a [[monarch]] from the industrial age, inviting visitors to [[speculate]] about what [[prestige]] would mean in a century when machines [[duplicate]] human skills.", "zh": "国家学院里，一幅享有盛誉的人工智能先驱画像与工业时代某位君主的画像并排悬挂，引得参观者纷纷遐想：当机器能够复制人类技能时，再过一个世纪，威望将会意味着什么。"}, {"en": "A traveling theater [[troupe]] staged a play in which an [[undercover]] inspector must [[determine]] whether a beloved schoolteacher is human; the production's emotional climax—rendered [[exquisitely]] by its lead actor—asked audiences to [[appreciate]] how much of identity is performance.", "zh": "一个巡回剧团上演了一出戏：剧中一名卧底督察必须查明一位深受爱戴的教师究竟是不是人类；该剧的情感高潮——经主演的精湛演绎——引导观众去体会，身份之中究竟有多少成分是表演。"}, {"en": "Reformers argued that schools should [[instruct]] students not merely to use tools but to [[track]] their limitations, treating data literacy and [[lingual]] fluency as the modern [[equivalent]] of numeracy.", "zh": "改革者主张，学校不仅要教导学生使用工具，还要让他们追踪工具的局限，把数据素养与语言流畅视为现代版的算术能力。"}, {"en": "Traditionalists feared that an [[infinite]] feed of generated content would [[preoccupy]] young minds and erode the [[commitment]] required for [[deliberation]].", "zh": "传统主义者担心，无穷无尽的生成内容推送会占据年轻人的头脑，侵蚀深思熟虑所需要的投入与定力。"}, {"en": "A widely shared [[autobiography]] by a former [[counselor]] described how one [[compassionate]] teacher can [[arrest]] a student's drift into despair more reliably than any app; a British edition quoted a school [[counsellor]] making the same point in nearly identical words.", "zh": "一位前咨询师所写、被广泛转发的自传讲述了一位富有同情心的教师如何比任何应用程序都更可靠地阻止学生滑向绝望；该书的英国版引用了一位学校辅导员的话，用几乎一模一样的措辞表达了同样的观点。"}, {"en": "Research groups tested competing [[hypotheses]] about automation and employment, and the most [[representative]] studies suggested that effects were [[irregular]] across regions—devastating in one town, barely [[discernible]] in the next.", "zh": "各研究小组检验了关于自动化与就业的种种相互竞争的假说，最具代表性的研究表明，其影响在不同地区并不均衡——在一座城镇是毁灭性的，在邻镇却几乎难以察觉。"}, {"en": "Economists warned against [[geo-centric]] thinking that treats one nation's experience as universal, and against the temptation to [[assume]] that what is [[previous]] is predictive.", "zh": "经济学家告诫人们，要警惕把一国经验当作普遍规律的“地域中心式”思维，也要抵制那种想当然地认为既往之事便能预示未来的诱惑。"}, {"en": "A [[frequent]] methodological error, they noted, was to [[concentrate]] only on sectors that are easy to measure, ignoring the [[external]] costs borne by families and communities.", "zh": "他们指出，一个常见的方法论错误，是只关注那些易于衡量的部门，却忽视了家庭与社区所承担的外部成本。"}, {"en": "When an automated trading fund collapsed, investigators found its risk model contained a [[dirt-cheap]] assumption that volatility would stay within historical bounds—an error so basic it seemed almost [[implausible]] in hindsight.", "zh": "当一只自动化交易基金崩盘时，调查人员发现其风险模型包含一个廉价而轻率的假设：波动率会始终处于历史区间之内——这个错误如此低级，事后看来简直令人难以置信。"}, {"en": "The failure threatened to [[compound]] into a wider crisis until regulators moved to [[overturn]] the fund's exemptions and [[overrule]] its internal appeals.", "zh": "这场失败险些恶化为一场范围更广的危机，直到监管者出手撤销该基金的豁免权、驳回其内部申诉，局势才得以控制。"}, {"en": "The episode did lasting damage to the [[reputation]] of quantitative investing, though defenders insisted that one bad model should not [[condemn]] an entire field, any more than a single forged signature invalidates every ledger of contracts.", "zh": "这一事件对量化投资的声誉造成了持久损害，不过支持者坚持认为，不应因一个糟糕的模型就否定整个领域，正如不能因一枚伪造的签名就让整本合同台账失效。"}, {"en": "Some firms offered each [[client]] a transparent account of when algorithms were used, hoping that honesty would [[confirm]] their brand's integrity; others preferred [[upfront]] disclosures only when legally compelled.", "zh": "一些公司向每位客户透明地说明算法在何时得到使用，希望这份诚实能印证其品牌的诚信；另一些公司则只在受到法律强制时才肯预先披露。"}, {"en": "Labor unions demanded that no worker be treated as [[inferior]] to software without recourse, and negotiated the right to human [[intervention]] in automated discipline cases, with [[stiff]] penalties for violations.", "zh": "工会要求，不得让工人在没有申诉渠道的情况下被视作不如软件，并争取到在自动化纪律处分案件中由人工介入的权利，对违规者处以严厉的惩罚。"}, {"en": "A senior manager might [[commend]] a team for questioning its own tools, or quietly penalize the same behavior—an inconsistency that bred [[discontent]] and reminded employees that policy on paper and culture in practice are not always [[loyal]] companions.", "zh": "一位高级管理者可能会表扬一个敢于质疑自家工具的团队，也可能悄悄惩罚同样的行为——这种前后不一滋生了不满，也提醒员工：纸面上的制度与实践中的文化，并不总是形影不离的伙伴。"}, {"en": "Scholars insisted on precise [[terminology]], noting that the [[connotation]] of words like 'intelligence' shapes what the public will tolerate.", "zh": "学者们坚持使用精确的术语，并指出“智能”这类词的隐含意义，会塑造公众所能容忍的边界。"}, {"en": "To [[portray]] every model as a potential catastrophe is as misleading as to [[display]] it as an infallible oracle; the responsible course is to remain [[flexible]] in the face of new evidence and to resist the [[arrogant]] certainty that any generation has the final word.", "zh": "把每个模型都描绘成潜在的灾难，与把它展示为永不犯错的神谕同样具有误导性；负责任的做法，是在新证据面前保持灵活，并抵制那种傲慢的确信——以为任何一代人都能一锤定音。"}, {"en": "An [[articulate]] essayist put it well: we [[associate]] machines with certainty because we fear our own doubts, but doubt is the [[catalyst]] of every honest inquiry.", "zh": "一位善于表达的散文家说得好：我们之所以把机器与确定性联系在一起，是因为我们害怕自己心中的疑虑；然而，怀疑正是一切诚实探究的催化剂。"}, {"en": "A joint [[annual]] report allowed signatories to [[extend]] shared standards gradually, and a mutual-recognition [[concession]] let small nations access audits they could never afford alone.", "zh": "一份联合年度报告使各签署方得以逐步推广共同标准，而一项互认让步安排则让小国得以获得它们独自永远负担不起的审计服务。"}, {"en": "Not every government chose to [[conform]]; some treated regulation as an [[alien]] constraint on sovereignty, while others saw cooperation as a [[privilege]] that must be earned through transparency.", "zh": "并非每个政府都选择遵从；有些把监管视为对主权的外来约束，另一些则把合作看作一种必须以透明来赢得的特权。"}, {"en": "Patient diplomacy—more marathon than sprint—slowly built [[consensus]] around a few core principles: human oversight, [[rigorous]] testing, and the duty to [[prescribe]] remedies when systems fail.", "zh": "耐心的外交——与其说是短跑，不如说是马拉松——慢慢围绕几项核心原则建立起共识：人类监督、严格测试，以及在系统失效时规定补救措施的责任。"}, {"en": "A young couple took out a [[mortgage]] priced partly by an algorithm; a retired engineer kept a meticulous [[inventory]] of household devices that listened and learned.", "zh": "一对年轻夫妇办理了一笔部分由算法定价的抵押贷款；一位退休工程师则一丝不苟地登记着家中那些会倾听、会学习的设备。"}, {"en": "Citizens learned to [[contact]] regulators through new portals, and [[engagement]] with public consultations reached record levels.", "zh": "公民学会了通过新的门户网站联系监管机构，公众对公共咨询的参与度也创下历史新高。"}, {"en": "The [[approximate]] effect of all this was hard to quantify, but few denied that something fundamental had shifted: people no longer treated each new tool as destiny, nor did they dismiss it as a mere [[companion]] to be ignored.", "zh": "这一切所带来的大致影响难以量化，但几乎没有人否认，某种根本性的东西已经改变：人们不再把每一件新工具视为宿命，也不再把它贬作无足轻重、可以忽略的附属品。"}, {"en": "They had begun, collectively, to [[command]] the terms of adoption.", "zh": "他们已经开始集体主导技术采用的条件。"}, {"en": "Looking back, the most striking feature of the era may be how ordinary the [[extreme]] predictions became.", "zh": "回首往事，这个时代最引人注目的特征，或许就是那些极端预言最终变得何其平常。"}, {"en": "The apocalyptic and the utopian both lost their [[appeal]] as the technology settled into the fabric of daily movement—present everywhere, decisive nowhere.", "zh": "随着技术融入日常往来的肌理，末日论调与乌托邦论调都失去了吸引力——它无处不在，却没有任何一处的决定真正由它作出。"}, {"en": "What endured was a quieter lesson: institutions [[deserve]] trust only when they remain open to revision, and every generation must earn again the right to [[anticipate]] the future rather than merely inherit it.", "zh": "留存下来的是一个更为沉静的教训：制度唯有始终乐于接受修正，才配得到信任；每一代人都必须重新赢得预判未来的权利，而不是仅仅把未来继承下来。"}, {"en": "The [[potential]] of any tool is inseparable from the character of those who wield it.", "zh": "任何工具的潜力，都与挥舞它的人的品格密不可分。"}, {"en": "A final [[tribute]] belongs to the skeptics who refused easy answers—the auditors, the dissenting engineers, the scholars who kept asking whether a system that seemed credible was also just.", "zh": "最后的敬意，属于那些拒绝简单答案的怀疑者——审计人员、持不同意见的工程师，以及那些不断追问“一个看似可信的系统是否也同样公正”的学者。"}, {"en": "If the coming century learns anything from this one, it should be that wisdom is not the [[possession]] of any single discipline or nation, but a shared practice—patient, corrigible, and stubbornly human.", "zh": "如果即将到来的世纪能从这个世纪学到点什么，那应当是：智慧不为任何单一学科或国家所占有，而是一种共同的实践——耐心、可被纠正，并且固执地属于人类。"}, {"en": "No statute, however carefully drafted, can replace the judgment of citizens willing to think; and no machine, however capable, can [[exhaust]] the questions that thinking will continue to raise.", "zh": "任何法令，无论起草得多么审慎，都无法取代乐于思考的公民的判断力；任何机器，无论多么强大，也无法穷尽思考将不断提出的问题。"}, {"en": "The record of those years, preserved in every public [[archive]] and family memory, reads less like a revolution than an education.", "zh": "那些岁月的记录，保存在每一座公共档案馆和每一段家庭记忆之中，读起来与其说像一场革命，不如说像一场教育。"}, {"en": "Societies did not solve the problem of intelligent machines; they learned to live inside it, revising their answers as evidence grew and building on what each [[predecessor]] had attempted.", "zh": "社会并没有解决智能机器的问题；他们学会了在这个问题之中生活，随着证据增多而修正自己的答案，并在前人每一次尝试的基础上继续建设。"}]}, {"key": "四星词汇 Day 02 List 3", "words": [{"w": "abide", "phon": "[əˈbaɪd]", "def": "v.遵守；忍受；居住；逗留", "si": [0], "dists": [3224, 2394, 1526]}, {"w": "eager", "phon": "[ˈɡər]", "def": "adj.热切的；渴望的", "si": [1], "dists": [2139, 2009, 2836]}, {"w": "machine", "phon": "[məˈʃin]", "def": "n.机器；机械", "si": [0], "dists": [1403, 1998, 930]}, {"w": "vaccine", "phon": "[vækˈn]", "def": "n.疫苗", "si": [1], "dists": [2923, 2424, 315]}, {"w": "facile", "phon": "[ˈfæs(ə)l]", "def": "adj.轻率的；肤浅的；易做到的", "si": [1], "r": "fac(做)+ile(易于)→容易做到的", "dists": [742, 2585, 1071]}, {"w": "habitat", "phon": "[ˈhæbɪtæt]", "def": "n.栖息地；居留地；产地", "si": [1], "dists": [884, 3262, 2515]}, {"w": "ideal", "phon": "[aɪˈdiəl]", "def": "adj.理想的n.理想；典范", "si": [1], "dists": [885, 1280, 665]}, {"w": "tactic", "phon": "[ˈtæktɪk]", "def": "n.战术；策略", "si": [2, 2], "dists": [321, 895, 808]}, {"w": "tactics", "phon": "[ˈtæktɪks]", "def": "n.策略；战术", "si": [2], "dists": [320, 895, 808]}, {"w": "contest", "phon": "[ˈkɑntest]", "def": "n.比赛；竞赛v.竞争；争夺；争辩；辩驳", "si": [2], "r": "con(一起)+test(测试)→一起比拼", "dists": [3478, 7, 351]}, {"w": "identify", "phon": "[aɪˈdentɪfaɪ]", "def": "v.鉴定；识别；确认", "si": [2], "dists": [505, 3458, 796]}, {"w": "propose", "phon": "[prəˈpəʊz]", "def": "v.提议；计划；求婚；举荐", "si": [3], "r": "pro(向前)+pose(放)→想法放前面", "dists": [398, 3437, 911]}, {"w": "vague", "phon": "[veɪɡ]", "def": "adj.含糊的；不明确的", "si": [3], "dists": [1062, 1122, 1553]}, {"w": "account", "phon": "[əˈkaʊnt]", "def": "n.账户；叙述；账目v.说明；占…", "si": [56], "dists": [706, 462, 416]}, {"w": "garment", "phon": "[ˈɡɑrmənt]", "def": "n.衣服；外衣v.给…穿衣服", "si": [53], "dists": [877, 3078, 1364]}, {"w": "magic", "phon": "[ˈmædʒɪk]", "def": "n.魔术；魔法adj.魔术（似）的；神奇的", "si": [53], "dists": [366, 2365, 808]}, {"w": "protect", "phon": "[prəˈtekt]", "def": "v.保护", "s orm", "phon": "[ˈplætfɔrm]", "def": "n.平台；站台；月台", "si": [22], "r": "plat(平)+form(形状)→平的台子", "dists": [558, 3350, 3038]}, {"w": "rap", "phon": "[ræp]", "def": "n.说唱乐v.说唱；敲击", "si": [3], "dists": [1603, 3487, 1236]}, {"w": "rethink", "phon": "[ˌriːˈθɪŋk]", "def": "v.重新思考；重新考虑", "si": [12], "dists": [2971, 2867, 2302]}, {"w": "binary", "phon": "[baɪnəri]ˈ", "def": "n.二进制；二元adj.二进位的；二元的", "si": [28], "dists": [2214, 958, 428]}, {"w": "deficiency", "phon": "[dɪˈfɪʃ(ə)nsi]", "def": "n.缺乏；不足", "si": [34], "r": "de(缺少)+fic(做)+iency→做得不够", "dists": [1030, 2224, 357]}, {"w": "caregiver", "phon": "[ˈkerɡɪvər]", "def": "n.照顾者；护理者；看护者", "si": [18], "dists": [1355, 1375, 1655]}, {"w": "transgression", "phon": "[trænzˈɡreʃ(ə)n]", "def": "n.违反；罪过", "si": [21], "dists": [34, 337, 2641]}, {"w": "prosocial", "phon": "[prəʊsəʊʃəl]ˈ", "def": "adj.亲社会的", "si": [16], "dists": [2637, 2978, 3282]}, {"w": "altruistic", "phon": "[ˌæltruˈɪstɪk]", "def": "adj.利他的；无私的", "si": [16], "dists": [2578, 3412, 2209]}, {"w": "sacrifice", "phon": "[ˈsækrɪfaɪs]", "def": "v.牺牲；献出；供奉n.供奉；祭品；牺牲（品）", "si": [17], "r": "sacri(神圣)+fic(做)+e→做祭神的事", "dists": [111, 414, 1480]}, {"w": "unselfishly", "phon": "[ʌnˈselfɪʃli]", "def": "adv.无私地；不自私地", "si": [17], "dists": [2273, 2209, 3488]}, {"w": "underlie", "phon": "[ˌʌndərˈlaɪ]", "def": "v.构成…的基础（或起因）", "si": [17], "dists": [1483, 2723, 3488]}, {"w": "upside", "phon": "[ˈʌpsaɪd]", "def": "n.好的一面；积极面", "si": [38], "dists": [161, 2000, 1263]}], "sents": [{"en": "In an era of unprecedented change, modern societies must [[prioritize]] human dignity as the ultimate [[symbol]] of civilizational progress.", "zh": "在这个前所未有的变革时代，现代社会必须把人的尊严放在首位，将其视为文明进步的终极象征。"}, {"en": "The digital revolution has generated [[tremendous]] wealth and connectivity, yet it has also introduced challenges that require careful navigation and sustained intellectual effort.", "zh": "数字革命创造了巨额财富与高度互联，却也带来了种种挑战，需要人们审慎应对、付出持久的智识努力。"}, {"en": "What was once a [[casual]] exchange between neighbors has migrated to screens, where every utterance falls under public [[scrutiny]].", "zh": "邻里之间曾经随意的日常交谈，如今已转移到屏幕之上；在那里，每一句话都要接受公众的审视。"}, {"en": "To [[acquaint]] themselves with this new reality, citizens must develop [[critical]] faculties to evaluate which sources are truly [[credible]] and which merely exploit emotional vulnerabilities, whether in journalism or in the [[rap]] lyrics that shape youth culture.", "zh": "为了让自己熟悉这一新现实，公民必须培养批判能力，以辨别哪些信息来源真正可信，哪些不过是在利用人们情感上的弱点——无论是在新闻报道中，还是在塑造青年文化的说唱歌词里。"}, {"en": "We [[marvel]] at the conveniences of technology, yet few fully [[realise]] how deeply the [[virtual]] realm has penetrated daily existence.", "zh": "我们惊叹于科技带来的种种便利，却很少有人充分意识到，虚拟世界已经何等深入地渗透进日常生活。"}, {"en": "When we finally [[realize]] the extent of this integration, we must also [[critique]] the mechanisms that [[impose]] corporate interests upon personal privacy without meaningful consent.", "zh": "当我们终于认识到这种融合的程度时，我们还必须批判这样一些机制：它们在缺乏真正同意的情况下，把企业利益强加于个人隐私。"}, {"en": "The [[current]] information ecosystem resembles a vast [[swamp]] where individual [[particle]]s of truth struggle to [[emerge]] from murky depths.", "zh": "当下的信息生态系统宛如一片广阔的沼泽，真相的一个个微粒在其中艰难地从浑浊的深处浮现。"}, {"en": "To survive in this environment, one must [[differentiate]] between [[particular]] facts and general distortions, using logical [[deduction]] rather than accepting surface-level claims.", "zh": "要在这样的环境中生存，就必须借助逻辑演绎，把具体事实与笼统的歪曲区分开来，而不是接受流于表面的说法。"}, {"en": "Governments [[supervise]] digital platforms to ensure they do not [[violate]] fundamental rights or promote [[violence]] through algorithmic amplification.", "zh": "政府对数字平台加以监督，以确保它们不会侵犯基本权利，也不会经由算法放大而助长暴力。"}, {"en": "Democratic nations must [[organize]] their legal frameworks to be [[inclusive]], addressing [[inadequate]] safeguards that leave marginalized communities exposed to online harms.", "zh": "民主国家必须把法律框架组织得更具包容性，着力解决保障措施不足的问题——这些不足使边缘化群体暴露在网络伤害之中。"}, {"en": "To [[acquire]] lasting [[wisdom]], the [[adolescent]] mind must [[cultivate]] analytical depth rather than [[remain]] [[indifferent]] to complex social issues.", "zh": "若想获得持久的智慧，青少年的心智就必须培养分析的深度，而不是对复杂的社会问题漠然处之。"}, {"en": "Educators should [[emphasize]] [[mental]] resilience, helping young people [[adjust]] to pressures that previous generations never encountered.", "zh": "教育工作者应当重视心理韧性，帮助年轻人去适应前几代人从未遭遇过的种种压力。"}, {"en": "From the local [[charter]] academy to the office of the university [[chancellor]], institutions must [[rethink]] traditional pedagogies.", "zh": "从本地的特许学校到大学的校长办公室，各类机构都必须重新审视传统教学法。"}, {"en": "Rather than [[decorate]] classrooms with merely ornamental technology, teachers should [[employ]] methods that [[nurture]] genuine understanding and [[secure]] a brighter intellectual future for every [[recipient]] of public education.", "zh": "教师不应用仅仅具有装饰性的技术去装点教室，而应采用这样的方法：培育真正的理解力，并为每一位公共教育的接受者确保一个更加光明的智识未来。"}, {"en": "The [[finance]] sector continues to [[merge]] with artificial intelligence, creating new [[contract]] arrangements that [[affect]] workers across every [[region]].", "zh": "金融业不断与人工智能相融合，催生了新型合同安排，影响着每一个地区的劳动者。"}, {"en": "As corporations [[switch]] to automated systems, many employees fear becoming [[redundant]], while others [[enlist]] in training programs held [[annually]] to [[sustain]] their careers and [[perform]] emerging duties.", "zh": "随着企业改用自动化系统，许多员工担心自己变得多余；另一些人则报名参加每年举办的培训项目，以维系职业生涯并履行新兴的职责。"}, {"en": "Human [[biology]] may be constant, but social environments profoundly [[indicate]] how [[prosocial]] and [[altruistic]] behaviors develop within any given [[affiliate]] group or community.", "zh": "人类的生理机能或许恒久不变，但社会环境深刻地决定着：亲社会行为和利他行为如何在任何一个特定的从属群体或共同体中发展起来。"}, {"en": "When communities [[donate]] resources [[unselfishly]] to aid struggling neighbors, they demonstrate that personal [[sacrifice]] still [[underlie]]s the foundation of civilized coexistence.", "zh": "当社区无私地捐出资源去援助困境中的邻里时，它们便证明了：个人牺牲仍然构成文明共存的基石。"}, {"en": "An aging population has strained the [[pension]] system and [[caregiver]] networks, as families struggle to provide [[adequate]] support for elderly relatives.", "zh": "人口老龄化已使养老金制度和照护者网络不堪重负，各个家庭难以为年迈的亲人提供足够的赡养。"}, {"en": "This situation compels policymakers to [[certify]] professional standards and [[administer]] programs that [[select]] qualified workers, reflecting a broader societal [[demand]] for compassionate eldercare.", "zh": "这一局面迫使政策制定者认证职业标准，并实施相应项目来选拔合格的从业者，反映出全社会对富有同情心的老年照护有着更广泛的需求。"}, {"en": "Public [[sentiment]] toward historical [[figure]]s has shifted dramatically, as modern audiences no longer [[admire]] prominent personalities without question.", "zh": "公众对历史人物的看法已发生急剧转变：现代受众不再不加质疑地崇敬那些显赫名流。"}, {"en": "Scholars now examine the [[biography]] of leaders with a more [[delicate]] touch, recognizing that even respected individuals may have committed moral [[transgression]]s that [[insult]] contemporary ethical standards.", "zh": "学者们如今以更为审慎细致的笔触去审视领袖的传记，承认即便是受人尊敬的人物，也可能犯下冒犯当代伦理标准的道德过失。"}, {"en": "The modern media [[platform]] hosts a continuous [[conversation]] where [[visual]] content can [[substitute]] for nuanced debate.", "zh": "现代媒体平台承载着不间断的对话，在其中，视觉内容可能取代细致入微的辩论。"}, {"en": "While this democratizes expression, it also allows [[cursory]] judgments to [[swell]] into [[widespread]] movements, as a single [[incident]] can permanently [[record]] damage upon someone's public [[profile]], creating a destructive [[feedback]] loop that amplifies outrage.", "zh": "这虽然使表达趋于民主化，却也让草率的判断膨胀为蔓延广泛的运动：单单一个事件就可能把伤害永久地刻在某人的公众形象上，形成一个不断放大愤怒的破坏性反馈回路。"}, {"en": "Technology firms [[encode]] user preferences in sophisticated algorithms, storing behavioral datasets in digital [[warehouse]]s where privacy protections are rarely [[transparent]].", "zh": "科技公司把用户偏好编入精密复杂的算法，将行为数据集存储在一座座数字仓库之中，而那里的隐私保护鲜有透明可言。"}, {"en": "When [[third-party]] vendors [[implicate]] users in data breaches, the [[outcome]] often leaves victims [[indignant]] and searching for legal means to [[defend]] their rights.", "zh": "当第三方供应商使用户卷入数据泄露事件时，其结果往往让受害者义愤填膺，转而寻找法律途径来维护自己的权利。"}, {"en": "Sociologists track the [[incidence]] of cybercrime, noting how digital environments can [[channel]] criminal behavior into new forms of exploitation.", "zh": "社会学家追踪网络犯罪的发生情况，注意到数字环境如何能把犯罪行为引导成新的剥削形式。"}, {"en": "Legal systems must establish a clear [[penalty]] for those who [[threaten]] national infrastructure or take [[advantage]] of security loopholes, ensuring justice maintains a [[definite]] purpose without becoming [[cruel]] or arbitrary.", "zh": "法律制度必须对那些威胁国家基础设施、或利用安全漏洞的人确立明确的刑罚，确保司法保有明确的目的，而不至于变得残酷或任意。"}, {"en": "As individuals [[reflect]] on their place in the digital [[universe]], many [[incline]] toward a [[binary]] worldview that separates technology from humanity.", "zh": "当个人反思自己在数字宇宙中的位置时，许多人倾向于一种二元对立的世界观，把技术与人性截然分开。"}, {"en": "Yet this perspective overlooks the [[peculiar]] reality that digital tools are merely extensions of human intention, and that true progress requires us to [[stretch]] our understanding beyond simplistic categories.", "zh": "然而，这种视角忽视了一个特殊的现实：数字工具不过是人类意图的延伸；真正的进步要求我们把理解伸展到简单化的分类之外。"}, {"en": "The legislative [[chamber]] must issue a formal [[declaration]] affirming that digital rights [[include]] protections for [[independent]] thought and expression.", "zh": "立法机构必须发布一项正式宣言，申明数字权利包含对独立思想与独立表达的保护。"}, {"en": "Such a [[mandate]] would [[impel]] corporations to maintain higher ethical standards, ensuring that algorithms do not reduce citizens to [[hostage]]s of automated decision-making systems.", "zh": "这样一项授权将敦促企业维持更高的道德标准，确保算法不会把公民降格为自动化决策系统的人质。"}, {"en": "History unfolds not as random [[chaos]] but as a coherent [[sequence]] of events, a [[series]] of interconnected developments that [[denote]] broader cultural shifts.", "zh": "历史的展开并非随机的混乱，而是一连串前后连贯的事件，是一系列彼此关联的发展，标志着更为宏大的文化变迁。"}, {"en": "Each generation must [[suppose]] that its challenges are unique, yet historical patterns consistently [[advise]] us that human societies eventually find ways to [[reduce]] conflict and build cooperation.", "zh": "每一代人都难免以为自己面对的挑战独一无二，然而历史的规律一再告诫我们：人类社会最终总能找到减少冲突、建立合作的办法。"}, {"en": "Just as the body requires proper [[nutrient]]s for physical health, the mind requires intellectual nourishment to avoid a [[deficiency]] in moral reasoning.", "zh": "正如身体需要适当的营养来维持生理健康，心灵也需要智识上的滋养，以免在道德推理方面出现匮乏。"}, {"en": "Individuals raised in supportive environments typically develop the strength to [[withstand]] social pressures, while those lacking guidance may prove more susceptible to manipulation.", "zh": "在支持性环境中长大的人，通常会培养出承受社会压力的力量；而那些缺乏引导的人，则可能被证明更容易受人操纵。"}, {"en": "A [[non-controversial]] public [[affair]] is increasingly rare in modern governance, particularly when [[unrepresentative]] polling samples distort public perception.", "zh": "在现代治理中，毫无争议的公共事务越来越罕见，尤其是当缺乏代表性的民调样本扭曲了公众认知的时候。"}, {"en": "Political leaders who [[withhold]] vital information from constituents often face [[acute]] public pressure, compelling them to [[enroll]] media specialists who can help [[surround]] their policies with more persuasive narratives.", "zh": "那些向选民隐瞒关键信息的政治领导人，往往面临尖锐的公众压力，这迫使他们延揽媒体专家，以更具说服力的叙事来环绕、包装自己的政策。"}, {"en": "The [[upside]] of technological progress is undeniable, yet humanity reaches its [[peak]] only when innovation serves [[merit]] rather than privilege.", "zh": "技术进步的好处不可否认，但唯有当创新服务于才干而非特权时，人类才能抵达自身的巅峰。"}, {"en": "As we stand at this crossroads, the ultimate test of civilization lies not in what we create, but in whether we can preserve the moral [[lineage]] that connects us to our highest aspirations.", "zh": "站在这样一个十字路口，文明的终极考验并不在于我们创造了什么，而在于我们能否守护那条把我们与最高理想相连的道德血脉。"}]}, {"key": "四星词汇 Day 03 List 5", "words": [{"w": "permission", "phon": "[pərˈmɪʃ(ə)n]", "def": "n.许可；批准", "si": [0], "r": "per(完全)+miss(送)+ion→完全放行", "dists": [3147, 293, 16]}, {"w": "convert", "phon": "[kənˈvɜrt]", "def": "v.转换；转变；变换；使...改变信仰n.皈依者", "si": [0], "r": "con(全部)+vert(转)→全部转变", "dists": [3308, 2338, 1926]}, {"w": "establishment", "phon": "[ɪˈstæblɪʃmənt]", "def": "n.建立；机构", "si": [0], "dists": [2085, 3452, 3014]}, {"w": "renovation", "phon 21, 2613]}, {"w": "recreation", "phon": "[ˌrekriˈeɪʃ(ə)n]", "def": "n.消遣；娱乐", "si": [42], "dists": [3149, 2785, 639]}, {"w": "finalize", "phon": "[ˈfaɪnəlaɪz]", "def": "v.确定；定案；最终确定", "si": [43], "r": "fin(界限)+alize(使)→定到界限", "dists": [1812, 2852, 539]}, {"w": "shortage", "phon": "[ˈʃɔrtɪdʒ]", "def": "n.不足；短缺", "si": [43], "dists": [2597, 1214, 3344]}, {"w": "obstruct", "phon": "[əbˈstrʌkt]", "def": "v.阻碍；阻塞；阻挡", "si": [43], "r": "ob(挡住)+struct(建造)→挡住建设", "dists": [846, 3119, 658]}, {"w": "undocumented", "phon": "[ˌʌnˈdɑkjumentɪd]", "def": "adj.没有书面证据支持的；无正式文件的；无事实证明的", "si": [44], "dists": [1608, 2872, 101]}, {"w": "intensive", "phon": "[ɪnˈtensɪv]", "def": "adj.密集的；增强的", "si": [44], "r": "in(向内)+tens(伸)+ive→向内拉紧", "dists": [743, 796, 2940]}, {"w": "surf", "phon": "[sɜrf]", "def": "v.冲浪；（互联网上）冲浪n.激浪；拍岸浪花", "si": [45], "dists": [3307, 1701, 1720]}, {"w": "offload", "phon": "[ˌɔˈləʊd]", "def": "v.卸货；解除；转手", "si": [45], "dists": [3461, 3388, 3279]}, {"w": "quiz", "phon": "[kwɪz]", "def": "n.小测验；知识竞赛", "si": [46], "dists": [3495, 3102, 1169]}, {"w": "flat", "phon": "[flæt]", "def": "adj.平坦的；扁平的；平淡无味的；（说话）断然的；（轮胎）瘪了的n.公寓；平坦部分adv.直接地", "si": [46], "dists": [2435, 2385, 2309]}], "sents": [{"en": "When the municipal council finally granted [[permission]] to [[convert]] the derelict railway depot into a cultural center, the [[establishment]] of a dedicated planning [[agency]] followed within weeks.", "zh": "当市政委员会最终批准将废弃的铁路机车车库改建成文化中心时，一个专门的规划机构在几周之内便随之成立。"}, {"en": "The [[department]] of urban affairs engaged a respected [[firm]] of architects to direct the [[renovation]], hoping to [[transform]] the decaying [[structure]] into a [[prominent]] landmark that would anchor the city's revival.", "zh": "城市事务部聘请了一家受人尊敬的建筑师事务所主持修缮工程，希望把这座日渐衰败的建筑改造成一处醒目的地标，使之成为支撑城市复兴的支柱。"}, {"en": "Older residents looked back with [[sorrow]] at the demolition of the old workshops and continued to [[grieve]] for the vanished yard; many openly voiced [[regret]] that so many craftsmen had been forced to [[depart]].", "zh": "年长的居民满怀伤感地回望旧车间被拆除的情景，仍在为消失的车场感到悲痛；许多人公开表示遗憾，说那么多工匠竟被迫离去。"}, {"en": "Officials argued that only bold change could [[induce]] fresh investment, and they promised [[regular]] public consultations to keep the community involved.", "zh": "官员们辩称，唯有大胆的变革才能引来新的投资；他们还承诺定期举办公众咨询会，让社区持续参与其中。"}, {"en": "Commentators in [[literary]] circles warned that the district's decline had been [[severe]], and it was difficult to [[overstate]] the [[misery]] that years of neglect had inflicted on local families.", "zh": "文学界的评论者警告说，该街区的衰败已十分严重，多年的疏于治理给当地家庭造成的苦难，怎样形容都不为过。"}, {"en": "Some feared that construction dust and heavy traffic would [[aggravate]] an already fragile [[environment]], while others urged the skeptics not to let suspicion [[persist]] once all the evidence had been aired.", "zh": "一些人担心，施工扬尘和繁重的交通会让本已脆弱的环境雪上加霜；另一些人则敦促怀疑者，在所有证据都公之于众之后，就不要再让猜疑持续下去。"}, {"en": "At one heated meeting, an [[aggressive]] faction tried to shout down the speakers, and tempers threatened to [[flare]] out of control.", "zh": "在一次气氛激烈的会议上，一个咄咄逼人的派系试图高声压倒发言者，人们的怒火眼看就要爆发失控。"}, {"en": "The mayor vowed to [[uphold]] the public's right to orderly debate, accusing the protesters of attempting to [[misinterpret]] the plan as a gift to developers.", "zh": "市长誓言维护公众有序辩论的权利，指责抗议者企图把该计划歪曲为送给开发商的礼物。"}, {"en": "[[Pessimistic]] columnists predicted failure, even as the first trucks delivered [[cement]] to the site.", "zh": "悲观的专栏作家预言工程必将失败，尽管此时首批卡车已把水泥运抵工地。"}, {"en": "The project promised to ease the daily [[commute]] of thousands and to protect both the [[intangible]] heritage of the neighborhood and its [[material]] fabric.", "zh": "该项目有望缓解数千人每日通勤的辛劳，并同时保护街区无形的文化遗产及其物质肌理。"}, {"en": "Because few local families could [[afford]] the rising [[rental]] prices, the council created a fund to [[safeguard]] long-time tenants.", "zh": "由于当地几乎没有家庭负担得起不断上涨的租金，委员会便设立了一项基金，以保护久居于此的租户。"}, {"en": "Engineers boasted that the concert hall's acoustics would be [[unsurpassed]], and an [[unexpected]] archaeological find beneath the floor led the mayor to [[depute]] a senior curator to oversee the excavation.", "zh": "工程师们夸口说音乐厅的音响效果将无可匹敌；而地板下一处出人意料的考古发现，促使市长委派一位资深馆长监督发掘工作。"}, {"en": "The city's [[philharmonic]] orchestra stood to gain the most.", "zh": "本市爱乐乐团将是最大的受益者。"}, {"en": "Musicians would often [[relate]] how they could no longer [[tolerate]] the leaking roof of their old hall, and one dramatic [[episode]], a storm that silenced a performance mid-symphony, had made the case for relocation.", "zh": "乐手们常常讲述，他们再也无法忍受旧音乐厅漏雨的屋顶；而一段戏剧性的插曲——一场暴风雨使交响乐在演奏中途戛然而止——为搬迁提供了充分的理由。"}, {"en": "A [[beneficial]] partnership with a foundation, whose guiding [[philosophy]] bordered on the [[worship]] of beauty, helped the orchestra [[derive]] new income from recordings.", "zh": "与一家基金会的有益合作（其指导理念近乎对美的崇拜）帮助乐团从唱片录制中获得了新的收入。"}, {"en": "Fundraisers began to [[hunt]] for sponsors, and the board agreed to [[release]] a candid prospectus.", "zh": "筹款人开始物色赞助商，董事会则同意发布一份坦诚的招股说明书。"}, {"en": "Because the country was sliding into [[recession]], every major [[shareholder]] of the partner companies demanded caution, and analysts could only [[infer]] from the data that donations would shrink.", "zh": "由于国家正滑向经济衰退，合作公司的每一位大股东都要求谨慎行事，分析师只能从数据中推断捐款将会缩水。"}, {"en": "The committee still voted to [[equip]] the hall with modern lighting and to [[present]] its plans before the budget talks could [[descend]] into confusion.", "zh": "委员会仍然投票决定为音乐厅配备现代化灯光设备，并赶在预算谈判陷入混乱之前提交其计划。"}, {"en": "The schedule was [[bound]] to face delays, yet a [[prompt]] inspection after a small, nearly [[disastrous]] fire confirmed the structural [[integrity]] of the old beams.", "zh": "工期注定会遭遇延误，然而一场险些酿成灾难的小火之后，一次迅速的检查确认了旧梁的结构完整性。"}, {"en": "Architects proposed a [[compact]] design that would [[relieve]] crowding and include a quiet [[lounge]] for visitors.", "zh": "建筑师提出了一种紧凑的设计，既能缓解拥挤，又能为参观者辟出一间安静的休息室。"}, {"en": "The [[press]], initially hostile, gradually softened its tone as the full plans became public.", "zh": "最初持敌对态度的新闻界，在完整计划公之于众后，语气逐渐缓和下来。"}, {"en": "With money running low, the committee grew [[desperate]], and its [[desire]] to impress donors tempted some contractors to [[inflate]] their prices.", "zh": "资金日渐吃紧，委员会变得不顾一切；而它急于打动捐赠者的心态，诱使一些承包商抬高报价。"}, {"en": "A meticulous [[chronology]] of spending, the auditors argued, would [[inform]] the public and curb the [[influence]] of lobbyists.", "zh": "审计者主张，一份一丝不苟的开支年表既能让公众了解情况，也能遏制说客的影响力。"}, {"en": "When one official tried to [[pretend]] that a [[brand]]-new crane was indispensable, a leaked [[remark]] exposed the ploy, and an idle threat by vandals to [[destruct]] the fence reminded everyone that honest accounting was [[essential]].", "zh": "当一名官员试图谎称一台崭新的起重机不可或缺时，一句泄露的言论揭穿了这一花招；破坏公物者扬言要捣毁围栏，这种虚张声势的威胁也提醒每个人：诚实的账目至关重要。"}, {"en": "To restore confidence, the council voted to [[establish]] an independent oversight board, hoping that transparency would [[prevail]] over cynicism.", "zh": "为恢复公众信心，委员会投票决定成立一个独立的监督委员会，希望透明能够战胜冷嘲热讽。"}, {"en": "Historians were asked to [[trace]] the depot's past in meticulous [[detail]], while auditors worked to [[prevent]] any misuse of funds.", "zh": "历史学家受邀一丝不苟地追溯车库的历史，审计人员则致力于防止任何滥用资金的行为。"}, {"en": "A neighborhood association became an unlikely [[ally]] of the board, offering a cautious [[estimate]] that even a [[modest]] budget, if officials could [[allocate]] it wisely, would suffice, and the board's code of professional [[ethics]] allowed it to [[modify]] any contract that seemed unfair.", "zh": "一个社区协会意外地成为该委员会的盟友，它谨慎地估计：只要官员们能明智地分配，即使预算不多也足够使用；而委员会的职业道德准则允许其修改任何看似不公的合同。"}, {"en": "Under no [[circumstance]], the charter declared, should the work displace poor families.", "zh": "章程宣告：在任何情况下，工程都不得迫使贫困家庭搬迁。"}, {"en": "Conservators cleaned every [[molecule]] of soot from the brickwork, treating the building as a vessel of collective [[tradition]], and artisans labored to [[render]] the facade in its original color.", "zh": "文物保护者清除了砖墙上的每一粒煤烟，把这座建筑当作承载集体传统的容器；工匠们辛勤劳作，力求将立面还原为原本的颜色。"}, {"en": "A local [[charity]] organized volunteers; a [[mass]] of [[correspondence]] from supporters, together with [[drastic]] cuts in administrative costs, kept the project alive.", "zh": "一家本地慈善机构组织了志愿者；支持者寄来的大量信件，加上行政开支的大幅削减，使项目得以维持下去。"}, {"en": "It was, one bishop wrote, a victory for [[humanity]], and the volunteers went on to [[pave]] the new square and [[rectify]] the errors of earlier builders.", "zh": "一位主教写道，这是人道的胜利；志愿者们随后铺好了新广场，并纠正了早期建造者的种种错误。"}, {"en": "The council issued an [[updated]] schedule and arranged a televised [[broadcast]] from the site.", "zh": "委员会发布了更新后的时间表，并安排了一场从工地现场进行的电视转播。"}, {"en": "Beneath the new arch, stonemasons carved the [[alphabet]] to honor the city's first printing house, a nod to local [[innovation]] in a [[prime]] location, and officials promised they would not [[alter]] the design again.", "zh": "在新拱门下方，石匠们雕刻了字母表，以纪念本市第一家印刷厂——这是在黄金地段对本地创新的致意；官员们承诺不会再更改设计。"}, {"en": "A public [[enquiry]] in the British style, followed by a formal American-style [[inquiry]], examined whether the contractor held a [[monopoly]] on local stonework and whether signs should appear in the regional [[dialect]].", "zh": "一场英式公开调查，随后又是一场正式的美式调查，审查了承包商是否垄断了本地石工业务，以及标识是否应使用地区方言。"}, {"en": "Engineers agreed to [[replace]] the cracked windows but to preserve the [[classical]] facade, subject to [[prior]] approval from the heritage board.", "zh": "工程师同意更换开裂的窗户，但保留古典风格的立面，这须以获得遗产委员会的事先批准为前提。"}, {"en": "Gardeners would [[transplant]] the old linden trees, though some members continued to [[insist]] that the trees be left alone.", "zh": "园丁将移栽那些老椴树，不过一些成员仍坚持要求不要动这些树。"}, {"en": "Facing a genuine [[dilemma]], the architects chose to [[represent]] both positions honestly; they could [[affirm]] that the [[intention]] was preservation rather than [[propaganda]], and that the [[substance]] of the debate mattered more than the [[amount]] of money at stake.", "zh": "面对真正的两难困境，建筑师选择如实呈现双方的立场；他们可以肯定，其意图在于保护而非宣传，辩论的实质比所涉金额的多少更为重要。"}, {"en": "Every approval followed a strict [[procedure]].", "zh": "每一项审批都遵循严格的程序。"}, {"en": "Above the entrance hung a handsome [[analogue]] clock, and [[multiple]] expert reports accompanied the file: British consultants were hired to [[analyse]] the soil, while American engineers would [[analyze]] the costs.", "zh": "入口上方挂着一只美观的指针式时钟，卷宗附有多种专家报告：英国顾问受聘分析土壤，而美国工程师将分析成本。"}, {"en": "A new research [[institute]] for architectural acoustics opened nearby, recent [[legislation]] required open bidding, and a portrait honored the depot's founder, an [[ancestor]] of the current mayor.", "zh": "附近新开了一所建筑声学研究所，近期的立法要求公开招标，还有一幅肖像纪念车库的创立者——现任市长的一位祖先。"}, {"en": "Construction hit trouble when the northwest corner began to [[sink]] and [[moisture]] seeped into the cellar.", "zh": "西北角开始下沉、湿气渗入地下室时，施工遇到了麻烦。"}, {"en": "Workers struggled to [[fend]] off damp and to protect the timbers from a burrowing [[insect]].", "zh": "工人们奋力挡住潮湿，并保护木料免遭一种掘洞昆虫的侵蚀。"}, {"en": "Gala [[proceeds]] paid for pumps, experimental [[biofuel]] generators powered the machines, and a rooftop [[recreation]] deck lifted morale.", "zh": "庆典的收益支付了水泵的费用，实验性生物燃料发电机为机器提供动力，屋顶的休闲平台则提振了士气。"}, {"en": "Even a sudden [[shortage]] of steel, and protesters who tried to [[obstruct]] the gates, could not stop the team from working to [[finalize]] the contract on time.", "zh": "即便是突如其来的钢材短缺，以及抗议者试图封堵大门，都无法阻止团队按时敲定合同。"}, {"en": "The opening festival welcomed everyone, including formerly [[undocumented]] workers who had completed [[intensive]] training and now guided the tours.", "zh": "开幕节庆欢迎每一个人，包括那些曾没有合法身份、如今已完成强化培训并担任导览的工人。"}, {"en": "In the digital lab, children could [[surf]] archives of the depot's history, while trucks came to [[offload]] the last surplus bricks.", "zh": "在数字实验室里，孩子们可以浏览有关车库历史的档案，卡车则前来卸下最后一批多余的砖块。"}, {"en": "A nightly [[quiz]] about the district drew crowds, and from the [[flat]] roof of the finished hall the city glittered, a promise that patience, honesty, and memory can rebuild what neglect once destroyed.", "zh": "每晚一场关于该街区的知识竞赛都吸引成群的观众；从竣工音乐厅的平屋顶上望去，整座城市熠熠生辉——这 i": [56], "dists": [1900, 3493, 1714]}, {"w": "undercut", "phon": "[ˌʌndərˈkʌt]", "def": "v.压低（价格）；削弱；切去…下部", "si": [19], "dists": [2723, 1351, 190]}, {"w": "drumbeat", "phon": "[ˈdrʌmbit]", "def": "n.鼓声；呼声", "si": [57], "dists": [2341, 3168, 870]}, {"w": "tent", "phon": "[tent]", "def": "n.帐篷；帐棚", "si": [62], "r": "tent(伸)→撑开拉紧的棚子", "dists": [2236, 1625, 1586]}, {"w": "mow", "phon": "[məʊ]", "def": "v.修剪；扫杀n.麦秆堆；干草堆积处", "si": [46], "dists": [2710, 3266, 2765]}, {"w": "weed", "phon": "[wid]", "def": "n.杂草；野草；大麻v.除草；铲除", "si": [46], "dists": [1372, 1353, 1626]}, {"w": "garden", "phon": "[ˈɡɑrd(ə)n]", "def": "n.花园v.从事园艺", "si": [48], "dists": [327, 2374, 2190]}, {"w": "lawn", "phon": "[lɔn]", "def": "n.草坪；草地", "si": [46], "dists": [1539, 1474, 1112]}], "sents": [{"en": "When the city council voted to [[found]] a new Institute of Urban Renewal, few residents [[recognise]] the scale of the challenge; even fewer [[recognize]] that the [[physical]] fabric of the old industrial district would be transformed within a decade.", "zh": "当市议会投票决定成立一所新的城市更新研究院时，几乎没有居民意识到这场挑战的规模；能认识到旧工业区的物质肌理将在十年内焕然一新的人就更少了。"}, {"en": "The plan promised [[affordable]] housing for young workers, yet the city already faced a worrisome [[dropout]] rate in its construction apprenticeship program.", "zh": "该计划承诺为年轻工人提供负担得起的住房，但这座城市建筑学徒项目令人担忧的高辍学率早已摆在眼前。"}, {"en": "The first [[concern]] was [[endurance]]: would the aging [[infrastructure]] survive another [[turbulent]] decade of climate shocks and economic swings?", "zh": "首要的关切是耐久力：日益老化的基础设施，能否再熬过又一个气候冲击与经济动荡交织的十年？"}, {"en": "Engineers warned that the power grid was [[fragile]], and that [[intense]] summer heat already pushed transformers to their limits.", "zh": "工程师们警告说，电网十分脆弱，盛夏的酷热已将变压器逼到了极限。"}, {"en": "In this [[respect]], the planners confronted a formidable engineering challenge.", "zh": "在这一方面，规划者面临着一项艰巨的工程挑战。"}, {"en": "Professor Lin, whose training in [[anthropology]] gave her an unusual lens on zoning disputes, curated an [[exhibit]] at the municipal museum to [[illuminate]] how earlier generations had rebuilt after the great fire.", "zh": "林教授受过人类学训练，这使她在看待区划争议时拥有非同寻常的视角；她在市立博物馆策划了一场展览，以揭示前人在那场大火之后是如何重建家园的。"}, {"en": "Her findings seemed to [[coincide]] with the mayor's own [[intuition]]: communities [[restore]] themselves when citizens feel genuine ownership over shared spaces.", "zh": "她的发现似乎与市长本人的直觉不谋而合：当市民对公共空间怀有真正的主人翁意识时，社区便会自我修复。"}, {"en": "Yet officials moved quickly to [[restrict]] speculation.", "zh": "然而，官员们迅速行动，限制投机行为。"}, {"en": "Property prices were volatile, and the high [[turnover]] of small shops threatened to tear neighborhoods [[apart]].", "zh": "房地产价格波动不定，小商铺的频繁更替更是险些把邻里社区撕成碎片。"}, {"en": "A swift policy [[turnaround]] was needed before [[disorder]], in the form of protests and rent strikes, could [[dominate]] the evening news.", "zh": "必须迅速扭转政策，以免以抗议和拒付房租为形式的混乱占据晚间新闻的头条。"}, {"en": "The mayor chose to [[appoint]] a young [[colleague]] from the housing bureau to [[monitor]] the rollout.", "zh": "市长选择任命住房局一名年轻同事来监督方案的推行。"}, {"en": "She refused to [[dismiss]] public anxiety, and her weekly briefings became an [[outlet]] for residents to [[express]] grievances.", "zh": "她不肯对公众的焦虑置之不理，每周的简报会也成了居民表达不满的渠道。"}, {"en": "She would often [[mention]] that trust, once broken, is extraordinarily hard to rebuild.", "zh": "她常说，信任一旦破碎，重建起来便异常艰难。"}, {"en": "A local [[astronomer]] volunteered to map light pollution, arguing that darkness itself was a civic [[asset]].", "zh": "一位本地天文学家主动请缨绘制光污染分布图，他提出，黑暗本身就是一项城市财富。"}, {"en": "His data would later [[assist]] planners who wanted to [[classify]] neighborhoods by night-sky quality.", "zh": "后来，他的数据为那些希望按夜空质量划分街区的规划者提供了帮助。"}, {"en": "He liked to say that to truly [[explore]] a city, one must look up as well as around.", "zh": "他总喜欢说，要真正探寻一座城市，既要环顾四周，也要仰望天空。"}, {"en": "The council sought to [[stimulate]] investment without resorting to [[extravagant]] subsidies.", "zh": "市议会力求在不诉诸高额补贴的情况下刺激投资。"}, {"en": "A [[commercial]] bank offered to [[sponsor]] a green bond, provided the government could [[assure]] investors that regulations would not suddenly [[reverse]].", "zh": "一家商业银行提出愿意赞助一只绿色债券，前提是政府能向投资者保证，监管政策不会突然逆转。"}, {"en": "The bond's [[approval]] required a [[precise]] legal framework that would [[specify]] exactly how funds were to [[distribute]] across districts.", "zh": "债券的获批需要一套严密的法律框架，确切规定资金将如何分配到各个区。"}, {"en": "A populist candidate tried to [[intimidate]] council members, claiming the renewal scheme would [[undercut]] local shopkeepers.", "zh": "一名民粹主义候选人试图恐吓市议会议员，声称更新计划会损害本地小店主的利益。"}, {"en": "His rhetoric was designed to [[compel]] a pause, and for a moment it seemed to [[attract]] wide support.", "zh": "他的言辞意在迫使工程暂停，一度似乎还赢得了广泛支持。"}, {"en": "The [[irony]] was that his own family firm stood to profit from delay.", "zh": "讽刺的是，他自己的家族企业反倒能从拖延中获利。"}, {"en": "A journalist began to [[investigate]], and the subsequent exposé led to a formal [[prosecution]] for conflict of interest.", "zh": "一名记者着手调查，随后的揭露性报道导致当事人因利益冲突而被正式起诉。"}, {"en": "Across the [[spectrum]] of opinion, a quieter majority favored a pragmatic path.", "zh": "在整个意见光谱上，更为沉默的大多数青睐一条务实的道路。"}, {"en": "One elder, a self-described [[pragmatist]], urged the council not to [[exclude]] modest proposals simply because they lacked glamour.", "zh": "一位自称务实主义者的长者敦促市议会，不要仅仅因为一些不起眼的提案缺乏光环就将其排斥在外。"}, {"en": "\"We cannot [[starve]] the old quarter of funds and then act shocked when its walls [[crumble]],\" she said.", "zh": "她说：“我们不能先掐断老城区的资金，然后等它的墙壁坍塌时又装出震惊的模样。”"}, {"en": "Her plain words did much to [[allay]] public fears.", "zh": "她朴实的话语大大缓解了公众的恐惧。"}, {"en": "Crews labored to [[connect]] a [[distant]] pumping station to the main reservoir, and to [[conserve]] water they installed meters of a new [[type]].", "zh": "施工队奋力将一座偏远的泵站与主水库连接起来；为了节约用水，他们安装了一种新型水表。"}, {"en": "Any [[attempt]] to [[prolong]] the life of lead pipes was firmly rejected; the goal was to replace them with [[intact]] modern systems all at once.", "zh": "任何想延长铅管使用寿命的尝试都被坚决否决；目标是用完好的现代系统将其一次性全部更换。"}, {"en": "One engineer noted that a single faulty valve could [[invert]] pressure and [[extinguish]] supply to an entire block.", "zh": "一名工程师指出，仅仅一个阀门发生故障，就可能使压力倒转，切断整个街区的供水。"}, {"en": "A [[pregnant]] mother of three testified that the waiting list for housing felt like an [[avalanche]] of paperwork.", "zh": "一位怀有身孕、已是三个孩子母亲的妇女作证说，住房候补名单给人的感觉就像雪崩般涌来的文书。"}, {"en": "Advocates pressed the council to [[assign]] a caseworker to every family and to [[promote]] [[enrollment]] in job-training programs.", "zh": "倡导者敦促市议会为每个家庭指派一名个案专员，并推动职业培训项目的报名工作。"}, {"en": "A small [[incentive]]—a monthly transit pass—helped [[compensate]] participants for the time they devoted to the courses.", "zh": "一项小小的激励——一张月度交通卡——帮助参与者补偿了他们投入课程的时间。"}, {"en": "The new community college would [[fulfil]] a long-standing [[pledge]] to local youth; its American partner campus would help [[fulfill]] the accreditation requirements.", "zh": "新的社区学院将兑现对本地青年许下的长久承诺；其美国合作院校则将帮助满足各项认证要求。"}, {"en": "Critics warned that an [[explicit]] focus on employability might narrow the curriculum, but the dean insisted that [[diverse]] courses—from [[drama]] to data science—would [[compose]] the catalog.", "zh": "批评者警告说，一味明确强调就业能力可能会使课程变窄，但院长坚持认为，从戏剧到数据科学的多样课程将共同构成这份课程目录。"}, {"en": "A [[tragic]] warehouse fire [[interrupted]] supply deliveries, and the contractor filed for bankruptcy, leaving the city to [[confront]] a budgetary [[gap]].", "zh": "一场惨烈的仓库火灾中断了物资供应，承包商又申请破产，使这座城市不得不直面预算缺口。"}, {"en": "Some feared the whole [[scheme]] would collapse, but the mayor refused to [[decline]] the challenge.", "zh": "一些人担心整个计划会就此崩溃，但市长拒绝回避挑战。"}, {"en": "She negotiated bridge loans and persuaded a [[federal]] agency to [[confer]] emergency grants.", "zh": "她通过谈判争取到过桥贷款，并说服一家联邦机构拨发紧急补助。"}, {"en": "Questions of [[jurisdiction]] arose when a developer invoked a nineteenth-century [[precedent]] to build near a protected wetland.", "zh": "当一家开发商援引十九世纪的一项判例，要在受保护的湿地附近建造房屋时，管辖权问题随之出现。"}, {"en": "Environmental lawyers argued that the state's [[constitution]] empowered the city to [[resist]] such claims.", "zh": "环境律师主张，州宪法赋予了该市抵制此类主张的权力。"}, {"en": "The court battle was fierce, but the ruling set a [[profound]] precedent of its own: ecological [[risk]] must be priced into every contract.", "zh": "法庭之战十分激烈，但这一裁决本身也开创了一个意义深远的先例：生态风险必须被计入每一份合同的价格。"}, {"en": "Residents hunted for a public [[restroom]] near the construction site and complained about the rising price of [[petrol]].", "zh": "居民们在工地附近寻找公共厕所，又抱怨汽油价格不断上涨。"}, {"en": "A barber advertised a [[special]] summer offer; a café served free coffee to night-shift workers.", "zh": "理发师打出夏季特惠的广告；一家咖啡馆为夜班工人免费供应咖啡。"}, {"en": "A child balanced a [[plate]] of dumplings while her father checked the project [[schedule]] on his phone.", "zh": "一个孩子稳稳端着一盘饺子，她的父亲则在手机上查看工程进度。"}, {"en": "At a public lecture, the astronomer dismissed [[astrology]] with a smile, yet conceded that human beings have always sought patterns in the night sky.", "zh": "在一次公开讲座上，这位天文学家微笑着对占星术不屑一顾，却也承认：人类始终在夜空中寻觅着规律。"}, {"en": "He invited the audience to [[apprehend]] the difference between evidence and wishful thinking, and to [[assimilate]] new data without surrendering their sense of wonder.", "zh": "他引导听众领会证据与一厢情愿之间的区别，并在接纳新数据的同时不放弃惊奇之心。"}, {"en": "Community gardens replaced derelict lots: volunteers would [[mow]] the common [[lawn]], pull every [[weed]] by hand, and [[tackle]] the [[depredation]] left by vandals.", "zh": "社区花园取代了荒废的空地：志愿者们修剪公共草坪，亲手拔除每一根杂草，清理破坏公物者留下的狼藉。"}, {"en": "One [[dynamic]] organizer, whose energy seemed almost [[dynamical]] in its persistence, used a long [[lever]] to pry up old paving stones; with a [[stick]] of chalk she marked where new saplings would go.", "zh": "一位充满干劲的组织者——她那锲而不舍的精力几乎带有一种“动力学”意味——用一根长杠杆撬起旧铺路石，又用一支粉笔标出新树苗未来的栽种位置。"}, {"en": "A recycled [[plastic]] greenhouse helped delicate seedlings [[survive]] their first harsh winter, and the entire [[garden]] became a beloved neighborhood retreat.", "zh": "一座再生塑料搭建的温室帮助娇嫩的幼苗熬过了第一个严冬，整座花园也成了街坊邻里钟爱的休憩之所。"}, {"en": "The results began to [[astound]] even seasoned skeptics.", "zh": "成果之显著，就连见惯风浪的怀疑者也开始感到震惊。"}, {"en": "Small manufacturers discovered that shared workshops could [[propagate]] new techniques; the [[array]] of startups suggested a quiet industrial [[revolution]].", "zh": "小型制造商发现，共享车间能够推广新技术；层出不穷的初创企业则预示着一场静悄悄的工业革命。"}, {"en": "No single firm enjoyed unchallenged [[superiority]]; rather, the district came to [[resemble]] a living laboratory where innovation felt [[spontaneous]] rather than engineered.", "zh": "没有任何一家公司享有无人挑战的优势；相反，整个街区渐渐像一座活生生的实验室，在这里，创新显得自发而生，而非被刻意设计出来。"}, {"en": "Yet not everyone was fully [[conscious]] of the transformation; a few residents remained [[averse]] to change, and some chose to [[avail]] themselves of relocation vouchers.", "zh": "然而，并非所有人都充分意识到了这场转变；少数居民依然厌恶变化，有些人则选择凭搬迁代金券另觅住所。"}, {"en": "Old and [[inherited]] assumptions about urban decay, it turned out, were hard to shake.", "zh": "事实证明，那些关于城市衰败的、世代沿袭的旧有臆断很难动摇。"}, {"en": "Looking back, the mayor offered a candid [[reflection]]: the city had tried to [[construct]] not just buildings but trust, and that effort had to [[consist]] of thousands of unglamorous daily decisions.", "zh": "回首往事，市长给出了一番坦诚的反思：这座城市试图构建的不仅是建筑，更是信任，而这份努力必须由成千上万个不起眼的日常决定组成。"}, {"en": "The project's success did not [[possess]] any single author; it was the work of many hands.", "zh": "这项工程的成功并不属于某一位缔造者；它出自众人之手。"}, {"en": "[[Moreover]], she added, true [[prosperity]] is measured not in towers but in the bonds between neighbors.", "zh": "她还说，真正的繁荣不是以高楼大厦来衡量的，而是以邻里之间的纽带来衡量的。"}, {"en": "To [[aspire]] to such a city, she concluded, is to [[communicate]] honestly, to [[address]] grievances promptly, to [[apply]] consistent metrics, to value every [[aspect]] of community life, and never to let the [[drumbeat]] of cynicism drown out quiet acts of repair.", "zh": "她最后说，向往这样一座城市，就意味着坦诚沟通、及时化解不满、采用始终如一的衡量标准、珍视社区生活的方方面面，并且永远不让愤世嫉俗的鼓点淹没那些无声的修补之举。"}, {"en": "The city's greatest [[stake]], she insisted, always lay in its people.", "zh": "她坚称，这座城市最大的利害所系，永远在于它的人民。"}, {"en": "In the final report, the authors noted that the old [[tension]] between growth and heritage could no longer be ignored.", "zh": "在最终报告中，作者们指出，发展与遗产保护之间由来已久的紧张关系已不容忽视。"}, {"en": "Developers who had [[aggressively]] pushed for maximum density were now asked to [[approach]] historic buildings with humility.", "zh": "那些曾气势汹汹追求最大容积率的开发商，如今被要求以谦卑的态度对待历史建筑。"}, {"en": "The authors [[intend]] their findings to guide future councils, ensuring that an [[intimate]] understanding of place informs every decision.", "zh": "作者们希望自己的研究结论能指导未来的市议会，确保每一项决定都出自对这片土地的深切体认。"}, {"en": "Even a simple canvas [[tent]] erected for community meetings had become a symbol: citizens gathered there to air grievances without fear of bitter [[conflict]], turning a temporary structure into a permanent covenant of cooperation.", "zh": "就连一顶为社区会议搭起的简陋帆布帐篷也成了一种象征：市民们聚集于此倾诉不满，而不必担心激烈的冲突；这座临时建筑由此化作一份永久的合作契约。"}]}, {"key": "三星词汇 Day 04 List 7", "words": [{"w": "back", "phon": "[bæk]", "def": "n.背部；后面adv.回原处；向后adj.后面的；拖欠的v.支持", "si": [35], "dists": [3445, 2520, 2336]}, {"w": "cake", "phon": "[keɪk]", "def": "n.蛋糕；饼", "si": [8], "dists": [2169, 1924, 1761]}, {"w": "daily", "phon": "[ˈdeɪli]", "def": "adv.每天；每日adj.每天的；每日的n.日报", "si": [5], "dists": [3327, 665, 1177]}, {"w": "face", "phon": "[feɪs]", "def": "n.脸v.面对", "si": [15], "dists": [1575, 1225, 1179]}, {"w": "gain", "phon": "[ɡeɪn]", "def": "v.获得；增加n.获得；增益", "si": [61], "dists": [1972, 926, 3259]}, {"w": "habit", "phon": "[ˈhæbɪt]", "def": "n.习惯", "si": [57], "dists": [318, 2368, 1664]}, {"w": "idea", "phon": "[aɪˈdiə]", "def": "n.主意；想法；理念", "si": [57], "dists": [319, 3501, 3175]}, {"w": "jaw", "phon": "[dʒɔ]", "def": "n.颚；颌；下巴", "si": [60], "dists": [1539, 1407, 3247]}, {"w": "key", "phon": "[ki]", "def": "n.钥匙；关键adj.关键的", "si": [57], "dists": [1979, 3183, 2072]}, {"w": "label", "phon": "[leɪb(ə)l]ˈ", "def": "n.标签v.用标签标明", "si": [10], "dists": [1231, 1112, 999]}, {"w": "naked", "phon": "[ˈneɪkɪd]", "def": "adj.裸体的；裸
