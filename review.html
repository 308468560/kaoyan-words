e, in a grey industrial [[place]] on the city's edge, captured the [[chronic]] condition of the [[workaholic]] age: persistently elevated [[cortisol]], gnawing [[anxiety]], and the unspoken fear that slowing down means falling behind.", "zh": "发生在城市边缘灰暗工业区的这一小插曲，道出了工作狂时代的积久病症：皮质醇持续偏高、挥之不去的焦虑，以及那种唯恐放慢脚步就意味着落后的、不曾言明的恐惧。"}, {"en": "Researchers who [[discuss]] burnout in strictly [[cognitive]] terms have designed a revealing [[experiment]].", "zh": "那些纯粹从认知角度讨论职业倦怠的研究人员，设计了一项颇具启发性的实验。"}, {"en": "After weeks of careful [[observation]], every [[expert]] recorded how attention and memory cease to [[function]] normally under sustained pressure.", "zh": "经过数周的细致观察，每位专家都记录下注意力和记忆力如何在持续压力下停止正常运作。"}, {"en": "The [[result]] is easy to [[describe]] but painful to [[explain]], for participants who tried to [[interpret]] their own data helped [[reveal]] flaws no questionnaire could fully [[expose]], strengthening the [[argument]] that overwork damages reasoning itself.", "zh": "这一结果描述起来容易，解释起来却令人痛苦，因为那些试图解读自身数据的参与者，反而帮助揭示了任何问卷都无法完全暴露的缺陷，从而强化了“过度工作会损害推理能力本身”这一论点。"}, {"en": "The strain is sharpest in [[two-paycheck]] families, whose [[dual]] workload breeds a quiet [[dissatisfaction]] that spills into [[social]] gatherings and frays [[interpersonal]] trust.", "zh": "这种压力在双职工家庭中最为尖锐：双重的工作负担滋生出一种悄然的不满，蔓延到社交聚会之中，侵蚀着人际信任。"}, {"en": "That strange [[disconnect]] persists even in [[upper]]-middle-class circles, where [[wealth]] buys every comfort except time.", "zh": "即便在上中层阶级的圈子里，这种奇怪的割裂依然存在——财富买得到一切舒适，唯独买不到时间。"}, {"en": "An old [[friend]] of mine, felled by stress-related [[illness]], admitted that he had spent a [[lifetime]] chasing promotion without once daring to [[plan]] the day he would [[retire]].", "zh": "我的一位老友被与压力相关的疾病击倒，他承认自己一辈子都在追逐晋升，却从未敢规划过退休那一天。"}, {"en": "[[Meanwhile]], the [[Internet]] magnifies the malaise.", "zh": "与此同时，互联网放大了这种隐忧。"}, {"en": "Every [[Internet-based]] platform can [[invite]] a celebrity [[interview]], host a fiery [[column]], and publish a sniping [[comment]] within minutes, while each disposable [[factoid]] competes to become the [[arbiter]] of public attention.", "zh": "每一个互联网平台都能在几分钟之内约来一场名人访谈、开设一个火药味十足的专栏、刊发一条冷嘲热讽的评论；与此同时，每一条用过即弃的趣闻都争相成为公众注意力的裁决者。"}, {"en": "Such constant [[interference]] can [[intrude]] into every quiet hour and [[disturb]] even sleep, a condition that the [[sociology]] of digital life now treats as normal.", "zh": "这种无休止的干扰会侵入每一个安静的时刻，甚至扰乱睡眠，而数字生活的社会学如今已把这种状态视为常态。"}, {"en": "I therefore decided to make a [[fresh]] start and seek a [[true]], genuinely [[free]] interval unlike anything I had learned to [[expect]] from the [[future]].", "zh": "于是我决定重新开始，去寻找一段真实而真正自由的时光，一段不同于我已学会对未来所期待的任何事物的时光。"}, {"en": "A professional [[futurologist]] once told me that lives take an unexpected [[turn]], and the [[twist]] I chose was a journey into the desert, where, in the [[aftermath]] of an early sandstorm, I suffered a genuine [[fright]] before meeting [[jolly]] companions who were [[delighted]] to share simple [[fun]] beneath the stars.", "zh": "一位职业未来学家曾告诉我，人生会出现意想不到的转折；而我选择的转折，是一次深入沙漠的旅行——在一场早来的沙尘暴过后，我着实受了一场惊吓，随后遇到一群快活的旅伴，他们欣然与我在星空下同享简单的乐趣。"}, {"en": "Our [[pilot]], a weathered man with a leather [[trunk]] strapped beside him, insisted that we [[rest]] during the [[quiet]] hour before dawn rather than [[hasten]] onward as our permits were about to [[expire]].", "zh": "我们的飞行员是个饱经风霜的人，身旁绑着一只皮箱。他坚持要我们在黎明前最安静的时辰休息，而不是趁着许可证即将到期继续赶路。"}, {"en": "Travelling on a [[shoestring]], I paid in whatever [[coin]] I carried and joined a creaking [[caravan]] halted at a [[roadside]] well, where a [[kind]] woman offered bread while her [[kid]], a solemn boy, stared at [[another]] stranger as though visitors had arrived from the moon.", "zh": "我以极少的盘缠旅行，用身上带着的任何钱币付账，加入了一支在路边水井旁停下的、吱呀作响的商队；在那里，一位善良的妇人端上面包，而她的孩子——一个神情严肃的男孩——盯着又一个陌生人看，仿佛来客是从月亮上降临的。"}, {"en": "The route, historians said, once linked [[Portugal]] to distant outposts where a [[British]] [[Briton]] might serve as a [[soldier]], witness [[combat]], and endure the [[disgrace]] of commanders willing to [[betray]] their own garrisons.", "zh": "历史学家说，这条路线曾把葡萄牙与遥远的前哨据点连接起来；在那些据点，一个来自不列颠的英国人可能以士兵的身份服役，亲历战斗，并忍受那些不惜出卖自家守军的指挥官所带来的耻辱。"}, {"en": "Centuries of trade and [[intermarriage]] explain why traces of that former [[colony]] still [[exist]], stubborn even in ruin; the besieged settlement, at last [[exorable]], negotiated its surrender.", "zh": "数百年的贸易与通婚解释了为何那片旧殖民地的痕迹依然存在，即便沦为废墟也顽固不化；这座被围困的定居点终于被说动，通过谈判接受了投降。"}, {"en": "In [[retrospect]], such patient [[retrospection]] teaches humility to every empire.", "zh": "回首往事，这种耐心的自省向每一个帝国传授谦卑。"}, {"en": "Our own expedition included a [[meteorologist]], a [[zoologist]], and a [[mineralogist]], whose talk drifted from desert [[chemistry]] to the [[cosmos]] itself.", "zh": "我们这支探险队里有一位气象学家、一位动物学家和一位矿物学家，他们的话题从沙漠化学一路飘荡到宇宙本身。"}, {"en": "Watching a satellite trace a faint [[arc]] above the [[planet]], they explained how a [[sonar]] array maps the seabed, how distant galaxies [[spin]], and why a red [[dwarf]] burns for billions of years.", "zh": "望着一颗卫星在行星上方划出一道淡淡的弧线，他们解释声呐阵列如何测绘海床、遥远的星系如何旋转，以及一颗红矮星为何能燃烧数十亿年。"}, {"en": "There was [[plenty]] of time to grasp the real [[extent]] of a universe whose [[total]] age reduces every human calendar to a blink.", "zh": "我们有充裕的时间去领会宇宙真正的广袤——它的总年龄让人类的每一部历法都短如眨眼一瞬。"}, {"en": "Later, crossing a reserve of giant [[redwood]] and low, fragrant [[shrub]], we catalogued riotous [[flora]] and [[fauna]]: a shaggy [[bison]], an escaped [[ostrich]] adopted by an eccentric warden, and timid mammals thick with winter [[fur]].", "zh": "后来，在穿过一片生长着巨型红杉与低矮芬芳灌木的保护区时，我们把缤纷繁茂的动植物一一登记在册：一头毛发蓬乱的野牛、一只被性情古怪的管理员收养的走失鸵鸟，还有长着浓密冬毛的胆怯哺乳动物。"}, {"en": "Beyond a thundering [[waterfall]], we rode [[horseback]] along the ridges, while our photographer, developing each [[snapshot]] in a portable [[darkroom]] with [[collodion]] plates, filed every print in a waterproof [[folder]].", "zh": "在一道水声轰鸣的瀑布之外，我们沿着山脊骑马前行；与此同时，我们的摄影师用火棉胶底片在便携式暗房里冲洗每张快照，再把每一张样片归入一只防水文件夹。"}, {"en": "At dusk an [[entourage]] arrived — a mining [[mogul]], a charming [[rogue]], and a visiting [[duchess]] of distant lineage — filling a restored [[Persian]] [[caravansary]] with laughter.", "zh": "黄昏时分，一队人马到来——一位矿业大亨、一个迷人的无赖，还有一位出身遥远世系的来访公爵夫人——让修复后的波斯商队客栈充满了笑声。"}, {"en": "The keeper melted [[butter]] over steaming [[rice]], ladled fragrant [[soup]], broke bars of dark [[chocolate]], and refused to [[poach]] the river trout his guests requested.", "zh": "店主在热腾腾的米饭上化开黄油，舀出香气扑鼻的汤，掰开一块块黑巧克力，却拒绝偷捕客人们点名要吃的河鳟。"}, {"en": "When the musicians struck up, travellers began to [[clap]], and the sheer [[pleasure]] of the evening dissolved every rank.", "zh": "乐师们奏起乐曲，旅人们开始鼓掌，而这个夜晚那份纯粹的快乐消融了一切等级。"}, {"en": "Yet the living world we had come to [[preserve]] is under siege.", "zh": "然而，我们远道而来想要保护的这个生机盎然的世界，正身陷重围。"}, {"en": "Where a [[plant]] once [[flourish]]ed and bore [[fruit]], [[scarcity]] now rules.", "zh": "曾经植物繁茂、果实累累的地方，如今由匮乏主宰。"}, {"en": "Governments that [[dispose]] carelessly of public land promote [[greenwash]] instead of genuine carbon [[sequestration]].", "zh": "那些随意处置公共土地的政府，推行的是“漂绿”，而非真正的碳封存。"}, {"en": "A preventable [[epidemic]] of tobacco-related disease persists wherever visitors [[smoke]] in protected valleys, so [[anti-smoking]] wardens no longer [[fume]] helplessly but enforce a firm rule [[against]] lit cigarettes.", "zh": "只要有游客在受保护的山谷里吸烟，一场本可预防的烟草相关疾病就会持续蔓延；因此，禁烟管理员们不再只是无助地发火，而是执行一条严格的规定：禁止点燃香烟。"}, {"en": "These [[sober]] rules made the journey more, not less, [[enjoyable]].", "zh": "这些冷静的规定让旅途变得更有乐趣，而非更少。"}, {"en": "A [[soothing]] routine offered genuine [[comfort]], kept us [[healthy]], and reminded even the [[young]] among us that a [[hundred]] small disciplines, taken in [[full]] measure, [[plus]] a willingness to pause, provide their own quiet [[reward]].", "zh": "一套抚慰人心的日常节奏带来了真切的安慰，让我们保持健康，甚至提醒我们当中最年轻的人：上百项微小的自律，若能十足充分地践行，再加上愿意停下脚步的心态，自会给予人悄然的回报。"}, {"en": "Sleep grew deep and [[sound]], judgment became [[solid]], and the path, once rough, grew steadily [[smooth]].", "zh": "睡眠变得深沉而酣畅，判断力变得扎实，而那条曾经崎岖的小路，也日渐平整起来。"}, {"en": "I had expected to [[dislike]] such restraint, even to feel [[distaste]] for its [[infuriating]] rigidity, and during the first [[uneasy]] days it was [[apparent]] that old habits die hard.", "zh": "我本以为自己会厌恶这种克制，甚至会对它那令人恼火的刻板感到憎恶；在最初那些不安的日子里，积习难改这一点显而易见。"}, {"en": "What followed was [[astonishing]]: silence, [[genuinely]] welcomed, began to [[infuse]] the camp with something close to [[soul]], and when a storm tore our map, no guide needed to [[plead]] or utter a desperate [[plea]].", "zh": "随之而来的一切令人惊讶：受到真诚欢迎的沉默，开始把一种近乎灵魂的东西注入营地；当暴风雨撕碎我们的地图时，没有一位向导需要恳求，也无需发出绝望的哀求。"}, {"en": "The [[claimant]] to leadership brandished an [[invalid]] compass and was gently relieved of command.", "zh": "那个觊觎领导权的人挥舞着一只失灵的罗盘，随即被温和地解除了指挥权。"}, {"en": "Back home, the scholars who [[fund]] fieldwork and [[collect]] oral histories know how to [[combine]] rigour with wonder, yet universities [[expend]] vast sums and [[expand]] campuses to [[invent]] metrics and [[introduce]] audits that no [[successful]] teacher trusts.", "zh": "回到国内，那些资助实地考察、采集口述历史的学者懂得如何把严谨与惊叹结合起来；然而大学耗费巨资、扩建校园，为的是发明各种衡量指标、推行连一位成功教师都不信任的考核审计。"}, {"en": "We treat education like a [[performer]]'s [[tournament]], a [[play]] staged for anxious [[playgoing]] parents, forgetting that a genuine [[playgoer]] attends for revelation rather than ranking.", "zh": "我们把教育当作一场演员的锦标赛、一场为焦虑的看戏家长们搭台上演的戏剧，却忘记了真正的戏迷到场是为了寻求启示，而非为了排名。"}, {"en": "So when I began to [[return]], I resolved to [[review]] my priorities, [[revise]] my schedule, [[revive]] neglected friendships, and [[revitalize]] the neighbourhood garden — small projects that cannot [[solve]] everything but can [[finish]] what they start.", "zh": "所以，当我开始返程时，我决心重新审视自己的轻重缓急，修订日程安排，重拾被疏忽的友谊，让社区花园重焕生机——这些小小的计划不能解决一切，却能善始善终。"}, {"en": "Travellers who [[come]] home from such [[experience]] learn one [[important]] lesson: to [[sort]] signal from noise and [[retain]] what matters.", "zh": "从这样的经历中归家的旅人，会学到重要的一课：从噪声中分拣出信号，留住真正重要的东西。"}, {"en": "[[Thankfully]], that lesson arrived before my patience, like my visa, ran out.", "zh": "庆幸的是，这一课在我的耐心——就像我的签证一样——耗尽之前到来了。"}, {"en": "Now a narrow [[slit]] of dawn crosses my desk, and ambition in [[disguise]] still whispers that the [[plain]] life wastes [[genius]].", "zh": "如今，一道狭窄的晨曦横过我的书桌，而乔装打扮的野心仍在低语：平淡的生活会浪费天赋。"}, {"en": "Yet a mere [[handful]] of unhurried mornings, a brisk [[shower]], and the [[color]] of wet stone — call it [[colour]] too, for both spellings hold — persuade me otherwise.", "zh": "然而，仅仅几个不慌不忙的清晨、一阵清爽的阵雨，以及湿石头的颜色——拼作 color 也好，colour 也罢，两种拼写都成立——便把我说服了。"}, {"en": "An [[intricate]], [[soft]] joy is the [[sole]] reward for those who neither [[explode]] with frustration nor [[disregard]] their limits.", "zh": "一种细腻而温柔的喜悦，是那些既不因挫败而暴怒、也不无视自身局限之人所能得到的唯一回报。"}, {"en": "With [[pluck]] we may build [[better]] habits, shed the [[delusion]] of endless growth, [[discontinue]] pointless meetings, and let the office [[backlog]] wait.", "zh": "凭着勇气，我们或许可以养成更好的习惯，抛却无限增长的错觉，停止毫无意义的会议，让办公室里积压的工作暂且等一等。"}]}, {"key": "三星词汇 Day 10 List 19", "words": [{"w": "interim", "phon": "[ˈɪntərɪm]", "def": "adj.暂时的；临时的；期间的n.过渡时期；中间时期", "si": [5], "dists": [1987, 2524, 209]}, {"w": "jury", "phon": "[ˈdʒʊri]", "def": "n.陪审团；评委会", "si": [43], "dists": [1091, 1048, 1110]}, {"w": "line-up", "phon": "[ˈlaɪnʌp]", "def": "n.阵容", "si": [40], "dists": [2154, 566, 266]}, {"w": "medicaid", "phon": "[ˈmedɪkeɪd]", "def": "n. （美国的）医疗补助计划", "si": [6], "dists": [1998, 3265, 1991]}, {"w": "monthly", "phon": "[ˈmʌnθli]", "def": "adj.每月的；每月一次的adv.每月一次；每个月n.月刊", "si": [3], "dists": [2861, 692, 2711]}, {"w": "occasionally", "phon": "[əkeɪʒnəli]ˈ", "def": "adv.偶尔；有时", "si": [7], "dists": [1305, 3451, 1851]}, {"w": "overly", "phon": "[ˈəʊvərli]", "def": "adv.过度地；过分地", "si": [25], "dists": [3389, 2207, 2057]}, {"w": "persuasion", "phon": "[pərˈsweɪʒ(ə)n]", "def": "n.说服；劝说", "si": [27], "dists": [590, 249, 16]}, {"w": "refocus", "phon": "[ˌriːˈfəʊkəs]", "def": "v.重新聚焦", "si": [32], "dists": [2146, 2514, 339 {"w": "farm", "phon": "[fɑrm]", "def": "n.农场；农庄v.耕种；务农", "si": [11], "dists": [1339, 2672, 1632]}, {"w": "perhaps", "phon": "[pərˈhæps]", "def": "adv.或许；可能", "si": [21], "dists": [1307, 2287, 2181]}, {"w": "single", "phon": "[ˈsɪŋɡl]", "def": "adj.单一的；单独的；单身的n.单曲（唱片） v.挑选", "si": [46], "dists": [3441, 2907, 2355]}, {"w": "third", "phon": "[θɜrd]", "def": "n.三分之一；第三adj.第三的adv.第三", "si": [46], "dists": [3501, 2250, 1917]}, {"w": "either", "phon": "[ˈðər]", "def": "adv.也（用于否定词组后） pron.两者中的任何一个；（用于否定句）两者都不conj.两者之一", "si": [21], "dists": [1287, 2243, 1451]}, {"w": "corn", "phon": "[kɔrn]", "def": "n.玉米；谷物", "si": [11], "dists": [3101, 1298, 3019]}, {"w": "cotton", "phon": "[ˈkɑt(ə)n]", "def": "n.棉；棉花；棉布", "si": [11], "dists": [3171, 3013, 3478]}, {"w": "soybean", "phon": "[ˈsɔɪˌn]", "def": "n.大豆", "si": [11], "dists": [2966, 2597, 1148]}, {"w": "wheat", "phon": "[wit]", "def": "n.小麦；小麦色", "si": [11], "dists": [3011, 2199, 1852]}, {"w": "straw", "phon": "[strɔ]", "def": "n.稻草；吸管", "si": [12], "dists": [345, 3421, 3370]}, {"w": "dairy", "phon": "[ˈderi]", "def": "adj.牛奶的；乳品的n.乳品店", "si": [11], "dists": [2545, 881, 3328]}], "sents": [{"en": "In the high desert of [[Arizona]], where a [[scattered]] line of homesteads clings to the [[rim]] of a red sandstone [[ridge]], a narrow [[road]] follows a shallow [[river]] across the open [[prairie]].", "zh": "在亚利桑那州的高原沙漠上，一排稀稀落落的农舍紧贴着红色砂岩山脊的边缘，一条狭窄的公路顺着一条浅浅的小河穿过开阔的草原。"}, {"en": "Life [[around]] here has never been easy, yet every [[inhabitant]] of the small [[community]], whether a lifelong [[dweller]] or a recent arrival, speaks of the landscape with stubborn affection.", "zh": "这里的生活从来都不容易，然而这个小社区的每一位居民——无论世居于此的老住户还是新近到来者——谈起这片土地时都带着一种执拗的眷恋。"}, {"en": "Twenty years ago a food-processing [[company]] employed half the town; when it closed, the [[tragedy]] was not a single catastrophe but a slow [[doom]].", "zh": "二十年前，一家食品加工公司雇佣着镇上一半的人；它倒闭时，悲剧并非一场突如其来的浩劫，而是一种缓慢的覆灭。"}, {"en": "The [[workday]] vanished for hundreds of [[unemployed]] workers, [[monthly]] rents went unpaid, and the [[workload]] of caring for families fell heavily on women.", "zh": "数百名失业工人失去了工作日，月租无人缴纳，照料家庭的重担重重地压在妇女身上。"}, {"en": "Neither the [[poor]] nor the once [[rich]] were spared, although the [[wealthy]] landowners could at least move elsewhere to rebuild.", "zh": "穷人和曾经的富人都未能幸免，尽管富有的地主至少还能搬到别处重建生活。"}, {"en": "During the [[interim]] years, healthcare became the cruellest burden.", "zh": "在这段过渡的岁月里，医疗成了最残酷的负担。"}, {"en": "Elderly residents with [[arthritis]] relied on [[medicaid]] and cheap [[medication]] from the lone [[drugstore]], where every patented [[drug]] seemed designed to empty a working man's [[pocket]].", "zh": "患关节炎的老年居民依靠医疗补助和镇上唯一一家药店里的廉价药物维持，而那里的每一种专利药似乎都旨在掏空一个劳动者的口袋。"}, {"en": "The pharmacist would [[occasionally]] waive a fee, and small mercies of that kind kept the town's [[spirit]] from breaking entirely.", "zh": "药剂师偶尔会免去一笔费用，正是这类小小的善意使小镇的精神没有彻底崩溃。"}, {"en": "Then Daniel, an [[upstart]] engineer in his late twenties, chose to [[arrive]] home rather than chase a coastal career.", "zh": "后来，年近三十的新锐工程师丹尼尔选择回到家乡，而不是去沿海追逐事业。"}, {"en": "His [[ride]] into town ended at his grandmother's porch, where he talked of [[broadband]] cables, [[mobile]] classrooms and data links fast enough to [[download]] a lecture in seconds.", "zh": "他搭车回到镇上，行程的终点是祖母家的门廊；在那儿，他谈起宽带电缆、移动教室，以及几秒之内就能下载完一场讲座的数据链路。"}, {"en": "Skeptics laughed at [[rocket]] science on the prairie, but Daniel insisted that connectivity could [[revolutionize]] the town and make a once-impossible [[dream]] genuinely [[possible]].", "zh": "怀疑者们嘲笑在草原上搞尖端科技，但丹尼尔坚持认为，互联互通能够彻底改变小镇，让曾经不可能的梦想真正成为可能。"}, {"en": "The [[farm]] belt surrounding the town still produced [[corn]], [[wheat]], [[cotton]] and [[soybean]] crops, while irrigated fields yielded [[potato]] rows and a family [[dairy]] delivered milk at dawn.", "zh": "小镇周围的农业带依然出产玉米、小麦、棉花和大豆，灌溉田里长出一排排土豆，一家家庭乳品店在黎明时分送奶。"}, {"en": "Farmers continued to [[sow]] winter rye and bale the leftover [[straw]], following rhythms older than any startup.", "zh": "农民们继续播种冬黑麦，把剩余的秸秆打捆，遵循着比任何初创公司都古老的节律。"}, {"en": "When rains finally [[pour]]ed, they would [[pound]] the hardpan, [[splash]] against the eaves and [[drain]] away within hours; in dry months farmers had to [[squeeze]] every [[drip]] from the aquifer and watch the soil [[suck]] moisture from perforated hoses.", "zh": "雨水终于倾盆而下时，会猛砸在硬磐上，溅打屋檐，不出几个小时便排流殆尽；干旱的月份里，农民不得不从含水层中挤出每一滴水，眼看着土壤从带孔的水带中吸取水分。"}, {"en": "A [[ripe]] tomato therefore tasted of patience as much as of sun.", "zh": "因此，一颗熟透的番茄尝起来，耐心的滋味与阳光的滋味一样多。"}, {"en": "A bitter [[divide]] soon separated those who trusted Daniel's plan from those who saw it as fantasy.", "zh": "一道尖锐的分歧很快把信任丹尼尔计划的人和把它视为幻想的人分隔开来。"}, {"en": "Water [[policy]], land policy and broadband subsidies became one tangled [[issue]], and every [[item]] on the council agenda seemed to [[involve]] the same quarrel.", "zh": "水政策、土地政策和宽带补贴纠缠成同一个复杂问题，议会议事日程上的每一项似乎都牵涉同样的争吵。"}, {"en": "Daniel's [[point]] was simple: access to information was a civic [[right]], not a privilege.", "zh": "丹尼尔的观点很简单：获取信息是一项公民权利，而非特权。"}, {"en": "Reformers grew [[righteous]], the demand grew [[urgent]], and each [[policymaker]] in the state capital began to feel the pressure.", "zh": "改革者们变得义愤填膺，诉求变得日益紧迫，州府的每一位决策者都开始感受到压力。"}, {"en": "Admittedly, the economics were [[complex]].", "zh": "诚然，其中的经济账错综复杂。"}, {"en": "The sheer [[complexity]] of federal grants can [[complicate]] even modest projects, and no one could [[assess]] or [[evaluate]] the scheme without honest data.", "zh": "联邦拨款本身的极端复杂就足以让哪怕规模不大的项目也举步维艰；没有真实可靠的数据，谁也无法评估这一方案。"}, {"en": "[[Perhaps]] a smaller pilot was wiser; [[either]] path, the council admitted, carried risk, and nobody could honestly claim the plan was [[complete]].", "zh": "或许先搞一个更小的试点更为明智；市议会承认，两条路都有风险，也没有人能诚实地声称这个计划已经完备。"}, {"en": "A few elders continued to [[doubt]] whether fibre optic cables belonged beneath cattle trails.", "zh": "几位长者仍在怀疑，光纤电缆是否该埋在牛走的小道下面。"}, {"en": "A [[rival]] telecom firm soon arrived to [[compete]], masquerading as a white knight.", "zh": "一家竞争的电信公司很快赶来分一杯羹，把自己伪装成白衣骑士。"}, {"en": "Every [[bidder]] promised the sky, and one [[giant]] corporation made an [[offering]] that included a [[handsome]] signing bonus and a pledge to [[double]] local speeds within a year.", "zh": "每一个竞标者都许下天大的诺言，一家大公司开出的条件包括一笔丰厚的签约奖金，以及一年内将本地网速提升一倍的承诺。"}, {"en": "Its claims of [[costless]] installation proved [[illusory]], however, and its [[overly]] polished executives left behind only thicker contracts.", "zh": "然而，其所谓免费安装的说法被证明只是幻影，那些过于光鲜的高管只留下了更厚的合同。"}, {"en": "At the town-hall meetings residents dared to [[ask]] questions and [[complain]] about past betrayals.", "zh": "在市政厅会议上，居民们敢于提出问题，抱怨过去遭受的一次次背叛。"}, {"en": "Daniel's [[persuasion]] rested on evidence rather than slogans; he asked listeners to [[refrain]] from applause until the end and [[explicitly]] listed what each household would pay.", "zh": "丹尼尔的说服力建立在证据而非口号之上；他请听众们等到最后再鼓掌，并明确列出每户人家将要支付的费用。"}, {"en": "Questions that were [[irrelevant]] he answered politely rather than dismissing as [[pointless]], and his [[pointed]] replies restored a [[common]] sense that facts still mattered.", "zh": "对于无关紧要的问题，他也礼貌作答，而不是斥之为毫无意义；他一针见血的回答恢复了人们的一种共识——事实依然重要。"}, {"en": "The surrounding hills were notoriously [[fire-prone]], and a single lightning strike could [[pose]] a lethal threat, with dry grass serving as both [[source]] and fuel.", "zh": "周围的山丘是出了名的火灾高发区，一次雷击就可能构成致命威胁，干枯的野草既是火源又是燃料。"}, {"en": "Wildfire is a strange [[weapon]]: it carries no [[poison]] yet [[spread]] with equal cruelty, and a long [[spell]] of heat can [[terrify]] even veterans.", "zh": "野火是一种奇异的武器：它不含毒药，却以同样的残忍蔓延；而长时间的持续高温，连经验丰富的老手也会心惊胆寒。"}, {"en": "Winds [[spook]]ed the ranch horses, and ember clouds glowed red in the night.", "zh": "大风让牧场的马群受惊，余烬汇成的云团在夜色中泛着红光。"}, {"en": "The emergency forced everyone to [[refocus]].", "zh": "这场紧急情况迫使所有人重新集中注意力。"}, {"en": "Neighbours helped [[arrange]] evacuation rosters and [[pool]] equipment, building a [[robust]] volunteer network that did not wait for official orders.", "zh": "邻里们帮忙安排疏散名单、凑集设备，建起一个强大的志愿者网络，不等官方命令便自行行动。"}, {"en": "Crews managed to [[disengage]] the town's solar [[circuit]] before flames reached the substation, cutting [[power]] manually; families learned which doors to [[lock]] and which roads to use, [[otherwise]] risking entrapment in the smoke.", "zh": "抢修队在大火逼近变电站之前设法切断了镇上的太阳能电路，以手动方式断电；家家户户弄清了该锁哪些门、走哪些路，否则就有可能在浓烟中被困。"}, {"en": "Recovery revealed the [[role]] technology could play.", "zh": "灾后恢复展现了技术所能发挥的作用。"}, {"en": "Daniel helped a cooperative [[post]] job openings online, negotiate a [[raise]] for care workers and watch local wages [[rise]] as remote contracts appeared.", "zh": "丹尼尔帮助一家合作社在网上发布招聘信息，为护工争取加薪，并眼看着随着远程合同的出现，本地工资不断上涨。"}, {"en": "New questions did [[arise]]—about data privacy and absentee landlords—and the changes could [[arouse]] suspicion, yet success continued to [[spur]] initiative.", "zh": "新的问题确实出现了——关于数据隐私和在外房东——这些变化也可能引起猜疑，但成功仍在不断激发人们的主动性。"}, {"en": "The [[drive]] to rebuild would [[span]] an entire generation.", "zh": "重建的动力将跨越整整一代人。"}, {"en": "An [[art]] collective invited a local [[poet]] to read at the reopening [[concert]], and every regular [[concertgoer]] recognised someone on stage.", "zh": "一个艺术团体邀请一位本地诗人在重新开幕的音乐会上朗诵，而每位常来的音乐会观众都能认出台上的某个人。"}, {"en": "The [[line-up]] mixed [[romantic]] ballads with [[postmodern]] electronic pieces; the [[spotlight]] favoured no [[popular]] celebrity but the teachers and mechanics in the [[dress]] circle.", "zh": "演出阵容把浪漫民谣与后现代电子乐曲混搭在一起；聚光灯没有偏爱任何流行名流，而是眷顾了前排正厅里的教师和技工。"}, {"en": "As the [[mood]] softened, children danced without self-consciousness.", "zh": "随着气氛柔和下来，孩子们毫不忸怩地跳起舞来。"}, {"en": "A student newspaper chose to [[document]] the recovery, and a long [[article]] became a minor [[revelation]].", "zh": "一份学生报纸选择记录这场复苏，一篇长文成了小小的启示。"}, {"en": "It showed that the [[irresponsibility]] of distant officials, not local laziness, had deepened the crisis; readers no longer felt judged by a [[jury]] of strangers.", "zh": "它表明，加深危机的是远方官员的不负责任，而非本地人的懒惰；读者们不再觉得自己正受一群陌生人组成的陪审团审判。"}, {"en": "Paranoia about a corporate [[spy]] quietly died, and the town regained its moral [[compass]], its ambition aimed forward like an [[arrow]] rather than backward in blame.", "zh": "对企业间谍的偏执悄然消散，小镇重新找回了道德罗盘，它的抱负像一支箭一样指向前方，而不是回头沉溺于指责。"}, {"en": "The [[domain]] of nature, that wider [[sphere]] in which every human [[kingdom]] is finally embedded, did not vanish during the crisis.", "zh": "自然的领域——那个人类的一切王国最终都嵌于其中的更广阔的范围——在危机期间并未消失。"}, {"en": "Ecologists counted a [[single]] surviving colony of an endangered [[species]] in the canyon—the [[third]] such census in a [[dozen]] years—and learned to [[compare]] census figures that [[fluctuate]] with the rains.", "zh": "生态学家在峡谷中清点出某一濒危物种仅存的一个种群——这是十二年来第三次此类普查——并学会比较随雨水多少而波动的普查数据。"}, {"en": "The [[internal]] logic of the ecosystem, its [[inherent]] discipline, began at the [[root]] of every blighted bush.", "zh": "生态系统的内在逻辑，它固有的秩序，始于每一丛枯萎灌木的根部。"}, {"en": "A trained [[eye]] could [[spot]] minute changes, [[pore]] over petal samples and watch seeds [[drift]] on the [[round]] thermals above the cliffs.", "zh": "训练有素的眼睛能察觉细微的变化，仔细研读花瓣样本，注视着种子在悬崖上方环形的上升热气流中飘荡。"}, {"en": "Maria nursed her [[spouse]] through chemotherapy, slipping a wedding [[ring]] back onto his thin finger and placing a [[rose]] beside his plate on good mornings.", "zh": "玛丽亚照料丈夫度过化疗，把婚戒重新套上他消瘦的手指，在他状态好的早晨把一枝玫瑰放在他的餐盘旁。"}, {"en": "Some days hope seemed to [[roll]] away like a loose [[rock]]; when his weight continued to [[drop]], she felt her own [[posture]] sag and her face grow [[drawn]].", "zh": "有些日子，希望似乎像松动的岩石一样滚走；当他的体重持续下降，她感到自己的身姿也蔫了下来，面容日渐憔悴。"}, {"en": "She refused to [[drag]] her grief through every conversation, refused to [[spit]] bitterness at the healthy, and treated self-pity as a [[silly]] luxury, even when a sudden [[rip]] in the clinic's budget threatened to [[arm]] every pessimist with fresh evidence and pull the whole household [[down]].", "zh": "她不肯让悲伤拖进每一次谈话，不肯把苦涩吐向健康的人，而把自怜视为一种愚蠢的奢侈——即便诊所预算突然裂开大口，威胁着要用新证据武装每一个悲观者、把整个家庭拖垮时，她依然如此。"}, {"en": "Online retailers would [[overpack]] trivial goods, persuading people to [[spend]] beyond need and, [[unintentionally]], to [[downgrade]] their own standards of sufficiency.", "zh": "网络零售商总是把微不足道的商品过度包装，劝人们超出需要地花钱，并无意识中降低了自己对“够用”的标准。"}, {"en": "The debate could [[draw]] in even the young, and it sometimes [[split]] families; a former Olympic [[athlete]] on the council argued with striking [[clarity]] that to [[simplify]] life was not poverty but a mature [[conception]] of freedom.", "zh": "这场辩论甚至能把年轻人也卷进来，有时还让家庭产生分歧；市议会中的一位前奥运选手以惊人的清晰条理论证道，简化生活不是贫穷，而是对自由的成熟理解。"}, {"en": "[[Aside]] from a few libertarians, most voters accepted that [[space]]—quiet, uncluttered, shared—was itself a kind of wealth.", "zh": "除了少数自由意志主义者，大多数选民都认同：空间——安静、整洁、共享的空间——本身就是一种财富。"}, {"en": "By the [[successive]] harvests that followed, the [[population]] had stabilized.", "zh": "到了此后接连而来的一个个收获季，人口已经稳定下来。"}, {"en": "No one pretended that a fibre cable was a magic [[spear]] or that every utility [[pole]] along the highway guaranteed happiness.", "zh": "没有人假装一根光缆是魔法长矛，也没有人假装公路沿线的每一根公用事业电线杆都能保证幸福。"}]}, {"key": "三星词汇 Day 10 List 20", "words": [{"w": "dry", "phon": "[draɪ]", "def": "adj.干的v.变干", "si": [35], "dists": [3327, 2545, 1177]}, {"w": "effect", "phon": "[ɪˈfekt]", "def": "n.影响；作用；效果；效应v.引起；实现；使生效", "si": [0], "r": "ef(出)+fect(做)→做出来的结果", "dists": [392, 567, 2962]}, {"w": "practice", "phon": "[ˈpræktɪs]", "def": "n.练习；实践；惯常做法v.练习；从事；习惯做", "si": [1], "dists": [466, 2608, 2565]}, {"w": "route", "phon": "[rut]", "def": "n.路线；途径", "si": [0], "dists": [3134, 1763, 3245]}, {"w": "spymaster", "phon": "[ˈspaɪmæstər]", "def": "n.间谍组织的首脑", "si": [40], "dists": [1697, 2767, 2118]}, {"w": "asteroid", "phon": "[ˈæstərɔɪd]", "def": "n.小行星", "si": [37], "r": "aster(星)+oid(像)→像星的", "dists": [819, 821, 3431]}, {"w": "due", "phon": "[du]", "def": "adj.预期的；应给的；到期的", "si": [1], "dists": [1299, 1046, 3205]}, {"w": "praise", "phon": "[preɪz]", "def": " 流", "si": [38], "dists": [1047, 2250, 1978]}], "sents": [{"en": "The [[preface]] of adult life opens when a graduate must choose a [[route]] whose long-term [[effect]] no teacher can fully [[predict]].", "zh": "当一名毕业生不得不选择一条其长远影响连任何老师都无法完全预测的道路时，成年生活的序幕便就此拉开。"}, {"en": "A [[first-timer]] in the labour market is [[due]] to discover that sustained [[practice]] outweighs raw talent, and that diplomas alone seldom secure a rewarding career.", "zh": "初入劳动力市场的人终会发现，持续的练习胜过天生的才华，而单凭文凭很少能谋得一份有价值的事业。"}, {"en": "At this [[stage]], achievement demands [[stamina]] rather than a sudden [[rush]] of enthusiasm.", "zh": "在这个阶段，成就需要的是持久的耐力，而非一阵突如其来的热情。"}, {"en": "Young people who [[prefer]] shortcuts often wander [[astray]], mistaking a [[row]] of certificates for genuine competence.", "zh": "偏爱走捷径的年轻人往往误入歧途，把一长串证书错当成真正的能力。"}, {"en": "It is [[dumb]] to assume that a [[stable]] salary guarantees security, yet [[during]] every downturn anxious graduates cling to precisely that illusion.", "zh": "以为稳定的薪水就能保证安稳是愚蠢的，然而在每一次经济下行中，焦虑的毕业生恰恰死死抱着这一幻想不放。"}, {"en": "A [[steelworker]] in an industrial [[province]] may watch the [[crude]] output of his [[durable]] craft displaced by machines.", "zh": "工业省份里的一名钢铁工人，或许会眼睁睁看着自己耐久手艺所出产的粗制品被机器取代。"}, {"en": "When a plant grinds to a [[standstill]], [[unemployment]] rises [[alarmingly]], and the [[statistics]] released by the [[state]] document the damage.", "zh": "当工厂逐渐陷入停顿时，失业率便以惊人的速度攀升，国家发布的统计数据记录下了这一损害。"}, {"en": "The [[underlying]] lesson is that no [[standard]] of living preserves itself.", "zh": "其背后的教训是：没有哪种生活水平能够自行维持下去。"}, {"en": "Companies that [[run]] on [[autopilot]], whose [[staff]] treat daily work as a lifeless [[rut]], soon [[ruin]] their own prospects.", "zh": "那些靠自动驾驶模式运转、员工又把日常工作当作毫无生气的老一套的公司，很快就会毁掉自己的前途。"}, {"en": "A worker's [[duty]] is not merely to [[attend]] the office but to [[prepare]] for change.", "zh": "工人的职责不仅仅是到办公室上班，还要为变化做好准备。"}, {"en": "Every [[member]] of an organization should [[consider]] whether habitual routines accelerate or obstruct [[progress]].", "zh": "组织中的每一个成员都应当思考：习惯性的例行公事究竟是在加速还是在阻碍进步。"}, {"en": "[[Confidence]] grows from systematic [[training]], not from empty [[rhetoric]].", "zh": "信心来自系统的训练，而非空洞的言辞。"}, {"en": "A [[confident]] professional keeps a [[journal]], reviews mistakes honestly, and refuses to [[indulge]] in self-pity.", "zh": "自信的专业人士坚持写日志，诚实地复盘错误，并拒绝沉溺于自怜。"}, {"en": "That [[attitude]] converts each setback into a [[useful]] lesson, while sincere [[praise]], when finally earned, can be accepted with humility.", "zh": "这种态度把每一次挫折都转化为有益的教训；而当真诚的赞美终于凭努力赢得时，也能以谦逊之心坦然接受。"}, {"en": "By contrast, a [[dishonest]] employee may [[steal]] [[credit]] belonging to colleagues or [[overpay]] associates from company funds.", "zh": "相比之下，不诚实的员工可能会把属于同事的功劳窃为己有，或动用公司资金向关系户支付过高的报酬。"}, {"en": "When investigators [[oversee]] the books, an [[audit]] often exposes the [[stain]].", "zh": "当调查人员审查账目时，审计往往会让污点暴露出来。"}, {"en": "Wrongdoers may hire an [[attorney]], threaten to [[sue]], or bargain for [[consent]], but documentary [[proof]] rarely vanishes.", "zh": "作恶者也许会聘请律师、威胁起诉，或是讨价还价谋求私了，但书面证据很少会凭空消失。"}, {"en": "Beyond the courtroom, citizens [[protest]] when a powerful [[predator]] exploits public trust.", "zh": "在法庭之外，当有权有势的掠夺者滥用公众信任时，公民便会奋起抗议。"}, {"en": "A [[democrat]] who genuinely believes in [[unity]] must defend honest institutions instead of excusing corruption for partisan gain.", "zh": "真正信奉团结的民主人士必须捍卫诚信的制度，而不是为了一党之私纵容腐败。"}, {"en": "An elected [[steward]] of public resources should never treat tax revenue as private [[moola]], for governing is not an [[auction]] where policy goes to the highest bidder.", "zh": "掌管公共资源的民选管理者绝不应把税收当作私人钱财，因为治国并非一场政策归最高出价者所有的拍卖。"}, {"en": "The digital era can [[augment]] human capacity enormously.", "zh": "数字时代能够极大地增强人类的能力。"}, {"en": "A single [[website]] or mobile [[program]] may [[contain]] more knowledge than an old library, while a carefully designed [[programme]] of study can reach a global [[audience]].", "zh": "一个网站或一款手机程序所能容纳的知识，或许比一座老图书馆还要多；而一套精心设计的学习课程则可以触达全球受众。"}, {"en": "Yet learners must [[stay]] [[awake]], because endless [[video]] clips [[consume]] attention that deep reading requires.", "zh": "然而学习者必须保持清醒，因为无穷无尽的视频片段会消耗深度阅读所需要的注意力。"}, {"en": "A [[screen]] may deliver an [[immersive]] [[attraction]], but [[bite-sized]] entertainment frequently becomes a [[trap]].", "zh": "屏幕也许能带来沉浸式的吸引，但短小零碎的娱乐往往会变成一个陷阱。"}, {"en": "[[Initially]], such platforms feel richly rewarding: every [[photograph]] of a holiday or a meal wins instant approval.", "zh": "起初，这类平台让人觉得回报丰厚：每一张度假或用餐的照片都能立刻赢得赞许。"}, {"en": "Posters [[confuse]] personal [[attractiveness]] with social [[status]], forgetting that online glamour is merely [[skin-deep]].", "zh": "发帖者把个人魅力与社会地位混为一谈，却忘记了网络上的光鲜不过是肤浅的表象。"}, {"en": "Going [[offline]] for intervals is no disgrace; it gives the [[prefrontal]] cortex room to recover, and even a hyper-[[connected]] society still requires periods of silence.", "zh": "不时离线并非耻辱；它让前额叶皮层有恢复的空间，即便是一个高度互联的社会也仍然需要静默的时光。"}, {"en": "Take the [[automotive]] sector, where a restored [[vehicle]] can [[fetch]] a remarkable price.", "zh": "以汽车行业为例：一辆经过修复的汽车能卖出惊人的价钱。"}, {"en": "Manufacturers once pledged lifelong employment; today that [[promise]] has grown fragile.", "zh": "制造商们曾承诺终身雇佣；如今，这一承诺已变得脆弱不堪。"}, {"en": "Executives who [[award]] themselves generous bonuses while plants close display [[disrespect]] for loyalty, and a redundant [[fitter]] feels the [[sting]] of betrayal [[badly]].", "zh": "高管们在工厂相继倒闭之际给自己发放丰厚奖金，表现出对忠诚的漠视，而被裁撤的钳工则深切地尝到了被背叛的刺痛。"}, {"en": "[[Economically]], households adapt by watching every [[buck]] and by distinguishing lasting [[property]] from passing fads.", "zh": "在经济层面，各个家庭靠看紧每一美元、靠区分持久的财产与昙花一现的时尚来适应时世。"}, {"en": "True [[happiness]] is rarely a designer [[bag]], and a ripe [[berry]] shared with friends may give more pleasure than hoarded [[stock]].", "zh": "真正的幸福很少是一只名牌包；与朋友分享的一颗成熟浆果，也许比囤积的股票带来更多快乐。"}, {"en": "In [[spite]] of relentless advertising, people can learn to be [[content]] with enough.", "zh": "尽管广告无休无止、铺天盖地，人们仍然可以学会知足于所拥有的一切。"}, {"en": "Before they [[quit]] compulsive shopping, consumers should examine the [[condition]] that drives it.", "zh": "在戒掉强迫性购物之前，消费者应当审视驱使这种行为的心理状态。"}, {"en": "Marketers [[unleash]] a [[strategy]] of [[entitlement]], suggesting that everyone deserves luxury beyond their means, and the [[expression]] of identity through brands is treated as an [[absolute]] right.", "zh": "营销者祭出一套“应得感”策略，暗示每个人都配得上超出自身财力的奢侈品，而借助品牌来表达身份也被当成一种绝对的权利。"}, {"en": "Without discipline, even a [[dry]], careful budget can crumble into [[dust]].", "zh": "若缺乏自律，即便是一份冷静、审慎的预算也可能崩塌成尘土。"}, {"en": "Beyond personal finance, a [[biologist]] studying [[ecology]] observes how species share a fragile [[site]].", "zh": "除个人理财之外，研究生态学的生物学家会观察各个物种如何共享一处脆弱的栖息地。"}, {"en": "A distant [[asteroid]] or a warming [[sea]] recalls that [[prehistoric]] extinctions were terrifyingly real.", "zh": "遥远的小行星或不断变暖的海洋提醒人们：史前的物种灭绝曾真实得令人恐惧。"}, {"en": "Every [[star]] visible on a [[starry]] night obeys physical laws older than the [[tide]], and villagers along the [[Avon]] or farmers in [[Denmark]] breathe the same atmosphere; no [[royal]] decree can repeal nature.", "zh": "星夜中可见的每一颗星辰都遵循着比潮汐更古老的物理法则，埃文河畔的村民与丹麦的农民呼吸着同样的大气；任何皇家法令都无法废止自然。"}, {"en": "A coastal [[town]] whose [[location]] once offered [[refuge]] to sailors now receives crowds of tourists.", "zh": "一座沿海小镇，其地理位置曾为水手提供避难之所，如今却迎来成群结队的游客。"}, {"en": "Nearby, an [[airport]] expansion proceeds [[off-plan]], over budget and behind schedule, a confusion even a fictional [[spymaster]] would relish.", "zh": "附近，一项机场扩建工程在规划手续之外推进，既超出预算又落后于工期，其混乱程度连虚构的间谍头目看了都会兴致盎然。"}, {"en": "When storms halt flights, stranded passengers [[phone]] home, for no authority can [[rule]] out disruption, and a single [[bit]] of false information can [[startle]] a crowded terminal.", "zh": "当风暴迫使航班停飞时，滞留的乘客纷纷打电话回家，因为没有任何部门能够排除运行中断的可能，而一丁点虚假信息就能让拥挤的航站楼陷入惊惶。"}, {"en": "In quieter settings, every research [[project]] begins with a sharp [[thesis]].", "zh": "在更 function lemmas(low){
  const c=new Set([low]);const add=x=>c.add(x);
  if(low.endsWith('ies')&&low.length>4)add(low.slice(0,-3)+'y');
  if(low.endsWith('ied')&&low.length>4)add(low.slice(0,-3)+'y');
  if(low.endsWith('es')&&low.length>3){add(low.slice(0,-2));add(low.slice(0,-1));}
  if(low.endsWith('s')&&!low.endsWith('ss')&&low.length>3)add(low.slice(0,-1));
  if(low.endsWith('ing')&&low.length>5){add(low.slice(0,-3));add(low.slice(0,-3)+'e');if(low.length>6&&low[low.length-4]===low[low.length-5])add(low.slice(0,-4));}
  if(low.endsWith('ed')&&low.length>4){add(low.slice(0,-2));add(low.slice(0,-1));if(low.length>5&&low[low.length-3]===low[low.length-4])add(low.slice(0,-3));}
  if(low.endsWith('er')&&low.length>4)add(low.slice(0,-2));
  if(low.endsWith('est')&&low.length>5)add(low.slice(0,-3));
  if(low.endsWith('ly')&&low.length>3)add(low.slice(0,-2));
  return c;
}

function wordOf(k){const p=k.split('/');return DATA.lists[+p[0]-1].words.find(w=>w.w===p[1]);}
function openNew(n){openNew2([n]);}
/* 连续学习会话：新词 + 每5分钟原地复习本周期词 + 每30分钟(按总计时)复习30分钟池，直到两个List学完，全部进12h队列 */
function openNew2(lists){
  const items=[];lists.forEach(n=>DATA.lists[n-1].words.forEach(w=>{const k=n+'/'+w.w;if(!RV.words[k])items.push({k,n,wd:w});}));
  if(!items.length){toast('这些 List 已全部学完');return;}
  S={mode:'new2',lists,queue:items,idx:0,again:[],cycle:[],bucket:[],doneCount:0,phase:'study',touched:[],total:items.length,pending30:false,finalFlush:false,n5:0,n30:0,study:null,label:''};
  startSess('📖 今日学习 · '+lists.map(n=>'List'+String(n).padStart(2,'0')).join('+'));
}
function openRevGroup(n,s){
  const keys=[];const now=Date.now();
  Object.keys(RV.words).forEach(k=>{const st=RV.words[k];const d0=nextDue(st);if(st.s===s&&d0!==null&&+k.split('/')[0]===n&&now>=d0)keys.push(k);});
  if(!keys.length){toast('该组没有到期词');renderDash();return;}
  S={mode:'rev',n,queue:shuffle(keys.map(k=>({k,n,wd:wordOf(k)}))),again:[],idx:0,total:keys.length,touched:[]};
  startSess('复习 · List '+String(n).padStart(2,'0')+' · '+LAB[s]);
}
function openRevAll(){
  const dd=dueData();const keys=[];dd.groups.forEach(g=>g.keys.forEach(k=>keys.push(k)));
  if(!keys.length){toast('没有到期词');return;}
  S={mode:'rev',n:0,queue:shuffle(keys.map(k=>({k,n:+k.split('/')[0],wd:wordOf(k)}))),again:[],idx:0,total:keys.length,touched:[]};
  startSess('复习 · 全部到期');
}
function startSess(label){
  document.getElementById('dashWrap').style.display='none';
  sess.style.display='block';
  S.label=label;
  S.sessStart=Date.now();
  if(S.mode==='new2'){S.cycleStart=S.sessStart;S.next30=S.sessStart+30*6e4;}
  setPhaseUI();
  if(S.timerInt)clearInterval(S.timerInt);
  S.timerInt=setInterval(()=>{
    const el=document.getElementById('cTimer');
    if(el&&S.cardStart)el.innerHTML='⏱ 思考中 <b>'+((Date.now()-S.cardStart)/1000).toFixed(1)+'</b> 秒';

function fmtHMS(ms){const s=Math.floor(ms/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');}
function fmtMS(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function setPhaseUI(){
  if(S.mode!=='new2'){sess.className='';document.getElementById('sMode').textContent=S.label;return;}
  sess.className=S.phase==='r5'?'ph-r5':(S.phase==='r30'?'ph-r30':'');
  document.getElementById('sMode').textContent=S.phase==='r5'?'🔄 5分钟周期复习':(S.phase==='r30'?'🔄 30分钟周期复习':S.label);
}
/* 总计时 & 周期倒计时（学习阶段每5分钟触发周期复习；总计时每30分钟触发30分钟池复习） */
function tickS2(){
  if(!S)return;
  const now=Date.now();
  const elT=document.getElementById('sTotalT');if(elT)elT.textContent=fmtHMS(now-S.sessStart);
  if(S.mode!=='new2')return;
  const elC=document.getElementById('sCycleT');
  const elP=document.getElementById('sPools');
  if(elP)elP.textContent='5分钟周期池 '+S.cycle.length+' 词 · 30分钟池 '+S.bucket.length+' 词 · 已入12h队列 '+S.doneCount+' 词';
  if(S.phase==='study'){
    const left=5*6e4-(now-S.cycleStart);
    if(elC)elC.textContent=left>0?fmtMS(left):'00:00';
    if(left<=0){
      if(S.cycle.length){startReview('5');return;}
      S.cycleStart=now;
    }
    if(now>=S.next30){S.next30+=30*6e4;if(S.bucket.length){startReview('30');return;}}
  }else{
    if(elC)elC.textContent='复习中';
    if(now>=S.next30){S.next30+=30*6e4;if(S.bucket.length)S.pending30=true;}
  }
}
function startReview(kind){
  const qm=document.getElementById('quizMask');if(qm)qm.classList.remove('show');
  if(S.phase==='study')S.study={queue:S.queue,idx:S.idx,again:S.again};
  S.phase=kind==='5'?'r5':'r30';
  S.queue=shuffle((kind==='5'?S.cycle:S.bucket).slice());
  S.idx=0;S.again=[];
  setPhaseUI();
  toast(kind==='5'?'⏰ 5分钟到了！原地复习本周期 '+S.queue.length+' 词':'⏰ 30分钟到了！复习30分钟池 '+S.queue.length+' 词');
  renderCard();
}
function endReview(kind){
  if(kind==='r5'){S.n5++;toast('✅ 5分钟周期复习完成 · 单词已放入30分钟周期池');}
  else{S.n30++;toast('✅ 30分钟复习完成 · 这些词今天搞定，12小时后见');}
  if(S.pending30&&S.bucket.length){S.pending30=false;startReview('30');return;}
  if(S.finalFlush){checkFinish();return;}
  S.phase='study';S.cycleStart=Date.now();
  S.queue=S.study.queue;S.idx=S.study.idx;S.again=S.study.again;
  setPhaseUI();renderCard();
}
function checkFinish(){
  if(S.cycle.length){startReview('5');return;}
  if(S.bucket.length){startReview('30');return;}
  renderDone();
}
function exitSess(){if(S){if(S.timerInt)clearInterval(S.timerInt);if(S.tick2)clearInterval(S.tick2);}S=null;sess.className='';sess.style.display='none';document.getElementById('dashWrap').style.display='';if('speechSynthesis' in window)speechSynthesis.cancel();renderDash();}

function sentHtml(en,target){
  return en.split(/(\[\[[^\[\]]+?\]\])/).map(p=>{
    if(!p.startsWith('[['))return esc(p);
    const form=p.slice(2,-2);
    let low=form.toLowerCase().replace(/’/g,"'").replace(/‑/g,'-');
    const hit=low===target||lemmas(low).has(target);
    return hit?'<mark class="thl">'+esc(form)+'</mark>':esc(form);
  }).join('');
}
function renderCard(){
  const cb=document.getElementById('cardBox');

  if(!(w.si||[]).length)back+='<div class="cex"><div class="zh">本词短文中暂无例句</div></div>';

    +'<button class="csp" id="csp">🔊 朗读</button>'

    +'<div class="cbtns"><button id="bNo">😵 不认识</button><button id="bMid">🤔 模糊</button><button id="bQuiz">✅ 认识</button><button id="bYes">💯 完全认识</button></div>'
    +'</div>'

    +'<div class="cused">⏱ 用时 <span id="usedT">0.0</span> 秒</div>'
    +'<div class="kbd">快捷键：1 不认识 · 2 模糊 · 3 认识（4选1） · 4 完全认识 · 空格/回车 继续</div>'
    +'<button class="cnext" id="cNext">继续 →</button>'
    +'</div></div>';
  document.getElementById('csp').addEventListener('click',e=>{e.stopPropagation();speak(w.w);});
  if(prefs.autosp)speak(w.w);
  function pick(a){
    if(S.answered)return;S.answered=true;

    ['bNo','bMid','bQuiz','bYes'].forEach(id=>{const b=document.getElementById(id);if(b)b.disabled=true;});
    if(a==='quiz')openQuiz();
    else answer(a,false);
  }
  document.getElementById('bNo').addEventListener('click',()=>pick('no'));
  document.getElementById('bMid').addEventListener('click',()=>pick('mid'));
  document.getElementById('bQuiz').addEventListener('click',()=>pick('quiz'));
  document.getElementById('bYes').addEventListener('click',()=>pick('yes'));
  document.getElementById('cNext').addEventListener('click',()=>{S.idx++;renderCard();});
}
function answer(a,advance){
  const it=S.queue[S.idx];const now=Date.now();
  if(S.mode==='new2'){
    if(S.phase==='study'){
      const old=RV.words[it.k];
      RV.words[it.k]={t0:(old&&old.t0)||now,t:now,s:0};
      if(a==='no')S.again.push(it);else S.cycle.push(it);
    }else if(S.phase==='r5'){
      const st=RV.words[it.k];st.t=now;
      if(a==='no'){S.again.push(it);}
      else{
        st.s=1;
        const ci=S.cycle.findIndex(x=>x.k===it.k);
        if(ci>=0){S.cycle.splice(ci,1);S.bucket.push(it);}
        if(a==='mid')S.again.push(it);
      }
    }else{ /* r30 */
      const st=RV.words[it.k];st.t=now;
      if(a==='no'){S.again.push(it);}
      else{
        st.s=2;
        const bi=S.bucket.findIndex(x=>x.k===it.k);
        if(bi>=0){S.bucket.splice(bi,1);S.doneCount++;}
        if(a==='mid')S.again.push(it);
      }
    }
    S.touched.push(it.k);save();
    if(advance){S.idx++;renderCard();}
    return;
  }
  if(S.mode==='new'){
    const old=RV.words[it.k];
    RV.words[it.k]={t0:(old&&old.t0)||now,t:now,s:0};
    if(a==='no')S.again.push(it);
  }else{
    const st=RV.words[it.k];st.t=now;
    if(a==='yes')st.s=Math.min(8,st.s+1);
    else if(a==='mid'){st.s=Math.min(8,st.s+1);S.again.push(it);}
    else{st.s=0;S.again.push(it);}
  }
  S.touched.push(it.k);
  save();
  if(advance){S.idx++;renderCard();}
}
/* ---------- 4-choice quiz on "认识" ---------- */
function openQuiz(){
  const it=S.queue[S.idx];const w=it.wd;
  const opts=[{t:true,def:w.def||''}];
  (w.dists||[]).forEach(pi=>{if(POOL[pi])opts.push({t:false,def:POOL[pi].def||''});});
  while(opts.length<4)opts.push({t:false,def:POOL[Math.floor(Math.random()*POOL.length)].def||''});
  shuffle(opts);
  const mask=document.getElementById('quizMask');
  mask.innerHTML='<div class="qbox"><div class="qh">请选出正确释义 · 来自 3 个拼写相似词的干扰项</div>'
    +'<div class="qw">'+esc(w.w)+'</div><div class="qph">'+esc(w.phon||'')+'</div>'
    +'<div class="qask">以下哪一个是 <b>'+esc(w.w)+'</b> 的中文意思？</div>'
    +'<div class="qopts">'+opts.map((o,i)=>'<div class="qopt" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o.def)+'</div>').join('')+'</div>'
    +'<div class="qfb" id="qfb"></div></div>';
  mask.classList.add('show');
  let answered=false;
  mask.querySelectorAll('.qopt').forEach(el=>{
    el.addEventListener('click',()=>{
      if(answered)return;answered=true;
      const i=+el.dataset.i;const correct=opts[i].t;
      const fb=document.getElementById('qfb');
      if(correct){el.classList.add('correct');fb.textContent='✅ 回答正确，已进入下一轮';fb.className='qfb ok';
        setTimeout(()=>{mask.classList.remove('show');if(S&&S.queue[S.idx]===it)answer('yes',false);},650);}
      else{el.classList.add('wrong');
        mask.querySelectorAll('.qopt').forEach(x=>{if(opts[+x.dataset.i].t)x.classList.add('correct');x.classList.add('disabled');});
        fb.textContent='❌ 答错了，正确答案已标绿，本轮再过一次';fb.className='qfb no';
        setTimeout(()=>{mask.classList.remove('show');if(S&&S.queue[S.idx]===it)answer('mid',false);},1100);}
    });
  });
}
function renderDone(){
  if(S.timerInt)clearInterval(S.timerInt);
  /* 整轮完成：本轮所有作答词的「重新计时基准」统一更新为现在（5分钟/30分钟轮次的相对计时起点） */
  const rnow=Date.now();S.touched.forEach(k=>{const st=RV.words[k];if(st)st.t=rnow;});
  if(S.checkKey){RV.checks[S.checkKey]=rnow;}
  save();
  document.getElementById('sBarFill').style.width='100%';
  document.getElementById('sProg').textContent='本轮完成';
  const totalSec=(Date.now()-S.sessStart)/1000;
  const mm=Math.floor(totalSec/60),ss=Math.round(totalSec%60);
  const avg=(totalSec/S.total).toFixed(1);
  const timeLine='<p>⏱ 本轮总用时 <b>'+(mm?mm+'分':'')+ss+'秒</b> · 共 <b>'+S.total+'</b> 词 · 平均 <b>'+avg+'</b> 秒/词</p>';
  let msg='';
  if(S.mode==='new2'){
    msg='<p><b>'+S.lists.map(n=>'List '+String(n).padStart(2,'0')).join(' + ')+'</b> 全部拿下！</p>'
      +timeLine
      +'<p>新学 <b>'+S.total+'</b> 词 · 过程中完成 5分钟周期复习 <b>'+S.n5+'</b> 轮 · 30分钟周期复习 <b>'+S.n30+'</b> 轮</p>'
      +'<p>📦 全部单词已进入「<b>12小时后</b>」复习队列——按首次学习总时间计算，到点本页响铃提醒，之后按 1天 → 2天 → 4天 → 7天 → 15天 推进。</p>';
  }else if(S.mode==='new'){
    msg='<p><b>List '+String(S.n).padStart(2,'0')+'</b> 新学完成，'+S.total+' 词已进入记忆周期。</p>'
      +timeLine
      +'<p>⏰ 5 分钟倒计时已从现在开始，到点会响铃提醒（在其它页面右下角也会弹出提醒）。<br>之后：30分钟（按本轮完成重新计时）→ 12小时起按首次学习总时间推进 1天 / 2天 / 4天 / 7天 / 15天。</p>'
      +'<p class="muted">建议现在顺手读一遍对应埋词短文加深印象：List'+String(S.n).padStart(2,'0')+'.html</p>';
  }else{
    msg='<p>本轮 <b>'+S.total+'</b> 词复习完成！下一轮倒计时已从现在开始重新计时。</p>'+timeLine+'<p class="muted">12小时及以后的轮次按首次学习总时间计算；未到期的词会在计划页显示倒计时。</p>';
  }
  document.getElementById('cardBox').innerHTML='<div class="done"><h2>🎉 本轮完成</h2>'+msg+'<div style="margin-top:18px;display:flex;gap:10px;justify-content:center"><button class="btn" id="doneBack">返回计划页</button>'
    +(BACK?'<button class="btn g" id="doneRet">← 返回 '+esc(BACK)+'</button>':'')+'</div></div>';
  document.getElementById('doneBack').addEventListener('click',exitSess);
  if(BACK)document.getElementById('doneRet').addEventListener('click',()=>{location.href=BACK;});
}
document.addEventListener('keydown',e=>{
  if(!S||sess.style.display==='none')return;
  if(e.key===' '||e.key==='Enter'){
    e.preventDefault();
    const card=document.getElementById('fcard');
    if(card&&card.classList.contains('flip')){S.idx++;renderCard();}
    return;
  }
  const map={'1':'bNo','2':'bMid','3':'bQuiz','4':'bYes'};
  if(map[e.key]){const b=document.getElementById(map[e.key]);if(b&&!b.disabled)b.click();}
  if(e.key==='Escape'){const m=document.getElementById('quizMask');if(m.classList.contains('show'))m.classList.remove('show');else exitSess();}
});
setInterval(()=>{if(!S&&sess.style.display==='none'&&RV.start)renderDash();},30000);
renderDash();

</script>
</body>
