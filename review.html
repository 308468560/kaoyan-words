 {"w": "throw", "phon": "[θrəʊ]", "def": "v.扔；抛；丢；投n.扔；抛；摔；投", "si": [55], "dists": [2119, 1442, 3498]}, {"w": "need", "phon": "[nid]", "def": "n.需要v.需要", "si": [53], "dists": [1404, 889, 397]}, {"w": "highly", "phon": "[haɪli]ˈ", "def": "adv.非常；高度地", "si": [57], "dists": [1713, 87, 2368]}, {"w": "attune", "phon": "[əˈtun]", "def": "v.使适合；使协调", "si": [48], "dists": [3362, 3368, 3366]}, {"w": "enemy", "phon": "[enəmi]ˈ", "def": "n.敌人；敌军", "si": [44], "dists": [1957, 1421, 2924]}, {"w": "asocial", "phon": "[eɪˈsəʊʃəl]", "def": "adj.缺乏社交性的；不合群的", "si": [19], "dists": [2978, 1678, 273]}, {"w": "mouse", "phon": "[maʊs]", "def": "n.老鼠；鼠标", "si": [21], "dists": [2784, 2469, 2282]}, {"w": "colorful", "phon": "[kʌlərf(ə)l]ˈ", "def": "adj.五彩缤纷的；丰富多彩的", "si": [35], "dists": [3019, 311, 2882]}, {"w": "colourful", "phon": "[ˈkʌlərf(ə)l]", "def": "adj.五彩缤纷的；丰富多彩的", "si": [35], "dists": [3020, 1808, 199]}, {"w": "cage", "phon": "[keɪdʒ]", "def": "n.笼子vt.把…关进笼子", "si": [21], "dists": [1924, 1761, 1687]}, {"w": "size", "phon": "[saɪz]", "def": "n.大小；尺码", "si": [34], "dists": [3395, 2649, 3485]}, {"w": "tail", "phon": "[teɪl]", "def": "n.尾巴；尾随者v.跟踪", "si": [22], "dists": [2612, 2319, 1061]}, {"w": "smell", "phon": "[smel]", "def": "n.闻；气味；嗅觉v.嗅；闻；散发气味；察觉", "si": [26], "dists": [2002, 3220, 2942]}], "sents": [{"en": "Late autumn has arrived, and a cold [[wind]] moves restlessly [[outside]] my window.", "zh": "深秋已至，一阵寒风在我的窗外不安地吹动。"}, {"en": "I sit very still and [[hold]] my breath, listening for the [[voice]] of the city beneath the darkness.", "zh": "我一动不动地坐着，屏住呼吸，倾听黑暗深处城市的声息。"}, {"en": "A thin [[film]] of cloud crosses an [[oval]] moon, softening every [[light]] along the river.", "zh": "一层薄薄的云掠过椭圆的月亮，使河畔的每一盏灯火都变得柔和。"}, {"en": "On a broken [[limb]] of the old oak, a bird folds one dark [[wing]] and sleeps.", "zh": "在老橡树一根折断的粗枝上，一只鸟儿收拢一只深色的翅膀，沉沉睡去。"}, {"en": "The whole scene is a [[mere]] whisper at the edge of an immense [[horizon]], yet it speaks plainly of larger things.", "zh": "整个景象不过是辽阔天际边的一声低语，却明白地道出了更宏大的事物。"}, {"en": "This region was the [[birthplace]] of the first [[industrial]] boom, and the [[birth]] of its mills set in motion a [[change]] that altered the whole [[notion]] of work.", "zh": "这个地区曾是第一次工业繁荣的诞生地，而工厂的兴建引发了一场变革，彻底改变了人们对工作的全部观念。"}, {"en": "Factory owners would [[enlarge]] their workshops year after year, treating growth itself as an [[engine]] that could never slow.", "zh": "工厂主们年复一年地扩建车间，把增长本身当作一台永远不能减速的引擎。"}, {"en": "In [[history]] books, the [[overall]] pattern looks confident, but that confidence rested on an [[unsustainable]] faith in coal.", "zh": "在史书里，整体格局看起来踌躇满志，但这种自信建立在对煤炭不可持续的迷信之上。"}, {"en": "Today even the [[biomass]] harvested from surrounding fields cannot disguise how thoroughly the old model has been exhausted.", "zh": "如今，即便是从周围田地里收获的生物质能，也无法掩盖旧模式已被彻底耗尽这一事实。"}, {"en": "Genuine [[reform]] therefore requires courage from [[parliament]], where members must [[vote]] to [[redefine]] prosperity itself.", "zh": "因此，真正的改革需要议会拿出勇气，议员们必须投票对繁荣本身重新加以定义。"}, {"en": "They should [[re-evaluate]] old subsidies and [[adopt]] policies that are [[legally]] binding, rather than protecting every wealthy [[banker]] whose institutions would otherwise [[incur]] ruinous losses.", "zh": "他们应当重新评估旧有补贴，采纳具有法律约束力的政策，而不是一味保护每一个富有的银行家——否则这些金融机构将蒙受毁灭性的损失。"}, {"en": "Even [[senior]] officials now admit that ordinary families, whose [[income]] has barely moved for a decade, are [[overburden]]ed.", "zh": "就连高级官员如今也承认，收入十年来几乎没有增长的普通家庭已不堪重负。"}, {"en": "To ignore them is plainly [[unjust]].", "zh": "忽视他们显然是不公正的。"}, {"en": "The local [[demographics]] reveal a growing [[Hispanic]] quarter, where families bring a [[lifestyle]] warmer than the [[homogeneous]] suburbs nearby.", "zh": "当地的人口结构显示出一个不断扩大的西语裔街区，那里的家庭带来了比附近同质化郊区更温暖的生活方式。"}, {"en": "Small restaurants and grocers genuinely [[enrich]] the city.", "zh": "小餐馆和食品杂货店真切地丰富了这座城市。"}, {"en": "Yet patterns of [[favoritism]] persist in hiring, and the same practice, spelled [[favouritism]] in older British texts, still hides behind polite allusions to \"fit\".", "zh": "然而，招聘中的偏袒之风依然存在；同样的做法在较古老的英国文本中拼作 favouritism，却仍躲在对“合适”一词客气的影射之后。"}, {"en": "A good [[college]] does not merely [[register]] students and drag them across a rigid [[curriculum]]; it invites them to [[engage]] with difficult questions.", "zh": "一所好大学不只是登记学生、拖着他们走完一套僵化的课程；它还邀请他们与难题交锋。"}, {"en": "Such [[involvement]] demands [[additional]] effort and a measure of [[cautiousness]], because endless drills are a [[time-wasting]] substitute for thought.", "zh": "这样的投入需要额外的努力和一定程度的审慎，因为无休止的操练只是浪费时间的思考替代品。"}, {"en": "Learners [[receive]] careful feedback, and teachers [[refer]] constantly to evidence rather than rote [[grammar]] alone.", "zh": "学习者得到细致的反馈，教师也不断诉诸证据，而不是单凭死记硬背的语法。"}, {"en": "No one should become [[asocial]] over grades; conversation remains part of learning.", "zh": "谁也不应为了分数而变得孤僻离群；交谈始终是学习的一部分。"}, {"en": "Nearby, the faculty of [[medicine]] studies how a single [[hormone]] can regulate the [[ovary]] in livestock, and how carefully preserved [[semen]] supports breeding programs.", "zh": "不远处，医学院正在研究单一激素如何调节牲畜的卵巢，以及精心保存的精液如何支撑繁育计划。"}, {"en": "One [[mouse]], safe in its [[cage]], provides data on tissue repair.", "zh": "一只安全地待在笼子里的小鼠，提供着组织修复方面的数据。"}, {"en": "In the next pen, a calf with one small [[horn]] just beginning to grow reminds visitors why the work matters; a technician traces each chart with a gloved [[finger]], while the tagged [[tail]] of a second animal flicks steadily at flies.", "zh": "隔壁围栏里，一头小牛头上一只小角刚刚开始生长，提醒着参观者这项工作为何重要；一名技术员戴着手套用手指描画每张图表，而第二头动物挂着标签的尾巴则稳稳地甩动，驱赶苍蝇。"}, {"en": "Results so far are [[inconclusive]], older records are [[incomplete]], and one early conclusion proved [[incorrect]].", "zh": "迄今为止的结果尚无定论，较早的记录也不完整，一项早期结论还被证明是错误的。"}, {"en": "On a [[fine]] Saturday I travel [[hither]] to a valley farm, where [[grass]] still gleams after rain.", "zh": "在一个晴朗的星期六，我远道来到一座山谷农场，雨后的青草依然闪闪发亮。"}, {"en": "Rows of [[grape]] vines heavy with fruit promise a [[delicious]] harvest, and the sheer [[thrill]] of picking one gives me uncomplicated [[delight]].", "zh": "一排排葡萄藤果实累累，预示着一场甘美的丰收；摘下一颗葡萄所带来的纯粹激动，给了我毫无杂念的喜悦。"}, {"en": "I [[enjoy]] the work until a wasp decides to [[bite]] my hand; the sharp [[smell]] of soil fills my [[throat]], and a [[bitter]] taste follows the sting.", "zh": "我享受着这份劳作，直到一只黄蜂决定蜇我的手；泥土刺鼻的气味灌满我的喉咙，蜇伤之后泛起一股苦味。"}, {"en": "Last summer a [[wildfire]] swept the far ridge, forcing the family to [[shed]] half their stock, and revenues took a deep [[dip]].", "zh": "去年夏天，一场野火席卷了远处的山脊，迫使这家人减栏一半牲畜，收入也大幅下滑。"}, {"en": "The [[consequence]] of such fires is no longer local; [[consequently]], the whole region must [[fight]] for adaptation rather than [[delay]].", "zh": "此类火灾的后果已不再局限于一地；因此，整个地区必须奋力适应，而不是拖延。"}, {"en": "To [[constrain]] emissions now will demand [[enormous]] effort and a [[serious]] acknowledgment of a [[grave]] situation, yet the costs of action still [[outweigh]] the costs of collapse.", "zh": "现在就限制排放，需要付出巨大的努力，并严肃承认形势的严峻，但行动的代价仍小于崩溃的代价。"}, {"en": "Every sensible [[limit]] on pollution protects the conditions in which towns can [[overcome]] fear and learn to [[thrive]].", "zh": "对污染的每一项合理限制，都在保护城镇赖以战胜恐惧、学会蓬勃发展的条件。"}, {"en": "The village market, by contrast, seems determined to [[sell]] everything at once.", "zh": "相比之下，村里的集市似乎铁了心要把所有东西一次性卖光。"}, {"en": "Vendors [[advertise]] cheeses with hand-painted signs; a few [[advertize]] the same goods in spellings copied from older catalogs, and locals grumble that prices [[increase]] each season.", "zh": "小贩们用手绘招牌兜售奶酪；也有几个人按照从旧商品目录里抄来的拼法为同样的货物做广告，当地人则抱怨物价每个季度都在上涨。"}, {"en": "Some would gladly [[overcharge]] tourists and then [[charge]] the imbalance to novelty, expecting every fat [[wallet]] to open without complaint.", "zh": "有些人巴不得向游客漫天要价，然后把这种失衡归咎于新奇，指望每一只鼓鼓的钱包都会毫无怨言地打开。"}, {"en": "A [[penny]] saved still matters here, so shoppers compare [[number]], [[size]], and every price [[tag]] before choosing.", "zh": "在这里，省下的一便士仍然重要，所以购物者在挑选之前会比较数量、尺寸和每一张价签。"}, {"en": "Stalls display [[colorful]] cloth (or [[colourful]] fabric, as one London-born trader insists), and even an [[overdressed]], [[regal]]-looking mannequin cannot make the markup seem reasonable.", "zh": "摊位上陈列着色彩鲜艳的布料（或者按照一位伦敦出生的商人坚持的说法，colourful fabric），可就连一个穿着过分讲究、看上去帝王般气派的人体模型，也无法让这样的加价显得合理。"}, {"en": "That evening I write a short [[blog]] and [[send]] its central [[message]] to friends.", "zh": "那天晚上，我写了一篇简短的博客，并把其中的核心信息发给朋友们。"}, {"en": "My [[ultra-thin]] laptop hums quietly; I [[wipe]] the screen, tap the trackpad, and admit how quickly such posts [[hook]] attention.", "zh": "我的超薄笔记本电脑轻声嗡鸣；我擦了擦屏幕，轻触触控板，不得不承认这类帖子吸引注意力的速度之快。"}, {"en": "Readers [[like]] a tidy moral, and they are [[likely]] to share one; [[likewise]], a loud [[volume]] of outrage spreads far faster than careful argument.", "zh": "读者喜欢干净利落的道德寓意，也很可能转发这样的内容；同样，声势浩大的愤怒远比审慎的论证传播得快。"}, {"en": "Seeking calmer company, I reopen a nineteenth-century [[novel]], studying a battered [[manuscript]] facsimile in which every long [[sentence]] rewards patience.", "zh": "为寻求更安静的陪伴，我重新翻开一部十九世纪的小说，研读一份破旧的手稿摹本，其中每一个长句都不辜负耐心的读者。"}, {"en": "Its author's [[wit]] remains sharp, and the [[wise]] narrator keeps his [[mind]] open without losing direction.", "zh": "作者的机智依然犀利，睿智的叙述者保持着开放的头脑，却又不曾迷失方向。"}, {"en": "The text tests my [[memory]], yet a [[thorough]] second reading, tracing each printed [[line]], rescues every forgotten [[minute]] detail.", "zh": "文本考验着我的记忆力，然而循着每一行印刷文字再仔细通读一遍，便能找回每一个被遗忘的细微之处。"}, {"en": "A careless, [[thoughtless]] first pass had cost me the flavour of an entire [[period]].", "zh": "第一次粗心草率、不假思索的浏览，曾让我错失了整整一个时代的韵味。"}, {"en": "We should remember the [[graveyard]]s where women denounced as a [[witch]] were once buried.", "zh": "我们应当记得那些墓地，被指控为女巫的妇女曾被埋葬在那里。"}, {"en": "Authorities would [[enrage]] crowds with claims that a suspect had dared to [[blaspheme]], then [[blame]] every famine on a convenient [[enemy]].", "zh": "当权者会声称某个嫌疑人竟敢亵渎神明，以此激怒民众，再把每一场饥荒都归咎于一个顺手可得的敌人。"}, {"en": "The accused could not [[refuse]] the court, [[unless]] they craved death, and neither [[honor]] nor [[honour]] survived the proceedings.", "zh": "被告无法拒绝法庭，除非他们甘愿赴死；而无论拼作 honor 还是 honour，名誉都未能在这场诉讼中幸存。"}, {"en": "The [[police]] of later, more skeptical generations would record these trials with shame.", "zh": "后世更多疑的几代警察，会带着羞愧记录下这些审判。"}, {"en": "What survives is something quieter: the [[ordinary]] decency of people who are the living [[embodiment]] of resilience.", "zh": "留存下来的是一种更安静的东西：普通人身上的善良正派，他们是韧性活生生的化身。"}, {"en": "Often [[unpretentious]], even shy, they nevertheless [[attune]] themselves to neighbors in trouble and seem to [[grasp]] suffering before anyone else names it.", "zh": "他们往往毫不张扬，甚至有些腼腆，却依然让自己与陷入困境的邻居同频，似乎在别人说出苦难之前就已体察到它。"}, {"en": "Their [[sense]] of fairness is firm, and every [[unique]] life they touch becomes less lonely.", "zh": "他们的公正感坚定不移，而他们所触及的每一个独特生命，都因此少了一分孤独。"}, {"en": "The frontier of any science borders an [[unknown]] region, and some questions may be finally [[unknowable]].", "zh": "任何科学的前沿都与未知之境接壤，而有些问题或许终究不可知。"}, {"en": "A rigorous [[method]], with [[fine-grained]] measurements, allows researchers to [[advance]] cautiously, to [[find]] what evidence genuinely shows, and to [[notice]] patterns that [[stem]] from causes rather than hopes.", "zh": "一种辅以精细测量的严谨方法，能让研究者谨慎前行，去发现证据真正表明的东西，去留意那些源于原因而非愿望的模式。"}, {"en": "For my own part, I [[wish]] for one more [[chance]] to order my days better.", "zh": "就我自己而言，我希望再有一次机会，把日子安排得更好。"}, {"en": "We all [[need]] discipline to [[fill]] the [[void]] left by idle hours, yet purpose arrives from [[nowhere]] on command.", "zh": "我们都需要自律，以填补闲散时光留下的空虚，但目标从不会听凭召唤凭空到来。"}, {"en": "My desk is a [[mess]], my plans remain [[somewhat]] [[unsettled]], and I cannot neatly [[separate]] worry from work.", "zh": "我的书桌一团糟，计划仍有些悬而未决，我也无法利落地把忧虑与工作分开。"}, {"en": "Still, there is no reason to [[throw]] every good intention away.", "zh": "尽管如此，也没有理由把每一个良好的意愿都抛掉。"}, {"en": "Morning brings a small [[renewal]]: cold air, [[refreshing]] rain, and the knowledge that no plan must be [[perfect]] to be worth keeping.", "zh": "清晨带来一丝小小的新生：冷空气、清爽的雨，以及一种了悟——计划不必完美，也值得坚持。"}, {"en": "This is a [[great]] comfort, [[highly]] welcome and [[especially]] gentle before a [[forthcoming]] winter.", "zh": "这是极大的安慰，在即将到来的冬天之前，令人欣然接受，也格外温柔。"}, {"en": "The old year is nearly [[over]], and looking back [[through]] its crowded months, I see that progress is slow, [[though]] genuine; [[indeed]], the simplest truths often [[lift]] the heart last.", "zh": "旧的一年将尽；回望它拥挤的数月，我看见进步虽缓慢，却真实；的确，最简单的真理往往最后才令人心振奋。"}]}, {"key": "三星词汇 Day 07 List 14", "words": [{"w": "unlike", "phon": "[ˌʌnˈlaɪk]", "def": "adj.不像…的；不同的prep.不像于；不同于", "si": [2], "dists": [1391, 2147, 2033]}, {"w": "blood", "phon": "[blʌd]", "def": "n.血；血液；血统", "si": [4], "dists": [2294, 2265, 2253]}, {"w": "chase", "phon": "[tʃeɪs]", "def": "v.追逐n.追逐", "si": [29], "dists": [1924, 2215, 1708]}, {"w": "finite", "phon": "[ˈfaɪnaɪt]", "def": "adj.有限的；限定的", "si": [1], "r": "fin(限制)+ite→有限制", "dists": [1087, 2126, 3079]}, {"w": "great-grandparent", "phon": "[ˌɡreɪtˈɡrændˌperənt]", "def": "n.曾祖父或曾祖母；外曾祖父或外曾祖母", "si": [5], "dists": [1424, 498, 22]}, {"w": "horrify", "phon": "[ˈhɔrɪfaɪ]", "def": "v.使恐怖；使震惊", "si": [16], "dists": [3275, 2413, 2128]}, {"w": "mine", "phon": "[maɪn]", "def": "n.矿；地雷pron.我的（东西） v.采矿；埋地雷", "si": [13], "dists": [2365, 2155, 2094]}, {"w": "overfish", "phon": "[ˌəʊvəˈfɪʃ]", "def": "v.捕捞过度", "si": [7], "dists": [3462, 2999, 2316]}, {"w": "perish", "phon": "[ˈperɪʃ]", "def": "v.死；暴卒；毁灭", "si": [15], "dists": [605, 3335, 2666]}, {"w": "sermon", "phon": "[ˈsɜrmən]", "def": "n.布道；说教；讲道", "si": [5], "dists": [2018, 1187, 1700]}, {"w": "thrust", "phon": "[θrʌst]", "def": "v.刺；戳n.推力；刺；戳", "si": [63], "dists": [2739, 2119, 2134]}, {"w": "unmistakable", "phon": "[ˌʌnmɪˈsteɪkəb(ə)l]", "def": "adj.不会弄错的；确定无疑的；清楚明白的", "si": [36], "dists": [2046, 2238, 1886]}, {"w": "wonder", "phon": "[ˈwʌndər]", "def": "n.惊奇；奇迹v.惊讶；想知道；怀疑", "si": [3], "dists": [2407, 2344, 1717]}, {"w": "board", "phon": "[bɔrd]", "def": a green and wind-scoured coastline lies Carrick Haven, a harbour town so small that the offshore [[island]] seems like a moored ship.", "zh": "在一条绿意盎然、饱受海风侵蚀的海岸线的西南端，坐落着卡里克港——这座渔港小镇如此之小，以至于近海的岛屿看起来就像一艘停泊的船。"}, {"en": "In an [[age]] accustomed to treating every corner of the [[world]] as a resource, few visitors dared [[to]] imagine that the sea's plenty could be [[inescapably]] [[finite]].", "zh": "在一个习惯于把世界每个角落都当作资源的时代，几乎没有访客敢于想象，大海的丰饶竟可能是无从逃避地有限的。"}, {"en": "[[Unlike]] inland cities, where [[human]] ambition is measured in concrete and glass, Carrick measured itself in tides, seasons, and the long [[reign]] of salt wind over slate roofs.", "zh": "与那些以混凝土和玻璃衡量人类雄心的内陆城市不同，卡里克以潮汐、季节以及咸风对石板屋顶的长久统治来衡量自身。"}, {"en": "Yet fishermen still spoke of the water with [[wonder]], because the harbour had taught generations that abundance is a loan, not a gift.", "zh": "然而渔民们谈起海水时仍心怀惊叹，因为这座港湾让一代又一代人懂得：丰裕是借来的，而非天赐的礼物。"}, {"en": "The sea ran in the [[blood]] of Carrick.", "zh": "大海流淌在卡里克人的血液里。"}, {"en": "Almost every [[great-grandparent]] buried in the churchyard had been a fisherman, and when the [[minister]] finished his [[sermon]], the congregation talked only of nets and tides.", "zh": "教堂墓地里安葬的曾祖辈几乎人人都当过渔民；牧师布道一结束，会众们谈论的便只有渔网和潮汐。"}, {"en": "For decades the fleet had gone out to [[serve]] markets a hundred miles away, and the [[bond]] among crewmen was forged before dawn, in shared tea and shared danger.", "zh": "数十年来，船队出海为百里之外的市场供货，船员之间的纽带在黎明前共饮茶水、共担风险中铸就。"}, {"en": "Nobody then believed it possible to [[overfish]] such an ocean; boats still returned heavy, and it seemed almost ungrateful to count every [[fish]] lifted from the water.", "zh": "那时没人相信这样一片海洋可能被过度捕捞；渔船依旧满载而归，而要逐条清点从水中捞起的鱼，简直近乎忘恩负义。"}, {"en": "By the 1990s, however, the [[data]] told an [[uncomfortable]] story.", "zh": "然而到了二十世纪九十年代，数据讲述了一个令人不安的故事。"}, {"en": "Catches began to [[collapse]], the once-modern canneries looked [[outdated]], and empty folds of net hung in [[grey]] sheds.", "zh": "渔获量开始暴跌，曾经现代化的罐头厂显得陈旧过时，空荡的网片挂在灰暗的棚屋里。"}, {"en": "[[Sadly]], the decline was [[partly]] self-inflicted: larger vessels, sonar-guided nets, and the quiet [[grip]] of debt had stripped the spawning grounds.", "zh": "令人痛心的是，这种衰退在一定程度上是自作自受：更大的船只、声呐制导的渔网，以及债务无声的扼制，已将产卵场劫掠一空。"}, {"en": "A local [[poll]] showed that most families knew someone who had left, and town meetings began to [[boil]] with recrimination.", "zh": "当地一项民意调查显示，大多数家庭都认识某个已经离开的人，镇上的会议开始因相互指责而群情激愤。"}, {"en": "The signs were [[strikingly]] clear, a flashing [[warning]] that even a storm-hardened community could not ignore, because empty water had begun to [[shake]] every assumption the town lived by.", "zh": "迹象醒目得惊人，那是闪烁的警报，连久经风暴的社区也无法忽视，因为空荡荡的海水已开始动摇小镇赖以生存的每一个假设。"}, {"en": "Above the cliffs stood an abandoned [[mine]], its flooded [[shaft]] weeping rust into the stream, while a disused plant had once poured [[chemical]] waste into the bay.", "zh": "悬崖上方矗立着一座废弃的矿井，被淹的竖井向小溪中渗出锈水；而一家废弃的工厂曾把化学废料倾入海湾。"}, {"en": "After a warehouse [[fire]], barrels leaked a dark [[liquid]] that continued to [[pollute]] the shallows for months.", "zh": "一场仓库大火之后，桶里泄漏出一种深色液体，持续污染浅水区达数月之久。"}, {"en": "Biologists later found poisons accumulated in the living [[tissue]] of oysters, and watched whole beds [[perish]] within a single season.", "zh": "生物学家后来发现，毒素在牡蛎的活体组织中积聚，并眼看着整片蚝床在一个季节内死去。"}, {"en": "Visitors expecting picture-postcard coves stood [[aghast]] at the slicks and dead gulls; it was a sight that could [[horrify]] even the least sentimental observer.", "zh": "期待着明信片般美丽小海湾的游客，面对油污和死去的海鸥惊愕伫立；那景象即使是最不多愁善感的旁观者也会心生恐惧。"}, {"en": "The town's earlier [[boom]] had hidden all of this.", "zh": "小镇早年的繁荣掩盖了这一切。"}, {"en": "In those years a single canning [[industry]] employed most of the [[workforce]], and the [[workplace]] hummed with the confidence that comes from a [[huge]] order book.", "zh": "在那些年月里，单一的罐头工业雇用了大部分劳动力，车间里因厚厚的订货单所带来的自信而一派繁忙。"}, {"en": "Investors, urged on by the cannery's [[founder]], chose to [[overfund]] expansion, buying an [[oversize]] freezer hall that far exceeded demand.", "zh": "在罐头厂创始人的鼓动下，投资者选择为扩张过度注资，买下了一座远超需求的超大冷冻车间。"}, {"en": "Subsidies encouraged a [[retail]] park on the waterfront, yet chronic [[inefficiency]] meant that profits leaked away like condensate.", "zh": "补贴催生了滨水区的一座零售园区，然而长期的低效意味着利润像冷凝水一样白白流走。"}, {"en": "Those years are now easy to [[overrate]]: they looked prosperous, but the prosperity was borrowed against fish that were no longer there.", "zh": "如今那些岁月很容易被高估：它们看上去繁荣，但那份繁荣是靠早已不在的鱼儿借来的。"}, {"en": "The harbour [[board]], led by a retired fishing [[executive]], invited the [[mayor]], the [[chief]] fisheries officer, and a [[group]] of young residents to draft a new [[agenda]].", "zh": "港务委员会由一位退休渔业高管牵头，邀请了镇长、首席渔业官员和一群年轻居民共同起草一份新的议程。"}, {"en": "At first members chose to [[overlook]] their differences rather than quarrel, and a quiet [[diplomacy]] replaced the shouting of previous years.", "zh": "起初，委员们选择搁置分歧而非争吵，一种安静的外交手腕取代了往年的叫嚷。"}, {"en": "They began to [[envisage]] quotas, patrols, and a restored wetland; when one early [[slipup]] misprinted the proposed limits, public trust wavered.", "zh": "他们开始设想配额、巡逻和一片恢复的湿地；当早先一次疏漏把拟议的限额印错时，公众的信任发生了动摇。"}, {"en": "But campaigners continued to [[lobby]] for restraint, and after three heated sessions the council passed a [[unanimous]] resolution, ready to [[announce]] that Carrick would change before the sea changed it permanently.", "zh": "但活动人士继续为克制捕捞而游说，经过三次气氛激烈的会议，委员会通过了一项一致决议，准备宣告：卡里克将在大海把它永久改变之前先做出改变。"}, {"en": "Poverty had fallen hardest on [[marginalized]] families, and almost every vulnerable [[individual]] had a story to tell: the [[household]] where a [[child]] went hungry, the mother weakened after [[childbirth]], the grandmother left holding legal [[guardianship]] with no income.", "zh": "贫困对边缘化家庭的打击最为沉重，几乎每个弱势个体都有故事可讲：孩子挨饿的家庭、产后虚弱的母亲、没有收入却独自承担法定监护权的祖母。"}, {"en": "Employers had continued to [[discriminate]] on grounds of [[sex]], [[sexual]] harassment went unreported on wet factory floors, and a [[hostile]] silence greeted anyone who complained.", "zh": "雇主仍在以性别为由歧视他人，潮湿的车间里性骚扰无人举报，任何开口抱怨的人迎来的都是充满敌意的沉默。"}, {"en": "Such [[inequality]] was nobody's single crime, yet it touched every [[person]] in the harbour, and no quota could heal what exclusion had broken.", "zh": "这种不平等不是某一个人的罪过，却触及港湾里的每一个人，而排他所毁坏的东西，没有任何配额能够弥合。"}, {"en": "Recruiters from city restaurants would [[hound]] sixteen-year-olds with promises, and the buses carried them away to [[chase]] wages the harbour could not pay.", "zh": "城里餐馆的招聘者会用种种承诺纠缠十六岁的少年，公共汽车把他们载走，去追逐港湾支付不起的薪水。"}, {"en": "Many were [[inexperienced]] and arrived carrying [[untested]] hopes; some met every [[setback]] as proof that home was finished.", "zh": "许多人缺乏经验，怀揣着未经检验的希望来到城市；有些人把每一次挫折都当作家乡已经完了的证据。"}, {"en": "They did not yet [[tire]] of the bright streets, and it was easy to [[outgrow]] a town that offered no future, or so they told themselves.", "zh": "他们尚未厌倦明亮的街道，而一座给不出未来的小镇也确实容易让人长大之后离开，至少他们这样告诉自己。"}, {"en": "It was not [[until]] their first winter away that they began to [[miss]] the headland's rocky [[nose]], the gulls, the exact pitch of the foghorn.", "zh": "直到离家后的第一个冬天，他们才开始想念海岬那岩石般的“鼻子”、海鸥，以及雾角准确的音调。"}, {"en": "Returning must have seemed [[unrealistic]], yet homesickness kept its own ledger.", "zh": "回乡看上去一定不切实际，然而乡愁记着它自己的账本。"}, {"en": "A [[recently]] returned emigrant gave the town its first surprise.", "zh": "一位新近归来的移居者给小镇带来了第一个惊喜。"}, {"en": "She was a [[passenger]] on the coastal coach, with two cases in the [[boot]] and [[first-hand]] knowledge of city marketing; when old neighbours came to [[greet]] her, she dared to [[enter]] her grandmother's damp [[house]] and light the [[fireplace]].", "zh": "她是沿海长途汽车上的一名乘客，行李箱里装着两只箱子，胸中装着城市营销的第一手知识；当老邻居们前来迎接她时，她鼓起勇气走进祖母那潮湿的屋子，点燃了壁炉。"}, {"en": "Within a week the kitchen was warm and [[comfortable]], full of [[chat]] and the [[chatter]] of visitors, and the [[unmistakable]] smell of drying herbs mixed with salt air.", "zh": "不出一周，厨房便温暖舒适，满是闲谈和访客叽叽喳喳的声音，干草药那清晰可辨的气息与咸湿的海风交融在一起。"}, {"en": "This was not mere [[nostalgia]]: she asked what the town could sell besides fish, and listened more than she spoke.", "zh": "这并非单纯的怀旧：她询问小镇除了鱼还能卖什么，而且听得多、说得少。"}, {"en": "A revived economy would [[entail]] hard choices: the old cannery had to [[disassemble]] its rusted [[conveyor]] line before a [[tiny]] cooperative could install a modern [[workstation]] for packing smoked mackerel.", "zh": "重振经济必然伴随着艰难的抉择：旧罐头厂必须先拆除生锈的输送线，然后一家小小的合作社才能安装现代化的工位，用来包装烟熏鲭鱼。"}, {"en": "A phone [[app]] was built to [[link]] buyers directly to boats, its sensors able to [[check]] each crate's origin as a visual [[cue]] for quality.", "zh": "人们开发了一款手机应用，将买家与渔船直接连接起来，其传感器能够查验每只板条箱的来源，作为品质的直观提示。"}, {"en": "The [[breakthrough]] was modest, but it helped to [[boost]] prices and showed that tradition and traceability could [[overlap]] rather than compete.", "zh": "这一突破并不起眼，却帮助推高了价格，并表明传统与可追溯性可以相互重叠，而非彼此竞争。"}, {"en": "She published a [[list]] of [[indirect]] benefits—tourism, repairs, apprenticeships—insisting that renewal need not copy the city but could [[depend]] on whatever genuinely [[fit]] the harbour.", "zh": "她公布了一份间接效益清单——旅游业、维修业、学徒制——并坚称，复兴不必照搬城市，而可以依托任何真正适合这座港湾的东西。"}, {"en": "The following summer, the town dared to [[host]] a maritime festival.", "zh": "第二年夏天，小镇鼓起勇气举办了一场海洋节。"}, {"en": "On the [[flagstone]] quay a market [[booth]] sold smoked fish beside second-hand clothing, where a visitor bought a bright 1960s [[miniskirt]] as casually as a postcard.", "zh": "石板铺就的码头上，一个集市摊位在二手服装旁卖着熏鱼，一位游客在那里像买明信片一样随意地买下一条鲜艳的二十世纪六十年代迷你裙。"}, {"en": "The old reading room, with its [[upholstered]] benches and simple maritime [[adornment]], staged an exhibition whose [[title]], Living with the Tide, used photographs to [[depict]] three generations of net-menders.", "zh": "古老的阅览室里摆着软包长凳和朴素的海洋风格装饰，这里举办了一场题为《与潮共生》的展览，用照片描绘了三代补网人。"}, {"en": "A brass band played on the quay, children waved a hand-painted [[flag]], and crowds gathered to [[cheer]] the rowing races; the [[centrepiece]] was a lantern-lit flotilla.", "zh": "一支铜管乐队在码头上演奏，孩子们挥舞着手绘旗帜，人群聚拢来为划船比赛喝彩；核心节目是一场灯笼映照的船队巡游。"}, {"en": "For one [[lively]] weekend the town remembered how to [[entertain]] itself without apology.", "zh": "在一个热闹的周末，小镇毫无愧色地记起了如何让自己开怀。"}, {"en": "The council imposed [[tight]] quotas and a no-take [[zone]] along the eastern [[boundary]] of the historic fishing [[ground]], using patrols to [[rein]] in boats tempted to [[overstep]].", "zh": "委员会在历史悠久的渔场东部边界沿线实施了严格的配额和一片禁渔区，并通过巡逻约束那些受到诱惑、试图越界的船只。"}, {"en": "Quotas had to [[cease]] being suggestions and become law; honest labelling helped to [[insure]] consumers and fishermen alike.", "zh": "配额必须不再只是建议，而要成为法律；诚实的标签有助于为消费者和渔民双方提供保障。"}, {"en": "Strict [[adherence]] to the rules was hard [[work]], yet an [[ethical]] marketplace proved to be a [[win-win]] arrangement: prices rose as stocks recovered, and a revived committee could [[settle]] [[minor]] disputes before they reached court.", "zh": "严格遵守规则是件辛苦的事，然而合乎道德的市场被证明是一种双赢安排：随着鱼类资源量恢复，价格上涨，一个恢复运作的委员会能够在细小纠纷闹上法庭之前将其化解。"}, {"en": "The college [[dean]] made adult education a personal [[mission]], arranging [[fortnightly]] classes where a former [[linguist]] taught Spanish to café owners and retired engineers taught net design.", "zh": "学院院长把成人教育当作个人使命，安排了每两周一次的课程：一位前语言学家教咖啡馆老板西班牙语，退休工程师们则教授渔网设计。"}, {"en": "A [[dentist]] opened a surgery charging a single fair [[fee]], advising patients to [[chew]] less sugar and explaining that even [[over-the-counter]] remedies could not replace [[basic]] care.", "zh": "一位牙医开了家诊所，只收取一笔公道的费用，建议患者少吃糖，并解释说即便是非处方药也无法替代基础护理。"}, {"en": "Volunteers staffed a legal clinic, and visitors were struck by the sheer [[enthusiasm]] of people who had recently believed their town was finished.", "zh": "志愿者们在一家法律咨询处值班，来访者惊讶于这些不久前还以为小镇已经完了的人们所展现出的十足热情。"}, {"en": "After [[five]] seasons, nature answered.", "zh": "五个季节之后，大自然给出了回应。"}, {"en": "Along the [[border]] of the reserve, [[green]] kelp began to [[grow]] again in the [[shade]] beneath the pier, and an oak near the chapel, its broad [[bole]] scored by decades of rope, put out new leaves with a golden [[tint]].", "zh": "在保护区边缘，绿色的海带开始在桥墩下方的荫凉处重新生长；小教堂旁的一棵橡树，粗壮的树干上留着数十年绳索磨出的伤痕，抽出了泛着金色的新叶。"}, {"en": "A farmer's shaggy [[horse]] pulled the first hay cart in years; in the grass every [[worm]] seemed busy; on the shingle a tern [[chick]] learned to run; in the shallows a soft [[shedder]] crab sheltered under a stone.", "zh": "农夫毛茸茸的马拉起了多年来的第一辆干草车；草丛里每条蚯蚓似乎都忙个不停；砾石滩上，一只燕鸥幼鸟学着奔跑；浅水中，一只柔软的蜕壳蟹躲在石头下面。"}, {"en": "Seeds that had lain [[dormant]] through the long decline woke when the sun began to [[shine]] again, though one furious April sky still threw [[hail]] against the windows.", "zh": "在漫长衰退期中一直蛰伏的种子，在太阳重新照耀时苏醒过来，不过四月里仍有一片狂暴的天空把冰雹砸向窗户。"}, {"en": "[[Misinformation]] spread through social feeds: the quotas were a conspiracy, the science was [[unreliable]], the recovery a fraud.", "zh": "错误信息在社交推送中蔓延：配额是一场阴谋，科学不可靠，复苏是场骗局。"}, {"en": "Officials did not [[deny]] that mistakes had occurred, but they learned to [[reject]] easy slogans and refused to let [[baseless]] rumours and [[groundless]] accusations displace the evidence.", "zh": "官员们并不否认曾经犯过错误，但他们学会了拒绝轻巧的口号，拒绝让毫无根据的谣言和指控取代证据。"}, {"en": "A common [[misconception]] held that conservation meant poverty; another, more [[misguided]] belief excused anyone who tried to [[cheat]] the limits, as if the sea could absorb every loss.", "zh": "一种常见的误解认为保护就意味着贫穷；另一种更加误入歧途的信念则为任何试图欺骗限额的人开脱，仿佛大海能够承受一切损失。"}, {"en": "The council asked the [[unreflecting]] sceptic to examine the landing figures, tried to [[persuade]] rather than punish, and argued that [[unnecessary]] confrontation helped nobody.", "zh": "委员会请不假思索的怀疑者查看上岸渔获数据，试图劝说而非惩罚，并主张无谓的对抗对谁都没有好处。"}, {"en": "Most residents came to [[agree]]; [[maybe]], [[hopefully]], a few remained cautious, and, [[furthermore]], caution itself was now treated as part of good stewardship.", "zh": "大多数居民逐渐表示认同；也许——但愿如此——仍有少数人保持谨慎，而且，谨慎本身如今也被视作良好管护的一部分。"}, {"en": "Carrick Haven's story is now studied in [[recent]] papers on coastal policy, though the [[local]] fishermen dislike grand theory.", "zh": "卡里克港的故事如今被沿海政策方面的最新论文研究，尽管当地渔民并不喜欢宏大理论。"}, {"en": "The [[main]] [[thrust]] of their lesson is plain: an economy is a [[literal]] ecology, not an abstraction, and years of [[toil]] can repair what years of greed unmade.", "zh": "他们教训的主旨十分朴素：经济就是一个实实在在的生态系统，而非抽象概念；多年辛劳能够修复多年贪婪所毁坏的一切。"}, {"en": "Nobody claims a [[miracle]]; the tides remain cold, prices remain fickle, and no renewal is genuinely [[unstoppable]].", "zh": "没有人声称出现了奇迹；潮水依旧寒冷，价格依旧无常，没有哪场复兴是真正不可阻挡的。"}, {"en": "Yet the town has shown that people can [[embody]] restraint, that a [[worldwide]] crisis can be answered by a single harbour, and that [[fellow]] citizens who reason [[together]] may yet outlast those who only consume.", "zh": "然而小镇已经表明，人能够践行克制，一场世界性的危机能够由一座港湾来回应，而共同理性商议的公民，或许终将比那些只会消耗的人走得更远。"}, {"en": "A final [[word]] belongs on the harbour sign, repainted each spring: take what the sea can spare.", "zh": "渔港的标牌上每年春天都重新刷上最后一句话：只取大海尚能匀出的东西。"}]}, {"key": "三星词汇 Day 08 List 15", "words": [{"w": "flavor", "phon": "[ˈfleɪvər]", "def": "n.风味；味道；特色v.给…调味", "si": [0], "dists": [2373, 1615, 1616]}, {"w": "flavour", "phon": "[ˈfleɪvər]", "def": "n.风味；滋味；味道v.给…添风味；调味", "si": [0], "dists": [2372, 1616, 1615]}, {"w": "guard", "phon": "[ɡɑrd]", "def": "n.保卫；警卫v.守卫；警戒", "si": [1], "dists": [877, 1088, 119]}, {"w": "laboratory", "phon": "[ˈlæbrətɔri]", "def": "n.实验室", "si": [3], "dists": [1556, 29, 221]}, {"w": "locate", "phon": "[ˈləʊkeɪt]", "def": "v.位于；查找…的地点；确定…的位置；使坐落于", "si": [1], "dists": [2328, 1231, 670]}, {"w": "mislead", "phon": "[ˌmɪsˈd]", "def": "v.误导", "si": [2], "dists": [2389, 2348, 3229]}, {"w": "shame", "phon": "[ʃeɪm]", "def": "n.羞愧；羞耻v.使丢脸；使羞愧", "si": [2], "dists": [2452, 2403, 2392]}, {"w": "upright", "phon": "[ˈʌpraɪt]", "def": "adj.直立的；竖直的；正直的；诚实的adv.笔直地", "si": [2], "dists": [2969, 3186, 3277]}, {"w": "worse", "phon": "[wɜrs]", "def": "adv.更糟；更坏adj.更坏的；更糟糕的； “bad”的比较级", "si": [3], "dists": [1043, 2191, 2602]}, {"w": "ahead", "phon": "[əˈhed]", "def": will replace the abandoned cannery.", "zh": "情况本来还可以更糟：与那些日渐衰败的内陆村庄不同，这座港口仍在向前看，憧憬着一座海洋实验室取代废弃罐头厂的未来。"}, {"en": "A generation of children [[born]] beside the docks will, we hope, grow up with both salt in their lungs and ambition in their hearts.", "zh": "我们希望，在码头边出生的这一代孩子，成长时胸腔里既有咸腥的海风，心中也怀有远大的抱负。"}, {"en": "Local fishermen used to [[deride]] the scientists, insisting that every research plan had one fatal [[flaw]]: it relied on [[guesswork]] rather than on a lifetime of experience.", "zh": "当地渔民过去常常嘲笑这些科研人员，坚称每一项研究计划都有一个致命缺陷：它依靠的是主观臆测，而不是一辈子积累的经验。"}, {"en": "Yet the researchers showed a genuine [[hunger]] to learn, recording every catch in a waterproof [[log]] rather than allowing facts to [[misplace]] themselves in fading memory.", "zh": "然而，研究人员表现出真正的求知渴望，他们把每一网渔获都记在防水日志上，而不是任凭事实在日渐模糊的记忆中错位遗失。"}, {"en": "The elders eventually admitted that they [[owe]] the newcomers a measure of respect.", "zh": "老人们最终承认，他们理应给予这些新来者几分尊重。"}, {"en": "In the evenings, both groups would [[relax]] together at the pier, and this quiet friendship began to [[shape]] a new civic identity.", "zh": "傍晚时分，两群人会一起在码头上歇息，这份沉静的友谊开始塑造一种新的城市共同体意识。"}, {"en": "A net needle, after all, is a [[tool]], and so is a microscope; each can [[aid]] the other, provided neither side is too proud to [[borrow]] knowledge from the other's craft.", "zh": "毕竟，织网针是一种工具，显微镜也是；只要双方都不至于太过骄傲、愿意向对方的行当借鉴知识，两者便能彼此助益。"}, {"en": "When the mayor asked the community to [[choose]] between tradition and science, she discovered that the alternatives were not [[equal]] in cost.", "zh": "当镇长要求社区在传统与科学之间做出选择时，她发现这两种选择所要付出的代价并不对等。"}, {"en": "A visiting professor, once an honoured [[guest]], found herself defending the laboratory before a rowdy council, an [[infant]] asleep in a carrier at her chest.", "zh": "一位曾备受礼遇的客座教授，如今却在喧闹的市政委员会面前为实验室辩护，胸前的婴儿背袋里还睡着一个襁褓中的婴儿。"}, {"en": "Her argument followed a remorseless [[logic]]: by dawn, when sea [[mist]] hung over the harbour, the town would either [[own]] its future or quietly surrender it.", "zh": "她的论证遵循着一种不容回避的逻辑：等到黎明、海雾笼罩港湾之时，这座小镇要么掌握自己的未来，要么悄悄将它拱手让出。"}, {"en": "She urged fishermen and scholars to [[share]] the docks and to fight [[tooth]] and nail for compromise rather than victory.", "zh": "她呼吁渔民和学者共用码头，为达成妥协而非赢得胜利全力以赴。"}, {"en": "Some residents felt an [[urge]] to reject every foreign [[ideology]], reopening an old [[wound]] that everyone had hoped had finally healed.", "zh": "一些居民冲动地想要排斥一切外来思想，这重新揭开了一道人人都本以为终于愈合的旧伤。"}, {"en": "The laboratory's declared [[aim]] was modest: to study the bay's ecosystem without presuming to [[chop]] it into rival disciplines.", "zh": "实验室公开宣称的目标并不张扬：研究海湾的生态系统，而不妄自尊大地把它切割成彼此对立的学科。"}, {"en": "Few officials allowed the dense reports to [[bother]] them, while deadlines continued to [[fly]] past and grant reviews were rushed in a [[hurry]].", "zh": "几乎没有官员肯费心翻阅那些厚重的报告；截止日期不断飞逝，资助评审也总是在匆忙中草草完成。"}, {"en": "Climate change had begun to [[loom]] over every decision, and to dismiss its evidence would have been a reckless [[mistake]].", "zh": "气候变化已开始笼罩每一项决策，对其证据置之不理本会是一个鲁莽的错误。"}, {"en": "At the [[top]] of the researchers' agenda was the sensible [[use]] of satellite data; even the local [[airline]] agreed to [[guide]] survey flights along the coast.", "zh": "研究人员议程上的首要事项是合理利用卫星数据；就连当地航空公司也同意引导勘测飞机沿海岸飞行。"}, {"en": "Sensors anchored at the [[bottom]] of the inlet would, in time, reveal more than a decade of hurried speculation had ever managed to hide.", "zh": "锚定在水湾底部的传感器，终有一天会揭示出十多年来仓促的猜测一直竭力掩盖的东西。"}, {"en": "On the morning the first survey [[flight]] was cancelled, the professor did not curse; she believed in [[Christ]] but placed her practical faith in perseverance.", "zh": "第一次勘测飞行被取消的那天早晨，教授没有咒骂；她信仰基督，但在实际行动中却把信念寄托于坚持不懈。"}, {"en": "Her colleagues felt sharp [[guilt]] at the delay, certain that local pride had been [[hurt]], yet their patient reassurances were not entirely in [[vain]].", "zh": "同事们因延误而深感内疚，确信当地人的自尊受到了伤害，然而他们耐心的安抚并非全然徒劳。"}, {"en": "One feedback [[loop]] after another refined their instruments, and neither side would [[misunderstand]] the other's silence again.", "zh": "一个接一个的反馈循环不断改进着仪器，双方再也不会误解彼此的沉默。"}, {"en": "Fishermen learned to [[rely]] on real-time data about a tagged [[shark]] patrolling the reef, a creature few had ever dared to [[touch]].", "zh": "渔民学会了依靠实时数据了解一条在礁石间巡游的带标识鲨鱼——过去几乎没人敢碰这种生物。"}, {"en": "Nobody pretended that the bay was a [[utopia]], but at least, the professor would later [[write]], its people had stopped arguing about whose knowledge truly mattered.", "zh": "没有人假装这座海湾是乌托邦，但教授后来写道，至少这里的人已经不再争论谁的知识才真正重要。"}, {"en": "When a buoy fitted with polished [[chrome]] fittings began to [[float]] free of its mooring, the station's [[alarm]] sounded before dawn.", "zh": "一只配有光亮铬合金配件的浮标开始挣脱系泊处、随水漂流时，监测站的警报在黎明前响了起来。"}, {"en": "A single [[error]] in a calibration table had loosened it, and the team raced to recover the instrument before they [[lose]] it to the tide.", "zh": "校准表上的一处差错使它松脱，队员们赶在它被潮水卷走之前奋力收回这台仪器。"}, {"en": "Their feelings were [[mixed]]: frustration with the hardware, excitement about the readings.", "zh": "他们的心情五味杂陈：对硬件故障感到懊恼，又对测得的数据感到兴奋。"}, {"en": "A new [[hybrid]] sensor combined acoustic and optical measurements with remarkable precision.", "zh": "一种新型混合传感器以惊人的精度把声学测量与光学测量结合在一起。"}, {"en": "Word of the project spread; even the university's [[president]] arrived on a brief [[tour]], his questions [[sharp]] and unusually well informed.", "zh": "项目的名声传了开来；就连大学校长也短暂地前来视察，他提出的问题犀利且异常内行。"}, {"en": "He promised to [[maintain]] funding and to remain [[alert]] to the station's practical needs.", "zh": "他承诺继续提供资助，并对监测站的实际需求保持关注。"}, {"en": "Rumours that foreign firms would [[boycott]] the port proved false, though a [[dearth]] of investment still slowed construction.", "zh": "有关外国公司将抵制该港口的谣言后来被证实不实，不过投资匮乏仍拖慢了建设进度。"}, {"en": "Inside the lab, a geneticist traced a damaged [[chromosome]] in local shellfish while engineers continued to [[design]] quieter sampling boats.", "zh": "实验室内，一位遗传学家正在追踪当地贝类体内一条受损的染色体，工程师们则继续设计噪音更小的采样船。"}, {"en": "Almost nothing could [[escape]] her notice; the occasional media [[hysteria]] about poisoned seafood merely made her sigh.", "zh": "几乎没有什么能逃过她的眼睛；媒体上偶尔出现的海鲜中毒的歇斯底里报道，也只会让她叹一口气。"}, {"en": "Old Mr. Han, too [[infirm]] to fish, would sit on the quay and [[moan]] affectionately about the weather, treating the laboratory almost as a second [[religion]].", "zh": "年迈体弱、无法出海捕鱼的韩老汉，常坐在码头上亲昵地抱怨天气，他几乎把实验室当成了第二信仰。"}, {"en": "Each dawn he would [[shave]] with great care, watch the gates open, and wait for the experiments to [[begin]].", "zh": "每天黎明，他都会一丝不苟地刮好胡子，看着大门打开，等待实验开始。"}, {"en": "Even the distant spectacle of [[Brexit]], he joked, could not sink a sturdy Chinese fishing boat.", "zh": "他还开玩笑说，就连遥远的英国脱欧闹剧，也弄不沉一条结实的中国渔船。"}, {"en": "The [[downside]] of such attention was regulation; new rules would [[enable]] officials to demand reports with increasing [[frequency]].", "zh": "这种关注带来的负面效应是监管；新规定将使官员们能够以越来越高的频率要求提交报告。"}, {"en": "Yet nobody was made to [[feel]] like a suspect, and each published [[guideline]] struck local readers as fundamentally fair.", "zh": "然而，没有人被逼得觉得自己像个嫌疑犯，而每一项公布的指引在当地读者看来都基本公允。"}, {"en": "A retired [[housewife]] who had once collected shells for restaurants now reported the worms that [[infest]] rotting hulls, helping researchers [[isolate]] an invasive species.", "zh": "一位曾为餐馆捡拾贝壳的退休家庭主妇，如今上报了那些在腐烂船体上滋生的蠕虫，帮助研究人员分离出一个外来入侵物种。"}, {"en": "A rusted anchor became the [[object]] of a student's thesis; viewed through a jeweller's [[lens]], it yielded quiet clues to nineteenth-century shipwrecks.", "zh": "一只生锈的铁锚成了一名学生论文的研究对象；透过珠宝商的放大镜观察，它静静提供着关于十九世纪沉船事故的线索。"}, {"en": "Samples were taken under conditions of [[maximal]] sterility, lest anyone [[misuse]] the findings for private commercial gain.", "zh": "样本均在最高级别的无菌条件下采集，以免有人将研究发现滥用于私人商业牟利。"}, {"en": "A visiting [[novelist]], researching a historical [[path]] of migration, compared the port's ancestors to [[Polynesian]] navigators who had sailed [[recklessly]] into vast and empty oceans.", "zh": "一位来访的小说家在研究一条历史上的迁徙路线时，把这座港口的先民比作波利尼西亚航海家——他们曾无所畏惧地驶入浩瀚空旷的大洋。"}, {"en": "The comparison made the town smile; a [[Spanish]] diplomat joked that such wanderers deserved an official [[sanction]], perhaps in the form of a bronze statue.", "zh": "这一比喻让镇上的人会心一笑；一位西班牙外交官打趣说，这样的漂泊者理应得到官方表彰，或许可以为他们立一尊铜像。"}, {"en": "The harder [[task]] was counting the human [[toll]] of those voyages, the names once considered [[unworthy]] of ledgers.", "zh": "更艰难的任务，是清点那些远航付出的生命代价——那些曾被认为不配载入名册的名字。"}, {"en": "A porcelain figurine, its [[wasp-waist]] silhouette chipped, suggested what global trade had once demanded of fashion, while a historian with a disciplined [[brain]] followed rumours of wartime [[espionage]] along the darkened waterfront.", "zh": "一尊蜂腰轮廓已有缺损的瓷质小塑像，诉说着全球贸易曾对时尚提出过怎样的要求；与此同时，一位思维缜密的历史学家沿着昏暗的滨水区追查战时间谍活动的传闻。"}, {"en": "Stories [[flow]] freely in such towns, and the novelist soon fell in [[love]] with her material.", "zh": "在这样的小镇里，故事随处流淌，小说家很快就深深爱上了自己的素材。"}, {"en": "On the quayside a blacksmith could [[shear]] iron plate with a single steady stroke, his face turned [[toward]] the harbour while his apprentice looked out [[towards]] the open sea.", "zh": "码头边，一位铁匠能一锤稳稳地剪断铁板；他把脸朝向港湾，而他的学徒则眺望外海。"}, {"en": "Rich and poor, old and young, found themselves [[alike]] in curiosity, [[despite]] quarrels that had lasted for decades.", "zh": "无论贫富长幼，人们在好奇心面前都并无二致，尽管彼此间的争执已持续了数十年。"}, {"en": "Every [[branch]] of local life offered material; she planned an [[essay]] that would open with a single pink [[flower]] clinging to the cliffs.", "zh": "当地生活的每一个分支都能提供素材；她计划写一篇散文，开篇便是一朵紧贴悬崖生长的粉色小花。"}, {"en": "Prices remained [[low]], and nobody tried to [[mock]] her strange, patient enthusiasm.", "zh": "物价始终低廉，也没有人试图嘲笑她那份奇特而耐心的热忱。"}, {"en": "Her notebook, bound in oilcloth, sat on a tavern [[shelf]] beside jars of pickled kelp while the [[townsfolk]] debated whether the old spring festival was still genuinely [[alive]].", "zh": "她那本油布封面的笔记本放在酒馆的架子上，旁边是一罐罐腌海带；镇民们则在争论，古老的春季节日是否依然鲜活。"}, {"en": "A [[chunk]] of pale coral, donated by a diver, sat next to pamphlets warning of a winter [[flu]] outbreak and of [[low-level]] contamination in imported steel.", "zh": "一块由潜水员捐赠的浅色珊瑚旁摆着若干小册子，有的警示冬季流感暴发，有的警示进口钢材中的低度污染。"}, {"en": "Conversation shifted into a quieter [[mode]] whenever she opened it, though the landlady, a [[pretty]] woman with shrewd eyes, kept a polished [[shell]] on the counter as a keepsake.", "zh": "每当她翻开笔记本，谈话便转入一种更安静的模式；不过老板娘——一位眼神精明的俊俏女人——在柜台上摆着一只抛光的贝壳作纪念。"}, {"en": "Dredgers had unearthed drums of [[toxic]] waste near the reef; [[brave]] teenagers had reported them, and the priest, emerging from his whitewashed [[church]], had publicly thanked their courage.", "zh": "挖泥船在礁石附近挖出了成桶的有毒废料；勇敢的青少年上报了此事，神父从粉刷洁白的教堂里走出来，当众感谢了他们的勇气。"}, {"en": "Few outsiders could [[detach]] scandal from profit, yet the tavern's cheerful [[informality]] put even wary visitors at ease.", "zh": "外来者很少能把丑闻与利益分开，但酒馆里那种轻松随意的气氛，让就连心存戒备的访客也能安然自在。"}, {"en": "Engineers presented a scale [[model]] of a tidal barrier, and old fishermen tried hard to [[remember]] the storms that might one day test it, since the building doubled as a storm [[shelter]].", "zh": "工程师们展示了一座潮汐屏障的比例模型，老渔民们则努力回忆那些有朝一日可能考验它的风暴——因为这座建筑还兼作防风暴避难所。"}, {"en": "A retired captain puffed a cheap [[cigar]] and nodded slowly; he was held in such [[esteem]] that the whole room fell silent.", "zh": "一位退休船长抽着廉价雪茄，缓缓点头；他极受敬重，满屋子的人都安静了下来。"}, {"en": "The researchers' central [[focus]] was the reef itself and the communities that [[inhabit]] its fringes, not mere [[lucre]].", "zh": "研究人员的核心关注点是礁石本身以及栖居在其边缘地带的社区，而不只是金钱。"}, {"en": "No truly [[modern]] port, they argued, should allow greed to [[remind]] its citizens of older, crueller times.", "zh": "他们主张，任何真正现代的港口，都不应放任贪婪让市民想起更古老、更残酷的年代。"}, {"en": "A healthy reef, after all, can [[shield]] the shore from the typhoon surges that regularly [[break]] over the eastern pier.", "zh": "毕竟，一处健康的礁石能够保护海岸，抵御定期越过东侧码头袭来的台风风暴潮。"}, {"en": "Children would [[circle]] the tidal pools, learning to [[detect]] movement beneath the rocks while their mothers [[fold]] laundry on the warm stones nearby.", "zh": "孩子们会绕着潮池转圈，学着察觉岩石下的动静，而他们的母亲则在附近温暖的石头上叠着衣物。"}, {"en": "The next generation would [[inherit]] whatever the town chose to leave behind: shared prosperity, or a [[lump]] of poisoned concrete.", "zh": "下一代人将继承小镇选择留下的一切：要么是共享的繁荣，要么是一块有毒的混凝土。"}, {"en": "Planners promised to [[remold]] the harbour district entirely, while a British partner firm offered to [[remould]] the old tram tracks into a coastal walkway.", "zh": "规划者承诺彻底重塑港区，一家英国合作公司则提议把旧电车轨道改造成一条海滨步道。"}, {"en": "That unexpected [[shift]] in policy arrived in a [[brief]] telegram, shortly after a rusting [[tractor]] had been winched up from the quay.", "zh": "这一出人意料的政策转变是通过一封简短电报传来的，当时一台生锈的拖拉机刚被人从码头边用绞车吊了上来。"}, {"en": "Without such investment the waterfront would surely [[deteriorate]], as [[folk]] wisdom had long predicted; storms once described in almost [[inhuman]] terms grew fiercer with every winter.", "zh": "没有这样的投资，滨水区注定会衰败，正如民间智慧早就预言的那样；曾被以近乎非人言辞形容的风暴，一年比一年凶猛。"}, {"en": "Bright lamps still [[lure]] night fishermen onto the water, where squid and mackerel become easy [[prey]], and trawlers from a [[remote]] province regularly [[ship]] their catch through the port.", "zh": "明亮的灯火仍引诱着夜捕渔民出海，在那里鱿鱼和鲭鱼成了唾手可得的猎物；来自偏远省份的拖网渔船也定期经由该港运出渔获。"}, {"en": "The resulting [[trade]] revived the market, though councillors refused to [[allow]] unregistered vessels to dock.", "zh": "由此带来的贸易让市场重新焕发了生机，尽管市政委员们拒绝允许未注册的船只靠岸。"}, {"en": "A visiting economist could [[bore]] anyone for hours with statistics, yet his quiet proposal to [[levy]] a small berthing fee sent a sudden [[chill]] through the shipowners' association.", "zh": "一位来访的经济学家能捧着统计数字让任何人厌烦上几个小时，然而他提出的征收小额停泊费的低调建议，却让船东协会骤然感到一阵寒意。"}, {"en": "The ensuing [[battle]] over fees revealed local politics at its [[best]] and at its [[dirty]] worst; compromises were struck, [[therefore]], not [[because]] any faction had surrendered, but because each one needed the others.", "zh": "随之而来的费用之争，暴露了地方政治最好与最肮脏的两面；妥协之所以能够达成，并非因为任何一派选择了投降，而是因为每一派都需要其他各派。"}, {"en": "A [[motorist]] stranded in the flooded parking [[area]] became, by one neat [[definition]], living evidence of inadequate drainage; from his cramped office [[cubicle]], a young [[millennial]] planner tracked the storm drains in real time.", "zh": "一名被困在积水停车场里的驾车者，按照一个巧妙的定义，成了排水系统不足的活证据；一位千禧一代的年轻规划者在狭小的办公隔间里实时追踪着雨水管道。"}, {"en": "Sustainability was already a tired [[catchword]], yet he remained [[clear-eyed]] about exactly what the town could realistically afford.", "zh": "“可持续性”早已是个令人厌倦的时髦口号，但对于这座小镇究竟现实地负担得起什么，他始终保持着清醒的认识。"}, {"en": "Before the present [[century]] grows much older, planners hope that visitors will [[traverse]] a fully restored waterfront, where an [[iconic]] lighthouse marks the town's fiftieth [[anniversary]] as a protected heritage site.", "zh": "规划者们希望，在本世纪走完它的历程之前，游客便能穿行于一处全面修复的滨水区，那里一座标志性灯塔将标志着该镇成为受保护遗产地五十周年。"}, {"en": "An [[archaeological]] museum will stand at the edge of the [[shore]], its exhibits explaining how corruption can quietly [[accrue]] through favours no single witness ever notices.", "zh": "一座考古博物馆将矗立在岸边，其展品将解释腐败如何借着那些没有任何单个目击者曾留意的人情往来悄然累积。"}, {"en": "The curators will be blunt about the [[insidious]] habits of [[malpractice]], warning every generation that trust, once broken, is the hardest structure of all to rebuild.", "zh": "馆长们将直言不讳地讲述渎职那些隐伏成性的积习，警示每一代人：信任一旦破碎，便是所有建筑中最难重建的东西。"}]}, {"key": "三星词汇 Day 08 List 16", "words": [{"w": "bring", "phon": "[brɪŋ]", "def": "v.带来；引起；导致", "si": [47], "dists": [2481, 3201, 3085]}, {"w": "Europe", "phon": "[ˈjʊrəp]", "def": "n.欧洲", "si": [1], "dists": [1909, 120, 3437]}, {"w": "follow", "phon": "[ˈfɑləʊ]", "def": "v.跟随；遵循", "si": [47], "dists": [2362, 2483, 2492]}, {"w": "luxury", "phon": "[lʌkʃəri]ˈ", "def": "n.奢华；奢侈品；难得的享受", "si": [10], "dists": [2516, 2534, 1380]}, {"w": "price", "phon": "[praɪs]", "def": "n.价格；代价v.定价", "si": [9], "dists": [2900, 2693, 2574]}, {"w": "remove", "phon": "[rɪˈv]", "def": "v.搬迁；去掉；移开；消除", "si": [17], "r": "re(离开)+mo ": "[ˈntaɪm]", "def": "n.期间；与此同时", "si": [54], "dists": [2860, 2997, 850]}, {"w": "crux", "phon": "[krʌks]", "def": "n.关键点；最难点；症结", "si": [43], "dists": [3346, 1690, 475]}, {"w": "inn", "phon": "[ɪn]", "def": "n.客栈；小旅馆", "si": [5], "dists": [969, 3054, 2588]}, {"w": "palace", "phon": "[ˈpæləs]", "def": "n.宫殿；王宫", "si": [4], "dists": [2941, 2965, 1964]}, {"w": "enclose", "phon": "[ɪnˈkləʊz]", "def": "v.围起；附上；封入", "si": [4], "dists": [487, 2704, 307]}, {"w": "merchant", "phon": "[ˈmɜrtʃənt]", "def": "n.商人", "si": [5], "dists": [2687, 2750, 2714]}, {"w": "pilgrim", "phon": "[ˈpɪlɡrɪm]", "def": "n.朝圣者", "si": [5], "dists": [688, 3415, 3269]}, {"w": "thief", "phon": "[θif]", "def": "n.小偷；贼；窃贼", "si": [5], "dists": [1744, 2076, 2308]}, {"w": "although", "phon": "[ɔˈðəʊ]", "def": "conj.虽然；尽管", "si": [21], "dists": [2134, 2019, 2003]}, {"w": "temperature", "phon": "[ˈtemprəˌtʃər]", "def": "n.温度；气温；体温", "si": [29], "dists": [402, 47, 628]}], "sents": [{"en": "It was on a damp [[Saturday]] morning that I arrived, wandering [[alone]] through a [[city]] I had never before visited.", "zh": "我是在一个潮湿的星期六早晨抵达的，独自一人漫步在一座从未到过的城市里。"}, {"en": "[[Europe]], I soon discovered, rewards those who wander slowly: [[along]] every [[broad]] avenue, some [[foreign]] inscription or weathered [[sign]] invites the curious [[outsider]] to pause and look again.", "zh": "我很快发现，欧洲会回报那些放慢脚步的人：沿着每一条宽阔的大道，总有某段异国铭文或是风化的招牌，引好奇的外来客驻足再看一眼。"}, {"en": "From the [[foot]] of the northern [[mountain]] the whole region unfolded beneath me; at that [[altitude]] the air was thin and [[clean]], and a [[brown]] hawk circled above a dark [[forest]].", "zh": "从北面的山脚望去，整片地区在我脚下铺展开来；在那样的海拔，空气稀薄而洁净，一只褐色的鹰在幽暗的森林上空盘旋。"}, {"en": "A stony [[trail]] tempted casual [[sightseeing]], yet the finest [[sight]] was the city itself, cupped in the green [[valley]] far below.", "zh": "一条石径吸引着人们随意观光，但最美的景致却是城市本身——它窝在下方远处翠绿的山谷之中。"}, {"en": "The old centre is still [[enclose]]d by crumbling walls, inside which the stone [[palace]] of a [[former]] [[aristocrat]] faces a row of [[guild]] halls.", "zh": "老城区仍被残破的城墙围着，城内一位昔日贵族的石砌宫殿正对着一排行会会馆。"}, {"en": "A [[merchant]] with a leather [[belt]] would once have haggled beside a dusty [[pilgrim]], while a [[clergyman]] warned that every [[thief]] served the [[devil]], and that greed was a [[monster]] crouched at the door of every [[inn]].", "zh": "当年，腰系皮带的商人常会在满身尘土的朝圣者身旁讨价还价，而教士则告诫说，每个小偷都在为魔鬼效力，贪婪则是蹲伏在每间客栈门口的怪兽。"}, {"en": "That [[evening]], on the [[eve]] of the annual festival, the innkeeper pressed a warm [[bun]] and a slice of roasted [[pork]] into my hands.", "zh": "那天傍晚，时值一年一度节日的前夜，客栈老板把一个热乎乎的圆面包和一片烤猪肉塞进我手中。"}, {"en": "My [[mouth]] watered, the cup was filled to the [[brim]], yet I ate [[sparingly]], mindful that a disciplined [[diet]] is itself a kind of wisdom.", "zh": "我直流口水，杯子也斟得满满的，可我还是吃得很节制，深知有节制的饮食本身就是一种智慧。"}, {"en": "Modern life, however, runs on [[money]].", "zh": "然而，现代生活是靠金钱运转的。"}, {"en": "Rising [[inflation]] swells every [[price]] tag; a cautious householder trims the family [[budget]], while the ordinary [[taxpayer]] eyes each additional [[percent]] with suspicion, and a [[trillion]]-dollar debt shadows the state.", "zh": "不断攀升的通胀让每一张价签都膨胀起来；谨慎的户主削减家庭预算，普通纳税人疑虑重重地审视每一个新增的百分点，而一笔万亿美元的债务如阴影般笼罩着国家。"}, {"en": "For speculators the credit [[bubble]] once promised a [[jackpot]], and [[luxury]] goods crowded the arcades, though each [[transaction]] concealed hidden risk.", "zh": "对投机者而言，信贷泡沫曾许诺一夜暴富，奢侈品挤满了拱廊商场，尽管每一笔交易都暗藏风险。"}, {"en": "A wealthy [[filer]] might quietly [[bribe]] an inspector, and a clever lawyer could twist a [[tort]] into a weapon against the weak.", "zh": "富有的报税人可能会悄悄贿赂稽查员，精明的律师则能把一桩民事侵权案扭曲成对付弱者的武器。"}, {"en": "Such stories no longer [[shock]] the locals, though the candour with which they were told never ceased to [[amaze]] me.", "zh": "这类事已不再让当地人震惊，但讲述它们时那种坦率，却始终令我惊叹。"}, {"en": "Everyone knows that a [[corrupted]] official may [[renege]] on his pledges, because the causes are [[deep-seated]].", "zh": "人人都知道，腐败的官员可能违背承诺，因为其根源根深蒂固。"}, {"en": "The [[principal]] failure is [[moral]] rather than technical: once a community discards its guiding [[principle]], [[evil]] quickly learns to wear a respectable face.", "zh": "首要的失败是道德上的而非技术上的：一个社会一旦抛弃了指导性原则，邪恶很快就会学会戴上一副体面的面孔。"}, {"en": "When [[evidence]] of bribery began to accumulate, a public [[probe]] was ordered; commissioners arrived to [[inspect]] the ledgers, the [[innocent]] trembled at the prospect of [[prison]], and the guilty hid behind batteries of lawyers.", "zh": "贿赂的证据开始堆积后，公众调查奉命展开；委员们前来查账，无辜者一想到监狱便不寒而栗，有罪者则躲在大批律师身后。"}, {"en": "The new reformers took office with the [[intent]] to act.", "zh": "新任改革者带着采取行动的意图上台了。"}, {"en": "They promised to [[clamp]] down on fraud, [[remove]] crooked appointees, [[delete]] wasteful programmes, and [[redirect]] funds toward neglected schools; they would [[accelerate]] investment, [[shorten]] delays, [[lessen]] the tax burden, end the chronic [[underuse]] of public assets, and [[maximize]] the value of every coin.", "zh": "他们承诺严厉打击欺诈、撤掉不老实的被任命者、删除浪费的项目，把资金重新引向被忽视的学校；他们还要加快投资、缩短拖延、减轻税负、结束公共资产长期利用不足的状况，并让每一枚硬币的价值最大化。"}, {"en": "Such pledges [[fuel]] a lively debate, for without the [[prompting]] of a free press, will ministers genuinely [[renew]] their vows, [[endorse]] a [[comprehensive]] charter, and remain [[responsive]] to ordinary voters?", "zh": "这类承诺激起了热烈的争论，因为倘若没有自由新闻界的督促，部长们真的会重申誓言、支持一份全面的宪章，并继续对普通选民作出回应吗？"}, {"en": "Opinions naturally [[differ]].", "zh": "意见自然会有分歧。"}, {"en": "Sceptics [[cite]] a dozen past failures and [[foresee]] another [[bummer]]; they dismiss the whole scheme as a [[nuisance]], dwell on every [[negative]] headline, and warn that [[tough]] years lie ahead.", "zh": "怀疑论者举出十几个过往的失败，预见到又一场扫兴的结局；他们把整个方案斥为麻烦，盯着每一条负面新闻不放，并警告说艰难的岁月还在后头。"}, {"en": "[[Although]] such caution is understandable, [[even]] sober observers concede that the plan is not [[altogether]] foolish.", "zh": "尽管这种谨慎可以理解，但即便是冷静的观察家也承认，该计划并非全然愚蠢。"}, {"en": "It is [[simple]] in conception, [[clear]] in purpose, and [[specifically]] aimed at institutional corruption; the [[exact]] savings remain uncertain, [[yet]] panic would serve no one.", "zh": "它构想简单、目的明确，并且专门针对制度性腐败；具体能省下多少钱仍不确定，但惊慌失措对谁都没有好处。"}, {"en": "[[Thus]] the public keeps watch, ready to protest [[whenever]] a promise is broken, as alert as it has [[ever]] been.", "zh": "于是公众保持着警惕，每逢承诺被违背便随时准备抗议，其警觉程度不亚于以往任何时候。"}, {"en": "Today a vigilant [[watcher]] can [[report]] wrongdoing in seconds.", "zh": "今天，一个警觉的观察者几秒钟之内就能举报不法行为。"}, {"en": "Newspapers still [[print]] angry editorials, but citizens prefer to [[browse]] headlines on their phones, [[click]] on leaked files, and [[scan]] documents that once gathered dust in archives; a single [[wire]] transfer leaves a [[digit]]al trail that no official can erase.", "zh": "报纸仍在刊登愤怒的社论，但公民们更愿意在手机上浏览标题、点开泄露的文件、翻阅那些曾在档案馆里积灰的文档；一笔电汇就会留下任何官员都无法抹去的数字痕迹。"}, {"en": "The [[film-making]] industry converts the steady [[outpouring]] of scandal into popular dramas, a musician plays a benefit [[gig]] for fired workers, an [[amateur]] actor eagerly expands his [[repertoire]], and a retired editor delivers a fiery [[speech]] in the crowded square.", "zh": "电影业把源源不断的丑闻改编成热播剧，音乐家为被解雇的工人举办慈善演出，业余演员热切地扩充自己的常备剧目，一位退休编辑在拥挤的广场上发表激昂的演说。"}, {"en": "Meanwhile, volunteers [[rescue]] [[endangered]] species along the marshy coast.", "zh": "与此同时，志愿者们在沼泽般的海岸边救助濒危物种。"}, {"en": "No gesture can fully [[assuage]] the damage of careless decades, yet restoring the wetlands may prove a genuine [[watershed]].", "zh": "没有任何姿态能够完全弥补数十年疏忽造成的破坏，但恢复湿地或许会成为一道真正的分水岭。"}, {"en": "As the global [[temperature]] climbs, glaciers retreat; as the ice caps [[shrink]], warnings [[mount]] that the [[bulk]] of humanity must recover a [[primitive]] humility and learn to live in [[harmony]] with the natural world rather than against it.", "zh": "随着全球气温上升，冰川消退；随着冰盖缩小，警告日益增多：人类大多数必须重拾一种原始的谦卑，学会与自然界和谐共处，而不是与之为敌。"}, {"en": "Sustainable [[transport]] is another local obsession.", "zh": "可持续交通是当地人另一件着迷的事。"}, {"en": "The city's [[traffic]] crawls at rush hour, commuters crowd the early [[train]], cyclists weave between buses, and a daredevil once proposed to [[parachute]] onto the festival bridge, until officers threatened, jokingly one hopes, to [[shoot]] him down.", "zh": "高峰时段城市交通寸步难行，通勤者挤满早班火车，骑车者在公交车之间穿行；曾有一个胆大之徒提议跳伞落到节日大桥上，直到警察威胁说——希望只是玩笑——要把他击落。"}, {"en": "Every winter fog [[dim]]s the lamps; a minor [[bump]] becomes a [[bruise]]d bumper, one careless [[shove]] at a crossing can [[wreck]] a bicycle, and a single [[tear]] on an injured child's cheek shames every bystander.", "zh": "每年冬天，雾气使路灯昏暗；一次轻微的碰撞就会让保险杠留下淤伤，路口处一下无心的猛推就能毁掉一辆自行车，而受伤孩子脸颊上的一滴眼泪，会让每个旁观者都感到羞愧。"}, {"en": "[[Children]] here learn early that schooling is more than a [[lesson]] for an examination.", "zh": "这里的孩子很早就懂得，上学不只是为了应付考试的一堂课。"}, {"en": "At the [[university]], even a crowded [[class]] can [[form]] lifelong friendships; disciplined argument shapes the [[formation]] of judgment and helps [[build]] the moral [[insight]] that [[impressionable]] adolescents so urgently need.", "zh": "在大学里，即便是拥挤的课堂也能结下终生的友谊；有纪律的辩论塑造判断力的形成，并帮助建立易受影响的青少年所迫切需要的道德洞见。"}, {"en": "A gifted teacher does not merely instruct; she can [[inspire]] [[ambition]], awaken a quiet [[pride]], and make even the most reluctant student [[fond]] of articulating his [[innermost]] convictions, treating each pupil as an [[agent]] responsible for his own future.", "zh": "有天赋的教师不只是传授知识；她能激发抱负、唤醒沉静的自尊，让连最不情愿的学生也乐于清楚表达内心深处的信念，把每个学生都视为对自己未来负责的主体。"}, {"en": "Why, then, do we [[travel]] at all?", "zh": "那么，我们究竟为什么还要旅行？"}, {"en": "A glossy [[brochure]] will promise effortless escape, but on the gray [[Monday]] after my return I understood that the journey's worth lay elsewhere.", "zh": "光鲜的旅行手册会许诺毫不费力的逃离，但在归来后那个灰暗的星期一，我明白了旅途的价值另有所在。"}, {"en": "One particular [[moment]] keeps returning: resting in a flowered [[meadow]] above the [[gulf]], I watched the sea merge imperceptibly with the sky.", "zh": "有一个特别的时刻不断浮现：在海湾上方开满鲜花的草地上歇息时，我望着大海难以察觉地与天空融为一体。"}, {"en": "The [[event]] I treasure most, however, was no spectacle at all, but an old village woman who [[clasp]]ed my hand in thanks for a trivial courtesy.", "zh": "然而，我最珍视的事根本不是什么奇观，而是一位村里的老妇人——为了一个微不足道的善举，她紧紧握住我的手表示感谢。"}, {"en": "That small gesture stays with me because every life conceals a [[private]] grief.", "zh": "那个小小的举动一直留在我心里，因为每个人的生命中都藏着一份不为人知的哀伤。"}, {"en": "Those who [[devote]] themselves to their neighbours learn to [[shoulder]] burdens without complaint, whereas the [[force]] of an [[insatiable]] hunger for gain breeds a corrosive [[insensitivity]].", "zh": "那些全身心投入邻里的人，学会了毫无怨言地承担重担；而对利益永不满足的饥渴所具有的力量，则会滋生出腐蚀性的冷漠。"}, {"en": "No one I met remained wholly untouched by the town's troubles, and I, too, was genuinely [[affected]] by the quiet dignity of people enduring hardship without self-pity.", "zh": "我遇到的人，没有谁能完全不为小镇的困境所动；而我也真切地被那些人无声的尊严所感染——他们忍受艰辛，却毫不自怜。"}, {"en": "Here lies the [[crux]] of any durable reform: character.", "zh": "任何持久改革的关键就在这里：品格。"}, {"en": "Neighbouring nations may be [[comparable]] in wealth yet strikingly [[similar]] in weakness, for cupidity is a remarkably constant [[trait]].", "zh": "邻国之间或许财富相当，弱点却也惊人地相似，因为贪婪是一种出奇恒定的品性。"}, {"en": "Only a [[plurality]] of voices, reasoning [[within]] a living [[convention]] of civility, permits a society to [[evolve]] and [[develop]] peacefully rather than through upheaval.", "zh": "唯有多元的声音，在一种鲜活的文明礼让传统之内进行理性探讨，才能让社会和平地演进与发展，而不是经由动荡。"}, {"en": "An [[American]] scholar I met at the inn expressed the [[foremost]] requirement plainly: institutions improve only when citizens refuse to be impressed by titles.", "zh": "我在客栈遇到的一位美国学者把首要条件说得很明白：唯有当公民拒绝被头衔打动时，制度才会改善。"}, {"en": "Reform, in the end, must [[bring]] citizens with it; statutes that nobody is prepared to [[follow]] [[eventually]] become dead letters.", "zh": "改革最终必须带上公民同行；无人愿意遵守的法规，终会变成一纸空文。"}, {"en": "Time is [[short]], and history must not be allowed to [[repeat]] itself.", "zh": "时间紧迫，绝不能让历史重演。"}, {"en": "A country can [[shut]] its eyes to graft, stand on the wrong [[side]] of justice, and [[discard]] its best chance for a generation.", "zh": "一个国家可以对贪腐视而不见、站在正义错误的一边，并断送掉整整一代人最好的机会。"}, {"en": "No abuse is too [[insignificant]] to name and condemn, while the [[prize]], a trustworthy public life shared fairly, is worth every sacrifice demanded.", "zh": "再小的弊端也值得点名与谴责，而那份奖赏——一种公平共享、值得信赖的公共生活——值得为之付出所要求的一切牺牲。"}, {"en": "Hard circumstances [[mold]] character as surely as damp walls [[mould]] in a poorly [[rent]]ed attic, and material insecurity remains the [[driving]] anxiety behind many a family's dream of [[everlasting]] stability.", "zh": "艰难的环境塑造品格，其确凿无异于潮湿的墙壁在租来的简陋阁楼里发霉；而物质上的不安全感，始终是许多家庭渴求永恒稳定的梦想背后最深的焦虑。"}, {"en": "A fat envelope of [[dollar]] notes cannot purchase belonging, however, and no person can permanently [[evade]] the claims of conscience.", "zh": "然而，厚厚一沓美元钞票买不来归属感，也没有人能够永远逃避良心的诉求。"}, {"en": "The townsfolk [[worry]] about their children's prospects, [[pray]] in cold, lit churches, and rise to work again each morning regardless.", "zh": "镇上的居民为孩子的前途担忧，在寒冷而灯火通明的教堂里祈祷，然后无论如何每天早晨依旧起身去工作。"}, {"en": "In the [[meantime]], there are no effortless answers, and none should be pretended.", "zh": "在此期间，不存在毫不费力的答案，也不该假装有。"}, {"en": "To every demagogue's seductive promise, the thinking citizen's best [[reply]] is a stubborn, patient insistence on evidence and decency.", "zh": "面对煽动者每一句诱人的承诺，有思想的公民最好的回应，便是坚定而耐心地坚持证据与正派。"}]}, {"key": "三星词汇 Day 09 List 17", "words": [{"w": "treat", "phon": "[trit]", "def": "v.对待；招待；治疗n.款待", "si": [5], "dists": [2628, 2119, 348]}, {"w": "ample", "phon": "[æmp(ə)l]ˈ", "def": "adj.足够的；丰裕的", "si": [1], "dists": [1098, 2773, 2695]}, {"w": "examine", "phon": "[ɪɡˈzæmɪn]", "def": "v.检验；审查；调查", "si": [1], "dists": [3027, 2773, 1631]}, {"w": "formidable", "phon": "[rmɪdəb(ə)l]ˈfɔ", "def": "adj.可怕的；令人敬畏的；难以对付的", "si": [2], "dists": [735, 1931, 2216]}, {"w": "instant", "phon": "[ˈɪnstənt]", "def": "n.瞬间；立即adj.立即的；即时的", "si": [0], "dists": [427, 69, 2588]}, {"w": "move", "phon": "[muv]", "def": "v.移动；搬家n.行动；移动", "si": [0], "r": "m 得充分的教训。"}, {"en": "Such inquiry is a [[formidable]] [[process]], for historians cannot simply [[simulate]] the past as though human affairs grew from a single [[tree]].", "zh": "这样的探究是一个艰巨的过程，因为历史学家不能简单地模拟过去，仿佛人类事务是从同一棵树上生长出来的。"}, {"en": "A scholar's [[burse]] may fund years of lonely work, yet one careless leap from a conceptual [[cliff]] can [[depress]] the value of an entire theory.", "zh": "学者的助学金或许能支撑多年孤寂的研究，然而从概念的悬崖上轻率地一跃，便可能使整套理论的价值一落千丈。"}, {"en": "There is no [[direct]] [[formula]] for wisdom; [[instead]], understanding arrives slowly.", "zh": "智慧没有直接的公式可循；相反，理解是缓慢到来的。"}, {"en": "How, then, should we [[treat]] the evidence?", "zh": "那么，我们应当如何对待证据？"}, {"en": "Researchers who [[sip]] coffee during another [[busy]] morning, brushing [[dirt]] from old specimens, often [[excel]] precisely because they chase neither [[fortune]] nor fame.", "zh": "那些在又一个忙碌的早晨啜饮咖啡、刷去古老标本上尘土的研究者，往往出类拔萃，恰恰因为他们既不追逐财富，也不追逐声名。"}, {"en": "A [[museum]] documenting courtship and [[procreation]] across species may [[reinforce]] what any careful curator would [[request]]: patience before judgment.", "zh": "一座记录各物种求偶与繁殖行为的博物馆，或许会强化任何一位细心的馆长都会提出的要求：先存耐心，再作判断。"}, {"en": "Visitors who [[sit]] through such exhibits learn how a remote [[tribe]] mastered [[anatomy]] without textbooks, refusing to [[deprive]] its young of wonder.", "zh": "耐心看完这类展览的参观者会了解到，一个偏远部落在没有教科书的情况下是如何掌握解剖学的，并且不肯剥夺年轻人的惊奇之心。"}, {"en": "You cannot [[buy]] such insight or [[climb]] toward it hurriedly, watching honest wonder [[disappear]] behind a screen.", "zh": "这种洞见无法用金钱买到，也无法匆忙攀登而至，只能眼睁睁看着纯真的惊奇消失在屏幕之后。"}, {"en": "Few topics, [[except]] perhaps language itself, fill a public [[forum]] as readily as [[music]] does.", "zh": "几乎没有什么话题——或许语言本身除外——能像音乐那样轻易地填满公共论坛。"}, {"en": "Great institutions [[produce]] work that may [[require]] decades to mature, and the [[situation]] today hums with the [[buzz]] of scholars who [[cling]] to evidence and refuse to [[disappoint]] the public through [[excess]] confidence.", "zh": "伟大的机构所产出的成果或许需要数十年才能成熟，而当下的局势中洋溢着学者们的忙碌之声，他们坚守证据，不肯因过度自信而令公众失望。"}, {"en": "Looking [[forward]], honest experts [[profess]] uncertainty while their [[research]] quietly accumulates.", "zh": "展望未来，诚实的专家公开承认不确定性，而他们的研究在悄然积累。"}, {"en": "Readers should remain [[sceptical]] of grand claims—though never merely [[skeptical]] for fashion's sake—for every rhetorical [[trick]] can erode the [[anchor]] of trust.", "zh": "读者应当对宏大的主张保持怀疑——但绝不应仅仅为了赶时髦而怀疑——因为每一种修辞花招都会侵蚀信任之锚。"}, {"en": "Tempting shortcuts [[bypass]] peer review and earn quiet [[disapproval]], turning a living theory into an intellectual [[fossil]].", "zh": "诱人的捷径绕开同行评议，招来无声的非议，把一个有生命力的理论变成一具思想化石。"}, {"en": "Rigorous method is the best [[insurance]] against the permanent [[mystery]] that surrounds any genuine [[skill]].", "zh": "严谨的方法是抵御永恒谜团的最佳保障，而任何真正的技艺都笼罩在这一谜团之中。"}, {"en": "Curiosity is often a [[by-product]] of disciplined doubt, and it must not be hidden under a [[cloak]] of ideology.", "zh": "好奇心往往是有纪律的怀疑的副产品，它绝不应被掩藏在意识形态的斗篷之下。"}, {"en": "A genuine [[disaster]] can still [[excite]] solidarity, and wise leaders [[foster]] cooperation instead of peddling the [[myth]] that private [[profit]] alone motivates people.", "zh": "一场真正的灾难仍能激发团结，明智的领导人培育合作，而不是兜售“唯有私利才能驱动人”的迷思。"}, {"en": "We should [[reserve]] judgment, never [[skip]] contrary data, and [[trim]] each claim to fit the facts.", "zh": "我们应当保留判断，绝不略过相反的数据，并修剪每一项主张使之贴合事实。"}, {"en": "One vivid [[anecdote]], watched around the [[clock]] online, may briefly dwarf years of [[discipline]], exposing a [[phony]] expert whose downfall can nevertheless [[reshape]] an entire field.", "zh": "一桩在网上被全天候围观的生动轶事，可能在短暂时间内令多年的修为相形见绌，暴露出一个虚假的专家，而此人的垮台却仍能重塑整个领域。"}, {"en": "A reconstructed [[skull]] may [[triumph]] over dogma, while public [[anger]] rises when institutions [[close]] ranks and refuse to [[disclose]] their records.", "zh": "一具复原的头骨或许能战胜教条；而当机构抱成一团、拒绝公开其记录时，公众的愤怒便会升腾。"}, {"en": "No official [[excuse]] can hide that only a tiny [[fraction]] of what each [[resident]] pays reaches the vulnerable; when supervision grows [[slack]], even [[trivial]] irregularities harden into systemic graft.", "zh": "任何官方借口都无法掩盖：每位居民所缴的费用中，只有极小一部分到达弱势群体手中；一旦监督松弛，即便微不足道的违规行为也会硬化为系统性的贪腐。"}, {"en": "From [[Asia]] to [[Britain]], an anonymous [[benefactor]] who funds audits can push a reluctant [[conclusion]] into daylight: [[corruption]] thrives on secrecy.", "zh": "从亚洲到不列颠，一位资助审计的匿名捐助者，能够把一个迟迟不愿得出的结论推向阳光下：腐败靠秘密而滋长。"}, {"en": "It may [[disconcert]] ministers when the [[exchequer]] must [[finally]] admit that [[further]] spending alone cannot repair trust.", "zh": "当财政部门最终不得不承认单靠增加支出无法修复信任时，部长们可能会感到窘迫不安。"}, {"en": "Reports of [[hacking]] and leaked emails [[overshadow]] the [[idealized]] portrait governments present, and the truly [[interesting]] question is whether [[jobless]] citizens gain when markets [[liberalize]] too quickly.", "zh": "有关黑客攻击与邮件泄露的报道，令各国政府所呈现的理想化画像黯然失色；而真正有趣的问题是：当市场自由化过快时，失业公民能否获益。"}, {"en": "At every family [[mealtime]], [[monetary]] anxiety mixes with worries over [[obesity]], and an [[overdue]] debate asks what [[percentage]] of reform should target behavior and what should target prices.", "zh": "在每一次家庭餐桌上，金钱焦虑与对肥胖的担忧交织在一起；一场迟来的辩论追问，改革中应有多大比例针对行为，又有多大比例针对价格。"}, {"en": "The principle of [[proportionality]] demands [[refined]] policy, not headlines; even a [[retiring]] official, drawn into a [[scandal]], may be forced to [[show]] the ledgers.", "zh": "比例原则要求的是精细的政策，而非新闻标题；即便是一位行将退休的官员，一旦卷入丑闻，也可能被迫出示账簿。"}, {"en": "A child in a dull [[suburb]], peering through a cheap [[telescope]], feels an [[undoubted]] and genuinely [[uplifting]] awe that exposes the central [[weakness]] of [[wordy]] official reports: from no [[angle]] does jargon weave warmer [[cloth]] than wonder.", "zh": "一个住在沉闷郊区的孩子，透过廉价望远镜凝视，会感到一种确凿无疑、真正令人振奋的敬畏；这种敬畏暴露了冗长官方报告的核心弱点——行话无论从哪个角度，都织不出比惊奇更温暖的布匹。"}, {"en": "A tiny [[fracture]] in consensus invites fresh study of human [[physiology]] and behavior alike.", "zh": "共识上一道微小的裂痕，会促使人们对人类的生理与行为展开新的研究。"}, {"en": "No society need remain a [[slave]] to old habits, though [[trouble]] gathers whenever prejudice and fear [[cloud]] public [[discourse]].", "zh": "任何社会都不必沦为旧习惯的奴隶，尽管每当偏见与恐惧遮蔽公共话语时，麻烦便会聚集。"}, {"en": "Citizens who [[exercise]] their judgment, who [[pick]] facts with care and regard every finite [[resource]]—even a [[slice]] of bread or a lump of [[coal]]—as shared inheritance, will distrust the professional [[troublemaker]] who feeds on panic.", "zh": "那些运用自己的判断力、谨慎拣选事实、把每一样有限的资源——哪怕只是一片面包或一块煤——都视为共同遗产的公民，将不会信任那个靠恐慌为生的职业捣乱者。"}, {"en": "What they [[discover]] is that ordinary people [[exert]] influence whenever they [[interact]] honestly; the broader [[picture]] shifts through a thousand [[slight]] adjustments more than one dramatic [[answer]].", "zh": "他们所发现的是：每当普通人诚实地互动，他们便在施加影响；更宏大的图景是经由上千次细微的调整而转变的，而非靠一个戏剧性的答案。"}, {"en": "Whether in [[France]] or elsewhere, a shared moral [[code]], sustained by [[frank]] conversation and genuine [[interest]], holds communities together.", "zh": "无论是在法国还是别处，一套由坦率交谈与真诚关注所维系的共同道德准则，都能将社群凝聚在一起。"}, {"en": "Every [[piece]] of evidence deserves a fair chance to [[respond]] to criticism; sound findings [[reproduce]] across labs with deceptive [[simplicity]].", "zh": "每一项证据都应得到回应批评的公平机会；可靠的发现在各个实验室之间得以复现，其简单之态颇具迷惑性。"}, {"en": "Last [[June]], a cautious [[shopper]] could [[become]] an informal auditor, [[since]] receipts and ratings [[usually]] reveal what slick advertising had concealed.", "zh": "去年六月，一个谨慎的购物者也能成为非正式的审计者，因为收据与评分通常会揭示花巧广告所掩盖的东西。"}, {"en": "By then, alert consumers had [[already]] learned to compare labels.", "zh": "到那时，警觉的消费者早已学会比较标签。"}, {"en": "[[whatever]] the headlines shout, we ought [[rather]] to think [[deeply]], button a sturdy [[jacket]] against the wind, and carry the [[weight]] of evidence like a smooth [[stone]] in the pocket.", "zh": "无论头条新闻在叫嚣什么，我们都更应该深入思考，扣上一件结实的夹克抵挡寒风，并把证据的分量像一块光滑的石子那样揣进口袋。"}, {"en": "Reformers who [[decentralise]] power in one province and [[decentralize]] it in another soon learn that labels matter less than outcomes, though the [[flip]] of a coin should never replace deliberation.", "zh": "在一个省份下放权力、又在另一个州分散权力的改革者很快会明白：标签不如结果重要，尽管抛硬币绝不应取代深思熟虑。"}, {"en": "Such policies cut a broad [[swath]] through bureaucracy.", "zh": "这样的政策大刀阔斧地穿透了官僚体系。"}, {"en": "Consider the [[vacancy]] signs along a windswept [[seacoast]], where a [[realtor]] promises that every [[vacation]] will be transformational.", "zh": "想想寒风凛冽的海岸线上那些“空置”招牌吧，在那里，房产中介承诺每一次度假都将带来脱胎换骨的改变。"}, {"en": "Without civic purpose, even luxury hotels stand [[empty]] for months, while [[savvy]] travelers press a corporate [[spokesperson]] for honest accounts of who truly gains.", "zh": "缺乏公民目标，就连豪华酒店也会连续数月空无一人；而精明的旅行者则逼迫企业发言人如实交代，究竟谁才是真正的受益者。"}]}, {"key": "三星词汇 Day 09 List 18", "words": [{"w": "slip", "phon": "[slɪp]", "def": "v.滑倒；滑落；溜走；悄悄地放n.滑倒；溜走；疏忽；纸片", "si": [0], "dists": [2777, 2935, 2827]}, {"w": "truck", "phon": "[trʌk]", "def": "n.卡车；手推车；敞篷货车v.用卡车运；交易", "si": [0], "dists": [2943, 2810, 182]}, {"w": "cognitive", "phon": "[ˈkɑɡnətɪv]", "def": "adj.认知的；认识的", "si": [2], "dists": [989, 3337, 1925]}, {"w": "discuss", "phon": "[dɪˈskʌs]", "def": "v.讨论；谈论；详细阐述", "si": [2], "dists": [754, 2883, 2946]}, {"w": "free", "phon": "[fri]", "def": "adj.自由的；免费的adv.自由地；免费地v.释放", "si": [11], "dists": [2343, 2460, 2189]}, {"w": "intermarriage", "phon": "[ˌɪntərˈmærɪdʒ]", "def": "n.异族结婚；通婚", "si": [16], "dists": [146, 2993, 210]}, {"w": "pilot", "phon": "[ˈpaɪlət]", "def": "n.飞行员；驾驶员", "si": [13], "dists": [3286, 3169, 1433]}, {"w": "rest", "phon": "[rest]", "def": "v. （使）休息；（使）倚靠；停留在；中止n.休息；其他；剩余部分；宁静", "si": [13], "dists": [2626, 2957, 741]}, {"w": "slit", "phon": "[slɪt]", "def": "n.裂缝；狭长的切口v.切长口子；撕裂；使成狭缝", "si": [41], "dists": [3249, 2788, 3395]}, {"w": "true", "phon": "[tru]", "def": "adj.真实的；真的；正确的adv.笔直地；正确地", "si": [11], "dists": [2768, 2250, 1951]}, {"w": "disgrace", "phon": "[dɪsˈɡreɪs]", "def": "n.耻辱；丢脸；不光彩v.使丢脸；使蒙受耻辱", "si": [15], "dists": [3255, 1956, 3059]}, {"w": "exist", "phon": "[ɪɡˈzɪst]", "def": "v.存在；生存；活着", "si": [16], "dists"
