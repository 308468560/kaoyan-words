57, 2434]}, {"w": "golden", "phon": "[ˈɡəʊldən]", "def": "adj.金色的；绝好的", "si": [11, 34], "dists": [1895, 877, 1767]}, {"w": "scoop", "phon": "[skup]", "def": "n.勺子；球型勺；长柄勺；独家新闻v.用勺舀；挖空；抢先获得", "si": [38], "dists": [1520, 1463, 3082]}, {"w": "everything", "phon": "[ˈevriθɪŋ]", "def": "pron.每件事；一切事物", "si": [19], "dists": [2705, 2255, 2632]}], "sents": [{"en": "The bus [[left|leave]] me at the edge of a small [[village]] in [[Virginia]] just after noon, and the [[glare]] off the asphalt was fierce enough to make me shade my eyes.", "zh": "中午刚过，长途车把我放在弗吉尼亚一个小村庄的路边，柏油路上的反光刺眼得让我不得不抬手遮住眼睛。"}, {"en": "My [[granny]] was waiting by the gate, small and straight-backed, with the same [[vigor]] she had when I was a boy.", "zh": "外婆在门口等我，个子不高，背却挺得笔直，还是我小时候见到的那股劲头。"}, {"en": "A [[heavy]] smell of [[orange]] peel and hot dust filled her kitchen, where an old [[fan]] turned slowly above the table.", "zh": "她的厨房里满是橙皮和热尘土的浓重气味，桌上一台旧电扇慢慢地转着。"}, {"en": "I had come for the summer to help restore the old [[theatre]] on the hill, a building that seemed to [[belong]] to another [[era]].", "zh": "我整个夏天都要留在这里，帮忙修复山上那座老剧院——它像是属于另一个时代的建筑。"}, {"en": "It was, [[undoubtedly]], the strangest summer of my life.", "zh": "那无疑是我一生中最奇怪的一个夏天。"}, {"en": "Granny still [[reaped|reap]] a [[crop]] of [[cucumbers|cucumber]] from the strip of soil behind the [[hedge]] and refused any [[help]] with the watering.", "zh": "外婆仍能从树篱后那一小条地里收获黄瓜，而且不肯让别人帮忙浇水。"}, {"en": "But a [[cataract]] had clouded her right eye, and the [[surgeon]] in the county town warned that waiting too [[long]] would make the operation harder.", "zh": "可白内障已经蒙住了她的右眼，县城的医生警告说，拖得太久手术会更难做。"}, {"en": "Her [[inability]] to read the small [[text]] in the paper [[annoyed|annoy]] her more than the pain did, because reading had always been her quiet [[pastime]].", "zh": "读不了报纸上的小字比疼痛更让她恼火，因为读书一直是她不声不响的消遣。"}, {"en": "She would [[not]] admit [[fear]], though a [[feeble]] lamp above the stairs showed how fast her sight was going.", "zh": "她不肯承认害怕，可楼梯上方那盏昏暗的灯说明她的视力正迅速衰退。"}, {"en": "A short [[nod]] was her way of ending such conversations, so I stopped arguing and began to [[search]] for a [[cure]] that did not depend on her stubbornness.", "zh": "她点点头，就算结束了这类谈话；于是我不再争辩，开始寻找一种不依赖她倔脾气的办法。"}, {"en": "The theatre had a [[majestic]] [[dome]] and a [[superhigh]] arch above the stage, and its windows let in a dusty gold light.", "zh": "剧院有一个宏伟的穹顶，舞台上方是一道极高的拱，窗户透进带灰尘的金色光线。"}, {"en": "The walls still carried the names of local [[nobility]] and a faded portrait of a [[queen]] in a [[golden]] frame.", "zh": "墙上还留着当地贵族的名号，以及一幅褪色的女王画像，装在金色画框里。"}, {"en": "In the loft waited a pipe [[organ]], and on the stage a [[virtuoso]] had once played until the whole hall seemed to [[glow]].", "zh": "阁楼里放着一架管风琴，从前有位演奏名家在台上弹奏，整个大厅仿佛都在发光。"}, {"en": "Behind the stage was a [[suite]] of dressing rooms, each with a cracked [[mirror]], a wooden [[bench]], and a [[noisy]] door.", "zh": "舞台后面是一套化妆间，每间都有一面裂了的镜子、一条木长凳和一扇吱嘎作响的门。"}, {"en": "A [[patch]] of damp had spread across the ceiling, and the floorboards rose at a [[bend]] near the [[position]] of the old lighting [[device]].", "zh": "天花板上洇开了一片潮痕，地板在老灯具旁边的转弯处翘了起来。"}, {"en": "I [[recall]] standing there that first afternoon, feeling a [[surge]] of [[emotion]] I could not name.", "zh": "我记得第一天下午站在那里，心里涌起一阵说不清的情绪。"}, {"en": "On Monday the committee met under the dome to divide a small [[surplus]] of [[capital]].", "zh": "周一，委员会在穹顶下开会，分配一小笔结余资金。"}, {"en": "There was [[no]] agreement on the [[quota]] of free seats for old people, and [[not]] one member trusted the [[parity]] between town and county money.", "zh": "给老人留多少免费座位，大家没有共识；也没有一个委员相信镇里和县里的钱是等额配套的。"}, {"en": "A [[consulting]] firm had sent a report whose [[criteria]] were written for a city, not for a valley.", "zh": "一家咨询公司送来一份报告，其中的标准是按城市写的，不是按山谷写的。"}, {"en": "Mr. Hale, a [[well-meaning]] farmer with a [[superior]] manner, wanted to spend [[everything]] on a [[mass-market]] estate at the edge of the meadow.", "zh": "黑尔先生是个好心肠的农场主，却带着一股高人一等的派头，他想把所有钱都花在草甸边上建大众住宅区。"}, {"en": "His plan would drain the [[ditch]], cut the [[hedge]], and damage the [[ecosystem]] that kept the stream clear.", "zh": "他的计划要排干沟渠、砍掉树篱，破坏让溪水保持清澈的生态系统。"}, {"en": "Most of us preferred [[voluntary]] labour and better [[accessibility]] for wheelchairs to any [[whopping]] new building.", "zh": "我们多数人宁愿出义工、把无障碍通道修好，也不想要一座耗资巨大的新楼。"}, {"en": "Hale's smile was [[insincere]], and his speech was [[self-serving]] from the first sentence to the last.", "zh": "黑尔的笑是假的，他那番话从头到尾都在为自己打算。"}, {"en": "On Saturday the village held its annual [[cricket]] match, the one [[pastime]] that still brought every generation to the same field.", "zh": "周六，村子里举行一年一度的板球赛，这是唯一还能把每一代人都聚到同一块场地上的消遣。"}, {"en": "I had never [[tried|try]] the game before, and my [[opponent]] was a boy of twelve with a [[superb]] eye.", "zh": "我从没打过这种球，而我的对手是个十二岁的男孩，眼力极好。"}, {"en": "He [[caught|catch]] two hard balls at the boundary, and a [[crow]] on the fence watched him as if it knew the [[score]].", "zh": "他在边界处接住两个快球，栅栏上一只乌鸦看着他，仿佛知道比分。"}, {"en": "The match stayed close until the last over, when a [[well-known]] teacher hit the ball into the [[ditch]] and ran [[headlong]] between the wickets.", "zh": "比赛一直咬得很紧，直到最后一轮，一位有名的老师把球打进了沟里，然后拼命地在球门之间奔跑。"}, {"en": "I dropped an easy catch, and my [[self-esteem]] sank until Granny, watching from a [[bench]], said I had [[acted|act]] with more [[passion]] than skill.", "zh": "我漏掉一个很容易的球，自尊心一落千丈；外婆坐在长凳上看，说我的热情多于技术。"}, {"en": "It was a [[pleasurable]] afternoon, and for a few hours nobody mentioned the developer or the [[crisis]].", "zh": "那是个令人愉快的下午，有几个小时没人提起开发商，也没人提起危机。"}, {"en": "The fair on Sunday filled the green with a [[cate]] tent, a [[textile]] stall, and the smell of fried bread.", "zh": "周日的集市把草坪填满了：一顶卖美食的帐篷、一个纺织品摊位，还有炸面包的香味。"}, {"en": "Every [[commodity]] on the tables carried a handwritten [[sticker]] with its price.", "zh": "桌上的每件商品都贴着写有价格的手写标签。"}, {"en": "A [[symbolic]] ribbon was cut by the oldest woman in the village, and two men began to [[assemble]] a [[patchwork]] quilt on the grass.", "zh": "村里最年长的老太太剪了一条象征性的彩带，两个男人开始在草地上拼一床百家被。"}, {"en": "I bought a [[little]] bowl for Granny and, [[besides]] that, a jar of honey for the committee.", "zh": "我给外婆买了一个小碗，此外还给委员会买了一罐蜂蜜。"}, {"en": "[[Beside]] the gate a neighbour asked, in a [[whisper]], whether the theatre would really reopen.", "zh": "门边有个邻居低声问我，剧院是不是真的会重新开门。"}, {"en": "The [[theft]] was discovered on Tuesday: the [[crown]] from the costume room, fake but [[golden]], had vanished.", "zh": "周二发现了失窃案：道具间那顶假的金色王冠不见了。"}, {"en": "The [[investigation]] began with a [[hint]] from a child who had seen a stranger near the [[runway]] of the county airfield.", "zh": "调查从一个孩子提供的线索开始，他说在县机场跑道附近看见过一个陌生人。"}, {"en": "The police could find no [[fault]] in our locks, and the case went to the [[court]] in the county town.", "zh": "警察在我们的门锁上找不出任何毛病，案子交到了县城的法院。"}, {"en": "I had to [[testify]], and the [[criminal]] turned out to be a man who had once repaired the roof.", "zh": "我不得不出庭作证，而那名罪犯原来就是曾经修过屋顶的人。"}, {"en": "A reporter got a [[scoop]] and put the story on the front page under a [[headline]] about the missing crown; the whole business felt like a [[nightmare]].", "zh": "一名记者抢到了独家新闻，把这件事以“王冠失踪”为标题登在头版；整件事像一场噩梦。"}, {"en": "On Thursday I drove Granny to the city, where the [[surgeon]] was a calm woman with a [[mastery]] of small jokes.", "zh": "周四我开车送外婆进城，那位外科医生是个沉稳的女人，很会说小笑话。"}, {"en": "The operation took less than an hour, and the [[cure]] was so quick that Granny asked whether the doctors had done anything at all.", "zh": "手术不到一小时，疗效快得外婆直问医生到底做了什么。"}, {"en": "In the waiting room I felt a [[surge]] of [[gloom]], then saw a [[gleam]] of hope when the nurse smiled.", "zh": "在候诊室，我先是一阵忧郁涌上来，随后看到护士一笑，又闪过一丝希望。"}, {"en": "Her [[feeble]] voice on the phone had frightened me, but her [[vigour]] returned before evening.", "zh": "她在电话里虚弱的声音吓到了我，可还没到傍晚她的精神就回来了。"}, {"en": "She said the city was too [[noisy]] and announced that she would [[leave]] the next morning.", "zh": "她说城里太吵，并宣布第二天早上就走。"}, {"en": "The developer's letters did not [[imply]] a threat, yet they made the valley's [[fate]] clear: the meadow would be sold by Christmas.", "zh": "开发商的信里没有暗示威胁，却把山谷的命运说得很明白：草甸会在圣诞节前卖掉。"}, {"en": "The plan was put to the [[test]] at a public meeting, where an [[eminent]] lawyer explained what the [[decrease]] in young families meant for the school.", "zh": "这个计划在一场公开会议上受了检验，一位著名律师说明了年轻家庭减少对学校意味着什么。"}, {"en": "His report was [[unfavorable]] to the developer in one county and [[unfavourable]] in another, which only showed how [[unreasonable]] the rules had become.", "zh": "他的报告在一个县对开发商不利，在另一个县也不被看好，这恰恰说明规则已经变得多么不合理。"}, {"en": "Granny asked him to do her a [[favor]] and read the [[oral]] history of the valley aloud, and he was clearly in [[favour]] of the idea.", "zh": "外婆请他帮个忙，把山谷的口述史大声念出来，他显然很赞成这个主意。"}, {"en": "In the [[past]] such meetings had ended with a [[noble]] promise and no money, and I had no [[reason]] to expect better.", "zh": "过去这种会总是以一句高尚的承诺和一分钱不给收场，我没有理由指望会更好。"}, {"en": "Still, the hall was full, and that fact alone gave me a [[positive]] feeling.", "zh": "不过大厅坐满了人，单是这一点就让我觉得事情有希望。"}, {"en": "We set the work in [[order]]: wood, wiring, seats, paint, one [[category]] per week.", "zh": "我们把活儿排好顺序：木工、电线、座椅、油漆，每周做一类。"}, {"en": "The wiring was [[time-consuming]], and my own [[laziness]] on the first Monday cost us a day.", "zh": "布线很耗时，而我第一个周一的懒惰让我们耽误了一天。"}, {"en": "I sent an [[e-mail]] to the heritage office and a longer [[email]] to an architect who had worked on old [[theaters|theater]].", "zh": "我给文物保护办公室发了一封邮件，又给一位修过老剧院的建筑师写了一封更长的邮件。"}, {"en": "The bank would not [[lend]] us money without a [[sure]] guarantee, so we asked the state [[senate]] for a [[supplement]] to the county grant.", "zh": "没有可靠的担保，银行不肯借钱给我们，于是我们向州参议院申请追加县里的拨款。"}, {"en": "A small [[cult]] had grown around the old building, and students came from the city to [[improve]] the garden in their [[leisure]] hours.", "zh": "这座老建筑周围渐渐有了一小群狂热爱好者，城里的学生利用空闲时间来修整花园。"}, {"en": "For a week the restoration was the [[headline]] in the county paper, and I learned to [[master]] the lighting board.", "zh": "有一个星期，修复工程成了县报的头条，我也学会了操作灯光台。"}, {"en": "The [[secret]] of the theatre's survival, I began to see, was not money but the [[mindset]] of people who refused to [[go]] quietly.", "zh": "我渐渐明白，剧院能活下来的秘密不是钱，而是那些不肯默默退场的人的心态。"}, {"en": "An [[improper]] shortcut in the accounts nearly ruined us, and the [[unfairness]] of the county [[quota]] made the [[surplus]] look like a joke.", "zh": "账目上一处不合规矩的捷径几乎毁了我们，而县里配额的不公平让那点结余显得像个笑话。"}, {"en": "We treated every dollar with [[caution]], and the treasurer wrote each payment in a small notebook.", "zh": "我们小心对待每一块钱，财务把每笔支出都记在一个小本子上。"}, {"en": "To my [[surprise]], a retired builder offered to [[do]] the roof himself and would take no payment.", "zh": "出乎我意料，一位退休建筑工提出自己来修屋顶，而且分文不取。"}, {"en": "I could only [[glimpse]] the scale of the work, and it was [[impossible]] to [[undo]] the years of neglect in one [[season]].", "zh": "我只能窥见这项工程的规模，而多年的荒废不可能在一个季节里扭转。"}, {"en": "Some evenings I sat on the steps and felt the [[blur]] of weeks pass like a single day.", "zh": "有些傍晚我坐在台阶上，觉得几个星期一晃而过，像只过了一天。"}, {"en": "Opening night came at the [[height]] of summer, with a [[glow]] of lamps along the road.", "zh": "首演之夜在盛夏到来，路旁亮起一片灯光。"}, {"en": "A [[well-known]] quartet played a [[masterpiece]] by a local composer, and the sound seemed to [[surpass]] anything I had heard in a concert hall.", "zh": "一支有名的四重奏组演奏了当地作曲家的一首杰作，那声音似乎胜过我在这音乐厅里听过的一切。"}, {"en": "The old play had been a [[bestseller]] in English and a [[best-seller]] in French, though nobody could explain why.", "zh": "那部老戏的英文版曾是畅销书，法文版也畅销，只是谁也说不清原因。"}, {"en": "The audience [[crushed|crush]] toward the door, and I heard a [[whisper]] that the portrait had been cleaned at last.", "zh": "观众挤向门口，我听见有人低声说那幅肖像终于被清洗过了。"}, {"en": "The new lights seemed to [[complement]] the carved wood, and the whole building [[impressed|impress]] even the sceptics.", "zh": "新灯光似乎与木雕相得益彰，整座建筑连怀疑论者都被打动了。"}, {"en": "Granny sat in the front row, her [[frown]] gone, and I wanted to [[thank]] her for making me stay.", "zh": "外婆坐在第一排，眉头舒展了，我想谢谢她让我留下来。"}, {"en": "In that [[whirl]] of applause I understood what [[culture]] means in a place that has almost nothing else.", "zh": "在那阵掌声的旋涡里，我明白了文化在一个几乎一无所有的地方意味着什么。"}, {"en": "The developer withdrew in September, and my granny called the vote a [[massacre]] of common sense.", "zh": "开发商在九月退出了，外婆把那次表决称作对常识的屠杀。"}, {"en": "His lawyer argued that the village had no [[option]] but to sell, yet the meadow stayed green.", "zh": "他的律师辩称村子除卖掉别无选择，可草甸还是绿的。"}, {"en": "The [[cause]] of our victory was simple: we had [[support]] from every [[sector]] of village life.", "zh": "我们获胜的原因很简单：村里各个行业的人都支持我们。"}, {"en": "Donations arrived in a steady [[supply]], and a [[globe]] in the schoolroom was repainted as a thank-you to the children who had raised money.", "zh": "捐款源源不断地来，教室里的一个地球仪被重新上了漆，用来感谢那些筹钱的孩子们。"}, {"en": "I had to [[cross]] the field each morning to collect the post, pushing a bicycle whose [[wheel]] had lost its shape.", "zh": "每天早上我都要穿过田地取邮件，推着一辆轮子已经变形的自行车。"}, {"en": "The wind would [[whip]] the flag on the dome, and I would [[forget]], for a moment, that I had ever lived anywhere else.", "zh": "风会抽打穹顶上的旗子，而我会有那么一刻忘记自己还曾在别处生活过。"}, {"en": "A [[superstition]] among the older actors said the theatre would close again if anyone whistled backstage, so we never did.", "zh": "老演员中有一种迷信，说只要有人在后台吹口哨，剧院就会再次关门，所以我们从不吹。"}, {"en": "By October the boy from the cricket match had become a local [[superstar]], and even the county paper interviewed him.", "zh": "到十月，板球赛上那个男孩成了当地的小明星，连县报都采访了他。"}, {"en": "I tried to [[extract]] one lesson from the summer, though the answer [[probably]] depended on whom you asked.", "zh": "我想从这个夏天里提炼出一条教训，可答案大概要看你问的是谁。"}, {"en": "Granny said the village had [[passed|pass]] from fear to pride without ever admitting it.", "zh": "外婆说，村子从恐惧走到了自豪，却从不承认这一点。"}, {"en": "[[Socially]], the theatre had become the centre of the village, and its stage was never empty for long.", "zh": "在社交上，剧院已经成了村子的中心，它的舞台从不会空太久。"}, {"en": "The old [[unfashionable]] belief that a small place can look after itself turned out to be true, though only because many people were [[active]].", "zh": "小地方能照顾自己这个不时兴的信念，结果证明是对的，但只是因为许多人都在积极行动。"}, {"en": "I had to [[curb]] my urge to stay, pack my bag, and return to the city.", "zh": "我不得不压下留下来的冲动，收拾行李回城。"}, {"en": "But I knew I would come back, and the thought made me [[cry]] for the first time all summer.", "zh": "但我知道我会回来，这个念头让我整个夏天第一次哭了。"}, {"en": "The whole summer stayed in me like an [[ember]] that refused to go out.", "zh": "整个夏天留在我心里，像一块不肯熄灭的余烬。"}]}, {"key": "三星词汇 Day 06 List 12", "words": [{"w": "cave", "phon": "[keɪv]", "def": "n.洞穴", "si": [12], "dists": [1467, 2169, 1924]}, {"w": "curious", "phon": "[ˈkjʊriəs]", "def": "adj.好奇的", "si": [12], "dists": [2420, 1595, 1488]}, {"w": "routine", "phon": "[ruːˈtin]", "def": "n.常规；例行公事adj.常规的；例行公事的", "si": [9], "dists": [3331, 173, 3351]}, {"w": "curse", "phon": "[kɜrs]", "def": "v.诅咒；咒骂n.诅咒；咒骂", "si": [49], "dists": [1488, 1732, 1784]}, {"w": "deem", "phon": "[dim]", "def": "v.认为；觉得", "si": [4], "dists": [3285, 964, 90]}, {"w": "feed", "phon": "[fid]", "def": "v.喂；吃；饲养n.饲养；喂养", "si": [20], "dists": [2343, 2931, 2460]}, {"w": "god", "phon": "[ɡɑd]", "def": "n.神", "si": [13], "dists": [1787, 1735, 1858]}, {"w": "herb", "phon": "[ɜrb]", "def": "n.药草；香草", "si": [35], "dists": [1841, 1788, 3123]}, {"w": "less", "phon": "[les]", "def": "adv.较少地；更少地； “little”的比较级adj.更少的； “little”的比较级pron.较少；更少", "si": [35, 77], "dists": [2467, 1790, 2709]}, {"w": "match", "phon": "[mætʃ]", "def": "n.比赛；火柴v.相配", "si": [30], "dists": [1343, 1699, 1612]}, {"w": "pater", "phon": "[ˈpeɪtər]", "def": "n.父亲", "si": [0], "dists": [1820, 763, 1518]}, {"w": "recollect", "phon": "[ˌrekəˈlekt]", "def": "v.回想起；记起", "si": [16], "dists": [2972, 542, 3016]}, {"w": "secular", "phon": "[ˈsekjələr]", "def": "adj.世俗的；非宗教的；长期的", "si": [14], "dis ty with two bags, a [[carry-on]], and a [[letter]] from my [[pater]] folded in my coat.", "zh": "长途车把我放在一个乡村县的边上，我带着两个包、一件手提行李，还有一封父亲的信折在外套里。"}, {"en": "The [[whole]] valley lay [[across]] a [[wide]] [[grassland]], and the road ran through it without a single [[curve]] for an hour.", "zh": "整个山谷铺展在一片宽阔的草原上，公路在中间笔直延伸了一个小时，没有一个弯。"}, {"en": "[[Here]] and there a house stood [[adjoining]] the old [[medieval]] [[bridge]], where a signpost helped me [[orient]] myself.", "zh": "零星几座房子紧挨着那座中世纪的老桥，桥边一块路牌帮我辨明了方向。"}, {"en": "I was [[actually]] more [[anxious]] than I admitted, and the [[visit]] began to [[seem]] a mistake.", "zh": "我其实比嘴上说的更焦虑，这趟来访开始显得像个错误。"}, {"en": "I [[deemed|deem]] it a [[difficult]] [[case]] from the first mile, though the driver only laughed at my [[certain]] frown.", "zh": "从第一英里起我就觉得这是件难办的事，尽管司机只是笑我那一脸笃定的愁容。"}, {"en": "[[Each]] field looked the same, and I could not [[think]] of a [[good]] [[indication]] that I belonged here.", "zh": "每一块田看起来都一样，我想不出任何好的迹象能说明我属于这里。"}, {"en": "My [[vocation]] for the summer was to help [[remodel]] an old [[storehouse]] into a reading room for the local [[society]].", "zh": "我夏天的工作，是帮忙把一座旧仓库改造成当地社团的阅览室。"}, {"en": "The [[interior]] smelled of [[paper]], dust, and the [[mixture]] of old [[goods]] that had been stored there for years.", "zh": "室内弥漫着纸张、灰尘和多年堆放其中的旧货混杂的气味。"}, {"en": "A [[volunteer]] [[instructor]] ran [[tuition]] classes in reading and [[mathematics]] for [[graduates|graduate]] who had never learned to read well.", "zh": "一位志愿讲师为那些从未学会好好读书的毕业生开设阅读和数学辅导课。"}, {"en": "The programme was [[time-limited]], with a [[minimal]] budget and a [[non-standard]] daily [[routine]].", "zh": "这个项目有期限，预算极少，每天的安排也不固定。"}, {"en": "A [[leading]] [[unionist]] on the committee called the plan [[vital]] for the town's [[cultural]] life.", "zh": "委员会里一位有影响力的工会成员称这个计划对镇上的文化生活至关重要。"}, {"en": "We had no [[bandwidth]] yet, only one old [[tablet]] and a [[thermostat]] that could not decide between hot and cold.", "zh": "我们还没有网络带宽，只有一台旧平板电脑，和一个冷热拿不定主意的恒温器。"}, {"en": "On my first free afternoon I followed a [[pathway]] to the [[cave]] above the creek, [[curious]] about the paintings the children kept describing.", "zh": "第一个空闲的下午，我沿着一条小径走到溪上的洞穴，对孩子们反复描述的那些画充满好奇。"}, {"en": "An old [[prophet]] was said to have lived there, and a [[theology]] of storms had grown around his name until he was almost a [[god]].", "zh": "据说一位古老的先知曾住在这里，围绕他的名字渐渐形成了一套关于风暴的神学，他本人也几乎成了神。"}, {"en": "The story was [[secular]] in [[origin]], yet it carried a strange [[holiness]], like a [[doctrine]] no church had ever [[formally]] accepted.", "zh": "这个故事起源是世俗的，却带着一种奇异的圣洁，像一条从未被任何教会正式接受的教义。"}, {"en": "The cave itself was almost [[unexplored]], and its [[theme]] was water: the ochre figures were barely [[visible]] in the dark.", "zh": "洞穴本身几乎未被探索，那些赭石色的人形在黑暗里几乎看不出来。"}, {"en": "I began to [[fantasize]] that they were a kind of [[fiction]] written on rock, a story that could [[outlive]] us all, and I could not [[recollect]] who had first told me of it.", "zh": "我开始幻想它们是写在岩石上的一种虚构，一个能比我们所有人活得更久的故事；我记不起是谁最先跟我讲起它。"}, {"en": "There was [[grace]] in the way the light entered, and for an hour I felt something close to [[peace]].", "zh": "光线照进来的样子有一种优雅，有一个小时我感到近乎平静的东西。"}, {"en": "A [[herd]] of [[wild]] horses still lived on the grassland, and a [[fierce]] stallion [[patrolled|patrol]] its edge.", "zh": "草原上仍生活着一群野马，一匹凶猛的种马在边缘巡逻。"}, {"en": "Their [[inborn]] and [[instinctive]] fear of people kept them at a distance.", "zh": "它们天生、本能的怕人让它们始终与人保持着距离。"}, {"en": "A [[mate]] stood beside the stallion, and the two [[fed|feed]] on [[grain]] scattered by the wind.", "zh": "一匹伴侣马站在种马旁边，两匹马吃风吹散的谷粒。"}, {"en": "A [[female]] vet took a [[swab]] from a young mare and, for the breeding programme, a blood sample.", "zh": "一位女兽医从一匹年轻母马身上取了拭子，又为繁育计划取了血样。"}, {"en": "The county's [[measures|measure]] to protect the herd were [[timely]], and the vet [[encouraged|encourage]] us to keep the fence low.", "zh": "县里保护马群的措施来得很及时，兽医也鼓励我们把围栏修低。"}, {"en": "[[Beyond]] the fence a [[solvable]] problem waited: water in summer, shade in winter, and every [[animal]] watching us, even the [[cute]] foal.", "zh": "围栏之外还有一个可以解决的问题在等着：夏天有水、冬天有荫，而每一头动物都在看着我们，连那只可爱的小马驹也是。"}, {"en": "My [[anxious]] nights had returned, the [[oppressive]] heat made my days [[unfocused]], and the [[therapy]] I had started in the city was now a phone call every Thursday.", "zh": "我焦虑的夜晚又回来了，白天注意力涣散，而在城里开始的心理治疗现在变成了每周四的一通电话。"}, {"en": "I took a [[tablet]] for [[fever]] on the third night, woke in [[sweat]] under a thick [[sweater]], and could not [[recover]] my breath.", "zh": "第三晚我吃了退烧药，穿着厚毛衣在汗里醒来，喘不上气。"}, {"en": "The doctor said the reaction was [[involuntary]] and did not mean I was [[unresponsive]] to treatment.", "zh": "医生说这种反应是不由自主的，并不意味着我对治疗没有反应。"}, {"en": "I felt [[self-conscious]] about my [[awkward]] hands and [[embarrassed]] by the [[patient]] in the next bed, who never complained.", "zh": "我为自己笨拙的双手感到不自在，也为邻床那位从不抱怨的病人感到羞愧。"}, {"en": "It was an [[unpleasant]] [[degree]] of weakness, and I [[ought]] to have asked for help sooner.", "zh": "那种虚弱程度令人不适，我本该早点求助。"}, {"en": "But the [[body]] has its own [[cunning]], every [[cell]] fighting in its own way, and by morning I felt almost [[normal]].", "zh": "但身体自有它的狡黠，每个细胞都以自己的方式抗争，到了早上我几乎觉得正常了。"}, {"en": "The town [[celebrated|celebrate]] its harvest with a [[custom]] older than the bridge: a tug-of-war [[match]] and a [[tune]] on the fiddle.", "zh": "镇上用一项比桥还古老的习俗庆祝丰收：一场拔河比赛和一段小提琴曲。"}, {"en": "A [[celebrity]] from the state capital came to open the fair, and the [[media]] followed her everywhere.", "zh": "一位来自州首府的名人来为集市揭幕，媒体到处跟着她。"}, {"en": "Children [[whistled|whistle]] and [[swung|swing]] on ropes tied to the old oak, and the [[collective]] noise was [[noteworthy]].", "zh": "孩子们吹着口哨，在系于老橡树上的绳子上荡来荡去，那集体的喧闹很值得注意。"}, {"en": "The [[norm]] was that everyone brought a dish, and the [[mixture]] of [[vivid]] colours and smells was [[unimaginable]].", "zh": "惯例是每家带一道菜，鲜明的色彩与气味混在一起，难以想象。"}, {"en": "For one afternoon the town forgot its [[problems|problem]] and its [[biases|bias]], and even the [[good-natured]] arguments ended in laughter.", "zh": "有一个下午，镇上忘了种种问题和偏见，连那些善意的小争吵都以笑声收场。"}, {"en": "I [[noted|note]] that the [[less]] people spoke about politics, the better the food tasted, and I bought a jar of [[herb]] honey for my pater.", "zh": "我注意到人们越少谈政治，饭菜就越香；我还给父亲买了一罐香草蜂蜜。"}, {"en": "In September a [[census]] taker came to the storehouse with a [[bilingual]] form and a long list of questions.", "zh": "九月，一位人口普查员带着双语表格和一大串问题来到仓库。"}, {"en": "The county wanted every [[voter]] registered before the [[congressional]] election, and the [[grassroots]] groups had begun a [[collective]] campaign.", "zh": "县里希望每位选民在国会选举前完成登记，基层组织已经开始了一场集体行动。"}, {"en": "A [[union]] meeting in the hall argued that [[liberty]] without a [[paycheck]] was [[meaningless]].", "zh": "大厅里的一场工会会议争论说，没有薪水的自由是没有意义的。"}, {"en": "The company's [[bid]] for the grassland had made [[homebuyers|homebuyer]] nervous and [[polarized|polarize]] the town.", "zh": "公司对草原的竞标让购房者紧张，也让小镇两极分化。"}, {"en": "Its [[unilateral]] offer, made without the [[congress]], looked like a [[cunning]] move to [[govern]] the valley from outside, and the town wanted to [[minimize]] the damage.", "zh": "它绕开国会单方面提出的条件，看起来像是一招从外部控制山谷的诡计，镇里则想尽量减小损害。"}, {"en": "A [[mandatory]] [[measure]] would have [[bound|bind]] the county for thirty years, and the [[chair]] asked the council to [[seek]] advice.", "zh": "一项强制性措施会把全县绑住三十年，会议主席要求议会先寻求法律意见。"}, {"en": "The council agreed to [[reconsider]], but the [[maximum]] the town could [[pay]] was small.", "zh": "议会同意重新考虑，但镇上能付的最高金额很小。"}, {"en": "The [[gross]] sum the company demanded was [[burdensome]] for a county of ten thousand people.", "zh": "公司索要的总金额，对一个只有一万人的县来说是沉重的负担。"}, {"en": "The only [[customer]] in the general store was a [[widow]] who bought [[goods]] at [[wholesale]] prices and sold them on, counting every coin from a worn [[pocketbook]].", "zh": "杂货店里唯一的顾客是一位寡妇，她以批发价买进货物再转卖，从一个破旧的钱包里一枚一枚地数硬币。"}, {"en": "She had [[hired|hire]] two graduates and paid them a [[paycheck]] that barely covered their [[tuition]] debts.", "zh": "她雇了两名毕业生，付的薪水勉强够还他们的学费债。"}, {"en": "Her [[energy]] was [[noteworthy]], and her [[field]] of knowledge was wider than the county line.", "zh": "她的精力值得称道，知识面比县界还宽。"}, {"en": "A [[billion]] dollars of mining revenue had been promised, yet the county was already close to [[default]] on its loan.", "zh": "有人承诺过十亿美元的采矿收入，可县里已经快要拖欠贷款了。"}, {"en": "The whole town, she said, had been [[uninformed]] about the small print, and an unpaid [[bill]] had been [[cut]] from the budget.", "zh": "她说，全镇人对那些小字条款都不知情，而一笔未付的账单被从预算里砍掉了。"}, {"en": "In October a storm [[erupted|erupt]] over the ridge, the old man [[cursed|curse]] the sky, and a [[cascade]] of water came through the bridge.", "zh": "十月，一场暴雨在山脊上爆发，老人咒骂着天，一股瀑布般的水流冲过桥。"}, {"en": "The creek became a [[seething]] brown flood, [[thick]] with mud and too fast to [[swim]], and the wind made the shutters [[rustle]].", "zh": "小溪变成翻腾的褐色洪流，泥浆浓稠，水流急得没法游泳，风把百叶窗吹得沙沙响。"}, {"en": "We [[swept|sweep]] water from the reading room, [[coated|coat]] the shelves with oil, and [[diverted|divert]] the stream behind the shed.", "zh": "我们把阅览室的水扫出去，给书架上油，把水流引到棚屋后面。"}, {"en": "The storm was an [[indication]] of what the valley could expect, and our repairs were neither [[timely]] nor cheap.", "zh": "这场风暴预示着山谷以后会遭遇什么，而我们的修缮既不及时也不便宜。"}, {"en": "[[Unfortunately]], a [[letter]] from the county warned that the flood would [[degrade]] the land for years.", "zh": "不幸的是，县里来的一封信警告说，洪水会让这片土地多年退化。"}, {"en": "The water had risen an [[inch]] above the floor, and the [[level]] of mud on the shelves told its own story.", "zh": "水已经漫过地板一英寸，书架上泥浆的高度说明了一切。"}, {"en": "That night a [[bang]] on the door woke us: someone had made an [[attack]] on the lock of the storehouse.", "zh": "那一夜门上砰的一声把我们惊醒：有人对仓库的锁下了手。"}, {"en": "The rumour spread that a bus had been [[hijacked|hijack]] at the depot, though an old poster spelled the word [[highjack]].", "zh": "有传言说一辆公交车在车站被劫持了，尽管一张旧海报把这个词拼成了 highjack。"}, {"en": "The [[suspect]] was a young man with a [[hip]] injury and no clear motive.", "zh": "嫌疑人是位髋部受伤的年轻人，动机不明。"}, {"en": "The story was [[nonsense]], a [[meaningless]] rumour, but it [[sparked|spark]] a [[fierce]] argument on the steps.", "zh": "这故事是胡说，一条毫无意义的谣言，却在台阶上引发了一场激烈的争吵。"}, {"en": "I had to [[defy]] the urge to leave and [[endure]] two hours of questions in the cold.", "zh": "我不得不压下离开的冲动，在寒冷中忍受了两个小时的盘问。"}, {"en": "The police [[suspended|suspend]] the inquiry, an [[investigator]] began to [[conduct]] interviews, and we locked the door [[lest]] someone return.", "zh": "警方暂停了调查，一名调查员开始进行问询，我们锁上门，唯恐有人再来。"}, {"en": "The damage looked [[wilful]], even [[willful]], and I could [[swear]] the back door had been locked; the truth was not easy to [[erase]].", "zh": "这破坏看起来是故意的，甚至是蓄意的；我敢发誓后门本来是锁着的，而真相并不容易被抹去。"}, {"en": "By then the town's [[gossip]] had turned me into a local figure, which was [[awkward]] for someone who disliked attention.", "zh": "到那时，镇上的流言已经把我变成了一个本地人物，这对不喜欢被关注的人来说很尴尬。"}, {"en": "A [[bias]] against outsiders could [[hinder]] every good idea, I learned, so I stopped arguing and started listening.", "zh": "我明白了，对外来者的偏见会阻碍每一个好主意，于是我不再争辩，开始倾听。"}, {"en": "The [[leading]] question at every meeting was whether the library was a [[hobby]] or a [[vocation]].", "zh": "每次会上最主要的问题都是：这座图书馆是爱好，还是使命。"}, {"en": "I learned to [[see]] the difference between a [[problem]] that was [[solvable]] and one that was merely [[unpleasant]].", "zh": "我学会分辨一个可解决的问题和一个只是令人不快的问题。"}, {"en": "[[Reasonableness]] was rare on both sides, [[cunning]] was common, and patience was rarer still.", "zh": "双方都少有讲理的时候，狡黠却很常见，耐心则更加稀少。"}, {"en": "In the end the [[matter]] was settled by a [[few]] calm voices, not by the loudest ones.", "zh": "最后，这件事是由几个平静的声音解决的，而不是嗓门最大的那些。"}, {"en": "The library opened in November as a [[center]] for learning, and a [[streaming]] line of readers began at nine and did not stop.", "zh": "图书馆在十一月作为学习中心开放，读者络绎不绝，从九点开始就没停过。"}, {"en": "A [[reader]] from the school took a [[paper]] bag home, and every book had a card [[attached|attach]] to the inside cover.", "zh": "一位学院的读者把纸袋带回家，每本书的封内都贴着一张卡片。"}, {"en": "A model [[orbiter]] above the blackboard seemed to [[sail]] through the room, and the children loved it.", "zh": "黑板上方一个轨道飞行器模型仿佛在教室里航行，孩子们很喜欢它。"}, {"en": "Our lending [[system]] was a notebook, a pencil, and one old [[tablet]] shared by everyone.", "zh": "我们的借阅系统是一个笔记本、一支铅笔，和一台大家共用的旧平板电脑。"}, {"en": "The [[media]] came once, took photographs, and never returned, which was probably [[sensible]].", "zh": "媒体来过一次，拍了照片就再没回来，这大概算是明智的。"}, {"en": "The [[thermostat]] failed again, so we moved into the [[centre]] of the room, where the old stove still worked, and we had to [[add]] a new heater in spring.", "zh": "恒温器又坏了，于是我们挪到屋子中央，那里老炉子还能用；到了春天我们只得添了一台新取暖器。"}, {"en": "The [[legacy]] of that fight was a [[mandatory]] rule that any sale of public land must be voted on.", "zh": "那场斗争留下的遗产是一项强制性规定：任何公共土地出售都必须经过投票。"}, {"en": "A [[widow]] left the storehouse in her [[will]], with a [[note]] that it should always hold books.", "zh": "一位寡妇把仓库写进了遗嘱，附了一张字条说这里永远要放书。"}, {"en": "The [[reasonableness]] of that gift moved everyone, and the town [[converged|converge]] on the square to [[celebrate]] the [[renaissance]] of a building nobody had wanted.", "zh": "那份馈赠的合情合理感动了所有人，全镇人聚集到广场上，庆祝一座曾经无人想要的建筑获得重生。"}, {"en": "We had to [[reconstruct]] part of the roof and [[widen]] the door, and the work took [[less]] time than we feared.", "zh": "我们不得不重建部分屋顶、加宽大门，而这项工作花的时间比担心的要少。"}, {"en": "My therapy ended, my anxious nights grew rare, and I began to [[recover]] my old [[energy]].", "zh": "我的治疗结束了，焦虑的夜晚越来越少，我开始恢复从前的精力。"}, {"en": "I could [[think]] about the future without fear, which was a [[degree]] of peace I had not known for years.", "zh": "我可以不带恐惧地想到未来，那是一种我多年未曾体会的平静程度。"}, {"en": "The company's [[defeat]] felt less like a victory than like a [[virtuous]] decision the whole town had made together; seasons [[cycled|cycle]], and for the first [[time]] I did not count them.", "zh": "公司的失败不像胜利，更像全镇共同做出的一个正直决定；四季循环，而我第一次没有去数它们。"}, {"en": "I still [[keep]] the notebook from that autumn, and I try to [[live]] by its plain advice.", "zh": "我仍留着那个秋天的笔记本，也努力照它朴素的建议生活。"}, {"en": "A place can be a [[paradise]] without being easy, and this one was both, [[thin]] soil and all.", "zh": "一个地方可以既是天堂又不容易，而这里是两者兼具，连土壤都贫瘠。"}, {"en": "[[Beyond]] the county line the world was loud and [[unimaginable]], but I no longer feared it, and the cave, the herd and the bridge had become one [[mixture]] in my memory.", "zh": "县界之外的世界喧嚣而难以想象，但我不再害怕它；洞穴、马群和桥在我记忆里混成了一体。"}, {"en": "[[Unfortunately]], I could not stay forever, and winter called me back to the city; I did not feel like a visitor [[anymore]].", "zh": "不幸的是，我不能永远留下，冬天把我召回城里；我不再觉得自己是个过客。"}, {"en": "But I [[won|win]] something there, and I [[mean]] to keep it.", "zh": "但我在那里赢得了某种东西，我打算守住它。"}, {"en": "The [[end]] of that year was not an end at all, and the [[unfolding]] of the story would [[recur]] in my dreams for years.", "zh": "那一年的结束根本不是结束，这个故事的展开会在我梦里重演多年。"}]}, {"key": "三星词汇 Day 07 List 13", "words": [{"w": "voice", "phon": "[vɔɪs]", "def": "n.声音；呼声；意见v.表达；发嗓音", "si": [38, 83], "dists": [1411, 2034, 2004]}, {"w": "wind", "phon": "[wɪnd]", "def": "n.风v.蜿蜒；缠绕", "si": [5], "dists": [1920, 2005, 1889]}, {"w": "Hispanic", "phon": "[hɪˈspænɪk]", "def": "adj.西班牙的；西班牙和葡萄牙的；拉丁美洲的", "si": [4], "dists": [1537, 379, 2476]}, {"w": "income", "phon": "[ˈɪnkʌm]", "def": "n.收入；收益；所得", "si": [26, 41], "dists": [1538, 660, 600]}, {"w": "medicine", "phon": "[ˈmedɪs(ə)n]", "def": "n.药；医学", "si": [34], "dists": [3143, 3265, 315]}, {"w": "notice", "phon": "[ˈnəʊtɪs]", "def": "n.注意；通知v.注意；留心；通知", "si": [13, 85], "r": "not(知道)+ice→让人知道", "dists": [1914, 2016, 1078]}, {"w": "outside", "phon": "[ˌaʊtˈsaɪd]", "def": "adv.在外面n.外面；外边；外部prep.在...外adj.外面的；外界的", "si": [5], "dists": [2712, 1915, 173]}, {"w": "redefine", "phon": "[ˌridɪˈfaɪn]", "def": "v.重新定义", "si": [3, 82], "r": "re(重新)+define 2784, 2469, 2282]}, {"w": "colorful", "phon": "[kʌlərf(ə)l]ˈ", "def": "adj.五彩缤纷的；丰富多彩的", "si": [14], "dists": [3019, 311, 2882]}, {"w": "colourful", "phon": "[ˈkʌlərf(ə)l]", "def": "adj.五彩缤纷的；丰富多彩的", "si": [14], "dists": [3020, 1808, 199]}, {"w": "cage", "phon": "[keɪdʒ]", "def": "n.笼子vt.把…关进笼子", "si": [78], "dists": [1924, 1761, 1687]}, {"w": "size", "phon": "[saɪz]", "def": "n.大小；尺码", "si": [78], "dists": [3395, 2649, 3485]}, {"w": "tail", "phon": "[teɪl]", "def": "n.尾巴；尾随者v.跟踪", "si": [78], "dists": [2612, 2319, 1061]}, {"w": "smell", "phon": "[smel]", "def": "n.闻；气味；嗅觉v.嗅；闻；散发气味；察觉", "si": [5], "dists": [2002, 3220, 2942]}], "sents": [{"en": "I came back to my [[birthplace]] on a [[bitter]] morning in March, with a [[wallet]] that held a [[mere]] twenty dollars and a [[curriculum]] vitae.", "zh": "三月一个寒冷的早晨，我回到出生地，钱包里只有二十美元和一份简历。"}, {"en": "The town had [[changed|change]], [[though]] the [[graveyard]] on the hill looked [[perfectly|perfect]] unchanged.", "zh": "小镇变了，尽管山上的墓地看起来依然如故。"}, {"en": "My [[senior]] aunt met me at the station and asked, with [[cautiousness]], why I had come.", "zh": "我年长的姑妈在车站接我，小心翼翼地问我来做什么。"}, {"en": "I said I had a [[chance]] to [[redefine]] myself, which was [[somewhat]] true and [[somewhat]] [[thoughtless]].", "zh": "我说我有个重新定义自己的机会，这话有几分真实，也有几分轻率。"}, {"en": "The town's [[Hispanic]] families had built most of the shops on Main Street, and their [[lifestyle]] was [[unpretentious]].", "zh": "镇上西语裔的家庭建起了主街上大半的店铺，他们的生活方式朴实无华。"}, {"en": "The [[wind]] came [[through]] the streets, and I could [[smell]] the river [[outside]] the station.", "zh": "风穿过街道，我能闻到车站外河水的气味。"}, {"en": "A [[wildfire]] of talk had already crossed the valley before I arrived.", "zh": "我还没到，一阵流言就像野火一样烧过了山谷。"}, {"en": "My [[involvement]] began with a [[manuscript]]: the [[incomplete]] [[history]] of a painter nobody remembered.", "zh": "我的参与始于一份手稿：一位无人记得的画家的残缺历史。"}, {"en": "The [[volume]] had lain in a [[shed]] for decades, and its pages were a [[mess]].", "zh": "那卷手稿在棚屋里放了几十年，书页乱成一团。"}, {"en": "I had to [[wipe]] each page with a soft brush and [[enlarge]] the [[minute]] writing with a lens.", "zh": "我不得不用软刷一页页地擦，再用放大镜把细小的字迹放大。"}, {"en": "The [[grammar]] of his [[sentences|sentence]] was old-fashioned, and some words were simply [[incorrect]].", "zh": "他句子的语法是旧式的，有些词干脆就是错的。"}, {"en": "His [[notion]] of art was [[unique]], and his [[memory]] of the town was [[unsettled]].", "zh": "他对艺术的理解很独特，而他对小镇的记忆却不安定。"}, {"en": "I began a [[blog]] to [[advertise]] the project, though the old poster in the window still used the spelling [[advertize]].", "zh": "我开了博客来宣传这个项目，尽管橱窗里的旧海报仍用 advertize 这个拼法。"}, {"en": "The [[message]] was simple: a small place can [[thrive]] if someone [[notices|notice]] it.", "zh": "要传达的信息很简单：只要有人注意到，小地方也能兴旺。"}, {"en": "The archive room was [[ordinary]], with [[colorful]] labels on one shelf and [[colourful]] posters on another.", "zh": "档案室很普通，一个架子上是彩色的标签，另一个架子上是彩色的海报。"}, {"en": "A [[mouse]] ran along the [[line]] of boxes, and I [[lifted|lift]] my feet.", "zh": "一只老鼠沿着一排箱子跑过，我抬起了脚。"}, {"en": "The [[light]] was [[refreshing]] after the dark [[shed]].", "zh": "在昏暗的棚屋之后，这光线让人精神一振。"}, {"en": "I could [[grasp]] the painter's [[method]] only by reading every [[additional]] note.", "zh": "只有读完每一条附加的注释，我才能领会画家的方法。"}, {"en": "The work was [[time-wasting]] in the best sense, and I [[enjoyed|enjoy]] every hour.", "zh": "这工作从最好的意义上说是耗时的，而我享受每一个小时。"}, {"en": "[[Indeed]], that [[period]] was the happiest of my year.", "zh": "的确，那段时间是我一年中最快乐的日子。"}, {"en": "A [[homogeneous]] row of files gave no hint of the painter's [[advance]] toward colour.", "zh": "一排一模一样的档案，丝毫看不出画家在色彩上的进展。"}, {"en": "Then an [[industrial]] company announced a [[biomass]] plant beside the river, and the town split.", "zh": "接着，一家工业公司宣布要在河边建一座生物质电厂，小镇分裂了。"}, {"en": "The plant would [[overburden]] the roads and [[constrain]] the river.", "zh": "这座电厂会让道路不堪重负，也会束缚这条河。"}, {"en": "Its [[engines|engine]] would run day and night, a new [[wing]] of the plant would [[increase]] the traffic, and the plan, [[overall]], looked [[unsustainable]].", "zh": "它的发动机将昼夜运转；总体来看，这个计划不可持续，而电厂新的一翼还会增加车流。"}, {"en": "An engineer presented a [[fine-grained]] report, but the conclusion was [[inconclusive]].", "zh": "一位工程师提交了一份细致的报告，但结论并不明确。"}, {"en": "The company [[advertised|advertise]] a [[great]] future with [[enormous]] profits.", "zh": "公司宣传了一个利润巨大的美好未来。"}, {"en": "The [[demographics]] showed a town that needed jobs, and the [[income]] gap was widening.", "zh": "人口数据表明小镇需要工作，而收入差距正在扩大。"}, {"en": "To [[refuse]] the plant was risky, and to accept it was [[unjust]] to the families downstream.", "zh": "拒绝电厂有风险，接受它则对下游的家庭不公。"}, {"en": "We formed a [[separate]] group and [[registered|register]] to [[vote]] one by one.", "zh": "我们成立了一个独立的团体，挨家挨户登记投票。"}, {"en": "A [[parliament]] committee would [[receive]] our report and [[send]] a [[forthcoming]] reply.", "zh": "议会的一个委员会将收到我们的报告，并给出一份即将到来的答复。"}, {"en": "The [[police]] had to keep the two sides apart, and a [[serious]] [[fight]] broke out at the gate.", "zh": "警察不得不把双方隔开，而门口爆发了一场严重的冲突。"}, {"en": "The mayor's [[favoritism]] toward the company was obvious, and his [[favouritism]] in hiring was worse.", "zh": "市长对那家公司的偏袒很明显，而他在用人上的徇私更糟。"}, {"en": "A [[banker]] on the committee warned that the town could [[incur]] a debt it could never repay.", "zh": "委员会里的一位银行家警告说，小镇可能背上永远还不清的债。"}, {"en": "The mood was [[bitter]], and [[consequently]] few people listened to reason.", "zh": "气氛苦涩，因此很少有人听得进道理。"}, {"en": "At home my sister was taking [[medicine]] for a dry [[throat]] and [[hormones|hormone]] for a problem with one [[ovary]].", "zh": "家里，我姐姐在吃治嗓子干涩的药，也在为一侧卵巢的问题服用激素。"}, {"en": "The clinic had used a [[semen]] sample, and the wait for news had left her [[unsettled]].", "zh": "诊所使用了一份精液样本，等待消息让她心神不宁。"}, {"en": "I sat with her for a [[minute]] that felt like an hour, watching her spirits [[dip]] and rise.", "zh": "我陪她坐了一分钟，却像一小时，看着她的情绪低落又回升。"}, {"en": "She said the [[thrill]] of hope was worth more than the [[delay]].", "zh": "她说希望带来的激动比拖延更值得。"}, {"en": "Her [[voice]] on the phone was calm, and the news, when it came, was good.", "zh": "她在电话里的声音很平静，而消息传来时是好消息。"}, {"en": "To keep sane I started a [[film]] club in the old [[college]] hall, with a [[curriculum]] of six [[novels|novel]] and their adaptations.", "zh": "为了保持清醒，我在学院的旧礼堂办了一个电影俱乐部，课程是六部小说及其改编电影。"}, {"en": "The first film was based on a [[novel]] that had been [[unknown]] here, and the audience loved it.", "zh": "第一部电影改编自一部在此地默默无闻的小说，观众很喜欢。"}, {"en": "We [[charged|charge]] a [[penny]] for entry, and the [[income]] went to the archive.", "zh": "我们收一便士入场费，收入都归档案室。"}, {"en": "A teacher [[highly]] praised the club and said she would [[like]] to [[engage]] her students.", "zh": "一位教师高度赞扬了这个俱乐部，并说她愿意让自己的学生参与。"}, {"en": "[[Likewise]], the owner of the [[shed]] let us store chairs there.", "zh": "同样，棚屋的主人允许我们把椅子存放在那里。"}, {"en": "The club became a small [[renewal]] for people who felt [[asocial]].", "zh": "这个俱乐部成了那些觉得自己不合群的人的一点更新。"}, {"en": "The old [[history]] spoke of a [[witch]] who lived past the [[horizon]], where the [[unknown]] began.", "zh": "古老的历史讲到一个住在天边之外的女巫，那里是未知开始的地方。"}, {"en": "The church said she had [[blasphemed|blaspheme]] the saints.", "zh": "教会说她亵渎了圣徒。"}, {"en": "Her story was [[unknowable]] in detail, and the evidence was thin.", "zh": "她的故事细节不可知，证据也很单薄。"}, {"en": "I did not [[wish]] to [[blame]] her, and I had no [[need]] to.", "zh": "我不想责怪她，也没有这个必要。"}, {"en": "The [[grave]] by the wall had no name, only a [[tag]] with a [[number]], and a [[limb]] of the old tree hung over it.", "zh": "墙边的坟墓没有名字，只有一块标着数字的标签，老树的一根枝干垂在它上方。"}, {"en": "Some [[notion]] of her survives in the memory of the oldest families, [[though]] nobody can [[find]] the house.", "zh": "关于她的一点观念还留在最年长的人家的记忆里，尽管没人找得到那座房子。"}, {"en": "In April the company tried to [[overcharge]] the town for a [[thorough]] survey.", "zh": "四月，公司试图就一次彻底勘测向小镇索要过高的费用。"}, {"en": "The [[consequence]] was a wave of anger that [[enraged|enrage]] even the [[wise]].", "zh": "后果是一阵怒火，连明智的人也怒了。"}, {"en": "A [[thoughtless]] [[sentence]] in the local paper made the [[fight]] worse, and the [[bite]] of it lasted for weeks.", "zh": "当地报纸上一句欠考虑的话让争斗更糟，那句话的刺痛持续了数周。"}, {"en": "I learned to [[mind]] my words and to [[hold]] my temper.", "zh": "我学会注意自己的言辞，也学会克制脾气。"}, {"en": "[[Unless]] the town could [[overcome]] its own fear, the plant would win.", "zh": "除非小镇能克服自己的恐惧，否则电厂就会赢。"}, {"en": "The [[chance]] of a fair vote was [[nowhere]] in sight.", "zh": "公平投票的机会还无处可见。"}, {"en": "The [[likely]] result was approval, and the true [[enemy]] was apathy.", "zh": "很可能的结果是批准，而真正的敌人是冷漠。"}, {"en": "We had to [[attune]] our message to people who never read a blog.", "zh": "我们必须让信息贴近那些从不看博客的人。"}, {"en": "I set a [[limit]] on my own involvement and tried to [[stem]] my anger.", "zh": "我给自己的参与设了限，并努力遏制怒火。"}, {"en": "The vote was [[over]] before nine, and the plant was refused.", "zh": "投票在九点前结束，电厂被否决了。"}, {"en": "The town chose to [[honor]] the river and, in [[honour]] of the painter, to keep the archive open.", "zh": "小镇选择尊重这条河，并为了纪念那位画家而让档案室继续开放。"}, {"en": "We [[adopted|adopt]] a new rule that any [[industrial]] project must face a public vote.", "zh": "我们通过了一条新规定：任何工业项目都必须经过公众投票。"}, {"en": "The mayor arrived [[overdressed]] for a town meeting, and even his supporters laughed.", "zh": "市长穿着过于正式地来参加镇民大会，连他的支持者都笑了。"}, {"en": "The company said the vote was [[legally]] sound but would be challenged.", "zh": "公司说这次投票在法律上有效，但会被质疑。"}, {"en": "A [[reform]] of the town's [[method]] of [[selling|sell]] land followed.", "zh": "随后小镇对出售土地的方法进行了改革。"}, {"en": "I [[received|receive]] a [[message]] from the painter's family, who had read the blog.", "zh": "我收到了画家家人的消息，他们读过那个博客。"}, {"en": "I began to [[re-evaluate]] the painter's [[birth]] and the [[sense]] of his work.", "zh": "我开始重新评估画家的出身以及他作品的意义。"}, {"en": "They also sent [[grapes|grape]] from their garden and a jar of something [[delicious]], which we ate on the [[grass]].", "zh": "他们还送来自家园子里的葡萄和一罐美味的东西，我们坐在草地上吃掉了。"}, {"en": "His [[wit]] had been sharp and his manners [[fine]], and his letters could [[delight]] a reader.", "zh": "他的机智敏锐，举止优雅，他的信能让读者愉悦。"}, {"en": "The letters filled a second [[volume]], and they helped me [[refer]] to dates I had missed.", "zh": "这些信件又凑成一卷，帮我查到了此前漏掉的日期。"}, {"en": "The exhibition [[enriched|enrich]] the town and gave the young an [[embodiment]] of what patience can build.", "zh": "展览让小镇充实起来，也让年轻人看到耐心能建成什么的一个化身。"}, {"en": "It was a [[delight]] to see the hall full, [[especially]] on a wet Sunday.", "zh": "看到大厅坐满人真是件乐事，尤其是在一个下雨的周日。"}, {"en": "The old poem began with the words come [[hither]], and we printed the line on the wall.", "zh": "那首老诗以“到这里来”开头，我们把这一行印在了墙上。"}, {"en": "The old hall looked almost [[regal]] after the repairs.", "zh": "修缮之后，旧礼堂看起来几乎有几分皇家气派。"}, {"en": "The plant was gone, but the [[void]] it left in the town's confidence would take years to [[fill]].", "zh": "电厂不在了，但它在小镇信心上留下的空洞需要多年才能填满。"}, {"en": "The benefits of the archive now seemed to [[outweigh]] the cost.", "zh": "如今档案室的好处似乎超过了它的成本。"}, {"en": "I wrote my notes on an [[ultra-thin]] laptop that my sister lent me.", "zh": "我把笔记写在我姐姐借给我的超薄笔记本电脑上。"}, {"en": "In the yard a [[cage]] the [[size]] of a cupboard held two hens, and a dog wagged its [[tail]] at me.", "zh": "院子里一只柜子大小的笼子里关着两只母鸡，一条狗朝我摇尾巴。"}, {"en": "A [[horn]] sounded from the road, and a boy [[threw|throw]] a ball that landed at my feet.", "zh": "路上传来一声喇叭，一个男孩把球扔了过来，落在我脚边。"}, {"en": "I [[hooked|hook]] my [[finger]] through the gate and stood there, listening.", "zh": "我把手指钩在门栅上，站在那里听着。"}, {"en": "The moon was [[oval]] above the roof, and the river ran on.", "zh": "月亮呈椭圆形挂在屋顶上方，河水继续流着。"}, {"en": "By winter I had filled three [[volumes|volume]] of notes, and the town had begun to [[redefine]] its own [[history]].", "zh": "到了冬天，我已经记满了三卷笔记，小镇也开始重新定义自己的历史。"}, {"en": "My sister's [[voice]] had lost its worried edge, and her [[lifestyle]] was calmer.", "zh": "我姐姐的声音里少了担忧，她的生活方式也平静了些。"}, {"en": "I [[found|find]] that the [[sense]] of a place comes [[through]] the people who stay, not the ones who leave.", "zh": "我发现一个地方的意义来自留下来的人，而不是离开的人。"}, {"en": "I had stopped trying to [[redefine]] the town and started to [[notice]] what was already there.", "zh": "我不再试图重新定义这个小镇，而是开始留意它本来就有的东西。"}, {"en": "The [[history]] I had come to write was no longer only the painter's.", "zh": "我来写的那段历史，不再只是画家的历史了。"}, {"en": "I had come home for a [[chance]], and I had been given something closer to a [[renewal]].", "zh": "我回家是为了一个机会，却得到了更接近重生的东西。"}]}, {"key": "三星词汇 Day 07 List 14", "words": [{"w": "unlike", "phon": "[ˌʌnˈlaɪk]", "def": "adj.不像…的；不同的prep.不像于；不同于", "si": [71], "dists": [1391, 2147, 2033]}, {"w": "blood", "phon": "[blʌd]", "def": "n.血；血液；血统", "si": [8], "dists": [2294, 2265, 2253]}, {"w": "chase", "phon": "[tʃeɪs]", "def": "v.追逐n.追逐", "si": [18], "dists": [1924, 2215, 1708]}, {"w": "finite", "phon": "[ˈfaɪnaɪt]", "def": "adj.有限的；限定的", "si": [17], "r": "fin(限制)+ite→有限制", "dists": [1087, 2126, 3079]}, {"w": "great-grandparent", "phon": "[ˌɡreɪtˈɡrændˌperənt]", "def": "n.曾祖父或曾祖母；外曾祖父或外曾祖母", "si": [3], "dists": [1424, 498, 22]}, {"w": "horrify", "phon": "[ˈhɔrɪfaɪ]", "def": "v.使恐怖；使震惊", "si": [47], "dists": [3275, 2413, 2128]}, {"w": "mine", "phon": "[maɪn]", "def": "n.矿；地雷pron.我的（东西） v.采矿；埋地雷", "si": [11], "dists": [2365, 2155, 2094]}, {"w": "overfish", "phon": "[ˌəʊvəˈfɪʃ]", "def": "v.捕捞过度", "si": [17], "dists": [3462, 2999, 2316]}, {"w": "perish", "phon": "[ˈperɪʃ]", "def": "v.死；暴卒；毁灭", "si": [39], "dists": [605, 3335, 2666]}, {"w": "sermon", "phon": "[ˈsɜrmən]", "def": "n.布道；说教；讲道", "si": [45], "dists": [2018, 1187, 1700]}, {"w": "thrust", "phon": "[θrʌst]", "def": "v.刺；戳n.推力；刺；戳", "si": [19], "dists": [2739, 2119, 2134]}, {"w": "unmistakable", "phon": "[ˌʌnmɪˈsteɪkəb(ə)l]", "def": "adj.不会弄错的；确定无疑的；清楚明白的", "si": [2], "dists": [2046, 2238, 1886]}, {"w": "wonder", "phon": "[ˈwʌndər]", "def": "n.惊奇；奇迹v.惊讶；想知道；怀疑", "si": [1], "dists": [2407, 2344, 1717]}, {"w": "board", "phon": "[bɔrd]", "def": "n.板；董事会v.上 02, 1518]}, {"w": "pollute", "phon": "[pəˈt]", "def": "v.污染", "si": [42], "dists": [3190, 2231, 2097]}, {"w": "recently", "phon": "[s(ə)ntli]ˈri", "def": "adv.最近；近来", "si": [1], "dists": [2232, 479, 683]}, {"w": "shine", "phon": "[ʃaɪn]", "def": "v.照耀；发光；闪耀", "si": [69], "dists": [2907, 3319, 2627]}, {"w": "south-western", "phon": "[ˌsaʊθˈwestərn]", "def": "adj.西南的", "si": [1], "dists": [3121, 3117, 1755]}, {"w": "tip", "phon": "[tɪp]", "def": "n.小费；提示；窍门；建议；尖端v.给…小费", "si": [31], "dists": [1571, 2416, 1047]}, {"w": "uncomfortable", "phon": "[ʌnkʌmfətəb(ə)l]ˈ", "def": "adj.使人不舒服的；感到难受的；不自在的", "si": [29], "dists": [8, 2216, 1745]}, {"w": "win-win", "phon": "[ˌwɪnˈwɪn]", "def": "adj.双赢的", "si": [82], "dists": [2725, 2005, 1995]}, {"w": "agree", "phon": "[əˈɡri]", "def": "v.同意；赞成", "si": [81], "dists": [2203, 2190, 2252]}, {"w": "cue", "phon": "[kju]", "def": "n.提示；信号；暗号v.给提示", "si": [71], "dists": [1837, 1732, 960]}, {"w": "fellow", "phon": "[ˈfeləʊ]", "def": "n. （组织的）会员；家伙；同事；同胞adj.同类的；同事的", "si": [4], "dists": [2563, 2483, 2492]}, {"w": "maybe", "phon": "[ˈmeɪbi]", "def": "adv.大概；或许", "si": [72], "dists": [1791, 1113, 1077]}, {"w": "slipup", "phon": "[ˈslɪpˌʌp]", "def": "n.错误", "si": [62], "dists": [2927, 2777, 3249]}, {"w": "main", "phon": "[meɪn]", "def": "adj.主要的；最重要的", "si": [4], "dists": [1166, 2450, 2179]}, {"w": "tight", "phon": "[taɪt]", "def": "adj.紧的adv.紧紧地", "si": [4], "dists": [3499, 3186, 2657]}, {"w": "furthermore", "phon": "[ˌfɜrðərˈmɔr]", "def": "adv.而且；此外", "si": [72], "dists": [2546, 3381, 2089]}, {"w": "hail", "phon": "[heɪl]", "def": "n.冰雹v.下冰雹；呼喊；欢呼；把…誉为", "si": [73], "dists": [1361, 1073, 1013]}, {"w": "zone", "phon": "[zəʊn]", "def": "n.地带；地区v.分成区", "si": [40], "dists": [972, 3390, 2915]}, {"w": "mayor", "phon": "[ˈmeɪər]", "def": "n.市长", "si": [33], "dists": [1036, 1457, 2647]}, {"w": "centrepiece", "phon": "[ˈsentərpis]", "def": "n.中心装饰品；最重要的项目（或物品）", "si": [7], "dists": [334, 15, 305]}], "sents": [{"en": "The [[fortnightly]] ferry to Grey Harbour smelled of diesel and wet rope, and I stood at the rail with the other [[passengers|passenger]], watching the [[island]] rise out of the morning mist.", "zh": "开往格雷港的渡轮每两周才有一班，船上满是柴油和湿绳子的味道；我和其他乘客一起站在栏杆边，看着小岛从晨雾里升起来。"}, {"en": "I had left the [[south-western]] coast [[recently]] enough that the place still felt familiar, yet I felt no [[nostalgia]] for it, only a mild [[wonder]] at how small it was.", "zh": "我离开西南海岸还没多久，这地方看上去依旧熟悉，可我对它并没有怀旧之情，只觉得有点惊讶：它竟然这么小。"}, {"en": "Five years in the city had made the town feel [[tiny]]; the same [[grey]] water, the same roofs, the same [[unmistakable]] smell of salt.", "zh": "在城里待了五年，小镇显得格外小；还是那片灰色的海水，还是那些屋顶，还是那股绝不会认错的咸味。"}, {"en": "My [[great-grandmother|great-grandparent]] would turn ninety on Sunday, and every branch of the [[household]] was coming home for it.", "zh": "我的曾祖母周日就满九十岁了，家里每一房的人都要回来。"}, {"en": "A [[fellow]] biologist from the [[workstation]] waved from the pier, and I [[greeted|greet]] him with a [[tight]] hug before we walked up the [[main]] street.", "zh": "工作站的一位同行在码头上朝我挥手，我紧紧抱了他一下，然后我们一起走上主街。"}, {"en": "Her [[house]] had not changed: the low ceiling, the [[fireplace]] with last night's [[fire]] still breathing, the same smell of wood smoke.", "zh": "她的房子一点没变：低矮的天花板，壁炉里昨晚的火还在喘着气，空气里还是那股柴烟味。"}, {"en": "She sat in an [[upholstered]] chair that was older than I was and [[comfortable]] in a way no new furniture is.", "zh": "她坐在一把比我还老的软垫椅子上，那种舒服是任何新家具都给不了的。"}, {"en": "The only [[adornment]] on the wall was a faded photograph of the mine, and the [[centrepiece]] of the room was a table she had polished for sixty years.", "zh": "墙上唯一的装饰是一张褪色的矿场照片，而房间的正中央摆着一张她擦了六十年的桌子。"}, {"en": "At ninety her [[age]] was written in her hands, but her [[blood]] still ran warm and quick, and a faint [[tint]] of rouge sat on her cheeks.", "zh": "九十岁的年纪都写在她手上，可她的血依然温热急促，脸颊上还留着一层淡淡的胭脂色。"}, {"en": "She studied my face as if reading a [[list]] of everything I had failed to write to her about.", "zh": "她端详着我的脸，像是在读一张清单，上面写满我没给她写信说的事。"}, {"en": "After tea she opened an album and pointed to a girl in a [[miniskirt]] standing beside a [[horse]], one hand on the [[reins|rein]].", "zh": "喝过茶，她翻开相册，指着一个穿迷你裙的姑娘，姑娘站在一匹马旁边，一只手扶着缰绳。"}, {"en": "That girl was my mother, and the [[bole]] of the tree behind her had been cut down the year the [[mine]] closed.", "zh": "那姑娘是我母亲，她身后那棵树的树干，在矿场关闭那年被砍掉了。"}, {"en": "In the next photograph a [[group]] of men stood at the pit head, and no one could [[deny]] that the work had broken their backs.", "zh": "下一张照片里，一群男人站在矿井口，谁也不能否认那份活儿压弯了他们的背。"}, {"en": "Great-grandfather had [[toiled|toil]] in the [[shaft]] for thirty years, and a single [[collapse]] had taken eleven men.", "zh": "曾祖父在矿井里苦干了三十年，一次塌方就带走了十一个人。"}, {"en": "She spoke of [[childbirth]] too, of her own mother dying young, and then she [[ceased|cease]] and looked out of the window.", "zh": "她也说起生孩子的事，说起她自己的母亲年纪轻轻就走了，然后她停住话头，望向窗外。"}, {"en": "[[Five|five]] names were [[depicted|depict]] in the margin, and she had watched each of their children [[grow]].", "zh": "页边写着五个名字，她看着他们的孩子一个个长大。"}, {"en": "At the harbour the [[fish]] market was already busy, and the smell of [[boiling|boil]] crab shells hung over the [[flagstones|flagstone]].", "zh": "港口的海鱼市场已经忙起来了，煮蟹壳的味道飘在石板路上。"}, {"en": "The old fishermen said the bay had been [[overfished|overfish]] for a decade, and each season the [[finite]] catch grew smaller.", "zh": "老渔民说这片海湾被过度捕捞了十年，每一季能捕到的鱼都更少，数量有限得让人心里发慌。"}, {"en": "A [[hound]] [[chased|chase]] a [[chick]] across the road, and a young man in rubber [[boots|boot]] pulled it back by the collar.", "zh": "一条猎犬追着一只小鸡跑过马路，一个穿胶靴的年轻人拽着项圈把它拉了回去。"}, {"en": "They [[served|serve]] hot soup from a [[booth]] near the quay, and I ate standing up, [[chewing|chew]] slowly while the wind [[thrust]] my hair into my eyes.", "zh": "码头边的摊亭卖热汤，我站着吃，慢慢嚼着，风把我的头发直往眼睛里戳。"}, {"en": "A [[linguist]] from the university was recording the old dialect, and she said the word for [[shedder]] crab would die with my grandmother's generation.", "zh": "一位大学来的语言学家在录当地方言，她说脱壳期虾的那个词，会随着我祖母那一代人一起消失。"}, {"en": "Nobody mentioned the plant, but the word passed from mouth to mouth like a [[warning]], and the [[ground]] under our feet felt less solid than it looked.", "zh": "没人提起那座工厂，可这个词从一张嘴传到另一张嘴，像一句警告，脚下的地面也显得没那么结实了。"}, {"en": "My own [[workstation]] in the city was stacked with [[data]] on fish [[tissue]], and I had come home with a simple [[mission]]: to measure how fast the bay could recover.", "zh": "我在城里的工作站堆满了鱼组织的数据，我这次回家只带着一个简单的任务：测出这片海湾多快能恢复。"}, {"en": "Our [[dean]] had signed the [[fee]] agreement, and the [[ethical]] review had taken a year.", "zh": "院长签了费用协议，伦理审查又花了一年。"}, {"en": "The [[chemical]] plant upstream had been [[overfunded|overfund]] by a [[misguided]] grant, and its celebrated [[breakthrough]] existed mostly on paper.", "zh": "上游那家化工厂曾被一个错误的拨款项目过度投资，它大肆宣传的突破大多只存在于纸面上。"}, {"en": "I had [[first-hand]] evidence that the water was cleaning itself, and that seemed a small [[miracle]].", "zh": "我有第一手的证据表明水正在自我净化，那几乎像个小奇迹。"}, {"en": "[[Hopefully]] the council would listen to a [[local]] scientist rather than to a [[diplomat|diplomacy]] from the capital.", "zh": "但愿议会肯听一位本地科学家的话，而不是听首都来的外交官。"}, {"en": "Back in the lab, the [[inefficiency]] of the old [[workplace]] was obvious, and we spent a week [[disassembling|disassemble]] a [[conveyor]] built for [[oversize]] crates.", "zh": "回到实验室，旧工作场所的低效一目了然：我们花了一周拆掉一条为超大号箱子设计的传送带。"}, {"en": "Only then would the [[basic]] samples [[fit]] on the bench.", "zh": "只有这样，基本的样本才放得下台面。"}, {"en": "On Monday I walked to the [[dentist]] because a filling had come loose on the ferry, and the chair was as [[uncomfortable]] as I remembered.", "zh": "周一我去看牙医，因为一个补牙的填充物在渡轮上松了，那张椅子还是和我记忆里一样难受。"}, {"en": "The light above my [[nose]] was too bright to let me [[check]] my watch, and he gave me a [[liquid]] to rinse with.", "zh": "我鼻子上方的灯太亮，让我没法看表，他给了我一瓶漱口液。"}, {"en": "He told me not to [[chew]] on that side for a day and gave me a [[tip]]: [[over-the-counter]] painkillers were enough.", "zh": "他让我一天别用那边嚼东西，还给了我一个建议：非处方止痛药就够了。"}, {"en": "It was [[unnecessary]] to [[tire]] myself with worry, he said, and [[sadly]] he was [[partly]] right.", "zh": "他说没必要为这事把自己弄累，可惜他说得只对了一半。"}, {"en": "That evening the town hall was full because the [[mayor]] had called a meeting about the plant.", "zh": "那天晚上镇公所坐满了人，因为市长召集了一场关于工厂的会。"}, {"en": "A [[poll]] in the local paper said the town was split, and the [[agenda]] on every seat was printed in red.", "zh": "本地报纸的民调说小镇分裂成了两半，每张座位上的议程都印成了红色。"}, {"en": "A [[lobbyist|lobby]] for the company, a smooth [[executive]] in a grey suit, tried to [[persuade]] us that the plant was safe.", "zh": "公司派来的说客是个穿灰西装的圆滑高管，他试图说服我们工厂是安全的。"}, {"en": "He was visibly [[hostile]] to questions, and his answers were full of [[misinformation]] and [[groundless]] claims.", "zh": "他对提问明显充满敌意，回答里全是错误信息和毫无根据的说法。"}, {"en": "The [[minister]] from the regional government [[denied|deny]] that any [[indirect]] [[link]] existed between the plant and the dead fish.", "zh": "地区政府的部长否认工厂和死鱼之间存在任何间接联系。"}, {"en": "The [[chief]] engineer was the only [[person]] on the panel willing [[to]] answer questions directly.", "zh": "总工程师是唯一一个愿意直接回答问题的人。"}, {"en": "An old miner rose and said that the first [[boom]] had lasted fifteen years, and that the river had begun to [[perish]] after the first spill.", "zh": "一位老矿工站起来说，第一轮繁荣持续了十五年，而河流在第一次泄漏之后就开始死去了。"}, {"en": "He was [[aghast]] that the company wanted to [[overstep]] the [[boundary]] of the old industrial [[zone]].", "zh": "他惊骇的是，公司竟想越过老工业区的边界。"}, {"en": "Beyond it lay the marsh, a [[border]] between land and water where [[worms|worm]] and young fish hid.", "zh": "边界之外是沼泽，是水与陆之间的地带，蠕虫和幼鱼都藏在那里。"}, {"en": "If the plant [[polluted|pollute]] that nursery, the whole bay would suffer, for some fish change [[sex]] as they mature and need calm water to reach [[sexual]] maturity.", "zh": "如果工厂污染了那片育幼场，整个海湾都会遭殃，因为有些鱼长大时会变性，需要平静的水域才能达到性成熟。"}, {"en": "For years the old workings had lain [[dormant]], and the company's [[founder]] had promised to leave them alone; the promise now looked like a form of [[guardianship]] nobody had asked for.", "zh": "旧矿坑已经休眠多年，公司的创办人曾承诺不去碰它；如今这个承诺看起来像一种没人要求的监护。"}, {"en": "Silence [[reigned|reign]] after he sat down.", "zh": "他坐下后，全场一片沉默。"}, {"en": "Then she told me about the winter of the flood, when a visiting preacher had delivered a [[sermon]] on patience and the town had lost its boats anyway.", "zh": "然后她讲起洪水那年的冬天，一位来访的牧师讲了一篇关于忍耐的布道，可小镇的船还是全没了。"}, {"en": "She said her husband had been a man of few [[words|word]] who [[embodied|embody]] [[adherence]] to a promise.", "zh": "她说她丈夫是个话很少的人，却用一生体现了对承诺的坚守。"}, {"en": "What [[horrified|horrify]] her was not the storm but the way officials spoke about it afterwards.", "zh": "让她恐惧的不是风暴，而是事后官员们谈论风暴的方式。"}, {"en": "Her [[diplomacy]] at the dinner table had kept a divided family [[together]] for fifty years.", "zh": "她在饭桌上的周旋手腕，让一个分裂的家族五十年都聚在一起。"}, {"en": "I wanted to [[cheer]] her, but she only [[shook|shake]] her head and smiled.", "zh": "我想让她高兴起来，她只是摇摇头笑了笑。"}, {"en": "On the day of the vote the [[flag]] above the school hung at half-mast for a fisherman lost at sea.", "zh": "投票那天，学校上方的旗为一个葬身大海的渔民降了半旗。"}, {"en": "People queued across the flagstones to the booth, and the queue itself was [[strikingly]] quiet.", "zh": "人们排着队走过石板路去投票亭，队伍本身安静得惊人。"}, {"en": "The result was not [[unanimous]], but the plant was [[rejected|reject]] by a clear majority.", "zh": "结果并不是全体一致，但工厂被明显的多数否决了。"}, {"en": "The square became [[lively]]; each [[individual]] had a face I half knew, and the [[huge]] crowd seemed [[unstoppable]] for a minute.", "zh": "广场一下子活了，每个人的脸我都隐约认得，巨大的人群有一刻像是不可阻挡的。"}, {"en": "The fight was not only about fish; it was about a [[workforce]] that had been [[marginalized]] for a generation.", "zh": "这场争斗不只是关于鱼，它关乎一整代被边缘化的劳动力。"}, {"en": "Tourism and [[retail]] had replaced the old [[industry]], and the [[inequality]] between summer visitors and winter residents was plain.", "zh": "旅游业和零售业取代了旧工业，夏天来的游客和冬天留下的居民之间的不平等一目了然。"}, {"en": "Fishermen could not [[insure]] their boats for a season without a loan, and it was [[unrealistic]] to ask them to wait.", "zh": "渔民没有贷款就买不起一整季的保险，要他们干等是不切实际的。"}, {"en": "The company had tried to [[cheat]] the town with a [[baseless]] survey, and its figures [[overlapped|overlap]] suspiciously with the ones it had published before.", "zh": "公司曾想用一份毫无根据的调查蒙骗小镇，而它的数字与之前公布的数字可疑地重叠。"}, {"en": "Any deal would [[entail]] a [[setback]] for the company, and the town should not [[discriminate]] between small boats and large ones.", "zh": "任何协议都会让公司受挫，而小镇也不该在大船和小船之间区别对待。"}, {"en": "A small [[boost]] to the harbour budget might [[settle]] more than a grand plan.", "zh": "港口预算的一点增加，也许比一个宏大计划更能解决问题。"}, {"en": "The company's report was [[unreliable]] and largely [[untested]], and its [[title]] promised more than the data showed.", "zh": "公司的报告不可靠，而且大部分未经检验，它的标题承诺的比数据能证明的多。"}, {"en": "A common [[misconception]] was that the sea could absorb anything; the [[literal]] truth was that it could not.", "zh": "一个常见的误解是海能吸收一切；照字面理解，真相是它不能。"}, {"en": "We should not [[overrate]] a single [[slipup]], but we should not [[overlook]] a pattern either.", "zh": "我们不该高估一次失误，但也不该忽视一种模式。"}, {"en": "The survey was [[outdated]] and its authors [[inexperienced]], yet a crowd of [[unreflecting]] readers took it as gospel.", "zh": "那份调查已经过时，作者也没有经验，可一群不假思索的读者把它当成了真理。"}, {"en": "When the council [[announced|announce]] the rejection, the company threatened to sue, then quietly withdrew.", "zh": "议会宣布否决后，公司威胁要起诉，随后又悄悄撤回了。"}, {"en": "That night my aunt [[hosted|host]] a dinner of [[boiled|boil]] fish and [[green]] vegetables, and the table was loud with [[chatter]].", "zh": "那天晚上姨妈做东，煮了鱼和青菜，桌上满是闲聊声。"}, {"en": "My cousin [[entertained|entertain]] us with stories of her first year as a teacher, and her [[enthusiasm]] was infectious.", "zh": "表姐讲她当老师第一年的故事，逗得我们直笑，她的热情很有感染力。"}, {"en": "My great-grandmother [[chatted|chat]] with the youngest [[child]] and let him [[grip]] her finger.", "zh": "曾祖母和最小的孩子聊天，让他握住自己的手指。"}, {"en": "The [[recent]] argument was forgotten for an hour, and the [[bond]] between the generations felt stronger than any vote.", "zh": "最近的争吵被忘了一个小时，几代人之间的纽带显得比任何投票都牢固。"}, {"en": "After dinner I sat in the [[shade]] of the porch and watched the lighthouse [[shine]] across the bay.", "zh": "晚饭后我坐在门廊的阴影里，看灯塔的光扫过海湾。"}, {"en": "My phone buzzed: the new sensor data had arrived, and I opened the [[app]] to read it.", "zh": "手机震了一下：新的传感器数据到了，我打开应用查看。"}, {"en": "[[Unlike]] the old paper log, the screen showed every tide minute by minute, and a [[cue]] told me the sampler was still working.", "zh": "和旧的纸质日志不同，屏幕上一分钟一分钟地显示潮汐，一个提示告诉我采样器还在工作。"}, {"en": "[[Maybe]] the town could live with the sea rather than against it; [[furthermore]], it might even profit from doing so.", "zh": "也许小镇可以和海共处而不是与海为敌；而且，这样做甚至可能获利。"}, {"en": "Then [[hail]] began to rattle on the roof, small and hard, and I thought of the [[minor]] repairs still undone.", "zh": "接着冰雹开始敲打屋顶，又小又硬，我想到那些还没修的小毛病。"}, {"en": "The [[work]] of persuasion would go on [[worldwide]] and at home, and I wondered whether I had already [[outgrown|outgrow]] the town or only begun to see it.", "zh": "说服的工作会在全世界、也会在家门口继续，我不知道自己是已经长大了、离开了小镇，还是才刚刚开始看见它。"}, {"en": "On Tuesday I [[boarded|board]] the ferry again, and this time I did not [[miss]] the island as I had before.", "zh": "周二我又登上了渡轮，这一次我不像从前那样想念这座岛了。"}, {"en": "The town would [[depend]] on the next council, and the council would depend on people who bothered to attend.", "zh": "小镇将取决于下一届议会，而议会取决于那些愿意到场的人。"}, {"en": "I could [[envisage]] a smaller plant, a cleaner river, and a school that taught children to fish with care.", "zh": "我能设想一座更小的工厂、一条更清的河，还有一所教孩子小心捕鱼的学校。"}, {"en": "[[Human]] beings are [[inescapably]] part of the ecosystem, not visitors to it.", "zh": "人类不可避免地是生态系统的一部分，而不是它的访客。"}, {"en": "As the boat [[entered|enter]] the channel, the [[world]] outside the bay seemed less urgent than the one I was leaving.", "zh": "船驶入航道时，海湾之外的那个世界似乎没有我正要离开的这个世界紧迫。"}, {"en": "I would stay [[until]] the last of the summer, and then come back.", "zh": "我会待到夏天结束，然后再回来。"}, {"en": "My great-grandmother [[agreed|agree]] to come to the city for the winter, on one condition: that I bring her back in spring.", "zh": "曾祖母同意冬天去城里住，只有一个条件：春天我得把她送回来。"}, {"en": "It was a [[win-win]] arrangement, she said, and for once nobody laughed at the phrase.", "zh": "她说这是个双赢的安排，这一次没人对这个说法发笑。"}]}, {"key": "三星词汇 Day 08 List 15", "words": [{"w": "flavor", "phon": "[ˈfleɪvər]", "def": "n.风味；味道；特色v.给…调味", "si": [71], "dists": [2373, 1615, 1616]}, {"w": "flavour", "phon": "[ˈfleɪvər]", "def": "n.风味；滋味；味道v.给…添风味；调味", "si": [71], "dists": [2372, 1616, 1615]}, {"w": "guard", "phon": "[ɡɑrd]", "def": "n.保卫；警卫v.守卫；警戒", "si": [7], "dists": [877, 1088, 119]}, {"w": "laboratory", "phon": "[ˈlæbrətɔri]", "def": "n.实验室", "si": [13], "dists": [1556, 29, 221]}, {"w": "locate", "phon": "[ˈləʊkeɪt]", "def": "v.位于；查找…的地点；确定…的位置；使坐落于", "si": [0], "dists": [2328, 1231, 670]}, {"w": "mislead", "phon": "[ˌmɪsˈd]", "def": "v.误导", "si": [66], "dists": [2389, 2348, 3229]}, {"w": "shame", "phon": "[ʃeɪm]", "def": "n.羞愧；羞耻v.使丢脸；使羞愧", "si": [23], "dists": [2452, 2403, 2392]}, {"w": "upright", "phon": "[ˈʌpraɪt]", "def": "adj.直立的；竖直的；正直的；诚实的adv.笔直地", "si": [64, 76], "dists": [2969, 3186, 3277]}, {"w": "worse", "phon": "[wɜrs]", "def": "adv.更糟；更坏adj.更坏的；更糟糕的； “bad”的比较级", "si": [61], "dists": [1043, 2191, 2602]}, {"w": "ahead", "phon": "[əˈhed]", "def": "adv.提前；在前", "si": [62], "dists": [1493, 2549, 3438]}, {"w": "born", "phon": "[bɔrn]", "def": "adj.出生的；天生的v.生（孩子）； “bear”的过去分词", "si": [27], "dists": [2540, 2253, 1378]}, {"w": "China", "phon": "[ˈtʃaɪnə]", "def": "n.中国", "si": [1], "dists": [1212, 3101, 2187]}, {"w": "deride", "phon": "[dɪˈraɪd]", "def": "v.嘲弄；嘲笑", "si": [26], "dists": [1470, 633, 2791]}, {"w": "flaw", "phon": "[flɔ]", "def": "n.瑕疵；缺陷；裂痕v.使有裂纹；使有缺陷", "si": [16], "dists": [2483, 2309, 730]}, {"w": "guesswork", "phon": "[ˈɡeswɜrk]", "def": "n.猜测；猜想", "si": [58], "dists":  864]}, {"w": "iconic", "phon": "[aɪˈkɑnɪk]", "def": "adj.图像的；肖像的；偶像的", "si": [51], "dists": [3009, 1552, 207]}, {"w": "anniversary", "phon": "[rsəri]ˌænɪˈvɜ", "def": "n.周年纪念日", "si": [51], "r": "anni(年)+vers(转)+ary→一年转一回", "dists": [2742, 2196, 517]}, {"w": "malpractice", "phon": "[ˌmælˈpræktɪs]", "def": "n.玩忽职守；治疗失当；营私舞弊", "si": [46], "dists": [3330, 30, 2860]}, {"w": "accrue", "phon": "[əˈkru]", "def": "v.自然增加；积累", "si": [47], "dists": [420, 480, 1379]}, {"w": "insidious", "phon": "[ɪnˈsɪdiəs]", "def": "adj.阴险的；潜伏的；暗中为害的", "si": [77], "dists": [2283, 699, 771]}], "sents": [{"en": "The bus left me at the edge of a town I could barely [[locate]] on the map, with [[mist]] on the hills and a [[path]] down to the [[shore]].", "zh": "公共汽车把我放在一个我几乎在地图上定位不了的小镇边上，山间有雾，一条小路向下通往海岸。"}, {"en": "I had come from [[China]] to translate a [[Spanish]] novel, and the house I had rented belonged to a [[housewife]] who welcomed me with the [[informality]] of an old friend.", "zh": "我从中国来，是为了翻译一部西班牙小说；我租的房子属于一位家庭主妇，她用老朋友般的随和迎接我。"}, {"en": "She showed me to a [[cubicle]] under the stairs, with a [[shelf]], a [[pretty]] window on the yard, and a [[low]] bed that creaked.", "zh": "她把我领到楼梯下的一个小隔间，那里有一个架子、一扇能看见院子的漂亮窗户，还有一张吱呀作响的低矮床铺。"}, {"en": "The room was [[remote]] from the town's noise, and for the first time in months I felt I could [[relax]].", "zh": "房间离镇上的喧闹很远，几个月来我第一次觉得自己能放松下来。"}, {"en": "[[Despite]] the dust, the [[area]] beyond the last street was [[alive]] with [[flowers|flower]].", "zh": "尽管尘土飞扬，最后一条街之外的这片区域却满是鲜花，生机勃勃。"}, {"en": "A farmer was [[shearing|shear]] a sheep beside the cottage I had [[borrowed|borrow]] for the summer.", "zh": "一个农夫正在我租来度夏的小屋旁给一只羊剪羊毛。"}, {"en": "In the morning I walked to the [[archaeological]] dig above the bay, where a team was uncovering a [[century]]-old fishing village.", "zh": "早晨我走到海湾上方的考古工地，那里有一支队伍正在挖掘一座百年渔村。"}, {"en": "A [[guard]] at the gate checked my name, handed me a first-[[aid]] kit, and pointed to a [[circle]] of stones that had once been a hearth.", "zh": "门口的警卫核对了我的名字，递给我一个急救包，然后指给我看一圈曾经是火塘的石头。"}, {"en": "The grant had [[enabled|enable]] the dig to continue, and a [[model]] of the old village stood in the site hut.", "zh": "这笔拨款让发掘得以继续，工地的小屋里摆着旧村的模型。"}, {"en": "Under the soil I found a [[lump]] of rusted iron and a [[chunk]] of [[shell]] that the [[tools|tool]] had cut cleanly.", "zh": "在土里，我找到一块锈铁和一片被工具切得整整齐齐的贝壳。"}, {"en": "My camera [[lens]] could [[detect]] markings no eye could see, and the bay itself was [[inhabited|inhabit]] by a small, rare fish.", "zh": "我的镜头能拍出肉眼看不见的痕迹，而这片海湾里生活着一种稀有的小鱼。"}, {"en": "Every [[object]] had to be [[logged|log]] before it was moved.", "zh": "每一件物品在移动前都必须登记。"}, {"en": "The dig was a [[branch]] of a larger project, and we had to [[traverse]] a narrow path to reach it each morning.", "zh": "这次发掘只是一个更大项目的一个分支，每天早上我们都得走一条窄路才能到达。"}, {"en": "That afternoon I visited the [[laboratory]] where a friend was studying a [[hybrid]] fish and its [[chromosomes|chromosome]].", "zh": "那天下午我去了实验室，一位朋友正在研究一种杂交鱼和它的染色体。"}, {"en": "She explained how [[toxic]] algae could [[infest]] a bay and how the [[frequency]] of blooms had risen [[sharply|sharp]].", "zh": "她解释说，有毒藻类会大批滋生、覆盖整个海湾，而藻华出现的频率急剧上升。"}, {"en": "Her team tried to [[isolate]] the cause with [[maximal]] care and almost no money.", "zh": "她的团队试图以最大的谨慎分离出病因，而经费几乎为零。"}, {"en": "Their [[focus]] was a [[flaw]] in the [[design]] of the sampling net, which let small fish escape and made every count unreliable.", "zh": "他们关注的是采样网设计上的一个缺陷，它让小鱼逃走，使每次计数都不可靠。"}, {"en": "Standing there, I felt the [[urge]] to [[write]] everything down, and my [[brain]] began to [[shape]] a chapter.", "zh": "站在那里，我突然很想把一切写下来，我的脑子开始构思一个章节。"}, {"en": "On Saturday the beach [[alarm]] rang twice, and a [[shark]] was seen beyond the buoys.", "zh": "星期六，海滩的警报响了两次，有人在浮标之外看见了一条鲨鱼。"}, {"en": "The reaction was close to [[hysteria]]: people screamed, a woman dropped her towel, and two boys [[floated|float]] [[recklessly]] on a raft, unaware.", "zh": "人们的反应近乎歇斯底里：有人尖叫，一个女人丢下毛巾，两个男孩还毫不知情地坐在筏子上漂着。"}, {"en": "A [[brave]] lifeguard paddled out with a [[lure]] and turned the fish away from the [[shore]].", "zh": "一名勇敢的救生员划着桨出去，用诱饵把那条鱼引离海岸。"}, {"en": "Sharks rarely [[prey]] on people, but fear does not need [[logic]].", "zh": "鲨鱼很少以人为食，但恐惧并不需要逻辑。"}, {"en": "On Sunday I went into the old [[church]] on the hill, not out of [[religion]] but out of curiosity, and looked up at the carved [[Christ]] above the door.", "zh": "星期天我走进山上的老教堂，不是为了宗教，而是出于好奇，我抬头看门上方那尊雕刻的基督像。"}, {"en": "The sermon was about [[shame]] and [[guilt]], and the priest said that no one was [[unworthy]] of [[esteem]].", "zh": "布道讲的是羞耻与罪疚，神父说没有谁不配得到尊重。"}, {"en": "I thought of the [[ideology]] behind such words, and of the [[utopia]] that every generation builds and loses.", "zh": "我想着这些话背后的意识形态，也想着每一代人都建起又失去的乌托邦。"}, {"en": "A woman near me began to [[moan]] softly, and someone helped her outside.", "zh": "我身边的一个女人开始低声呻吟，有人把她扶了出去。"}, {"en": "The [[modern]] world [[misunderstands|misunderstand]] such places, I thought, and [[derides|deride]] what it cannot [[use]].", "zh": "我想，现代世界误解了这样的地方，并嘲笑它无法使用的东西。"}, {"en": "My landlady's daughter had a new [[infant]], [[born]] three weeks early, and the whole street took turns holding him.", "zh": "房东的女儿生了个早产三周的婴儿，整条街的人轮流抱他。"}, {"en": "His [[hunger]] was enormous; he cried until his face turned red, then fed and slept.", "zh": "他的饥饿感大得惊人；他会哭到脸通红，然后吃奶、睡觉。"}, {"en": "His first [[tooth]] had not come, and his grandmother, [[infirm]] and slow, sang to him in a dialect I could not follow.", "zh": "他的第一颗牙还没长出来，他虚弱而迟缓的祖母用我听不懂的方言给他唱歌。"}, {"en": "She said that in her day a housewife had no time to be tired, and that [[love]] was mostly work.", "zh": "她说在她那个年代，家庭主妇没时间喊累，而爱多半就是干活。"}, {"en": "I held him for an hour, and for once I [[felt|feel]] no [[hurry]].", "zh": "我抱了他一个小时，那一刻我第一次不觉得着急。"}, {"en": "The town's [[president]] had called a meeting about the new road [[toll]], and the debate turned into a [[battle]].", "zh": "镇长召集了一场关于新过路费的会议，讨论很快变成了一场战斗。"}, {"en": "A group of [[motorists|motorist]] in a [[chrome]]-trimmed car threatened a [[boycott]] of the ferry company.", "zh": "一群开着一辆镀铬汽车的车主威胁要抵制渡轮公司。"}, {"en": "They said the [[levy]] would fall on locals, [[because]] tourists never paid it.", "zh": "他们说新的征费会落在本地人身上，因为游客从来不用付。"}, {"en": "Older residents said the [[dearth]] of parking was the real [[downside]], and that the council should [[maintain]] the [[guidelines|guideline]] it had published.", "zh": "年长的居民说，真正的坏处是停车位短缺，议会应该维持它已经公布的准则。"}, {"en": "The argument drifted to [[Brexit]] and [[sanctions|sanction]], then to [[trade]], and [[therefore]] to everything else.", "zh": "争论飘到英国脱欧和制裁，又飘到贸易，因此飘到了一切。"}, {"en": "Someone joked about [[espionage]], and the [[inhuman]] speed of the vote made the joke feel true.", "zh": "有人拿间谍活动开玩笑，而表决快得没有人性，让这个玩笑像是真的。"}, {"en": "No one was [[allowed|allow]] to speak for more than two minutes, [[despite]] the heat, and the [[dirty]] little [[misuse]] of a public [[task]] was plain to all.", "zh": "没有人被允许发言超过两分钟，尽管天气炎热，而那桩肮脏的小小滥用公职，大家都看得明白。"}, {"en": "That night a [[chill]] came off the water, and clouds began to [[loom]] over the bay.", "zh": "那天夜里，水面上来了一阵寒意，云开始在海湾上方逼近。"}, {"en": "We took [[shelter]] in a house she had [[inherited|inherit]] from her mother, and the storm [[broke|break]] with a noise like a [[ship]] hitting the dock.", "zh": "我们躲进她母亲留给她的房子里，暴风雨炸开时，声音像一艘船撞上码头。"}, {"en": "Water [[flowed|flow]] down the hill and [[escaped|escape]] through a broken drain.", "zh": "水顺着山坡流下，从一条破裂的排水管里溢了出去。"}, {"en": "The [[alarm]] rang again, but this time it was only the wind.", "zh": "警报又响了，但这次只是风。"}, {"en": "By midnight the sky was clear, and the [[mist]] had lifted.", "zh": "到午夜天已放晴，雾也散了。"}, {"en": "On Monday a fisherman was brought in with a deep [[wound]] in his arm, [[hurt]] by a [[tractor]] chain and [[unshaven|shave]] for days.", "zh": "周一，一个渔民被送来，手臂上有一道很深的伤口，是拖拉机链条弄伤的，他好几天没刮胡子了。"}, {"en": "The doctor on the night [[shift]] was young but careful, and he found an [[error]] in the first [[definition]] of the injury.", "zh": "值夜班的医生年轻但细心，他发现了最初对伤情的判断中的错误。"}, {"en": "There were rumours of [[malpractice]] at another clinic, where a [[low-level]] nurse had been left alone with [[infirm]] patients, and a mask was their only [[shield]].", "zh": "另一家诊所有玩忽职守的传言，一个低级护士被独自留下照看虚弱的病人，口罩是他们唯一的屏障。"}, {"en": "The [[toll]] of such stories [[accrues|accrue]] slowly, and people [[remember]] them long after the official report is forgotten.", "zh": "这类故事的代价是慢慢累积的，人们会在官方报告被遗忘很久之后还记得它们。"}, {"en": "The village festival began with a [[tour]] of the old quarter and ended with a speech that [[bored|bore]] even the mayor.", "zh": "村庄的节庆从老城区的游览开始，以一场连市长都听困了的演讲结束。"}, {"en": "A [[flight]] from Madrid had brought a [[Spanish]] [[airline's|airline]] crew, and a dancer in a [[wasp-waist]] dress sold [[cigars|cigar]].", "zh": "从马德里来的航班带来了一队西班牙航空公司的机组人员，一个穿细腰裙的舞者在卖雪茄。"}, {"en": "The [[townsfolk]] [[mocked|mock]] the visitors gently, and the visitors [[mocked|mock]] the [[folk]] music back.", "zh": "镇民温和地嘲弄访客，访客也反过来嘲弄民间音乐。"}, {"en": "It was the [[anniversary]] of the [[iconic]] lighthouse, and someone read a [[brief]] [[essay]] about its first keeper.", "zh": "那天是那座标志性灯塔的周年纪念，有人朗读了一篇关于第一位守塔人的短文。"}, {"en": "The [[guest]] of honour was a [[novelist]] whose [[Polynesian]] saga I had been translating all summer.", "zh": "主宾是一位小说家，我整个夏天都在翻译她那部波利尼西亚传奇。"}, {"en": "I had been translating her novel for two years, and her [[catchword]] for the book was 'the sea remembers'.", "zh": "我译她的小说已经两年了，她给这本书的流行语是'海会记得'。"}, {"en": "She was a [[millennial]] with a [[clear-eyed]] view of history, and she distrusted every [[pretty]] phrase.", "zh": "她是千禧一代，对历史有清醒的眼光，怀疑每一个漂亮的词。"}, {"en": "We argued about a single word for an hour, and I [[began|begin]] to see translation as a [[mode]] of reading.", "zh": "我们为一个词争了一个小时，我开始把翻译看作一种阅读方式。"}, {"en": "Her prose was [[mixed]] with island words, a [[hybrid]] language that no dictionary could capture.", "zh": "她的文字混着岛上的词语，是一种没有词典能收容的混合语言。"}, {"en": "By August I had begun to [[rely]] on the town's slow mornings, and to [[owe]] the landlady more than rent.", "zh": "到了八月，我已经开始依赖小镇缓慢的早晨，也欠房东的已经不止房租。"}, {"en": "We [[shared|share]] bread, tools and [[guesswork]], and she never made me feel like a [[guest]].", "zh": "我们分享面包、工具和猜测，她从不让我觉得自己是个客人。"}, {"en": "She said a good life was not about [[lucre]] but about [[choosing|choose]] what to [[aim]] at.", "zh": "她说好的生活不在于钱财，而在于选择把目标放在哪里。"}, {"en": "I was not sure I was [[equal]] to that, but I was willing to [[bother]] trying.", "zh": "我不确定自己是否配得上这一点，但我愿意为此费心。"}, {"en": "The [[best]] I could do was write honestly, and [[worse]] still was to pretend I understood more than I did.", "zh": "我能做的最好的事是诚实地写，更糟的是假装我懂得比实际多。"}, {"en": "[[Ahead]] lay a [[century]] of such small decisions, each one [[shaping|shape]] the shore.", "zh": "前方还有一个世纪这样的小决定，每一个都在塑造海岸。"}, {"en": "The town had been [[remolded|remold]] (or [[remoulded|remould]]) by three summers of visitors, and it would be remade again.", "zh": "小镇被三个夏天的游客改造过，还会被继续改造。"}, {"en": "One afternoon I got lost on the hill, and a [[guide]] led me down, [[upright]] and patient, with a [[fly]] circling his hat.", "zh": "一天下午我在山上迷了路，一位向导把我带下来，他腰背挺直、很有耐心，一只苍蝇绕着他的帽子飞。"}, {"en": "I had [[misplaced|misplace]] my map and wasted an hour in [[vain]], which taught me to [[own]] my [[mistake]].", "zh": "我把地图放错了地方，白白浪费了一个小时，这教会我要承认自己的错误。"}, {"en": "A [[misleading|mislead]] sign at the [[top]] of the path pointed nowhere, and at the [[bottom]] a [[loop]] of road led back to the start.", "zh": "小路顶端一块误导人的牌子指向虚无，底端一条环路又把人带回起点。"}, {"en": "I began to [[use]] my phone as a [[tool]] and to [[alert]] the others when I moved.", "zh": "我开始把手机当工具用，移动时提醒同伴。"}, {"en": "The sea was so clear that I could [[touch]] the bottom, and I did not want to [[lose]] my way again.", "zh": "海水清得我能触到底，我不想再迷路。"}, {"en": "A [[flu]] went through the town in the last week of August, and half the [[townsfolk]] stayed in bed.", "zh": "八月最后一周，流感席卷小镇，一半的镇民都待在床上。"}, {"en": "I cooked for the landlady: I would [[chop]] vegetables, boil rice, and [[detach]] the leaves from the herbs.", "zh": "我给房东做饭：切菜、煮饭，把香草的叶子摘下来。"}, {"en": "We avoided the [[shellfish|shell]] from the north bank, which had been [[toxic]] since June, and drank tea whose [[flavor]] (or [[flavour]]) came from wild mint.", "zh": "我们不吃北岸的贝类，那里从六月起就有毒；我们喝加了野薄荷的茶，风味就来自薄荷。"}, {"en": "The kitchen was [[dirty]] by city standards, but on the last Sunday I [[folded|fold]] dough for bread while she watched.", "zh": "按城里的标准，厨房很脏，但在最后一个周日，她看着我和面做面包。"}, {"en": "On my last evening we sat on the wall and watched a [[ship]] move [[toward]] the harbour mouth, and later, walking home, I kept turning [[towards]] the water.", "zh": "最后一个傍晚，我们坐在墙上，看一艘船朝港口出口驶去；后来走回家时，我不停地转向水面。"}, {"en": "The town and I had changed, [[alike]] in small ways, and [[despite]] the difference in our ages we had become friends.", "zh": "小镇和我都变了，在某些小地方彼此相似，而尽管年龄相差很大，我们成了朋友。"}, {"en": "She [[reminded|remind]] me to [[remember]] the small things, and to write them down before they [[deteriorated|deteriorate]].", "zh": "她提醒我要记住小事，并在它们变坏之前写下来。"}, {"en": "I promised to send her the finished book, and she said she would [[write]] back in her [[upright]] hand.", "zh": "我答应把译好的书寄给她，她说她会用挺拔的字迹回信。"}, {"en": "I had come to translate a novel and was leaving with something more [[insidious]]: the sense that the town had translated me.", "zh": "我来时是为了译一部小说，离开时却带走了更阴险的东西：一种小镇把我翻译了的感觉。"}]}, {"key": "三星词汇 Day 08 List 16", "words": [{"w": "bring", "phon": "[brɪŋ]", "def": "v.带来；引起；导致", "si": [15], "dists": [2481, 3201, 3085]}, {"w": "Europe", "phon": "[ˈjʊrəp]", "def": "n.欧洲", "si": [1, 22], "dists": [1909, 120, 3437]}, {"w": "follow", "phon": "[ˈfɑləʊ]", "def": "v.跟随；遵循", "si": [2], "dists": [2362, 2483, 2492]}, {"w": "luxury", "phon": "[lʌkʃəri]ˈ", "def": "n.奢华；奢侈品；难得的享受", "si": [9], "dists": [2516, 2534, 1380]}, {"w": "price", "phon": "[praɪs]", "def": "n.价格；代价v.定价", "si": [7], "dists": [2900, 2693, 2574]}, {"w": "remove", "phon": "[rɪˈv]", "de
