han it served the truth.", "zh": "我的任务要求是：写出普通读者能够感同身受的文字，一页接一页地填满而不夹杂术语行话，并避开任何花哨的措辞——这类措辞或许更能博得出版界的赞赏，却无助于呈现真相。"}, {"en": "The town I will [[call]] Millford—its real [[name]] is withheld at the request of several [[unnamed]] residents—once prospered on textiles.", "zh": "我将把这座小镇称作米尔福德——应几位不愿具名的居民要求，它的真实名字在此隐去——它曾靠纺织业繁荣一时。"}, {"en": "Anyone with a [[background]] in economics could read the [[pattern]] of its decline: the [[major]] mill closed, the local [[economy]] shrank, and the [[damage]] spread from shop to shop like [[damp]] through plaster.", "zh": "任何有经济学背景的人都能读懂它衰败的轨迹：大型纺织厂倒闭，当地经济萎缩，创伤像潮气穿透灰泥一样，从一家店铺蔓延到另一家店铺。"}, {"en": "My [[methodology]] was simple.", "zh": "我的方法很简单。"}, {"en": "I rented a room [[above]] the bakery on the high street and set out to [[observe]] [[daily]] life without trying to [[oversimplify]] it.", "zh": "我在商业大街面包店的楼上租了一个房间，着手观察日常生活，却不打算把它过度简化。"}, {"en": "No single [[theory]] explains why some towns [[disintegrate]] while others [[continue]]; the first [[clue]], I soon learned, is usually a [[fact]] too small for statisticians to notice—in this case, the smell of fresh bread at six in the morning.", "zh": "没有哪种单一理论能解释，为何有些城镇分崩离析而另一些却存续下来；我很快明白，第一条线索往往是一个小得令统计学家也难以察觉的事实——在这里，便是清晨六点新鲜面包的香气。"}, {"en": "The bakery was run by Miriam, a woman of formidable [[tact]] and even more formidable [[zeal]].", "zh": "面包店由米丽娅姆经营，这个女人处世的老练令人敬畏，而她的热忱更令人敬畏。"}, {"en": "Nobody dared ask the [[calorie]] count of her lemon [[cake]], sharpened with [[zest]]; people came because it tasted like childhood.", "zh": "谁也不敢打听她那只加了柠檬皮提味的柠檬蛋糕含有多少卡路里；人们前来，是因为它吃起来有童年的味道。"}, {"en": "In winter she baked [[plum]] [[pudding]]; in summer she lectured anyone who would listen that [[quality]] matters more than [[quantity]], and priced her loaves accordingly.", "zh": "冬天她烤李子布丁；夏天她会对任何愿意倾听的人谆谆告诫：质比量重要，并据此为她的面包定价。"}, {"en": "The mill had once offered what economists [[label]] steady [[labor]]—or, as the old Yorkshire-born foreman insisted on spelling it, [[labour]].", "zh": "纺织厂曾提供经济学家所称的稳定劳动（labor）——或者，按那位出生于约克郡的老工头坚持的拼法，写作 labour。"}, {"en": "After it closed, nobody left in town could [[earn]] much beyond a cashier's [[salary]], and Millford seemed [[unable]] to [[recruit]] a single new employer.", "zh": "工厂倒闭后，留在镇上的人谁也挣不到比收银员工资高多少的钱，而米尔福德似乎连一家新雇主都招揽不来。"}, {"en": "A [[prejudice]] against newcomers took root; every [[quarrel]] at the council meeting seemed to [[trigger]] a fresh [[conspiracy]] on the internet.", "zh": "对新来者的偏见生了根；市政会议上的每一次争吵，似乎都会在互联网上引发一场新的阴谋论。"}, {"en": "One [[bizarre]] rumor held that a distant [[landowner]] planned to [[bury]] chemical waste beneath the playing fields, a story invented, as far as anyone could tell, to [[kill]] the proposal for a new housing estate.", "zh": "有个离奇的谣言说，一位远居外地的地主打算把化学废料埋在运动场下面；据所有人判断，编造这个故事是为了扼杀新建住宅区的提案。"}, {"en": "Then, one October night, the ground began to [[quake]].", "zh": "后来，在十月的一个夜晚，大地开始震动。"}, {"en": "It was only a modest tremor—this is not [[volcano]] country—but a [[gaping]] crack opened in the [[wall]] of the old library, and for the first time the town had to [[face]] a [[danger]] it could see and touch.", "zh": "那只是一次轻微的震动——这里并非火山地带——但老图书馆的墙上裂开了一道大缝，小镇第一次不得不面对一个看得见、摸得着的危险。"}, {"en": "A building can be made [[safe]] again with scaffolding and money; confidence, once shaken, is slower to repair.", "zh": "借助脚手架和金钱，一栋建筑可以重归安全；而信心一旦动摇，修复起来却要缓慢得多。"}, {"en": "People began to [[gather]] in the library [[square]] at dawn, a [[pack]] of sandwiches in one hand and a borrowed tool [[kit]] in the other, ready to [[join]] the repair crews.", "zh": "人们开始在黎明时分聚集到图书馆广场，一只手拿着一包三明治，另一只手拎着借来的工具箱，准备加入修缮队伍。"}, {"en": "A Scout troop pitched a [[camp]] for out-of-town volunteers, and one tireless [[supporter]] even sewed a bright [[uniform]] for the cleanup teams.", "zh": "一支童子军队伍为外地来的志愿者搭起营地，还有一位不知疲倦的支持者，甚至为清扫队缝制了一套鲜亮的制服。"}, {"en": "There was Tom, a retired [[runner]] still nicknamed 'the [[rabbit]]' for the [[pace]] he once set, who now organized the work shifts.", "zh": "一位是退休赛跑运动员汤姆，因当年领跑的速度仍被人唤作“兔子”，如今由他负责安排轮班。"}, {"en": "There was Mr. Hale, seventy-eight and still [[hale]], who played chess in the park and told every [[joke]] twice for emphasis.", "zh": "一位是黑尔先生，七十八岁仍身体硬朗，他在公园里下棋，每个笑话都要讲两遍以示强调。"}, {"en": "And there was Sister Agnes, whom even the atheists called a [[saint]], though she laughed that she had none of the patience of a [[knight]] in old stories.", "zh": "还有阿格尼丝修女，连无神论者都称她为圣徒，可她却笑着说，自己一点也没有古老故事里骑士的那种耐心。"}, {"en": "Residents could [[take]] home a pair of [[jeans]], a winter coat from the communal [[wardrobe]], or a voucher for a free [[haircut]].", "zh": "居民可以把一条牛仔裤、一件从公共衣橱里取出的冬衣，或是一张免费理发券带回家。"}, {"en": "The point, its founder told me, was dignity: no one should feel [[naked]] before the world on account of poverty, and no one's worth should be measured by the [[thinness]] of a wallet.", "zh": "它的创始人告诉我，关键在于尊严：任何人都不应因贫穷而在世人面前感到赤裸露怯，任何人的价值也不应以钱包的厚薄来衡量。"}, {"en": "Some older families grew [[jealous]] of the attention paid to newcomers; a [[nasty]] letter in the local paper dismissed the volunteers as 'busybodies,' and one councillor, [[mad]] with frustration after a long meeting, used an insult as [[bait]] to provoke his rivals.", "zh": "一些世居于此的家族渐渐嫉妒起新来者受到的关注；当地报纸上一封措辞恶毒的来信把志愿者贬为“爱管闲事的人”，还有一名市政委员在漫长的会议后沮丧得发狂，竟用一句侮辱作诱饵去激怒他的对手。"}, {"en": "The [[rage]] burned for a week and then collapsed, as such feuds do, when both sides admitted that the [[game]] of outrage produces no winners.", "zh": "怒火燃烧了一个星期便偃旗息鼓——这类争斗向来如此——因为双方都承认，愤怒的博弈没有赢家。"}, {"en": "Beneath the surface lay structural problems: a leadership [[vacuum]], a chronic [[lack]] of investment, streets too [[narrow]] for modern delivery trucks, and a [[dense]] thicket of bylaws so [[obscure]] that even solicitors could not agree on what they required.", "zh": "表象之下潜伏着结构性问题：领导层真空、长期投资不足、街道窄得容不下现代送货卡车，还有密密麻麻、晦涩难懂的地方法规，连律师们对其要求都莫衷一是。"}, {"en": "It is [[easy]] to blame individuals; it is harder to identify the [[factor]] that matters most, which, in my view, is simply the [[proportion]] of residents who still [[believe]] the future is worth building.", "zh": "指责个人很容易；更难的是找出最关键的因素——在我看来，它不过是仍然相信未来值得建设的居民所占的比例。"}, {"en": "The turning point began with a [[petition]].", "zh": "转折点始于一份请愿书。"}, {"en": "Miriam and Sister Agnes gathered signatures to [[declare]] the mill a heritage site rather than let it be demolished.", "zh": "米丽娅姆和阿格尼丝修女四处征集签名，要求宣布纺织厂为遗产地，而不是任其被拆除。"}, {"en": "A developer proposed to buy it, [[backload]] the payments, and raise a [[skyscraper]] of flats on the site; the council nearly agreed.", "zh": "一位开发商提出要买下它，把付款负担后置，并在原址上盖起一栋摩天公寓楼；委员会差一点就同意了。"}, {"en": "Then the townsfolk held a [[dance]] and a bake [[sale]] outside the mill [[gate]], a television crew arrived, and suddenly the whole [[nation]] seemed to be watching.", "zh": "后来，镇民们在厂门外办了一场舞会和一次烘焙义卖，一支电视摄制组也闻讯而来，一夜之间，整个国家似乎都在注视着这里。"}, {"en": "Today the mill houses a cooperative [[store]] on its ground floor, while the upper [[tier]] has become a museum where one [[relic]] after another recalls the age of steam.", "zh": "如今，纺织厂的底层开着一家合作商店，上面一层则成了博物馆，一件又一件遗物让人追忆起蒸汽时代。"}, {"en": "Visitors wander through as if on [[safari]], cameras ready, while children [[race]] between the looms and grandparents [[wake]] memories they thought long buried.", "zh": "参观者像游猎一样在馆中穿行，随时准备拍照；孩子们在织机之间奔跑嬉戏，祖父母们则唤醒了他们以为早已埋葬的记忆。"}, {"en": "If there is a [[heaven]] for industrial towns, Miriam says, it must look like this: honest work, warm bread, and laughter under one roof on forgiving [[earth]].", "zh": "米丽娅姆说，如果工业城镇也有天堂，那一定就是这个样子：在宽厚的大地上，同一屋檐下有诚实的劳作、温热的面包和欢声笑语。"}, {"en": "Skills came [[back]] slowly.", "zh": "各种技艺慢慢地回来了。"}, {"en": "A retired [[tailor]] taught teenagers to sew; a carpenter took on [[budding]] apprentices; the [[exchange]] between generations was [[mutual]], the young offering energy and the old offering [[proficiency]].", "zh": "一位退休裁缝教青少年缝纫，一位木匠收了初出茅庐的学徒；代际之间的交流是双向的，年轻人付出精力，年长者奉献熟练技艺。"}, {"en": "Every [[talent]], however modest, found a use.", "zh": "每一样才能，无论多么微小，都找到了用武之地。"}, {"en": "[[Kin]] who had moved away years before began returning, and each new [[joint]] venture, however small, added another thread to the fabric of the town.", "zh": "多年前搬走的亲友开始陆续回乡，每一个新的合作项目无论多小，都为这座小镇的织锦添上了一根新线。"}, {"en": "The council adopted a [[goal-focused]] plan, struck a [[balance]] between growth and preservation, and gave every [[stakeholder]]—shopkeeper, [[co-worker]], parent, pensioner—a seat at the table.", "zh": "委员会通过了一项以目标为导向的计划，在发展与保护之间求得平衡，并让每一位利益相关者——店主、同事、父母、领养老金的人——都在谈判桌前拥有一席之地。"}, {"en": "It was a broadly [[liberal]] settlement, generous with [[welfare]] for the [[ill]] and the elderly, yet firm in asking something from everyone whose fortunes were [[aligned]] with the town's recovery.", "zh": "这是一个总体上宽宏大度的解决方案：对病人和老人的福利慷慨大方，同时又坚定地要求每个命运与小镇复苏相连的人都有所付出。"}, {"en": "Two winters ago a grant scheme went [[downhill]] when an official was found guilty of [[wrongdoing]], and auditors demanded a [[clawback]] of the misspent money.", "zh": "两年前的冬天，一项拨款计划急转直下：一名官员被判违法，审计人员要求追回被滥用的资金。"}, {"en": "The scandal threatened to [[worsen]] an already fragile trust.", "zh": "这桩丑闻险些让本已脆弱的信任雪上加霜。"}, {"en": "To its credit, the council did not [[abandon]] the programme; it hired an independent [[screener]] to vet every contract, obtained a [[warrant]] wherever the law required one, and ruled that secrecy of any kind was [[unacceptable]].", "zh": "值得称道的是，委员会没有中止该计划；它聘请了一名独立审查员审核每一份合同，凡法律要求授权令之处一律办妥，并裁定任何形式的保密都不可接受。"}, {"en": "A [[streetlight]] flickers on over the playground.", "zh": "操场上空，一盏路灯忽闪着亮了起来。"}, {"en": "In the bakery window, [[half]] the loaves are already sold; a [[quarter]] of an hour later the rest are gone.", "zh": "面包店橱窗里，一半的面包已经售出；一刻钟之后，剩下的也销售一空。"}, {"en": "On the [[edge]] of town, the [[horticultural]] society's proudest project has turned a derelict lot into rows of beans, herbs, and roses, tended by schoolchildren every Friday.", "zh": "在小镇边缘，园艺协会最引以为傲的项目把一块废弃荒地变成了一排排豆畦、香草和玫瑰，每周五由学童们照管。"}, {"en": "The gym runs [[self-defence]] classes; teenagers still [[sneak]] into the cinema as teenagers always have; the drama society stages a folk tale in which a [[king]] loses his crown to a clever shepherd and wins it again through honesty.", "zh": "体育馆开设自卫课；青少年仍像历来的青少年那样溜进电影院；戏剧社上演一出民间故事，剧中国王被一个聪明的牧羊人夺走王冠，又凭诚实重新赢回。"}, {"en": "On summer weekends families paddle a rubber [[raft]] down the gentle river, and the farm shop sells [[lamb]] from the hills alongside a [[packet]] of garden seeds.", "zh": "夏日周末，一家人乘橡皮筏沿平缓的河水漂流，农家小店在出售一袋袋园种子的同时，也卖着山地产的羔羊肉。"}, {"en": "Nothing here is [[wholly]] new, and that, people say, is precisely the point.", "zh": "这里没有什么是全然崭新的，而人们说，这恰恰就是关键所在。"}, {"en": "Word of the revival spread: a film student arrived to make a documentary, locals soon began to [[dub]] the mill 'the palace,' and the crew shot one [[retake]] after another of its reopening.", "zh": "复兴的消息传了开来：一个学电影的学生前来拍摄纪录片，当地人很快开始把纺织厂戏称为“宫殿”，摄制组则为它的重新开放拍了一个又一个重拍镜头。"}, {"en": "Every digital file had a [[back-up]] in the town archive.", "zh": "每一份数字文件在镇档案馆里都有备份。"}, {"en": "At the [[rear]] of the mill, the old loading dock became an open-air stage.", "zh": "在纺织厂后部，旧装卸台变成了一座露天舞台。"}, {"en": "At the hospital, volunteers repainted the children's [[ward]] in sunflower yellow; at the barber's, Mr. Hale's white [[hair]] fell in wisps while he held court on cricket.", "zh": "在医院，志愿者们把儿童病房重新漆成向日葵黄；在理发店里，黑尔先生一边滔滔不绝地大谈板球，一边让白发一缕缕落下。"}, {"en": "Old-timers swore the whole revival was a passing [[fad]], but even they admitted that the [[prospect]] of a future was better than none at all.", "zh": "老人们断言整场复兴不过是昙花一现，但就连他们也承认，有个未来的盼头总比毫无指望要强。"}, {"en": "So what did Millford [[achieve]]?", "zh": "那么，米尔福德究竟成就了什么？"}, {"en": "Nothing that would [[create]] headlines in the capital—and yet stories like it [[abound]], if we bother to look.", "zh": "没有一件足以成为首都报纸的头条——然而，只要我们肯费心去找，这样的故事比比皆是。"}, {"en": "The [[key]] [[idea]] is modest: renewal is a [[habit]] before it is a policy, an [[ability]] practised day after day until it hardens into character.", "zh": "核心理念并不起眼：复兴在成为政策之前，首先是一种习惯，一种日复一日践行、直至内化为品格的能力。"}, {"en": "The town's long [[war]] against decline was won not by any [[lone]] hero but by hundreds of small acts whose effects [[fade]] into the fabric of ordinary life, invisible until you feel them [[viscerally]]—warm bread, a child's shout, lamplight on wet stone.", "zh": "小镇对抗衰败的漫长战争，不是靠任何孤胆英雄取胜的，而是靠数以百计的微小举动；它们的效应融进日常生活的肌理，无从察觉，直到你发自肺腑地感受到它们——温热的面包、孩子的喊叫、湿石板上的灯光。"}, {"en": "It would be [[unrealistically]] tidy to claim that every problem is solved.", "zh": "若声称所有问题都已解决，那将是不切实际的粉饰。"}, {"en": "Rents still [[impinge]] on the young; tempers still fray; there were mornings when I muttered '[[damn]] this rain' into my coffee before recovering my [[calm]], and setbacks that made my [[jaw]] clench.", "zh": "租金仍压得年轻人喘不过气；人们仍会发脾气；有些早晨，我对着咖啡嘟囔“这该死的雨”，随后才恢复平静；也有种种挫折让我紧咬牙关。"}, {"en": "Yet year by year the town has gone on to [[gain]] in confidence what it once lost in numbers.", "zh": "然而年复一年，这座小镇在人口上失去的，已在信心中一点点赢了回来。"}, {"en": "I think of the [[ink]] drying on the heritage application, of the [[rising]] murmur in the market at dawn, of the [[tie]] that binds neighbor to neighbor—and I am certain of one thing: a community that refuses to let go of itself has already touched something close to [[transcendence]].", "zh": "我想起遗产申请书上渐渐干涸的墨迹，想起黎明时分集市上渐起的喧闹，想起把邻里彼此联结的纽带——我确信一件事：一个不肯放弃自我的社区，已然触碰到了某种近乎超越的东西。"}]}, {"key": "三星词汇 Day 04 List 8", "words": [{"w": "nationwide", "phon": "[ˌneɪʃ(ə)nˈwaɪd]", "def": "adj.全国性的adv.在全国范围内", "si": [1], "r": "nat(出生)+ion(国)+wide→全国范围", "dists": [2708, 1242, 78]}, {"w": "pain", "phon": "[peɪn]", "def": "n.痛苦；苦恼", "si": [28], "dists": [2949, 1079, 1168]}, {"w": "protoscience", "phon": "[ˌprəʊtəʊˈsaɪəns]", "def": "n.原科学；前科学", "si": [26], "dists": [1030, 1557, 3430]}, {"w": "query", "phon": "[kwɪri]ˈ", "def": "n.询问；疑问；问号v.询问；怀疑", "si": [15], "dists": [3102, 1675, 1185]}, {"w": "rail", "phon": "[reɪl]", "def": "n.横杆；铁轨v.咒骂；责备；抱怨；以横木围栏", "si": [2], "dists": [2612, 1519, 1384]}, {"w": "saliva", "phon": "[səˈlaɪvə]", "def": "n.唾液；口水", "si": [28], "dists": [ sts": [2383, 1955, 2049]}, {"w": "glue", "phon": "[ɡlu]", "def": "n.胶；胶水v.胶合；粘合；紧附于", "si": [31], "dists": [2412, 2398, 1633]}, {"w": "shortfall", "phon": "[ˈʃɔrtfɔl]", "def": "n.不足；差额；亏空", "si": [7], "dists": [723, 1678, 1393]}, {"w": "soak", "phon": "[səʊk]", "def": "v.浸泡；吸收n.浸泡", "si": [5], "dists": [445, 3486, 3291]}, {"w": "carbon", "phon": "[ˈkɑrbən]", "def": "n.碳；复写纸", "si": [7], "dists": [1689, 1807, 3114]}], "sents": [{"en": "At [[dawn]] the eastbound [[railroad]] pulled out of Chicago, and Mara Ellison pressed her forehead to the window as the [[fall]] [[landscape]] unrolled in ribbons of gold and rust.", "zh": "拂晓时分，东行的列车驶离芝加哥；玛拉·埃利森把额头贴在车窗上，秋日的原野如绶带般铺展开来，金黄与赭红交织成带。"}, {"en": "Her [[journey]] home to Cedar Junction, a [[Midwestern]] town of eleven thousand, had begun as a reluctant favor and was ending as something closer to a homecoming: a [[native]] daughter who had sworn never to return was coming back to help organize a [[nationwide]] festival of science and civic life.", "zh": "她回到锡达章克申这座一万一千人口的中西部小镇，起初只是不情愿地帮个忙，到头来却更像一场归乡：一位曾发誓永不回来的本乡女儿，正要返乡协助筹办一场全国性的科学与市民生活节。"}, {"en": "A conductor steadied himself against the [[rail]] of the luggage rack and nodded at her laptop.", "zh": "一名列车员扶着行李架的横杆稳住身子，朝她的笔记本电脑点了点头。"}, {"en": "The [[rain]] began before the train crossed the county line, cutting [[visibility]] to a few hundred meters.", "zh": "火车还没越过县界，天就下起雨来，能见度骤降到几百米。"}, {"en": "In town, every [[automobile]] slowed to a crawl, and delivery vans edged down the narrow [[lane]] behind the depot.", "zh": "镇上，每辆汽车都慢得像在爬行，送货车沿着车站后方狭窄的小巷缓缓挪动。"}, {"en": "Mara made a [[quick]] dash along Main [[Street]], but the downpour still managed to [[soak]] her coat.", "zh": "玛拉沿着主街一路疾奔，可大雨还是把她的外套浇了个透。"}, {"en": "The festival office was [[near]] the old granary, close enough that she arrived merely dripping rather than drowned.", "zh": "节庆办公室就在旧粮仓旁边，距离够近，她赶到时不过是浑身滴水，还不至于淋成落汤鸡。"}, {"en": "Cedar Junction faced what its mayor called a triple squeeze: a budget [[shortfall]], a shrinking [[tax]] base, and a state mandate to cut [[carbon]] emissions by forty percent.", "zh": "锡达章克申面临着镇长所谓的“三重挤压”：预算亏空、税基萎缩，外加一项要求碳排放量削减百分之四十的州级强制令。"}, {"en": "A [[stern]] report from the regional commission seemed to [[warn]] that without firm [[control]] of spending, the town's decline could become [[overwhelming]].", "zh": "地区委员会一份措辞严厉的报告似乎在警告：若不严格控制开支，该镇的衰落便可能势不可挡。"}, {"en": "The [[absence]] of young families deepened the [[challenge]], and one columnist branded the council's long inertia an [[egregious]] failure of civic nerve.", "zh": "年轻家庭的外流让这一挑战雪上加霜；一位专栏作家把市议会长期以来的无所作为，斥为公民勇气方面一次极其恶劣的失败。"}, {"en": "Mara was, by training, a [[statistician]], and by former trade a science [[editor]] at a Boston journal.", "zh": "论专业训练，玛拉是统计学家；论此前的职业，她是波士顿一家学术期刊的科学编辑。"}, {"en": "She opened the town's neglected [[database]] of infrastructure records, cleaned each [[input]] field, and began to [[edit]] a recovery plan that would [[translate]] raw numbers into policy.", "zh": "她打开镇上长期无人过问的基础设施记录数据库，清理每一个输入字段，并着手编制一份复苏方案，要把原始数字转化为政策。"}, {"en": "From [[satellite]] imagery she mapped heat islands; from a door-to-door [[survey]] she assembled [[metrics]] of civic health.", "zh": "她依据卫星图像绘制热岛分布图，又通过挨家挨户的走访调查，汇总出衡量市民生活健康状况的各项指标。"}, {"en": "Her working [[premise]] was simple: evidence, honestly presented, can still move a small town.", "zh": "她的工作前提很简单：诚实地呈现证据，依然能够打动一座小镇。"}, {"en": "At the first town [[hall]] meeting, the [[public]] mood was plainly [[uncertain]].", "zh": "在第一次镇民大会上，公众的情绪显然游移不定。"}, {"en": "Every [[question]] from the floor seemed to conceal a sharper [[query]] about trust.", "zh": "会场里提出的每一个问题，背后似乎都藏着一个关于信任的更尖锐的诘问。"}, {"en": "The thorniest item, a proposal to install [[surveillance]] cameras by the school, was by general consent a [[thorny]] one: was it strictly [[legal]], and who would audit the auditors?", "zh": "最棘手的议题——一项在学校旁边安装监控摄像头的提案——众人也都公认难办：这究竟是否严格合法？又由谁来监督那些监督者？"}, {"en": "A retired judge spoke with the [[judiciary]]'s habitual caution, while a high-school teacher dismissed one viral video as a [[fake]].", "zh": "一位退休法官以司法界惯有的谨慎发了言，而一名中学教师则把一段疯传的视频斥为假货。"}, {"en": "The organizing [[team]] met each evening in the library basement, and volunteers were soon scheduled to [[occupy]] every booth on the festival grounds.", "zh": "筹办组每晚在图书馆地下室碰头，志愿者很快就被安排到节庆场地上的每一个摊位值班。"}, {"en": "Each [[pair]] of students was assigned a mentor, and it took [[strong]] [[faith]] plus patient [[effort]] to [[manage]] the logistics: permits were a [[necessity]], liability insurance a [[necessary]] evil.", "zh": "每两名学生配一名导师；要把后勤张罗妥当，靠的是坚定的信念加上耐心的努力：许可证必不可少，责任保险则是不得不忍受的麻烦事。"}, {"en": "By the end of October, a Friday pep [[rally]] in the high-school gymnasium drew four hundred people.", "zh": "到十月底，一场周五的鼓劲大会在中学体育馆举行，吸引了四百人参加。"}, {"en": "The district's [[education]] board voted to [[teach]] data literacy in every grade, arguing that [[knowledge]] of statistics now mattered as much as a second [[language]].", "zh": "学区教育委员会投票决定在所有年级教授数据素养，理由是：如今统计学知识和第二语言一样重要。"}, {"en": "The high school added a [[Mandarin]] elective, taught by a Fulbright [[candidate]] who had studied [[abroad]], while the debate club sharpened students' [[verbal]] skills with scrupulous [[gender]] balance on every panel.", "zh": "中学增设了一门普通话选修课，由一位曾留学海外的富布赖特奖学金候选人执教；辩论社则以每个讨论小组都严格恪守性别平衡的方式，磨炼学生的语言表达能力。"}, {"en": "The science club, fresh from a regional [[Olympiad]], enjoyed an [[enviable]] record and knew it.", "zh": "刚从地区奥林匹克竞赛归来的科学社，战绩骄人，自己也心知肚明。"}, {"en": "The festival's west wing celebrated [[physics]] in its most tactile forms: a [[bipedal]] robot wobbling across the gym floor, a [[flywheel]] storage unit whose main [[gear]] had been salvaged from a combine harvester, and a [[bulb]] glowing under a bicycle crank.", "zh": "节庆的西翼展区以最具触感的形式展示物理学：一个双足机器人摇摇晃晃地穿过体育馆地板，一个飞轮储能装置的主齿轮是从联合收割机上拆救下来的，还有一只灯泡在自行车曲柄的带动下发光。"}, {"en": "Attendance had grown [[eightfold]] in a single year.", "zh": "参观人数在一年内增长到原来的八倍。"}, {"en": "One corner, labeled the [[protoscience]] cabinet, displayed alchemy notebooks and phrenology heads, a reminder, the curator said, of how [[hard]] it is to [[imagine]] what we cannot yet see, and how often a science begins as a [[quirk]] of curiosity.", "zh": "一个被标为“前科学展柜”的角落，陈列着炼金术笔记和颅相学头像。馆长说，这提醒人们：要想象我们尚无法看见的东西有多难，而一门科学又有多少次，最初只是源于好奇心的一次古怪念头。"}, {"en": "The county hospital sponsored a [[biomedical]] tent offering free [[cancer]] screening.", "zh": "县医院赞助了一顶生物医学帐篷，提供免费的癌症筛查。"}, {"en": "A [[saliva]] [[sample]], no needles and no [[pain]], could now flag risk markers for several diseases, and nurses worked to [[deliver]] results within the hour, especially to the town's most [[vulnerable]] residents.", "zh": "只需一份唾液样本，不用针头，也没有痛苦，如今就能查出数种疾病的风险指标；护士们力争在一小时内送出结果，尤其是送到镇上最弱势的居民手中。"}, {"en": "One elderly [[male]] farmer, blinking in a grateful [[daze]], reported that the doctor's rubber hammer had produced 'the first [[reflex]] my knee has shown in years.'", "zh": "一位年迈的男农民眨着眼睛，神情恍惚又满怀感激，说医生的橡皮锤引出了“我的膝盖多年来出现的第一个膝跳反射”。"}, {"en": "Saturday's cleanup drew volunteers to the old [[canal]], where decades of [[waste]] had left the banks [[bare]].", "zh": "周六的清理活动把志愿者吸引到旧运河边；几十年来的废弃物已让两岸变得光秃秃的。"}, {"en": "Teenagers waded in to [[wash]] silt from the stones while toddlers piled [[sand]] into buckets, and a human [[chain]] passed trash bags up the slope, the [[glue]] of the morning, one organizer laughed, being coffee and donuts.", "zh": "青少年涉水而入，冲去石头上的淤泥，幼童们把沙子堆进小桶，一条人龙把垃圾袋沿坡传递上去——一位组织者笑着说，那天上午把众人黏合在一起的，是咖啡和甜甜圈。"}, {"en": "Someone observed that the [[water]] here eventually reached the [[ocean]], and a small cheer rolled down the bank like a [[wave]].", "zh": "有人说，这里的水最终会流入大海；一阵轻轻的欢呼便沿着河岸荡开，像波浪一般。"}, {"en": "Not even a forecast of storms could [[cancel]] the parade.", "zh": "即使预报有暴风雨，也没能取消游行。"}, {"en": "The marching [[band]] struck up at nine, and the whole affair was unabashedly [[gay]] and bright, an eruption of uncomplicated [[joy]].", "zh": "行进乐队九点奏乐开场，整场活动欢快明丽、毫不掩饰，迸发出一种简单纯粹的喜悦。"}, {"en": "Parents hoisted children onto their shoulders to [[watch]]; when a stray [[knock]] of thunder sounded, no one seemed to [[dare]] leave.", "zh": "父母们把孩子举到肩头观看；当一声零星的雷响传来，似乎谁也不敢离去。"}, {"en": "At [[last]] the sun broke through, attendance took a [[jump]] past ten thousand, and the mayor held the signed permit in her [[palm]] like a trophy.", "zh": "太阳终于破云而出，参观人数一跃突破一万；镇长把签好字的许可证握在掌心，像捧着一座奖杯。"}, {"en": "Nothing, not mud and not cost, could [[hamper]] the mood.", "zh": "无论泥泞还是花费，都妨碍不了人们的兴致。"}, {"en": "Food Alley was presided over by a [[cook]] from the veterans' post whose [[hamburger]], seared in a cast-iron [[pan]] and finished with smoked [[salt]], had a [[taste]] locals described as practically judicial.", "zh": "美食巷由退伍军人协会驿站的一位厨师主理；他做的汉堡用铸铁锅煎烤，最后以熏盐收尾，当地人称那味道简直公允老到，颇有法官断案的气派。"}, {"en": "A cider [[bar]] anchored the corner.", "zh": "一个苹果酒摊位坐镇街角。"}, {"en": "In the craft barn, visitors could [[knit]] a scarf square, glaze a [[vase]], or [[paint]] a commemorative tile; a woodworker showed how to steam and bend a [[cane]], and the history club displayed a replica jousting [[lance]].", "zh": "在手工艺棚里，游客可以织一方围巾片、给一只花瓶上釉，或绘制一块纪念瓷砖；一位木工演示如何把藤条蒸软折弯，历史社则展出了一杆马上比武所用长矛的复制品。"}, {"en": "One runner's [[sandal]] disintegrated at the starting line; another arrived [[puffed-out]] and [[faint]] after sprinting the first unseasonably [[spring]]-warm mile.", "zh": "一名赛跑者的凉鞋在起跑线上散了架；另一个人在反常地如春日般暖和的头一英里冲刺之后，气喘吁吁，几欲晕倒。"}, {"en": "The high-school [[coach]] had to [[steer]] two teenagers away from a [[blunder]] involving a shortcut through the rose garden.", "zh": "中学教练不得不把两个少年从一个蠢主意边上拉回来——他们打算抄近路穿过玫瑰园。"}, {"en": "'If you [[fail]], fail forward,' he bellowed, holding ice to a twisted [[heel]] while the officials struggled to [[rank]] the finishers.", "zh": "“就算失败，也要败着向前，”他吼道，一边给扭伤的脚后跟敷冰块，工作人员则费劲地给冲线者排出名次。"}, {"en": "Evening belonged to the arts: a touring [[ballet]] company in the auditorium, followed by a student [[satire]] so [[searing]] that the superintendent was seen to laugh exactly twice.", "zh": "夜晚属于艺术：礼堂里是一家巡演芭蕾舞团的演出，随后是一出学生讽刺剧，言辞犀利得有人看见学监正好笑了两次。"}, {"en": "A charity [[lottery]], top prize a used pickup truck, funded next year's festival, a fact the emcee would [[quote]] for months.", "zh": "一场头奖为一辆二手皮卡的慈善彩票为明年的节庆提供了资金；这件事主持人后来逢人便讲，念叨了好几个月。"}, {"en": "'The [[value]] of a town,' he said in his closing [[talk]], 'is the sum of what its people give.' Every stub was stamped with the [[date]], October second, and every [[deserving]] cause was listed on the back.", "zh": "“一座小镇的价值，”他在闭幕致辞中说，“在于其居民所付出的总和。”每一张票根上都盖着日期——十月二日，每一项值得资助的事业都列在票根背面。"}, {"en": "What did Cedar Junction [[know]] by year's end that it had not known before?", "zh": "到了年底，锡达章克申懂得了哪些它此前不曾懂得的东西？"}, {"en": "That a [[fair]] hearing can change minds; that each outstretched [[hand]] can [[make]] the next one braver.", "zh": "它懂得：一场公正的听证会能够改变人心；每一只伸出的手，都能让下一只手更加勇敢。"}, {"en": "One [[man]] who had long sworn the town was [[unchangeable]] admitted that the [[land]] itself now seemed different, not [[unchanged]] fields but working common ground.", "zh": "一个长期断言小镇不可改变的男人承认，如今连这片土地本身似乎都不同了——那不再是一成不变的田野，而是一片被共同耕耘的共识之地。"}, {"en": "There was nothing [[unnatural]] about it, Mara wrote in her final column; it was simply human [[nature]] given a chance.", "zh": "玛拉在最后一篇专栏中写道：这一切毫不反常，那不过是人性得到了一次机会而已。"}, {"en": "The closing [[banquet]] filled the grange with the smell of roast turkey, and in a [[cozy]] corner the historical society unrolled a [[genealogy]] chart tracing forty families, which everyone signed with an almost [[ritualistic]] gravity.", "zh": "闭幕宴会让格兰其厅弥漫着烤火鸡的香气；在一个温馨的角落里，历史学会展开了一幅追溯四十个家族的家谱图，每个人都带着近乎仪式般的庄重感在上面签名。"}, {"en": "Weather and luck had seemed to [[conspire]] in the town's favor.", "zh": "天气与运气似乎都在暗中协力，向着对小镇有利的方向。"}, {"en": "[[Regrettably]], the grant money remained [[slim]], and no one pretended the [[quest]] for renewal was complete.", "zh": "遗憾的是，拨款依旧微薄，谁也不会自欺欺人地说，这场寻求复兴的征程已经完成。"}, {"en": "Yet the [[large]] point carried no small [[import]]: a community that dares to measure its own [[well-being]] honestly has already begun to [[foreshadow]] a better [[day]].", "zh": "然而，这一大处落墨的要点含义非同小可：一个敢于诚实衡量自身福祉的社区，已经开始预示更美好的明天。"}]}, {"key": "三星词汇 Day 05 List 9", "words": [{"w": "stressed-out", "phon": "[strestaʊt]", "def": "adj.压力过重的；紧张过度的", "si": [0], "dists": [1040, 1828, 453]}, {"w": "technical", "phon": "[ˈteknɪk(ə)l]", "def": "adj.技术的；专业的；工艺的", "si": [0], "dists": [1239, 1238, 390]}, {"w": "unclear", "phon": "[ˌʌnˈklɪr]", "def": "adj.不清楚的；不确定的；不肯定的", "si": [0], "dists": [3472, 2680, 3008]}, {"w": "way", "phon": "[weɪ]", "def": "n.道路；方向；路线；方法；方式", "si": [1], "dists": [939, 1314, 1240]}, {"w": "accept", "phon": "[əkˈsept]", "def": "v.接受；认可；同意", "si": [1], "r": "ac(朝向)+cept(拿)→拿过来", "dists": [2559, 1276, 420]}, {"w": "advocate", "phon": "[ˈædvəkeɪt]", "def": "v.提倡；主张n.提倡者；拥护者；辩护律师", "si": [1], "dists": [670, 9, 547]}, {"w": "barrier", "phon": "[ˈbæriər]", "def": "n.屏障；障碍；栅栏", "si": [2], "dists": [1375, 958, 3188]}, {"w": "cool", "phon": "[kul]", "def": "adj.凉的；凉爽的；冷静的；顶好的；酷的v.变凉；冷静下来", "si": [2], "dists": [2945, 2889, 1192]}, {"w": "fame", "phon": "[feɪm]", "def": "n.名声；声誉", "si": [2], "dists": [216, 3317, 3042]}, {"w": "generate", "phon": "[ˈdʒenəreɪt]", "def": "v.产生；引起；发（热、电）", "si": [3], "dists": [376, 1108, 1959]}, {"w": "harm", "phon": "[hɑrm]", "def": "v.伤害；损害n.伤害；损害", "si": [3], "dists": [1196, 927, 3167]}, {"w": "image", "phon": "[ˈɪmɪdʒ]", "def": "n.图像；形象；画面；影像", "si": [4], "dists": [1197, 1183, 901]}, {"w": "indictment", "phon": "[ɪnˈdaɪtmənt]", "def": "n.起诉；控告；起诉状", "si": [3], "r": "in(进入)+dict(说)+ment→把人说进罪", "dists": [1934, 158, 557]}, {"w": "just", "phon": "[dʒʌst]", "def": "adv.只是；就；仅仅；刚刚；恰好adj.公正的；正当的；合理的", "si": [4], "dists": [1302, 1284, 3352]}, {"w": "late", "phon": "[leɪt]", "def": "adj.晚的；迟的；已故的adv.晚；迟", "si": [4], "dists": [763, 1199, 1112]}, {"w": "neighbor", "phon": "[ˈneɪbər]", "def": "n.邻居", "si": [4], "dists": [1287, 1580, 1987]}, {"w": "neighbour", "phon": "[ˈneɪbər]", "def": "n.邻居", "si": [4], "dists": [1580, 1287, 1430]}, {"w": "offer", "phon": "[ˈɔfər]", "def": "n.提议；提供；报价v.提供；愿  "swap", "phon": "[swɑp]", "def": "v.交换n.交换", "si": [52], "dists": [499, 1797, 1567]}, {"w": "staple", "phon": "[ˈsteɪp(ə)l]", "def": "n.订书钉；主要产品；主要部分；主食v.用订书机装订adj.主要的；重要的", "si": [54], "dists": [3336, 1098, 3406]}, {"w": "aboard", "phon": "[əˈbɔrd]", "def": "adv.在（船、车、飞机）上prep.在（船、车、飞机）上", "si": [55], "dists": [1124, 2186, 3438]}, {"w": "skyrocket", "phon": "[ˈskaɪrɑkɪt]", "def": "n.冲天火箭v.剧增；猛涨；猛升", "si": [53], "dists": [3283, 85, 1827]}, {"w": "unite", "phon": "[juˈnaɪt]", "def": "v.联合；团结；统一", "si": [52], "dists": [3400, 2173, 2033]}, {"w": "homeowner", "phon": "[ˈhəʊməʊnər]", "def": "n.自己拥有住房者；房主；屋主", "si": [55], "dists": [2142, 1933, 2463]}, {"w": "shortcut", "phon": "[ˈʃɔrtkʌt]", "def": "n.捷径；近路", "si": [56], "dists": [2611, 2597, 723]}, {"w": "scenario", "phon": "[səˈnæriəʊ]", "def": "n.设想；可能发生的情况；情节梗概", "si": [56], "dists": [2158, 1148, 2045]}], "sents": [{"en": "In every [[stressed-out]] modern city, [[technical]] innovation arrives so quickly that regulations remain [[unclear]].", "zh": "在每一座压力重重的现代城市，技术创新来得如此之快，以至于法规始终不明朗。"}, {"en": "People search for a [[way]] to [[accept]] change, while thinkers [[advocate]] calmer public debate.", "zh": "人们寻找接受变化的方法，而思想家们则倡导更为冷静的公共讨论。"}, {"en": "Yet a [[barrier]] of habit blocks dialogue, and few stay [[cool]] when [[fame]] and profit beckon.", "zh": "然而，习惯的壁垒阻碍着对话；当名声与利益招手时，很少有人能保持冷静。"}, {"en": "Platforms [[generate]] endless content, and no one can [[harm]] truth without eventually facing an [[indictment]] of public opinion.", "zh": "平台源源不断地产出内容，而任何人损害真相，最终都难逃舆论的谴责。"}, {"en": "The [[image]] of progress is not [[just]] efficiency, and any reform arriving [[late]] may disappoint both an American [[neighbor]] and a British [[neighbour]].", "zh": "进步的形象不只是效率；任何姗姗来迟的改革，都可能让美国邻居和英国邻居双双失望。"}, {"en": "Each [[offer]] of help can [[pull]] communities together when [[rapid]] shifts unsettle old routines.", "zh": "当急剧的变化扰乱旧有常规时，每一次伸出援手都能把社群凝聚在一起。"}, {"en": "[[Strict]] standards matter, because every [[technique]] and every [[technic]] of persuasion can uplift or mislead.", "zh": "严格的标准至关重要，因为每一种说服的技巧和技法都可能提振人心，也可能误导他人。"}, {"en": "It would be [[absurd]] to [[hide]] from screens; instead we work [[alongside]] machines and [[await]] better rules.", "zh": "躲避屏幕是荒谬的；我们转而与机器协同工作，并等待更完善的规则。"}, {"en": "A [[blank]] page, not a fashionable [[buzzword]], should begin policy.", "zh": "开启政策的应当是一页白纸，而不是时髦的流行词。"}, {"en": "Even the [[cream]] of talent must resist the temptation to [[distort]] evidence.", "zh": "即便是精英中的精英，也必须抵制歪曲证据的诱惑。"}, {"en": "The [[electronic]] town square is loud, and every [[environmentalist]] knows attention is an [[extremely]] fragile resource.", "zh": "电子市镇广场喧闹不堪，每个环保主义者都知道，注意力是一种极其脆弱的资源。"}, {"en": "No citizen should treat algorithms as a [[foe]], and a wise [[government]] will [[inquire]] before it legislates.", "zh": "公民不应把算法视为敌人，明智的政府会在立法之前先行调查。"}, {"en": "The [[intrusiveness]] of tracking concerns every [[lawmaker]], just as birds [[migrate]] across borders indifferent to jurisdictions.", "zh": "追踪的侵扰令每位立法者担忧，正如鸟儿飞越国界，对各个司法辖区毫不在意。"}, {"en": "From the [[Netherlands]] to Asia, the costs of transition feel [[onerous]], though surveys show publics [[overwhelmingly]] want dignity.", "zh": "从荷兰到亚洲，转型的代价令人感到沉重，尽管调查显示各国民众压倒性地渴望尊严。"}, {"en": "A healthy [[physique]] and a calm mind help citizens [[preside]] over their own attention, where [[punishment]] rarely changes behavior.", "zh": "健康的体魄和冷静的头脑有助于公民主宰自己的注意力；在注意力这件事上，惩罚鲜能改变行为。"}, {"en": "What endures is [[permanent]] curiosity, not the [[reinterpretation]] of slogans.", "zh": "持久的是永恒的好奇心，而不是对标语的重新解读。"}, {"en": "Like a [[ruby]], a verified fact keeps its color.", "zh": "经过核实的事实如同红宝石，本色不改。"}, {"en": "The [[visa]] queues at consulates grow [[cumbersome]] when systems lack an [[overhaul]], and travelers [[get]] lost in paperwork.", "zh": "当体制缺乏彻底改革时，领事馆前的签证队伍变得拖沓不堪，旅客们在文书材料中晕头转向。"}, {"en": "Every [[second]] spent online shapes [[survival]] in the marketplace of ideas, where a [[thousand]] voices compete for one open [[slot]].", "zh": "上网度过的每一秒都在塑造思想市场中的生存；在那里，上千种声音为一个空缺的位置而竞争。"}, {"en": "Trust grows [[steadily]] when people [[unplug]] each evening and rebuild their [[vocabulary]] of hope, [[whereas]] constant outrage leaves minds [[weak]].", "zh": "当人们每晚离开屏幕、重建关于希望的语汇时，信任便稳步增长；而持续的愤怒只会令心智虚弱。"}, {"en": "[[Access]] to knowledge must [[base]] itself on fairness, or citizens become [[captive]] to feeds engineered by a distant [[corporation]].", "zh": "知识的获取必须以公平为根基，否则公民就会被遥远公司所设计的信息流所囚禁。"}, {"en": "To [[cope]] with this pressure, societies must [[deal]] honestly with history and let the [[elder]] teach the young.", "zh": "为了应对这种压力，社会必须诚实面对历史，让长者教导后辈。"}, {"en": "A [[generous]] culture will not [[imitate]] whatever is viral, and [[justice]] requires that no firm release a product without asking what it does to [[mankind]].", "zh": "宽容的文化不会模仿一切病毒式传播之物；正义要求任何公司发布产品前，都必须追问它会对人类造成什么影响。"}, {"en": "Neither [[office]] gossip nor a headline's [[punch]] should decide truth, for [[neither]] rumor nor fear is a guide.", "zh": "职场流言和标题的冲击都不应裁断真相，因为谣言和恐惧都不足为凭。"}, {"en": "A [[rare]] mind can [[string]] facts together rather than tear them from context, and [[unconventional]] teachers show the [[very]] [[worth]] of doubt.", "zh": "罕有之人能够把事实串联起来，而不是将它们抽离语境；不落俗套的教师则展现出怀疑本身的价值。"}, {"en": "Against a [[baseline]] of civility, no student should simply [[copy]] a machine's answer; the [[core]] of learning cannot [[die]].", "zh": "在以礼貌为底线的前提下，任何学生都不应照抄机器给出的答案；学习的核心不能消亡。"}, {"en": "Whether the [[genre]] is poem or report, writers must [[harness]] language and [[justify]] their claims.", "zh": "无论体裁是诗歌还是报告，写作者都必须驾驭语言，为自己的主张提出依据。"}, {"en": "A Nobel [[laureate]] once said that [[manner]] reveals character, and an [[old-fashioned]] courtesy may run [[parallel]] to scientific rigor.", "zh": "一位诺贝尔奖得主曾说，举止揭示品格；而一种老派的礼貌，完全可以与科学的严谨并行不悖。"}, {"en": "Before we [[purchase]] the newest device, remember the laboratory [[rat]] that pressed a lever for reward.", "zh": "在购买最新设备之前，请记住那只为了奖赏而按压杠杆的实验室老鼠。"}, {"en": "We must [[save]] attention, [[strive]] for depth, and teach every [[teenager]] that being [[uncool]] is finer than cruelty.", "zh": "我们必须节省注意力、追求深度，并教导每个青少年：不随大流比刻薄残忍更为可贵。"}, {"en": "[[Perception]] is trainable; we can [[wear]] ideas lightly and let a [[beam]] of reason enter the room.", "zh": "感知力是可以训练的；我们可以轻松地看待种种观念，让一束理性之光照进房间。"}, {"en": "A library [[card]] may outlast any password, and what is [[correct]] in code may be wrong in ethics.", "zh": "一张借书证可能比任何密码都持久；在代码上正确的事，在伦理上可能是错误的。"}, {"en": "Public [[debate]] should be [[elegant]], not a [[fantasy]] of victory.", "zh": "公共辩论应当优雅，而不应是一场关于胜利的幻想。"}, {"en": "From the [[geography]] of farms to megacities, [[harsh]] inequality shadows the future.", "zh": "从农田的地理分布到特大城市，严酷的不平等如影随形地笼罩着未来。"}, {"en": "So [[lay]] the foundations carefully: [[manufacture]] devices that serve people, cast a wide [[net]] for talent, and feed the curious [[omnivore]] with [[pure]] data.", "zh": "因此，请谨慎地奠定根基：制造服务于人的设备，广撒网招揽人才，用纯净的数据喂养好奇的杂食者。"}, {"en": "At any [[rate]], skeptics [[say]] reform is slow, yet citizens [[struggle]] on.", "zh": "无论如何，怀疑者说改革进展缓慢，但公民们仍在奋力前行。"}, {"en": "In a small [[studio]] a [[veteran]] editor checks facts while storms [[weather]] the coastline.", "zh": "在一间小小的工作室里，一位资深编辑核实着事实；与此同时，暴风雨侵蚀着海岸线。"}, {"en": "We must [[bear]] witness and [[care]] for the vulnerable, because [[debt]] to truth compounds silently.", "zh": "我们必须为弱者作证、关怀弱者，因为亏欠真相的债会悄无声息地累积。"}, {"en": "The [[element]] of trust cannot be bought, and [[far]] too often haste ruins judgment.", "zh": "信任这一要素无法用金钱买到，而匆忙又太过频繁地毁掉判断力。"}, {"en": "In [[haste]] we clicked; now we read slowly, and a thoughtful [[layout]] helps readers see.", "zh": "我们曾在匆忙中点击；如今我们慢慢阅读，而体贴的版面设计帮助读者看清内容。"}, {"en": "Each [[march]] for science begins [[on]] a campus lawn, and every [[paraphrase]] of research must stay faithful.", "zh": "每一场科学游行都始于校园草坪，而对研究成果的每一次转述都必须忠实于原意。"}, {"en": "A mother's [[purse]] is not bottomless; the [[ratio]] of price to value matters, and the [[scale]] of change exceeds one [[week]].", "zh": "母亲的钱包并非取之不尽；价格与价值之比至关重要，而变革的规模远超一周的时间。"}, {"en": "In a [[stuffy]] archive we [[study]] how nations [[underfund]] schools at their peril.", "zh": "在一间闷热的档案馆里，我们研究各国如何因对学校投入不足而自食其果。"}, {"en": "Ideas travel through translation, and even a [[beard]] can become a campus symbol of dissent.", "zh": "思想借由翻译传播，即便是一把胡须也能成为校园里表达异议的象征。"}, {"en": "A first [[career]] job may [[cost]] sleep, but no one forgets the smell of a [[cottage]] library.", "zh": "第一份正式工作或许要以睡眠为代价，但谁也不会忘记乡间小屋图书馆的气息。"}, {"en": "Over one [[decade]], a [[far-off]] theory became routine, and the [[ghost]] of superstition faded as trucks [[haul]] vaccines through the night.", "zh": "十年之间，一个遥远的理论变得稀松平常；当卡车连夜运送疫苗时，迷信的幽灵也随之消散。"}, {"en": "The [[neural]] networks of our age are [[online]] before children can read, and every [[parent]] faces a [[rational]] fear.", "zh": "我们这个时代的神经网络，在孩子识字之前就已上线；每位父母都面临着一种合乎情理的担忧。"}, {"en": "Yet fear should not [[stun]] us; each [[scene]] of discovery can [[vibrate]] through a classroom, and a nation's [[style]] of curiosity begins in its [[subconscious]] habits.", "zh": "然而恐惧不应令我们惊呆；每一个发现的场景都能在教室里引发共鸣，一个民族好奇的风格，正始于其潜意识中的习惯。"}, {"en": "An [[undergraduate]] who asks good questions may [[weep]] at failure, then return with renewed [[accord]] between ambition and humility.", "zh": "善于提问的本科生或许会因失败而落泪，随后又会归来，在抱负与谦逊之间达成新的协调。"}, {"en": "Markets [[beat]] on, and every [[carrier]] of information must [[count]] its social cost.", "zh": "市场依旧跳动不息，每个信息的载体都必须计算其社会成本。"}, {"en": "A [[brush]] with failure teaches more than success, and fields [[burn]] before new growth.", "zh": "与失败的一次擦肩比成功更能教会人成长；田野也总要先经焚烧，才会有新的生长。"}, {"en": "One [[acre]] of forest stores more carbon than a thousand speeches, and [[lumber]] must be cut with restraint.", "zh": "一英亩森林储存的碳，胜过一千场演讲；木材的采伐必须有所节制。"}, {"en": "We [[swap]] waste for reuse, [[unite]] across borders, and [[launch]] satellites to watch the ice.", "zh": "我们以废物换取再利用，跨越国界联合起来，并发射卫星监测冰川。"}, {"en": "No [[skyrocket]] of prices should [[strip]] families of heat, and no [[raid]] on science budgets goes unanswered.", "zh": "价格的飞涨不应剥夺家庭的取暖之资，对科学预算的任何砍削也不会无人回应。"}, {"en": "A [[raisin]] in the lunchbox, a [[bunch]] of students at the gate, a [[staple]] of bread—these small things hold civilization.", "zh": "饭盒里的一粒葡萄干、大门口的一群学生、一块主食面包——正是这些小事维系着文明。"}, {"en": "[[Aboard]] the same warming planet, every [[homeowner]] shares one roof.", "zh": "在同一个日益变暖的星球上，每位房主都共顶着一片屋顶。"}, {"en": "There is no [[shortcut]] to wisdom, and no easy [[scenario]]; only patient work, [[via]] steady habits, will [[improvement]] bring.", "zh": "智慧没有捷径，也没有轻松的剧本；唯有凭借持之以恒的习惯耐心耕耘，进步才会到来。"}]}, {"key": "三星词汇 Day 05 List 10", "words": [{"w": "counter", "phon": "[ˈkaʊntər]", "def": "n.柜台；对立面v.反驳；抵消adv.相反地", "si": [30], "dists": [1449, 1875, 822]}, {"w": "counterculture", "phon": "[ˈkaʊntərkʌltʃər]", "def": "n.反主流文化；反正统文化", "si": [31], "dists": [3448, 411, 305]}, {"w": "decent", "phon": "[ˈdis(ə)nt]", "def": "adj.像样的；体面的；正派的", "si": [5], "dists": [636, 2232, 2772]}, {"w": "far-reaching", "phon": "[ˌfɑrˈritʃɪŋ]", "def": "adj.深远的；影响深远的", "si": [1], "dists": [2089, 1549, 12]}, {"w": "gift", "phon": "[ɡɪft]", "def": "n.礼物；天赋", "si": [3], "dists": [3259, 2422, 2027]}, {"w": "have", "phon": "[hæv]", "def": "v.有；吃；得到", "si": [39], "dists": [2452, 1473, 995]}, {"w": "impact", "phon": "[ˈɪmpækt]", "def": "n.冲击（力）；影响力v.冲击；撞击；对…产生影响", "si": [1], "dists": [1135, 866, 646]}, {"w": "lead", "phon": "[lid]", "def": "v.领导；带领；导致n.铅", "si": [35], "dists": [3049, 1715, 1474]}, {"w": "marine", "phon": "[məˈrin]", "def": "adj.海的；与海有关的n.水兵；海军陆战队士兵；舰队；海运业", "si": [14], "dists": [366, 315, 2365]}, {"w": "never", "phon": "[ˈnevər]", "def": "adv.从未；决不", "si": [27], "dists": [397, 2653, 1877]}, {"w": "open", "phon": "[ˈəʊpən]", "def": "v.打开；开放adj.开放的；营业的n.公开；户外", "si": [27], "dists": [1460, 1184, 1279]}, {"w": "part", "phon": "[pɑrt]", "def": "n.部分；局部；零件；角色v.分离；分开", "si": [39], "dists": [1517, 751, 2471]}, {"w": "raw", "phon": "[rɔ]", "def": "adj.生的；未加工处理过的", "si": [14], "dists": [3247, 3339, 1308]}, {"w": "su  [[far-reaching]]: [[software]] now quietly directs hospital queues and harvest schedules alike, and the [[reach]] of computation extends to every [[scope]] of human endeavor.", "zh": "事实证明，它的影响极为深远：如今软件在无形中调度着医院的候诊队列与农作物的收割日程，莫不如此；而计算的范围已延伸至人类事业的每一个角落。"}, {"en": "Maya, once a curious [[pupil]] at a village [[school]], arrived on a crowded university [[campus]] determined to [[learn]] computer [[science]].", "zh": "玛娅曾是乡村学校里一个充满好奇心的学生，她来到拥挤的大学校园，下定决心学习计算机科学。"}, {"en": "Her [[gift]] for a narrow [[subfield]] — machine ethics — earned her the highest [[grade]] in her cohort and the [[courage]] to ask unfashionable questions.", "zh": "她在一个狭窄的子领域——机器伦理——上的天赋，为她赢得了同届学生中的最高成绩，也赋予她提出不合时宜问题的勇气。"}, {"en": "As a [[newcomer]] among the metropolitan [[elite]], she was soon approached by a [[headhunter]] dangling a [[lucrative]] [[opportunity]] at a [[renowned]] firm.", "zh": "作为跻身大都市精英中的新人，很快就有一名猎头找上她，以一家知名公司待遇丰厚的机会相诱。"}, {"en": "To [[tempt]] her further, the recruiter hinted that [[well-educated]] and [[well-connected]] colleagues would [[envy]] her salary; it was, by any honest measure, a [[decent]] offer.", "zh": "为了进一步打动她，招聘人员暗示说，那些受过良好教育、人脉广泛的同事都会羡慕她的薪水；平心而论，这是一份相当体面的录用条件。"}, {"en": "Her daily work involved [[coding]] recommendation engines that [[operate]] on a simple [[equation]] of attention and profit.", "zh": "她的日常工作是编写推荐引擎，这类引擎依照“注意力与利润”这一简单的等式运行。"}, {"en": "She tried to [[craft]] each [[creation]] responsibly, yet every [[milestone]] felt less like a [[landmark]] of progress than a [[mark]] of compromise, so she accepted a public [[commission]] to investigate the industry.", "zh": "她试图负责任地打造每一件作品，然而每一个里程碑都与其说是进步的地标，不如说是妥协的印记，于是她接受了一项委托，公开调查这一行业。"}, {"en": "The [[e-commerce]] boom had transformed the [[market]] beyond recognition; the digital [[marketplace]] traded around the clock, [[cash]] grew scarce, and investors paid a [[premium]] for growth.", "zh": "电子商务的繁荣已使市场变得面目全非；数字集市昼夜不停地交易，现金日益稀缺，投资者则为增长支付溢价。"}, {"en": "Funds continued to [[invest]] and [[accumulate]] — a [[million]] users here, a billion there — while few paused to ask why.", "zh": "资金不断流入、不断堆积——这里一百万用户，那里十亿——却很少有人停下来问一问缘由。"}, {"en": "In one [[newsroom]] after another, editors mourned the death of [[newsprint]] and the shuttered [[newsstand]] on the corner.", "zh": "在一间又一间编辑部里，编辑们哀悼新闻纸的消亡，也哀悼街角那家关门停业的报亭。"}, {"en": "An untraceable [[leak]] then exposed the [[falsehood]] that engagement equals truth, showing how outrage can [[incite]] clicks, how [[falsely]] framed headlines shape public [[opinion]], and how every [[viewpoint]] downstream rewards the most [[vocal]] voices.", "zh": "随后，一则无法追查来源的泄露揭穿了“参与度等于真相”的谬见，暴露出愤怒如何能够煽动点击，被歪曲炮制的标题如何塑造公众舆论，而下游的每一种观点又如何只回报那些嗓门最大的声音。"}, {"en": "A [[lawsuit]] followed, and parliament debated an [[amendment]] to media [[law]].", "zh": "一场诉讼随之而来，议会也就一项媒体法修正案展开辩论。"}, {"en": "Legislators voted to [[enact]] a [[ban]] on manipulative design, adopted [[government-defined]] transparency standards, and moved to [[block]] [[single-use]] plastics — from carrier bags to disposable [[cutlery]] — in the same session, while the [[grocery]] lobby protested loudly.", "zh": "立法者投票通过对操纵性设计颁布禁令，采纳由政府界定的透明度标准，并在同一次会议上着手取缔一次性塑料制品——从购物袋到一次性餐具——而食品杂货业的游说团体则高声抗议。"}, {"en": "The environmental evidence was [[devastating]]: [[marine]] life choked in every [[basin]], [[geological]] strata recorded our [[raw]] refuse, and [[rampant]] consumption left a [[pile]] of debris beneath the urban [[haze]].", "zh": "环境方面的证据令人震惊：每一片海域都有海洋生物窒息，地质岩层记录下我们的原生垃圾，猖獗的消费在城市雾霾之下留下成堆的残骸。"}, {"en": "Coastal communities [[suffer]] first, and complacency could [[undermine]] decades of patient conservation.", "zh": "沿海社区首当其冲，而自满可能使数十年耐心保护的成果毁于一旦。"}, {"en": "Seeking perspective, Maya fled to the [[countryside]], crossing half the [[country]] like a restless [[traveller]].", "zh": "为了换一种眼光审视生活，玛娅逃向乡间，像一个停不下来的旅人，横穿了半个国家。"}, {"en": "The [[trip]] took her by [[underground]] to a coastal town where a modest [[hotel]], a public [[library]] with an ancient [[photocopier]], and a small [[opera]] house stood side by side; she worked from a [[portable]] laptop on the shore.", "zh": "这趟旅程带她乘地铁来到一座海滨小镇，那里一家朴素的旅馆、一座配有古老复印机的公共图书馆和一座小巧的歌剧院并肩而立；她在海边用一台便携笔记本电脑工作。"}, {"en": "There she began to [[decide]] what [[else]] mattered: to [[give]] more than she took, to [[carry]] the burdens of others, and to [[weigh]] her own ambitions honestly.", "zh": "在那里，她开始判断还有什么真正重要：付出要多于索取，分担他人的重担，并诚实地掂量自己的抱负。"}, {"en": "Each [[step]] required a [[push]] and, occasionally, a gentle [[nudge]] from friends; she learned to [[react]] calmly under pressure and to [[behave]] with integrity when nobody was watching.", "zh": "每一步都需要奋力一推，偶尔还需要朋友温柔的督促；她学会了在压力之下从容应对，在无人注视时仍以正直自持。"}, {"en": "She met her future [[partner]] at a dinner [[party]], and the [[couple]] would eventually [[marry]] beneath the stars at [[nightfall]].", "zh": "她在一次晚宴上结识了未来的伴侣，两人最终在黄昏时分的星空下结为夫妻。"}, {"en": "A sudden [[giggle]] broke the solemn toasts, someone compared love to a [[throne]] that no one wishes to occupy alone, and the host joked that chopping an [[onion]] produced the only honest tears of the evening; later they collapsed into [[bed]], laughing at the [[weird]] turns of fortune.", "zh": "一声突如其来的轻笑打断了庄重的祝酒；有人把爱情比作一把没人愿意独自端坐的王座，主人则打趣说，切洋葱催出的眼泪是今晚唯一真诚的泪水；后来他们瘫倒在床上，笑谈命运种种离奇的转折。"}, {"en": "Meanwhile the [[craze]] for speculative tokens swept the financial world, where [[fashion]] dictated investment more than reason.", "zh": "与此同时，投机性代币的狂热席卷了金融界，在那里，支配投资的与其说是理性，不如说是风尚。"}, {"en": "A promoter in an expensive [[suit]] tried to [[hawk]] exotic derivatives to pensioners before the inevitable [[crash]] — a [[snap]] of confidence, a [[crack]] in credit markets, a final [[blow]] that spread [[terror]] — and the whole [[cast]] of evangelists vanished before regulators could [[cap]] their leverage.", "zh": "一个身穿昂贵西装的推销者，在不可避免的崩盘到来之前，竭力向养老金领取者兜售光怪陆离的衍生品——信心骤然崩断，信贷市场裂开一道缝，最后是散播恐慌的致命一击——而整群鼓吹者在监管者尚未来得及限制其杠杆时，便已消失得无影无踪。"}, {"en": "The causes were [[subtle]] yet [[distinct]] from ordinary greed: a [[partial]] regulator, a [[tense]] public mood, widespread [[insecurity]], and quiet [[distress]].", "zh": "其成因微妙，却又与寻常的贪婪不同：偏袒一方的监管者、紧张的公众情绪、普遍的不安全感，以及暗自煎熬的痛苦。"}, {"en": "Simple explanations [[elude]] us, interviews [[elicit]] only contradiction, and the full [[puzzle]] resists solution, for few truly [[understand]] systemic risk.", "zh": "简单的解释总与我们失之交臂，访谈只能引出矛盾，整个谜题始终拒绝被解开，因为几乎没有人真正理解系统性风险。"}, {"en": "Recovery was [[slow]] and then suddenly [[fast]].", "zh": "复苏起初迟缓，继而突飞猛进。"}, {"en": "[[Newly]] cautious firms adopted [[new]] norms, promises once broken were [[never]] repeated in quite the same way, and reformers kept the doors of debate [[open]].", "zh": "新近变得谨慎的公司采用了新的规范，曾经背弃的承诺再也没有以完全相同的方式重演，改革者则让辩论的大门始终敞开。"}, {"en": "The settlement, when it came, felt [[ready]]-made; no one claimed a [[painlessly]] won [[victory]], yet the reform was a genuine [[success]] and, for once, a [[real]] one.", "zh": "和解到来时，给人一种早已备好的感觉；没有人声称这是一场毫不费力得来的胜利，但这场改革是一次真正的成功，而且这一回，是名副其实的成功。"}, {"en": "'[[Please]],' one official murmured, 'let it hold.'", "zh": "“拜托，”一位官员低声说道，“就让它维持下去吧。”"}, {"en": "Critics offered a [[counter]] narrative.", "zh": "批评者给出了一种相反的叙事。"}, {"en": "A [[counterculture]] of frugal living, long dismissed as the [[vice]] of an [[unpopular]] fringe, began to gain ground, and even the habitual [[cynic]] conceded the [[bold]] [[suggestion]] that growth, as a [[term]], can [[presuppose]] limits — a [[view]] finally worth serious debate.", "zh": "一种奉行节俭生活的反文化，长期以来被斥为不得人心的边缘群体的恶习，此时开始站稳脚跟；就连惯于冷嘲热讽的人也承认，那个大胆的主张——“增长”作为一个概念，可能预先设定了极限——是一种终于值得认真辩论的观点。"}, {"en": "The [[overarching]] lesson was that societies must [[forge]] resilience [[amid]] uncertainty.", "zh": "统领一切的教训是：社会必须在不确定性之中铸就韧性。"}, {"en": "Crises [[creep]] in quietly; every [[hindrance]] ignored will [[tend]] to grow, [[subsequent]] shocks demand [[lean]] institutions, and [[reliance]] on bailouts corrodes responsibility.", "zh": "危机总是悄无声息地潜入；每一个被忽视的障碍都往往会不断滋长，接踵而至的冲击要求机构精简高效，而依赖纾困则会侵蚀责任感。"}, {"en": "Leaders must [[carve]] waste from budgets and [[upgrade]] infrastructure before collapse forces their hand.", "zh": "领导者必须趁崩溃尚未迫使他们就范之前，从预算中裁撤浪费、升级基础设施。"}, {"en": "The chief [[architect]] of the reforms chose to [[lead]] from the [[head]] of the table rather than from [[behind]].", "zh": "这场改革的总设计师选择坐在桌首引领方向，而不是躲在幕后指挥。"}, {"en": "The [[course]] of the crash taught her to [[cover]] blind spots, to refuse to [[swallow]] easy slogans — even a report's [[subtitle]] deserved scrutiny — and to remember that the [[least]] protected citizens matter most, since policy serves a nation [[well]] only when tested against their lives.", "zh": "崩盘的历程教会她：要弥补盲点，拒绝囫囵吞下轻率的口号——哪怕是报告的副标题也值得细察——并牢记受保护最少的公民才最要紧，因为政策唯有以他们的生活加以检验，才能很好地服务于一个国家。"}, {"en": "Against this [[backdrop]], no mentor needs to [[coax]] the next generation into lecture halls [[packed]] with idealists, for idealism renews itself by a quiet mechanism [[whereby]] example begets example.", "zh": "在这样的背景下，没有导师需要把下一代哄进挤满理想主义者的讲堂，因为理想主义凭借一种无声的机制自我更新：榜样催生榜样。"}, {"en": "These students will travel [[farther]] than their teachers, [[juggle]] competing duties, stand on the [[verge]] of exhaustion, recover on some high [[plateau]] of reflection, and display the [[foresight]] their elders lacked.", "zh": "这些学生将走得比他们的老师更远，同时应付彼此竞争的职责，站在精疲力竭的边缘，在某座沉思的高地上恢复元气，并展现出长辈们所欠缺的远见。"}, {"en": "We [[have]] only one world, and each of us is [[part]] of its unfinished story.", "zh": "我们只有一个世界，而我们每一个人都是它未竟故事的一部分。"}]}, {"key": "三星词汇 Day 06 List 11", "words": [{"w": "ember", "phon": "[ˈembər]", "def": "n.灰烬；余烬", "si": [0], "dists": [3386, 465, 2653]}, {"w": "fate", "phon": "[feɪt]", "def": "n.命运；宿命", "si": [0], "dists": [1512, 1225, 1179]}, {"w": "glare", "phon": "[ɡler]", "def": "v.发出刺眼的光；怒目而视；瞪视n.闪耀光；刺眼；瞪眼", "si": [2], "dists": [877, 422, 55]}, {"w": "headline", "phon": "[ˈhedlaɪn]", "def": "n.大字标题；头条", "si": [1], "dists": [156, 1598, 448]}, {"w": "imply", "phon": "[ɪmˈplaɪ]", "def": "v.暗示；意味", "si": [1], "dists": [534, 2695, 1950]}, {"w": "leave", "phon": "[liv]", "def": "v.离开；离去；留下n.休假", "si": [ f": "adj.不诚恳的；不真心的", "si": [41], "dists": [427, 69, 2730]}, {"w": "senate", "phon": "[ˈsenət]", "def": "n.参议院", "si": [42], "dists": [1866, 3410, 2060]}, {"w": "parity", "phon": "[ˈpærəti]", "def": "n.相等；等值；同等", "si": [42], "dists": [1517, 2230, 2648]}, {"w": "quota", "phon": "[ˈkwəʊtə]", "def": "n.配额；限额；定额", "si": [42], "dists": [1185, 3495, 3102]}, {"w": "little", "phon": "[ˈlɪt(ə)l]", "def": "adj.少的；小的", "si": [42], "dists": [1842, 2284, 1137]}, {"w": "frown", "phon": "[fraʊn]", "def": "v.皱眉；蹙额n.皱眉；蹙额", "si": [42], "dists": [2621, 1689, 2572]}, {"w": "self-serving", "phon": "[ˌselfˈsɜrvɪŋ]", "def": "adj.谋取私利的；自私自利的", "si": [42], "r": "self(自己)+serve(服务)→只为自己", "dists": [1677, 1019, 1130]}, {"w": "court", "phon": "[kɔrt]", "def": "n.法院；球场；宫廷v.求爱；献殷勤；招致", "si": [42], "dists": [1376, 3020, 1488]}, {"w": "mirror", "phon": "[ˈmɪrər]", "def": "n.镜子v.反射；反映", "si": [43], "dists": [2247, 757, 2434]}, {"w": "golden", "phon": "[ˈɡəʊldən]", "def": "adj.金色的；绝好的", "si": [43], "dists": [1895, 877, 1767]}, {"w": "scoop", "phon": "[skup]", "def": "n.勺子；球型勺；长柄勺；独家新闻v.用勺舀；挖空；抢先获得", "si": [43], "dists": [1520, 1463, 3082]}, {"w": "everything", "phon": "[ˈevriθɪŋ]", "def": "pron.每件事；一切事物", "si": [43], "dists": [2705, 2255, 2632]}], "sents": [{"en": "Every era ends, I think, not with an explosion but with a cooling [[ember]], and no columnist can decree the [[fate]] of the age she happens to inhabit.", "zh": "我想，每个时代的终结都不是伴随着一声轰然巨响，而是随着余烬渐渐冷却；没有哪个专栏作家能够裁定她恰好置身其中的这个时代的命运。"}, {"en": "I still remember the morning whose largest [[headline]] stared up from the breakfast page; its phrasing seemed to [[imply]] that the country had chosen to [[leave]] its old self behind, as though a recurring [[nightmare]] had been ordered to [[pass]] and never return.", "zh": "我仍记得那个早晨，最醒目的大字标题从早餐版上赫然映入眼帘；其措辞似乎在暗示，这个国家已选择将旧我抛在身后，仿佛一场反复出现的噩梦被勒令退场、永不再来。"}, {"en": "Editors measured the story by a familiar [[score]]: a luxury [[suite]] booked for the visiting envoy, a [[superb]] trade figure, and the hard [[glare]] of cameras on the courthouse steps.", "zh": "编辑们用一套熟悉的标准来衡量这则报道：为来访特使预订的豪华套房、一组骄人的贸易数据，以及法院台阶上摄像机刺眼的强光。"}, {"en": "Beyond the capital, [[superhigh]] rents and crowded express roads now [[test]] the patience of commuters, and a single scandal can [[undo]] a career built over decades.", "zh": "在首都之外，高企的房租和拥挤的快速路如今考验着通勤者的耐心，而一桩丑闻就能毁掉一段经营数十年的职业生涯。"}, {"en": "What strikes the visitor is the [[vigor]] of the coastal cities and, in the older market towns, a quieter [[vigour]] of a kind once described by a [[well-known]] novelist: the stubborn loyalty of people who feel they [[belong]] to a particular valley.", "zh": "令来访者深受触动的，是沿海城市的活力；而在那些更古老的集镇里，则有一种更为沉静的生机——正如一位知名小说家曾描写过的那种：自觉属于某一处山谷的人们所怀有的固执忠诚。"}, {"en": "A reservoir that once fed a [[cataract]] of white water now sits low; children who used to play [[cricket]] on the common read about a [[criminal]] gang and a fiscal [[crisis]] in the same bulletin.", "zh": "曾经奔涌出白色瀑布的水库如今水位低落；过去常在公地上打板球的孩子们，在同一份新闻简报里读到犯罪团伙与财政危机的消息。"}, {"en": "Whether the dislocation is anyone's [[fault]] is harder to say; a faint [[gleam]] of prosperity is visible even in the gloomiest lanes, yet progress has rushed [[headlong]] into places that had [[no]] appetite for it.", "zh": "这种脱节究竟是谁的过错，更难断言；即便在最阴郁的小巷里也能看到一丝繁荣的微光，然而进步却一头扎进了那些对它毫无渴求的地方。"}, {"en": "To resist is [[not]] a realistic [[option]] for the young, who throw themselves into commerce with genuine [[passion]], hoping to [[reap]] rewards their parents never imagined.", "zh": "对年轻人而言，抗拒并不是一个现实的选择；他们满怀真正的热情投身商海，希望收获父辈从未想象过的回报。"}, {"en": "Advertising teaches them that a pricier product is always [[superior]], that a sports [[superstar]] deserves their devotion, and even old [[superstition]] has been rebranded as content for the feeds.", "zh": "广告教会他们：更贵的产品总是更优越，体育巨星值得他们倾心，就连古老的迷信也被重新包装成信息流里的内容。"}, {"en": "Demographers called to [[testify]] before committees will [[undoubtedly]] confirm what every [[village]] elder already knows.", "zh": "被传唤到各委员会作证的人口统计学家，无疑会证实每一位村中长者早已知道的事情。"}, {"en": "A [[well-meaning]] teacher sitting on a wooden [[bench]] outside the school can still [[catch]] the mood before anyone else: whether the [[crop]] will be sold, why the river's fish [[decrease]] year by year, which families stand in [[favor]] with the local committee and which have fallen out of [[favour]] since the last election.", "zh": "一位坐在校门外木凳上的善意老师，仍能比任何人都更早捕捉到这种情绪：庄稼能否卖出去，河里的鱼为何逐年减少，哪些家族受地方委员会青睐，哪些又自上次选举之后失宠。"}, {"en": "From where she sits, one may [[glimpse]] the entire national argument in miniature.", "zh": "从她落座的地方，人们便可以窥见整个国家纷争的缩影。"}, {"en": "It is [[impossible]] to discuss the district without hearing of the wartime [[massacre]], a wound that even the most [[noble]] rhetoric has failed to close; historians preserve the survivors' [[oral]] testimony against the slow erosion of the [[past]].", "zh": "谈论这个地区，就不可能不听说那场战时大屠杀——一道即使最高尚的辞令也未能弥合的伤口；历史学家保存着幸存者的口述证词，抵御着往昔被缓慢侵蚀。"}, {"en": "There is a sound [[reason]] to publish this record as a [[supplement]] to the school [[text]], along the lane where every mill [[wheel]] once turned at each familiar [[bend]] of the river.", "zh": "把这份记录作为学校教材的补充出版，自有其充分的理由；就在那条小巷旁，每座磨坊的水轮曾随着河流每一处熟悉的弯转而转动。"}, {"en": "Such material belongs to its own [[category]] of memory, civic rather than commercial.", "zh": "这类材料属于它自己特有的记忆范畴：公民性的，而非商业性的。"}, {"en": "Tourists still [[cross]] the old bridge at dawn, when a lone [[crow]] calls from the poplar and an [[eminent]] professor, visiting from the capital, admits that what she once used to [[fear]] most—homogenization across the [[globe]]—has arrived.", "zh": "黎明时分，游客们仍会走过那座老桥；一只孤零零的乌鸦在杨树上啼叫，一位从首都来访的知名教授承认，她曾经最惧怕的东西——席卷全球的同质化——已经到来。"}, {"en": "The [[heavy]] trucks never failed to [[impress]] her with their scale, yet she questioned the official [[position]] that every change was unambiguously [[positive]].", "zh": "那些重型卡车的体量总能给她留下深刻印象，然而她质疑那种官方立场，即每一项变化都毫无疑问是积极的。"}, {"en": "Even the [[mass-market]] billboards, she noted with a [[nod]], now advertised nostalgia itself.", "zh": "她点点头指出，就连面向大众市场的广告牌，如今兜售的也是怀旧本身。"}, {"en": "At dusk the sky turned a soft [[orange]], and the national [[pastime]] in the square was to [[recall]] the day's gossip while fingers continued to [[search]] for bargains on phones that [[supply]] endless diversion and [[support]] a thousand small traders.", "zh": "黄昏时分，天空染上柔和的橙色；广场上全民的消遣是回顾白天的种种闲话，手指却不停地在手机上搜寻便宜货——这些手机既提供无尽的消遣，也养活着上千个小商贩。"}, {"en": "A revived [[textile]] workshop had begun to [[assemble]] garments for a brand as far away as [[Virginia]]; its manager, a former stable hand who could still [[whip]] a cart up a muddy lane, insisted that [[accessibility]] mattered more than prestige.", "zh": "一家复苏的纺织作坊开始为一个远在弗吉尼亚的品牌缝制服装；其经理曾是马厩伙计，至今仍能挥鞭赶着马车冲上泥泞的小巷，他坚持认为，便利可达比声望更重要。"}, {"en": "Such claims [[annoy]] the planners in the [[capital]], for whom the boundary between city and countryside continues to [[blur]]; a [[consulting]] firm, applying strict quantitative [[criteria]], recommended that every household receive a [[device]] capable of monitoring irrigation and that the village finally [[ditch]] its paper ledgers.", "zh": "这类说法令首都的规划者们恼火，在他们看来，城市与乡村之间的界线仍在继续模糊；一家咨询公司运用严格的量化标准，建议每户家庭都领到一台能够监控灌溉的设备，并建议村庄最终抛弃纸质账簿。"}, {"en": "Notices arrived first by [[e-mail]] and again by [[email]] reminder, an accident of this anxious [[era]], while a desk [[fan]] stirred the humid air of the office.", "zh": "通知先是通过电子邮件发来，随后又有一封电邮提醒——这是这个焦虑时代的意外产物；与此同时，一台台式电扇搅动着办公室里潮湿的空气。"}, {"en": "Few residents could [[forget]] the afternoon an elderly [[granny]], detecting a [[hint]] of condescension in the officials' questions, demanded a formal [[investigation]] into missing subsidies; [[laziness]], she declared, was a luxury no poor family could afford.", "zh": "几乎没有居民能忘记那个下午：一位年迈的老奶奶察觉出官员们提问中带着一丝屈尊俯就，要求对失踪的补贴展开正式调查；她宣称，懒惰是任何贫困家庭都负担不起的奢侈品。"}, {"en": "Water, once a gift, had become a tradable [[commodity]], and the new [[mindset]] taught people to [[extract]] profit from the [[majestic]] mountains rather than reverence them.", "zh": "水曾是上天的馈赠，如今却成了可交易的商品；新的心态教导人们从巍峨的群山之中榨取利润，而非对它们心怀敬畏。"}, {"en": "Whatever [[nobility]] the landscape retained, it had a determined [[opponent]] in the balance sheet.", "zh": "无论这片山水保留了多少崇高之气，它在资产负债表面前都有一个坚定不移的对手。"}, {"en": "For the young, the city promised a more [[pleasurable]] life: they would [[probably]] attend a fashion show where a model hailed as the [[queen]] of the [[runway]] paraded gowns stitched from local silk.", "zh": "对年轻人来说，城市许诺了一种更愉悦的生活：他们多半会去看一场时装秀，一位被誉为 T 台女王的模特在台上展示用本地丝绸缝制的礼服。"}, {"en": "Psychologists warn that such spectacles can inflate [[self-esteem]] only transiently; [[socially]] ambitious teenagers saved for a designer [[sticker]] on their phone case, a cheaply [[symbolic]] gesture.", "zh": "心理学家警告说，这类场面只能短暂地抬高自尊；在社交上野心勃勃的青少年攒钱，只为给手机壳贴上一枚名牌贴纸——一种廉价的象征性姿态。"}, {"en": "Researching any of this properly is [[time-consuming]], yet one must [[try]], however [[unreasonable]] the deadline appears.", "zh": "要把这一切妥帖地研究清楚是件耗时的事，然而无论截止日期显得多么不合情理，人都必须一试。"}, {"en": "The gala opened with a [[voluntary]] chorus and a [[whopping]] donation from a tycoon whose every public [[act]] was choreographed; tables groaned with every [[cate]] the region could boast, chosen to [[complement]] the wines.", "zh": "庆典以一支自发的合唱开场，还有一位大亨捐出的巨额款项，此公的每一次公开亮相都经过精心编排；桌上琳琅满目，摆满了该地区所能夸耀的每一道佳肴，且皆经挑选以佐配美酒。"}, {"en": "A replica [[crown]] sat under a glass [[dome]], and guards were ready to [[crush]] any disturbance, though the loudest [[emotion]] on display was the [[gloom]] of excluded residents watching from behind a [[hedge]].", "zh": "一顶复制品王冠置于玻璃穹顶之下，警卫随时准备镇压任何骚动；然而现场最强烈的情绪，是被拒之门外的居民在树篱后观望时的阴郁。"}, {"en": "Critics called the pageant [[improper]] in a time of austerity, arguing that [[leisure]] on such a scale belonged to a [[master]] of industry, not to a [[noisy]] minority; a single muddy [[patch]] behind the marquee flooded every [[season]].", "zh": "评论家称这场盛大表演在紧缩年代不合时宜，认为如此规模的享乐属于工业巨头，而不属于一群喧闹的少数派；帐篷后面一块泥泞的空地每到当令时节就被淹没。"}, {"en": "To be [[sure]], the organizers had reasons to [[thank]] nobody but themselves when questions of [[unfairness]] arose, and the mayor was caught in a [[whirl]] of interviews from which not even the most [[active]] press officer could rescue him.", "zh": "诚然，当不公的质疑出现时，组织者怨不得别人，只能怪自己；市长陷入了应接不暇的采访漩涡，连最积极的新闻官也无法把他解救出来。"}, {"en": "Standing [[beside]] the ruined bandstand, one understood that [[besides]] corruption a deeper [[cause]] was at work: the ancient compact between town and land.", "zh": "站在倾颓的露天音乐台旁，人会明白：除了腐败之外，还有一种更深层的原因在起作用——城镇与土地之间古老的契约。"}, {"en": "A child began to [[cry]] over a dropped [[cucumber]] while her mother joined the strange [[cult]] of the new phone, whose screen began to [[glow]] at the [[height]] of every dinner.", "zh": "一个孩子因为掉了一根黄瓜哭了起来，而她的母亲则加入了对新手机的古怪膜拜——每到晚饭最热闹的时刻，手机屏幕便亮了起来。"}, {"en": "Few gadgets genuinely [[improve]] fellowship or [[lend]] an evening the gravity of a genuine [[masterpiece]].", "zh": "鲜有小玩意儿能真正增进情谊，或为一个夜晚赋予真正杰作般的庄重感。"}, {"en": "In [[order]] to make sense of the [[patchwork]] landscape, I sought out a retired diplomat who kept no [[secret]] about the recent [[surge]] of capital into the valley; his brother, a [[surgeon]], thought the hospital's new wing would [[surpass]] any clinic in the province.", "zh": "为了理解这片拼布般斑驳的风景，我找到一位退休外交官，他对近期资本涌入山谷的情形毫不隐讳；他的兄弟是一位外科医生，认为医院的新翼楼将胜过全省任何一家诊所。"}, {"en": "The old [[theatre]] had reopened as a cinema, though locals still called it the [[theater]], and an [[unfashionable]] playwright, once a household name, would [[whisper]] that his [[bestseller]] had outlived him.", "zh": "老剧院已作为电影院重新开放，尽管当地人仍叫它“剧场”；一位不再时髦的剧作家——曾是家喻户晓的名字——会低声感叹，他那部畅销书比他本人活得更久。"}, {"en": "His [[best-seller]] on statecraft urged [[caution]]: a [[culture]] that cannot [[curb]] its appetites will imagine every [[cure]] is for sale.", "zh": "他那部论述治国之道的畅销书敦促人们谨慎：一种无法克制自身欲望的文化，会幻想每一种药方都可以买到。"}, {"en": "What can a lone writer [[do]], when institutions are [[feeble]] and the ambitious [[go]] where the grants lead?", "zh": "当机构孱弱、雄心勃勃者跟着拨款的指引四处奔走时，一个孤立无援的写作者又能做什么呢？"}, {"en": "Readers still write for [[help]], describing an [[inability]] to focus for [[long]] on anything longer than a caption.", "zh": "读者仍写信求助，诉说自己无法长时间专注于任何比一则图片说明更长的文字。"}, {"en": "Technocrats promise [[mastery]] as though society were an [[organ]] to be tuned; the technology [[sector]] posts a trade [[surplus]] one quarter and, to nobody's [[surprise]], reports data [[theft]] the next.", "zh": "技术官僚们许诺掌控一切，仿佛社会是一个可以调试的器官；技术行业一个季度公布贸易顺差，而毫不令人意外，下一个季度便报告数据失窃。"}, {"en": "An [[unfavorable]] exchange rate here, an [[unfavourable]] review there, and even a [[virtuoso]] of public relations cannot repair an [[ecosystem]] wounded by years of [[insincere]] promises.", "zh": "这里是不利的汇率，那里是负面的评论，即便是公关高手，也无法修复一个被多年虚伪承诺所伤的生态系统。"}, {"en": "The [[senate]] debated farm [[parity]] and a new import [[quota]] while a [[little]] clerk allowed himself a [[frown]], aware that the most [[self-serving]] argument tends to [[court]] applause rather than truth.", "zh": "参议院就农业平价和一项新的进口配额展开辩论，一名小职员却容许自己皱了皱眉——他意识到，最自私自利的论点往往博取的是掌声，而非真相。"}, {"en": "A free press can [[mirror]] such moments, and occasionally a reporter stumbles on a [[golden]] [[scoop]] that explains [[everything]] at once, provided she remembers that the story belongs, in the end, to the people whose lives it describes.", "zh": "自由的新闻界能够映照这样的时刻；偶尔，一名记者会挖到一条黄金独家新闻，一下子把所有事情解释清楚——只要她记得，这则报道最终属于它所描写其生活的那些人。"}]}, {"key": "三星词汇 Day 06 List 12", "words": [{"w": "cave", "phon": "[keɪv]", "def": "n.洞穴", "si": [20], "dists": [1467, 2169, 1924]}, {"w": "curious", "phon": "[ˈkjʊriəs]", "def": "adj.好奇的", "si": [0], "dists": [2420, 1595, 1488]}, {"w": "routine", "phon": "[ruːˈtin]", "def": "n.常规；例行公事adj.常规的；例行公事的", "si": [0], "dists": [3331, 173, 3351]}, {"w": "curse", "phon": "[kɜrs]", "def": "v.诅咒；咒骂n.诅咒；咒骂", "si": [18], "dists": [1488, 1732, 1784]}, {"w": "deem", "phon": "[dim]", "def": "v.认为；觉得", "si": [2], "dists": [3285, 964, 90]}, {"w": "feed", "phon": "[fid]", "def": "v.喂；吃；饲养n.饲养；喂养", "si": [17], "dists": [2343, 2931, 2460]}, {"w": "god", "phon": "[ɡɑd]", "def": "n. 疏导它的流向，也可以重塑它的结构。"}, {"en": "We [[celebrate]] the [[celebrity]] who considers fame a [[vocation]], yet we [[suspect]] that [[bias]] shapes our views.", "zh": "我们崇拜那些将名望视为天职的名人，却又怀疑偏见左右着我们的看法。"}, {"en": "It is [[good]] to question the [[default]] settings of culture, [[lest]] we follow the [[herd]] without reflection.", "zh": "对文化的默认设定加以质疑是有益的，以免我们不加思索地随波逐流。"}, {"en": "Some [[custom]]s deserve respect; others are mere [[nonsense]].", "zh": "有些习俗值得尊重，另一些则不过是无稽之谈。"}, {"en": "We must [[orient]] ourselves toward a [[virtuous]] [[pathway]].", "zh": "我们必须让自己走上一条崇德向善的道路。"}, {"en": "No single model can [[match]] every situation, and we should [[add]] new ideas carefully.", "zh": "没有哪种单一模式能够适配所有情形，因此我们应当审慎地吸纳新观念。"}, {"en": "The [[investigator]] of human nature finds [[inborn]] traits and [[instinctive]] drives.", "zh": "研究人性的人会发现先天的特质与本能的冲动。"}, {"en": "Yet [[theology]] and [[secular]] philosophy both explore [[holiness]] and morality.", "zh": "然而，神学与世俗哲学都在探索神圣与道德。"}, {"en": "A [[pater]] may [[feed]] his child with [[herb]]s from the garden, but he also feeds the mind.", "zh": "父亲或许会用园子里种的草药喂养孩子，但他同时也在滋养孩子的心灵。"}, {"en": "We should not [[curse]] our limitations or [[fantasize]] about a [[paradise]] elsewhere.", "zh": "我们既不应诅咒自身的局限，也不应幻想着别处存在一座天堂。"}, {"en": "Even the ancient [[god]] of the mountain has been replaced by reason.", "zh": "就连那古老的山神，也已经被理性所取代。"}, {"en": "In the [[cave]] of ancient history, humans painted on walls.", "zh": "在远古历史的洞穴中，人类曾在墙壁上作画。"}, {"en": "Later, [[medieval]] scholars studied [[mathematics]] and [[doctrine]].", "zh": "后来，中世纪的学者研究数学与教义。"}, {"en": "Today, a [[graduate]] may compose a [[paper]] on philosophy.", "zh": "今天，一名研究生可以撰写一篇哲学论文。"}, {"en": "The [[instructor]] gives [[tuition]] to the [[patient]] student.", "zh": "导师向那位耐心的学生悉心传授知识。"}, {"en": "A [[bilingual]] [[reader]] can enjoy [[fiction]] from many cultures.", "zh": "掌握双语的读者能够欣赏来自多种文化的小说。"}, {"en": "The [[letter]] remains a powerful tool.", "zh": "书信至今仍是一种强有力的工具。"}, {"en": "A [[visit]] to the library reveals [[non-standard]] manuscripts that are truly [[noteworthy]].", "zh": "去一趟图书馆，便能看到一些非同寻常、确实值得关注的手稿。"}, {"en": "Historians [[reconstruct]] the past from fragments.", "zh": "历史学家凭借残篇断简重构往昔。"}, {"en": "Our communities face a [[difficult]] [[problem]]: how to [[govern]] without becoming [[oppressive]].", "zh": "我们的社会面临一道难题：如何施行治理而不流于压迫。"}, {"en": "The [[congress]] holds [[congressional]] debates; the [[unionist]] speaks for the [[union]]; the [[voter]] casts a ballot.", "zh": "国会举行国会辩论；工会支持者为工会发声；选民投下选票。"}, {"en": "Yet [[uninformed]] citizens may [[polarize]] debates.", "zh": "然而，信息闭塞的公民可能使辩论走向两极分化。"}, {"en": "A [[cunning]] leader may [[hijack]] the agenda, or even [[highjack]] a movement.", "zh": "狡猾的领导人可能劫持议程，甚至挟持一场运动。"}, {"en": "We must [[defy]] such tactics.", "zh": "我们必须公然反抗这类手段。"}, {"en": "The public grows [[anxious]] under [[attack]] from misinformation.", "zh": "在虚假信息的攻击之下，公众变得愈发焦虑。"}, {"en": "A [[leading]] newspaper provides one [[indication]] of the mood, while officials remain [[unresponsive]].", "zh": "一家主流报纸可以反映出这种情绪的某种迹象，而官员们却始终无动于衷。"}, {"en": "Tensions [[erupt]] from [[grassroots]] anger, and the streets are [[seething]].", "zh": "紧张局势因草根阶层的愤怒而爆发，街头巷尾群情激愤。"}, {"en": "A [[wilful]] denial of reality and a [[willful]] refusal to compromise only [[fierce]]ly deepen divisions.", "zh": "对现实的执意否认，加上拒绝妥协的顽固态度，只会急剧加深分歧。"}, {"en": "Economic life involves [[customer]]s, [[goods]], and [[wholesale]] trade.", "zh": "经济生活涉及顾客、商品与批发贸易。"}, {"en": "A [[homebuyer]] may [[bid]] on a house; a [[paycheck]] determines one's [[pocketbook]].", "zh": "购房者可能为一幢房子出价竞投，而薪水决定着一个人钱包的厚薄。"}, {"en": "To [[cut]] costs is often [[burdensome]], and a [[mean]] policy can [[degrade]] workers.", "zh": "削减成本往往是件沉重的事，而刻薄的政策还会贬低劳动者的尊严。"}, {"en": "We should [[encourage]] fair [[pay]] and [[reasonableness]].", "zh": "我们应当鼓励公平的薪酬与通情达理的态度。"}, {"en": "A [[timely]] [[measure]] can prevent crisis.", "zh": "一项及时的措施能够防患于未然。"}, {"en": "The national [[bill]] reaches a [[billion]] dollars, and [[gross]] inequality persists.", "zh": "全国的账单高达十亿美元，而严重的不平等依然存在。"}, {"en": "Companies [[hire]] and fire at will, while the [[storehouse]] of opportunity seems locked.", "zh": "公司随心所欲地雇佣和解雇员工，机遇的宝库却仿佛大门紧锁。"}, {"en": "Many choose [[less]] rather than more.", "zh": "许多人宁可少取，也不愿贪多。"}, {"en": "A [[fever]] can strike the [[body]]; a [[swab]] can detect disease.", "zh": "发烧可能侵袭身体，拭子检测则能查出疾病。"}, {"en": "[[Therapy]] helps us [[recover]].", "zh": "治疗帮助我们康复。"}, {"en": "On the [[grassland]], an [[animal]] may roam.", "zh": "在草原上，动物可以自由漫步。"}, {"en": "A [[sweater]] keeps us warm; a [[thermostat]] regulates temperature.", "zh": "毛衣为我们保暖，恒温器则调节温度。"}, {"en": "We must not [[erase]] the [[thick]] forests or spoil the [[thin]] air.", "zh": "我们绝不能毁掉茂密的森林，也不能污染洁净稀薄的空气。"}, {"en": "Children learn to [[swim]] in clear lakes and wear a warm [[coat]] in winter.", "zh": "孩子们在清澈的湖水中学习游泳，在冬天穿上暖和的外套。"}, {"en": "The [[swing]] of seasons brings both rain and sunshine.", "zh": "四季的轮回既带来雨水，也带来阳光。"}, {"en": "We need [[mandatory]] safeguards to [[minimize]] risk.", "zh": "我们需要强制性的保障措施，将风险降至最低。"}, {"en": "The [[volunteer]] firefighter shows [[good-natured]] courage; the [[patrol]] keeps streets safe.", "zh": "志愿消防员展现出发自内心的勇气，巡逻队则守护街道的安全。"}, {"en": "A mobile phone is a [[cute]] device, but [[unfocused]] use wastes hours.", "zh": "手机是一种精巧的设备，但心不在焉地使用它会浪费大量时间。"}, {"en": "We should [[suspend]] distractions and [[keep]] our goals in view.", "zh": "我们应当暂时抛开令人分心的事物，始终把目标放在心上。"}, {"en": "Travelers pack a [[carry-on]] bag and face [[involuntary]] delays.", "zh": "旅行者收拾好随身行李，还要面对身不由己的延误。"}, {"en": "Even a [[time-limited]] offer can pressure us into poor choices.", "zh": "即便是限时优惠，也可能迫使我们做出糟糕的选择。"}, {"en": "Education is a [[vital]] [[bridge]] to opportunity.", "zh": "教育是通向机遇的关键桥梁。"}, {"en": "[[Each]] student deserves a [[level]] playing field.", "zh": "每个学生都应获得一个公平的竞争环境。"}, {"en": "A [[sensible]] teacher adapts to individual needs.", "zh": "明智的教师会根据个体的不同需要因材施教。"}, {"en": "We should not let costs [[hinder]] talent.", "zh": "我们不应让费用阻碍人才的成长。"}, {"en": "A [[degree]] opens doors; a [[hobby]] enriches life.", "zh": "学历能打开机会之门，爱好则能丰富人生。"}, {"en": "The [[field]] of knowledge is [[wide]].", "zh": "知识的领域广阔无垠。"}, {"en": "We should [[widen]] access for all.", "zh": "我们应当拓宽渠道，让所有人都有机会参与。"}, {"en": "Cultural life is a [[mixture]] of old and new.", "zh": "文化生活是新旧事物的混合体。"}, {"en": "A [[prophet]] may predict the future; an artist may create beauty.", "zh": "先知或许能预言未来，艺术家则能创造美。"}, {"en": "The [[grace]] of a dancer, the [[rustle]] of leaves, the [[whistle]] of a bird—all inspire us.", "zh": "舞者的优雅、树叶的沙沙声、鸟儿的啁啾——这一切都给予我们灵感。"}, {"en": "A [[tune]] can lift spirits.", "zh": "一支曲子就能够振奋精神。"}, {"en": "A [[census]] counts people; the press informs them.", "zh": "人口普查统计人口，新闻媒体则向民众提供信息。"}, {"en": "We should [[reconsider]] harsh judgments and [[recollect]] our shared humanity.", "zh": "我们应当重新审视那些严厉的评判，重拾彼此共通的人性。"}, {"en": "In the [[centre]] of town, the [[center]] of attention may shift quickly.", "zh": "在市中心，人们关注的焦点可能迅速转移。"}, {"en": "What seems [[meaningless]] to one generation becomes [[hip]] to the next.", "zh": "在一代人看来毫无意义的事物，到下一代人那里却可能变成时尚。"}, {"en": "We must [[endure]] hardship.", "zh": "我们必须忍受艰难困苦。"}, {"en": "It is hard to admit mistakes, but [[self-conscious]] reflection helps.", "zh": "承认错误并非易事，但自觉的反思会有所助益。"}, {"en": "Do not [[swear]] in anger.", "zh": "不要在愤怒时口出恶言。"}, {"en": "Instead, try to [[win]] trust.", "zh": "相反，要努力赢得信任。"}, {"en": "[[Few]] people achieve greatness without [[sweat]].", "zh": "几乎没有人能不付汗水便成就伟大。"}, {"en": "The road is long, but [[peace]] awaits those who persist.", "zh": "前路漫漫，但内心的宁静属于那些坚持不懈的人。"}, {"en": "With [[minimal]] effort, we can achieve little.", "zh": "付出极少，收获便微乎其微。"}, {"en": "We cannot [[anymore]] pretend that all problems are [[solvable]].", "zh": "我们再也不能假装所有问题都能迎刃而解。"}, {"en": "[[Unfortunately]], some wounds never fully heal.", "zh": "遗憾的是，有些伤口永远无法完全愈合。"}, {"en": "A [[mate]] shares joy and sorrow.", "zh": "伴侣与我们同甘共苦。"}, {"en": "A [[female]] leader may [[chair]] a meeting.", "zh": "女性领导者可以主持会议。"}, {"en": "A [[widow]] may [[outlive]] her spouse.", "zh": "遗孀或许会比自己的配偶更为长寿。"}, {"en": "[[Gossip]] can destroy trust; [[unpleasant]] words wound.", "zh": "流言蜚语能摧毁信任，不中听的话语会刺痛人心。"}, {"en": "A kind [[note]] can brighten a day.", "zh": "一张善意的便条，就能让人一整天心情明朗。"}, {"en": "Let us [[bind]] ourselves to one another with respect.", "zh": "让我们以尊重为纽带，将彼此紧紧相连。"}, {"en": "The [[interior]] of the earth remains [[unexplored]].", "zh": "地球的内部仍有许多未曾探明之处。"}, {"en": "[[Wild]] rivers [[sweep]] through valleys.", "zh": "狂野的河流奔涌着穿过山谷。"}, {"en": "We should [[sail]] the seas with care.", "zh": "我们应当谨慎地航行于海洋之上。"}, {"en": "Every [[grain]] of sand matters.", "zh": "每一粒沙都有其意义。"}, {"en": "The [[cycle]] of seasons [[recur]]s.", "zh": "四季的循环周而复始。"}, {"en": "[[Energy]] is precious.", "zh": "能源弥足珍贵。"}, {"en": "[[Certain]] species adapt to [[adjoining]] habitats, while others perish.", "zh": "某些物种能够适应毗邻的栖息地，另一些则走向灭亡。"}, {"en": "[[Liberty]] is not free.", "zh": "自由并非凭空得来。"}, {"en": "[[Unilateral]] actions often fail.", "zh": "单方面的行动往往以失败告终。"}, {"en": "A wise policy considers the [[maximum]] good.", "zh": "明智的政策会顾及最大多数人的最大福祉。"}, {"en": "A legal [[case]] may set a [[norm]], and we [[ought]] to follow [[formally]] established rules.", "zh": "一个法律案件或许会确立一项规范，而我们应当遵守那些以正式程序制定的规则。"}, {"en": "We [[will]] shape it.", "zh": "未来将由我们亲手塑造。"}, {"en": "Our [[legacy]] depends on present choices.", "zh": "我们能留下怎样的遗产，取决于当下的抉择。"}, {"en": "Let us [[think]] deeply.", "zh": "让我们深入思考。"}, {"en": "Let us [[see]] clearly.", "zh": "让我们看清本质。"}, {"en": "The [[end]] is not yet determined.", "zh": "结局尚未注定。"}, {"en": "Though the road ahead may [[curve]] unexpectedly, we should not feel [[embarrassed]] by our past mistakes or fear [[defeat]].", "zh": "尽管前方的道路可能意外转弯，我们既不应为过去的错误感到难堪，也不应惧怕失败。"}, {"en": "Even in [[awkward]] moments, we grow.", "zh": "即便身处尴尬的时刻，我们也在不断成长。"}]}, {"key": "三星词汇 Day 07 List 13", "words": [{"w": "voice", "phon": "[vɔɪs]", "def": "n.声音；呼声；意见v.表达；发嗓音", "si": [1], "dists": [1411, 2034, 200
