, "dists": [1900, 3493, 1714]}, {"w": "undercut", "phon": "[ˌʌndərˈkʌt]", "def": "v.压低（价格）；削弱；切去…下部", "si": [26], "dists": [2723, 1351, 190]}, {"w": "drumbeat", "phon": "[ˈdrʌmbit]", "def": "n.鼓声；呼声", "si": [36], "dists": [2341, 3168, 870]}, {"w": "tent", "phon": "[tent]", "def": "n.帐篷；帐棚", "si": [2], "r": "tent(伸)→撑开拉紧的棚子", "dists": [2236, 1625, 1586]}, {"w": "mow", "phon": "[məʊ]", "def": "v.修剪；扫杀n.麦秆堆；干草堆积处", "si": [8], "dists": [2710, 3266, 2765]}, {"w": "weed", "phon": "[wid]", "def": "n.杂草；野草；大麻v.除草；铲除", "si": [8], "dists": [1372, 1353, 1626]}, {"w": "garden", "phon": "[ˈɡɑrd(ə)n]", "def": "n.花园v.从事园艺", "si": [8], "dists": [327, 2374, 2190]}, {"w": "lawn", "phon": "[lɔn]", "def": "n.草坪；草地", "si": [2, 8], "dists": [1539, 1474, 1112]}], "sents": [{"en": "The bus left me at a [[petrol]] station on the edge of the village, and the school was only a [[distant]] white shape on the hillside.", "zh": "巴士把我放在村口的加油站，学校只是山坡上一个遥远的白色轮廓。"}, {"en": "I [[intended|intend]] to stay six weeks and help my aunt, who had [[founded|found]] the place twenty years earlier.", "zh": "我打算待六周，帮姑姑的忙，这所学校是她二十年前创办的。"}, {"en": "She pointed me to the [[restroom]] behind the kitchen and then to a [[tent]] pitched on the [[lawn]].", "zh": "她指了指厨房后面的洗手间，又指了指草坪上搭好的帐篷。"}, {"en": "The school was [[affordable]] for families who could pay almost nothing, and its [[dropout]] rate had fallen to zero.", "zh": "这所学校让几乎付不起钱的家庭也上得起，辍学率已经降到零。"}, {"en": "Every morning began with [[physical]] exercise, and the children ran with an [[endurance]] that shamed me.", "zh": "每天早晨从体育锻炼开始，孩子们跑步的耐力让我自愧不如。"}, {"en": "My aunt was [[respected|respect]] by every child, and she gave the same [[respect]] to the slowest runner.", "zh": "每个孩子都敬重姑姑，她也把同样的尊重给跑得最慢的那个。"}, {"en": "Her [[colleague]] Mr. Tan taught maths and kept the accounts, [[apart]] from the two years he had spent in the city.", "zh": "她的同事谭老师教数学、管账目，只有他在城里的那两年例外。"}, {"en": "The school's [[infrastructure]] was [[fragile]]: one pump, one generator, and a kitchen roof that would [[crumble]] in a strong wind.", "zh": "学校的基础设施很脆弱：一台水泵、一台发电机，还有一个遇大风就会塌的厨房屋顶。"}, {"en": "I spent my first week helping to [[mow]] the [[lawn]] and pull [[weed]]s from the [[garden]].", "zh": "第一周我都在帮忙修剪草坪、给花园拔草。"}, {"en": "The shed behind the kitchen held tools that no one had bothered to [[classify]] for years.", "zh": "厨房后面的棚子里堆着多年无人费心分类的工具。"}, {"en": "On Monday my aunt [[appointed|appoint]] me to teach English to the oldest class.", "zh": "周一，姑姑任命我去教最高年级的英语。"}, {"en": "She [[assigned|assign]] me forty students and a [[schedule]] that began at six.", "zh": "她给我分配了四十个学生，还有一张六点开始的日程表。"}, {"en": "Before I could stand in front of them, I had to [[apply]] for a temporary teaching permit.", "zh": "在站到他们面前之前，我得先申请临时教师资格。"}, {"en": "The [[enrollment]] list was handwritten, and I [[classified|classify]] the children by reading level.", "zh": "入学名单是手写的，我按阅读水平把孩子们分了类。"}, {"en": "One boy, the class [[monitor]], was a [[special]] case: he could not hear well and needed [[precise]] instructions.", "zh": "有个男孩是班长，情况特殊：他听力不好，需要非常明确的指令。"}, {"en": "A new [[type]] of lesson was needed for him, one with pictures and fewer words.", "zh": "他需要一种新的课型，图多、字少。"}, {"en": "In July a [[turbulent]] storm broke over the valley, and the rain was so [[intense]] that the road became a stream.", "zh": "七月，一场狂暴的风暴席卷山谷，雨大得把路变成了溪流。"}, {"en": "The generator died, and in the [[disorder]] that followed nobody could find the candles.", "zh": "发电机熄了，随之而来的混乱中谁也没找到蜡烛。"}, {"en": "A small [[avalanche]] of mud blocked the lower path, and three children were [[interrupted|interrupted]] on their way home.", "zh": "一小股泥石流堵住了下面的小路，三个孩子在回家路上被阻断了。"}, {"en": "We [[extinguished|extinguish]] the kitchen fire with wet sacks and spent the night in the hall.", "zh": "我们用湿麻袋扑灭了厨房的火，在大厅里过了一夜。"}, {"en": "The [[tension]] only lifted at dawn, when everyone had [[survived|survive]].", "zh": "直到天亮，确认每个人都活了下来，紧张才散去。"}, {"en": "The storm's [[depredation]] was everywhere: torn roofs, broken fences, a hillside stripped of grass.", "zh": "风暴的破坏随处可见：屋顶被撕开、篱笆断裂、山坡被剥去了草皮。"}, {"en": "It took a month to [[restore]] the pump and reopen the road.", "zh": "修好水泵、重新打通道路花了一个月。"}, {"en": "We had to [[allay]] the children's fear of hunger, though nobody actually [[starved|starve]].", "zh": "我们得缓解孩子们对挨饿的恐惧，尽管实际上没人饿死。"}, {"en": "A [[lever]] and a rope moved the fallen beams, and the new classroom came to [[resemble]] the old one so closely that the children laughed.", "zh": "我们用杠杆和绳子挪开了塌落的梁，新教室和旧教室像得让孩子们笑了。"}, {"en": "The stone walls were still [[intact]], [[moreover]], which saved us a fortune.", "zh": "而且石墙依然完好，这为我们省下了一大笔钱。"}, {"en": "A cheap [[outlet]] in the county town [[undercut]] local prices, and two volunteers came to [[assist]] with the buying.", "zh": "县城一家便宜的折扣店压低了当地价格，还有两名志愿者来帮忙采购。"}, {"en": "The rebuilding needed money, so my aunt [[pledged|pledge]] her savings and asked the village for help.", "zh": "重建需要钱，于是姑姑拿出自己的积蓄作保证，并向全村求助。"}, {"en": "A [[sponsor]] from the city offered to pay for a new roof, but only with the council's [[approval]].", "zh": "城里一位赞助商愿意出资修屋顶，但要先得到议会的批准。"}, {"en": "The council agreed and began to [[distribute]] the funds in stages.", "zh": "议会同意了，并开始分阶段发放资金。"}, {"en": "A tax [[incentive]] was meant to [[compel]] absent landowners to contribute, and families that lost crops were [[compensated|compensate]].", "zh": "一项税收激励本意是迫使不在本地的地主出钱，庄稼受损的家庭则得到了补偿。"}, {"en": "Every household had a [[stake]] in the result, which is why the work went so fast.", "zh": "每户人家都在结果里有份，所以工程进展得很快。"}, {"en": "Then a [[commercial]] company announced a dam upstream, and the village found itself in a [[conflict]] it had not chosen.", "zh": "接着一家商业公司宣布要在上游建坝，村子卷进了一场并非自己选择的冲突。"}, {"en": "The company's [[scheme]] would divert the river that fed our pump.", "zh": "这家公司的方案会把供我们水泵的河改道。"}, {"en": "Our lawyer argued that the [[federal]] [[constitution]] protected the village's water, and that the [[jurisdiction]] belonged to the provincial court.", "zh": "我们的律师主张，联邦宪法保护村里的水源，管辖权属于省法院。"}, {"en": "There was no [[precedent]] for such a case, and a [[prosecution]] of the company seemed unlikely.", "zh": "这类案子没有先例，起诉这家公司似乎不太可能。"}, {"en": "I helped [[investigate]] the company's records, and a [[drumbeat]] of questions followed every meeting.", "zh": "我帮忙调查公司的记录，每次会后都有一连串追问。"}, {"en": "On clear nights an [[astronomer]] from the city set up a telescope and used a red lamp to [[illuminate]] the star chart.", "zh": "晴朗的夜里，城里来的天文学家架起望远镜，用红灯照亮星图。"}, {"en": "He showed the children the [[spectrum]] of a distant star and explained that its colours reveal what the star is made of.", "zh": "他给孩子们看一颗遥远恒星的光谱，解释它的颜色能揭示恒星的成分。"}, {"en": "One girl asked whether [[astrology]] could predict the rains; he said the two only [[coincide]] by accident.", "zh": "一个女孩问占星术能否预测雨水，他说两者只是碰巧一致。"}, {"en": "That night was a [[reflection]] on how little we know, and my [[intuition]] told me the girl would become a scientist.", "zh": "那一夜让人反省我们所知甚少，而我的直觉告诉我，那女孩将来会成为科学家。"}, {"en": "The school kept a small [[exhibit]] of her drawings in the corridor.", "zh": "学校在走廊里为她办了个小小的画展。"}, {"en": "My aunt and I had an [[intimate]] talk on the roof, the kind we had never managed in the city.", "zh": "我和姑姑在屋顶上有过一次亲密的长谈，那种谈话在城里从未有过。"}, {"en": "She was [[conscious]] of her age and [[concerned|concern]] about who would run the school after her.", "zh": "她清楚自己的年纪，也担心她之后谁来管这所学校。"}, {"en": "I tried to [[express]] my fears without sounding ungrateful.", "zh": "我试着表达自己的担忧，又不想显得不知感恩。"}, {"en": "Her answer was [[explicit]]: she would stay until a successor was ready, and she [[assured|assure]] me that the village would help.", "zh": "她的回答很明确：她会留到接班人选好为止，还向我保证村里会帮忙。"}, {"en": "She warned me against the [[superiority]] of city people, and against the [[gap]] I had begun to feel between two lives.", "zh": "她提醒我不要有城里人的优越感，也不要在我已开始感到的两种生活之间的隔阂里越陷越深。"}, {"en": "What she said left a [[profound]] impression on me.", "zh": "她的话给我留下了深刻的印象。"}, {"en": "The children put on a [[drama]] about the flood, written in three days and entirely [[spontaneous]].", "zh": "孩子们演了一出关于洪水的戏，三天写成，完全即兴。"}, {"en": "They [[aspired|aspire]] to things I had stopped imagining: a clinic, a library, a bus that came twice a day.", "zh": "他们向往着我已经不再想象的东西：一间诊所、一座图书馆、一天来两趟的公交。"}, {"en": "Their parents [[possessed|possess]] little money but spoke of a future [[prosperity]] no one in the city would have predicted.", "zh": "他们的父母没什么钱，却谈论着城里人谁也预料不到的未来繁荣。"}, {"en": "The play ended with a [[tragic]] scene, and the whole hall went silent.", "zh": "戏以一场悲剧收尾，整个大厅静了下来。"}, {"en": "There was a fine [[irony]] in it: the dam builders were [[extravagant]] in their promises and absent when the rain came.", "zh": "其中有一种微妙的讽刺：建坝的人承诺得极尽夸张，下雨时却不见人影。"}, {"en": "The land dispute was an [[inherited]] quarrel, older than the school itself, and no one [[risked|risk]] a direct accusation.", "zh": "这场土地纠纷是继承下来的旧怨，比学校还老，没人敢直接指控。"}, {"en": "The company's men had [[aggressively]] repeated that the dam would bring work to everyone.", "zh": "公司的人一再咄咄逼人地说，大坝会给所有人带来工作。"}, {"en": "A [[pregnant]] woman in the front row laughed and cried at once, and the performance [[attracted|attract]] parents who had never come before.", "zh": "前排一位孕妇又笑又哭，这场演出还吸引来了从未露面的家长。"}, {"en": "I tried a new [[approach]] to science: we [[explored|explore]] the stream with nets and jars.", "zh": "我在科学课上试了个新方法：带着网和罐子去溪边探索。"}, {"en": "The [[diverse]] life in one pool [[astounded|astound]] the class.", "zh": "一个水洼里多样的生命让全班惊叹。"}, {"en": "I asked them to [[specify]] what they saw and to [[address]] one question at a time.", "zh": "我要求他们说清楚看到了什么，一次只解决一个问题。"}, {"en": "An [[array]] of beetles, snails and tiny fish covered the table.", "zh": "桌上摆满了甲虫、蜗牛和小鱼。"}, {"en": "The children [[assimilated|assimilate]] new words faster than I could write them down.", "zh": "孩子们吸收新词的速度比我记下来的还快。"}, {"en": "A [[dynamic]] classroom, I learned, is one where the teacher moves and the children [[dominate]] the discussion.", "zh": "我明白了，有活力的课堂是老师走动、孩子们主导讨论的课堂。"}, {"en": "Physics was the [[dynamical]] part of the day: wheels, weights, and a wooden cart.", "zh": "物理是这一天里讲动力的部分：轮子、砝码和一辆木车。"}, {"en": "In August the court [[declined|decline]] the company's request and refused to [[exclude]] the village from the hearing.", "zh": "八月，法院驳回了公司的请求，也拒绝把村子排除在听证之外。"}, {"en": "The company had tried to [[intimidate]] witnesses, which only [[stimulated|stimulate]] the village to organise.", "zh": "公司曾试图恐吓证人，这反而激励了村子组织起来。"}, {"en": "The ruling [[promoted|promote]] a new idea: water belongs to the people who live beside it.", "zh": "判决推动了一个新观念：水属于住在水边的人。"}, {"en": "We began to [[conserve]] the spring and to [[prolong]] the life of the old pump.", "zh": "我们开始保护泉眼，延长旧水泵的寿命。"}, {"en": "The school's success [[consisted|consist]] of small things: a repaired roof, a full classroom, a promise kept.", "zh": "这所学校的成功由小事构成：修好的屋顶、坐满的教室、守住的承诺。"}, {"en": "To [[avail]] ourselves of the new funds, we had to [[construct]] a proper store room and [[stick]] to the plan.", "zh": "为了利用这笔新资金，我们得建一间像样的储藏室，并坚持原计划。"}, {"en": "The summer had been a small [[revolution]] in how I thought about work.", "zh": "这个夏天是我对工作的看法发生的一场小小革命。"}, {"en": "I began to [[recognise|recognise]] how much I had changed, and the children seemed to [[recognize|recognize]] it too.", "zh": "我开始意识到自己变了多少，孩子们似乎也看出来了。"}, {"en": "I learned to [[communicate]] without translation and to [[connect]] a family's story with the river.", "zh": "我学会了不用翻译也能交流，也学会把一户人家的故事和那条河连起来。"}, {"en": "My aunt would [[mention]] a name, then [[confer]] with the oldest woman in the room before telling the rest.", "zh": "姑姑会先提一个名字，然后和屋里最年长的妇人商议，再讲其余的事。"}, {"en": "One [[aspect]] of village life surprised me: no one [[attempted|attempt]] to hide a quarrel.", "zh": "乡村生活有一点让我吃惊：没人试图掩饰争吵。"}, {"en": "At dinner we ate rice from tin [[plate]]s in the yard.", "zh": "晚饭时我们在院子里用铁盘吃饭。"}, {"en": "My aunt [[fulfilled|fulfil]] her promise to train a successor, and the council promised to [[fulfill|fulfill]] its part by winter.", "zh": "姑姑履行了培养接班人的承诺，议会也答应入冬前完成自己那一部分。"}, {"en": "The school had once had a high [[turnover]] of staff, but she had engineered a [[turnaround]] in two years.", "zh": "学校曾有过很高的人员流动率，而她两年内实现了扭转。"}, {"en": "She [[resisted|resist]] every attempt to [[restrict]] its intake and refused to [[dismiss]] a child for poor marks.", "zh": "她抵制一切限制招生的企图，也拒绝因成绩差而开除孩子。"}, {"en": "She could [[apprehend]] a child's trouble before the child said a word, and she [[tackled|tackle]] each problem like a [[pragmatist]].", "zh": "孩子还没开口，她就能察觉他的难处，处理每个问题都像个实用主义者。"}, {"en": "On my last morning I tried to [[compose]] a song for the children and failed; they sang their own instead.", "zh": "最后一个早晨，我想给孩子们写首歌却没写成，他们便唱了自己的歌。"}, {"en": "The school had taught me that [[anthropology]] begins at home, not in a distant archive.", "zh": "这所学校教会我，人类学始于家门口，而不是遥远的档案馆。"}, {"en": "I was [[averse]] to leaving, and a [[plastic]] chair on the lawn was the last thing I saw from the bus.", "zh": "我不愿离开，草坪上那把塑料椅子是我从巴士上看到的最后一样东西。"}, {"en": "The village had become an [[asset]] in my life rather than a subject of study.", "zh": "这个村子成了我生命中的财富，而不只是一个研究对象。"}, {"en": "I could not [[reverse]] the decision to go, or [[invert]] the order of that summer, so I promised to return.", "zh": "我无法撤回离开的决定，也无法颠倒那个夏天的顺序，只好答应会回来。"}, {"en": "Their songs would [[propagate]] through the valley long after the bus had gone, and I would [[confront]] the city with what I had learned.", "zh": "巴士走远后，他们的歌声仍会在山谷里传开，而我会带着学到的东西去面对城市。"}]}, {"key": "三星词汇 Day 04 List 7", "words": [{"w": "back", "phon": "[bæk]", "def": "n.背部；后面adv.回原处；向后adj.后面的；拖欠的v.支持", "si": [4], "dists": [3445, 2520, 2336]}, {"w": "cake", "phon": "[keɪk]", "def": "n.蛋糕；饼", "si": [6], "dists": [2169, 1924, 1761]}, {"w": "daily", "phon": "[ˈdeɪli]", "def": "adv.每天；每日adj.每天的；每日的n.日报", "si": [5], "dists": [3327, 665, 1177]}, {"w": "face", "phon": "[feɪs]", "def": "n.脸v.面对", "si": [52], "dists": [1575, 1225, 1179]}, {"w": "gain", "phon": "[ɡeɪn]", "def": "v.获得；增加n.获得；增益", "si": [65], "dists": [1972, 926, 3259]}, {"w": "habit", "phon": "[ˈhæ "def": "adj.园艺的", "si": [14], "dists": [150, 51, 1396]}], "sents": [{"en": "I [[abandoned|abandon]] my job at a [[publishing]] house in June, after eight years of reading other people's [[prose]].", "zh": "六月，我辞掉了出版社的工作，此前八年我一直在读别人的散文。"}, {"en": "My [[salary]] was good, the [[economy]] was uncertain, and everyone said it was a [[mad]] decision.", "zh": "我的薪水不错，经济形势又不确定，所有人都说这是个疯狂的决定。"}, {"en": "I had spent years correcting a [[phrase]] on every [[page]], and my [[background]] was in books, not in flour.", "zh": "我花了多年时间逐页改一句话，我的底子是书，不是面粉。"}, {"en": "My last [[editorial]] meeting ended with a shrug and a [[joke]] about people who open bakeries.", "zh": "最后一次编辑会以一声耸肩和一句关于开面包店的人的玩笑收场。"}, {"en": "So I took the train [[back]] to the town where I grew up.", "zh": "于是我坐上火车，回到我长大的小镇。"}, {"en": "My grandmother's shop stood on the [[square]], and she had run it [[daily]] for forty years.", "zh": "外婆的店就在广场上，她每天经营了四十年。"}, {"en": "Her [[cake]] and [[pudding]] were famous, and her [[plum]] tart sold out before noon.", "zh": "她的蛋糕和布丁很有名，李子挞不到中午就卖光。"}, {"en": "She counted [[calorie]]s for nobody and [[quality]] for everything.", "zh": "她从不为谁算卡路里，却对每样东西的品质斤斤计较。"}, {"en": "I wanted to [[earn]] my living there, though the [[habit]] of office life was hard to break.", "zh": "我想在那里靠手艺谋生，尽管办公室生活的习惯很难改掉。"}, {"en": "The [[rear]] room was [[damp]], and the [[narrow]] stairs creaked under every tray.", "zh": "后屋很潮湿，狭窄的楼梯在每只托盘下吱呀作响。"}, {"en": "We cleared years of dust with a [[vacuum]] and found an old [[store]] of tins behind the [[wall]].", "zh": "我们用吸尘器清掉了多年的积灰，在墙后发现了一批旧罐头。"}, {"en": "A [[kit]] of pastry tools hung by the window, most of them older than I was.", "zh": "窗边挂着一套做点心的工具，大多比我的年纪还大。"}, {"en": "The [[streetlight]] outside made the whole window glow after closing time, though the damp had done [[damage]] to the frame.", "zh": "打烊后，外面的路灯让整扇窗都亮着，不过潮气已经损坏了窗框。"}, {"en": "A [[gate]] at the side let in the morning light, and we kept it open.", "zh": "侧边的一扇门让晨光照进来，我们一直开着它。"}, {"en": "Behind the shop was a [[horticultural]] tangle of herbs, and mint and thyme [[abound]] there.", "zh": "店后是一片园艺式的香草乱丛，薄荷和百里香长得满地都是。"}, {"en": "My grandmother [[gathered|gather]] mint every morning, and I learned to [[observe]] which beds stayed wet.", "zh": "外婆每天早上采薄荷，我也学会观察哪块地一直很湿。"}, {"en": "The [[earth]] there was dark, and in [[damp]] weather the roses [[faded|fade]] early.", "zh": "那里的泥土很黑，潮湿天气里玫瑰谢得早。"}, {"en": "A [[rabbit]] came at dusk to eat the lettuce, and a late frost could [[kill]] the herbs.", "zh": "黄昏时一只兔子来吃生菜，而一场晚霜可能冻死香草。"}, {"en": "My first [[co-worker]] was a [[budding]] baker named Lili, [[recruited|recruit]] from the technical school.", "zh": "我的第一位同事是个初露头角的烘焙师，叫莉莉，是从技术学校招来的。"}, {"en": "She had real [[talent]] and was never [[jealous]] of anyone's recipes.", "zh": "她有真本事，也从不嫉妒别人的配方。"}, {"en": "Her [[kin]] ran a [[lamb]] farm outside town, and her uncle delivered meat twice a week.", "zh": "她的亲戚在城外经营羊场，她叔叔每周送两次肉来。"}, {"en": "A [[lone]] customer who came every day for a [[packet]] of biscuits became our most loyal [[supporter]].", "zh": "一位每天来买一小包饼干的独身顾客，成了我们最忠实的支持者。"}, {"en": "On Saturdays we cleared the tables for a reading club, and I read stories about a [[safari]] and a [[knight]].", "zh": "周六我们把桌子腾出来办读书会，我读关于非洲旅行和骑士的故事。"}, {"en": "The children preferred the one about a [[king]] who [[buried|bury]] his [[relic]] under a [[volcano]], and a story about a [[heaven]] made of bread.", "zh": "孩子们更喜欢那个国王把圣物埋在火山下的故事，还有一个用面包做成的天堂的故事。"}, {"en": "We acted out a [[raft]] trip and a [[camp]] on the moon, and nobody minded the plot.", "zh": "我们把木筏漂流和月球露营演了出来，没人计较情节。"}, {"en": "For an hour the shop became a place where a [[saint]] could sit beside a [[rabbit]].", "zh": "有一个小时，这家店成了圣徒也能和兔子同桌的地方。"}, {"en": "In July a [[landowner]] announced a [[skyscraper]] on the [[square]], and the town [[declared|declare]] itself open for business.", "zh": "七月，一位地主宣布要在广场上盖摩天大楼，镇子宣称自己对外来投资敞开大门。"}, {"en": "The [[major]] [[stakeholder]] was a company nobody in the street had heard of.", "zh": "主要的利益相关方是一家街上谁都没听说过的公司。"}, {"en": "A [[liberal]] councillor said the plan needed a public [[petition]], not a private [[warrant]].", "zh": "一位开明的议员说，这个计划需要公众请愿，而不是一纸私下授权。"}, {"en": "We gathered signatures and stood at the [[gate]] every morning.", "zh": "我们征集签名，每天早上都守在那扇门边。"}, {"en": "Then a [[clue]] appeared: an [[unnamed]] letter said the company had bought land under a false name.", "zh": "接着出现了一条线索：一封未署名的信说，公司用假名买了地。"}, {"en": "The [[conspiracy]] was [[dense]] with detail, and the [[wrongdoing]] went back years.", "zh": "这个阴谋细节密集，不法行为可以追溯到多年前。"}, {"en": "Someone [[sneaked|sneak]] into our yard one night and left a box of papers as [[bait]].", "zh": "有天夜里有人溜进我们的院子，留下一箱文件当诱饵。"}, {"en": "The tower would [[impinge]] on the light that reached the square, and the company's interests were never [[aligned]] with ours.", "zh": "那座塔会挡住照到广场的光，而公司的利益从来与我们不一致。"}, {"en": "I began to [[name]] the people behind it, though that was dangerous.", "zh": "我开始点出幕后那些人的名字，尽管这很危险。"}, {"en": "Our lawyer obtained a [[warrant]] to see the accounts, and the figures [[worsened|worsen]] the company's position.", "zh": "我们的律师取得了查阅账目的搜查令，而那些数字让公司的处境更糟。"}, {"en": "A [[clawback]] clause in the contract was the [[trigger]] for the whole dispute.", "zh": "合同里的一条追回条款，成了整场争端的导火索。"}, {"en": "It was [[unacceptable]] that a [[danger]] of this size sat on the [[edge]] of the square, and the accounts had a [[gaping]] hole.", "zh": "这么大的危险就摆在广场边上，实在不可接受；而且账目上有一个巨大的窟窿。"}, {"en": "Without public support the deal would [[disintegrate]], and the [[proportion]] of local shops would fall.", "zh": "没有公众支持，这笔交易就会瓦解，本地店铺的比例也会下降。"}, {"en": "The two issues were [[tied|tie]] together, and no one could separate them.", "zh": "这两个问题绑在一起，没人能把它们分开。"}, {"en": "On the first Sunday in August I ran a [[race]] through the town, my first as a [[runner]] in twenty years.", "zh": "八月的第一个周日，我参加了镇上的跑步比赛，这是我二十年来第一次当跑者。"}, {"en": "I kept a slow [[pace]], passed the [[half]] mark, and at three [[quarters|quarter]] of the way wanted to stop.", "zh": "我保持着慢配速，跑过一半标记，到四分之三处时想放弃。"}, {"en": "A [[hale]] old man in a [[uniform]] ran beside me and invited me to a [[joint]] class in [[self-defence]].", "zh": "一位穿制服的硬朗老人跑在我旁边，还邀我去上一堂联合自卫课。"}, {"en": "I did not [[believe]] I could finish, but the [[prospect]] of the shop's door kept me moving.", "zh": "我不相信自己能跑完，但想到店门就在前面，我一直在跑。"}, {"en": "The shop's [[sale]]s rose in August, and our [[proficiency]] with the old oven finally showed.", "zh": "八月店里销售额上升，我们对那台老烤箱的熟练终于显出来了。"}, {"en": "Lili had the [[ability]] to [[create]] a new cake from whatever was left in the [[store]], and to [[pack]] the bread before I finished counting.", "zh": "莉莉有本事用仓库里剩下的东西做出新蛋糕，还能在我数完钱之前把面包打包好。"}, {"en": "We [[exchanged|exchange]] recipes with a café across the street, a [[mutual]] arrangement that helped both of us.", "zh": "我们和街对面的咖啡馆交换配方，这种互助安排对双方都有好处。"}, {"en": "I began to [[believe]] we could [[achieve]] something real, though a [[fad]] for sourdough helped more than skill.", "zh": "我开始相信我们能做成点真事，尽管酸面包的风潮比手艺帮的忙更大。"}, {"en": "Most new cafés are a [[fad]], a friend said; ours had a [[theory]] behind it.", "zh": "一个朋友说，多数新咖啡馆只是一时风潮；我们这家背后有一套理论。"}, {"en": "It was hard to [[balance]] the books and the ovens, but we managed.", "zh": "兼顾账本和烤箱很难，但我们做到了。"}, {"en": "In September my grandmother fell [[ill]], and her [[thinness]] frightened me.", "zh": "九月，外婆病了，她瘦成那样让我害怕。"}, {"en": "She sat by the window with her [[hair]] uncombed, and I gave her a [[haircut]] on the back step.", "zh": "她头发乱着坐在窗边，我在后门台阶上给她剪了头发。"}, {"en": "Her [[jaw]] was set and her [[face]] calm, and she refused to let me [[wake]] the doctor.", "zh": "她下颌绷紧，脸色平静，不让我去叫醒医生。"}, {"en": "I felt the floor [[quake]] under me the day she could not get up.", "zh": "她起不来床的那天，我觉得脚下的地板都在震。"}, {"en": "She told me to stay [[calm]] and to keep the shop open.", "zh": "她让我保持镇定，店照常开。"}, {"en": "At the town meeting the [[rage]] was [[viscerally]] real, and two neighbours had a [[nasty]] [[quarrel]].", "zh": "镇民大会上，那种愤怒发自肺腑，两个邻居还吵了一架，话说得很难听。"}, {"en": "It is easy to [[oversimplify]] such a fight, but the [[methodology]] of the developer's survey was [[wholly]] dishonest.", "zh": "这样的争执很容易被简单化，但开发商调查的方法论完全不诚实。"}, {"en": "An [[introductory]] speech by the mayor was [[goal-focused]] and said nothing at all, which I would [[call]] a waste of ten minutes.", "zh": "市长的一段开场致辞目标明确，却什么也没说，我会称之为浪费了十分钟。"}, {"en": "I heard [[prejudice]] in my own voice too, and that was the worst part.", "zh": "我也在自己的声音里听到了偏见，这才是最糟的部分。"}, {"en": "In October a food [[magazine]] sent a writer to [[name]] us one of the best bakeries in the [[nation]].", "zh": "十月，一家美食杂志派记者来，把我们评为全国最好的面包店之一。"}, {"en": "The article called us [[rising]] stars, and the [[label]] on our window suddenly mattered.", "zh": "文章称我们是新星，我们窗上的那块标签忽然变得重要起来。"}, {"en": "A [[screener]] from the magazine asked to [[retake]] the photographs because the light was wrong.", "zh": "杂志的一位审查员要求重拍照片，因为光线不对。"}, {"en": "We built a three-[[tier]] cake for the photograph, and it collapsed on the way out.", "zh": "我们为拍照做了一个三层蛋糕，结果端出去的路上塌了。"}, {"en": "The [[key]] to the article was a single line, printed in [[ink]]: the shop was not [[unrealistically]] perfect.", "zh": "这篇文章的关键只有一行，是印在纸上的：这家店并没有不切实际地完美。"}, {"en": "That same week someone broke in and [[took|take]] the cash box from the [[safe]].", "zh": "就在同一周，有人闯进来，从保险箱里拿走了钱箱。"}, {"en": "We found a [[back-up]] of the accounts on an old drive, which was a small [[gain]].", "zh": "我们在一个旧硬盘上找到了账目的备份，算是一点小小的收获。"}, {"en": "The police said the [[lack]] of a camera made the case hard.", "zh": "警察说没有摄像头让案子很难办。"}, {"en": "The bank had also begun to [[backload]] its fees onto small shops like ours.", "zh": "银行也开始把后期费用摊到我们这样的小店身上。"}, {"en": "I learned to [[label]] every box and to count the till twice.", "zh": "我学会给每个箱子贴标签，收银箱的钱要数两遍。"}, {"en": "The Saturday market was a [[game]] of patience, and it was not [[easy]] to sell bread beside cheap cakes.", "zh": "周六的集市是一场耐心的博弈，在便宜蛋糕旁边卖面包并不容易。"}, {"en": "A [[war]] of signs had started on the street, and the [[welfare]] of the older shopkeepers depended on the outcome.", "zh": "街上打起了一场招牌战，年长店主的生计取决于结果。"}, {"en": "My grandmother had spent a month in the [[ward]] after a bad winter, and she never forgot the nurses.", "zh": "外婆在一个难熬的冬天后住了一个月病房，她一直记得那些护士。"}, {"en": "The [[damn]] thing about small towns, she added, is that everyone knows your name.", "zh": "她补了一句：小地方该死的就在于人人都知道你的名字。"}, {"en": "The children [[continued|continue]] the reading club through the winter, and their [[zeal]] gave me [[zest]] for the work.", "zh": "孩子们把读书会一直办到冬天，他们的热情也给了我对这份工作的兴致。"}, {"en": "Their [[idea]] of a party included a [[dance]] and a [[bizarre]] game they [[dubbed|dub]] the key dance.", "zh": "他们心目中的派对包括跳舞和一个他们称作钥匙舞的奇怪游戏。"}, {"en": "A [[fact]] we had not expected was that the [[quantity]] of bread they ate doubled.", "zh": "我们没料到的一个事实是，他们吃的面包量翻了一倍。"}, {"en": "The [[labor]] of kneading had doubled too, and the [[factor]] behind it was simple: hungry children learn better.", "zh": "揉面的劳动也翻倍了，背后的原因很简单：饿着的孩子学不好。"}, {"en": "[[Above]] the shop, my grandmother kept a [[wardrobe]] of old clothes and a pair of [[jeans]] that no longer fit.", "zh": "店楼上，外婆收着一柜旧衣服和一条已经不合身的牛仔裤。"}, {"en": "A [[tailor]] had made them, she said, and clothes, like towns, could be adjusted.", "zh": "她说那是一位裁缝做的，衣服和镇子一样，都可以修改。"}, {"en": "In December I began to see a [[pattern]] in our days, and the [[prospect]] of spring did not [[obscure]] the hard parts.", "zh": "十二月，我开始看出我们日子里的某种模式，春天的前景也没有遮住那些艰难。"}, {"en": "A good baker needs [[tact]] as much as flour, she said, and I was [[unable]] to argue.", "zh": "她说，好面包师需要圆融，和需要面粉一样多，我无力反驳。"}, {"en": "The town had [[joined|join]] the petition, the tower was never built, and the road to the station still ran [[downhill]] past our door.", "zh": "全镇都加入了请愿，那座塔始终没建成，通往车站的路依旧从我们门前下坡而过。"}, {"en": "I still [[labour]] over the oven at six, and I have never missed the office.", "zh": "我依旧六点就在烤箱前忙活，从未怀念过办公室。"}, {"en": "The shop was not [[naked]] ambition; it was simply work, done well, and she spoke of its [[transcendence]] without ever using the word.", "zh": "这家店不是赤裸裸的野心，只是一份做得好的工作，而她谈论它的超越时，从未用过这个词。"}, {"en": "[[About]] half my old colleagues thought I was mad, and the other half asked for a job.", "zh": "我过去的同事大约一半觉得我疯了，另一半则问我能不能来上班。"}]}, {"key": "三星词汇 Day 04 List 8", "words": [{"w": "nationwide", "phon": "[ˌneɪʃ(ə)nˈwaɪd]", "def": "adj.全国性的adv.在全国范围内", "si": [6], "r": "nat(出生)+ion(国)+wide→全国范围", "dists": [2708, 1242, 78]}, {"w": "pain", "phon": "[peɪn]", "def": "n.痛苦；苦恼", "si": [47], "dists": [2949, 1079, 1168]}, {"w": "protoscience", "phon": "[ˌprəʊtəʊˈsaɪəns]", "def": "n.原科学；前科学", "si": [15], "dists": [1030, 1557, 3430]}, {"w": "query", "phon": "[kwɪri]ˈ", "def": "n.询问；疑问；问号v.询问；怀疑", "si": [19], "dists": [3102, 1675, 1185]}, {"w": "rail", "phon": "[reɪl]", "def": "n.横杆；铁轨v.咒骂；责备；抱怨；以横木围栏", "si": [54], "dists": [2612, 1519, 1384]}, {"w": "saliva", "phon": "[səˈlaɪvə]", "def": "n.唾液；口水", "si": [77], "dists": [955, 3358, 2497]}, {"w": "talk", "phon": "[tɔk]", "def": "v.说话；交谈n.谈话", "si": [2, 15], "dists": [2477, 2171, 956]}, {"w": "value", "phon": "[ˈvælju]", "def": "n.价值；（数）值v.估价；重视", "si": [7], "r": "valu(价值)→价值", "dists": [325, 2738, 2021]}, {"w": "warn", "phon": "[wɔrn]", "def": "v.警告；告诫；提醒注意", "si": [6], "dists": [939, 1314, 957]}, {"w": "absence", "phon": "[ˈæbsəns]", "def": "n.缺席；缺乏", "si": [25, 32], "dists": [3407, 800, 602]}, {"w": "ballet", "phon": "[bæˈleɪ]", "def": "n.芭蕾舞；芭蕾", "si": [43], "dists": [2106, 2543, 1103]}, {"w": "canal", "phon": "[kəˈnæl]", "def": "n.运河；沟渠", "si": [0, 54], "dists": [1085, 454, 2889]}, {"w": "bipedal", "phon": "[d(ə)l]ˌbaɪˈ", "def": "adj.两足动物的n.两足动物", "si": [12], "dists": [1200, 417, 720]}, {"w": "dare", "phon": "[der]", "def": "v.敢于；胆敢", "si": [36], "dists": [1193, 1106, 3327]}, {"w": "edit", "phon": "[ˈedɪt]", "def": "v.编辑；剪辑", "si": [4], "dists": [149, 1070, 2938]}, {"w": "editor", "phon": "[ˈedɪtər]", "def": "n.编辑（者）；剪辑员", "si": [4], "dists": [1069, 965, 3321]}, {"w": "fail", "phon": "[f dj.繁茂的；恶臭的；讨厌的；极端的", "si": [67], "dists": [2898, 1097, 373]}, {"w": "satire", "phon": "[ˈsætaɪər]", "def": "n.讽刺；讽刺作品", "si": [53], "dists": [3410, 2403, 936]}, {"w": "metrics", "phon": "[ˈmetrɪks]", "def": "n.度量；韵律学", "si": [19], "dists": [2548, 1670, 671]}, {"w": "bulb", "phon": "[bʌlb]", "def": "n.电灯泡；球茎状物；球茎；鳞茎", "si": [3], "dists": [2669, 2744, 2792]}, {"w": "foreshadow", "phon": "[fɔrˈʃædəʊ]", "def": "v.预示；预兆", "si": [85], "dists": [2855, 1423, 2256]}, {"w": "reflex", "phon": "[ˈrifleks]", "def": "n.反射动作；本能反应；反射作用adj.反射的；反作用的；本能的", "si": [83], "dists": [542, 2391, 2059]}, {"w": "input", "phon": "[ˈɪnpʊt]", "def": "n.输入v.输入", "si": [88], "dists": [545, 2094, 2071]}, {"w": "spring", "phon": "[sprɪŋ]", "def": "n.春天；弹簧；泉v.跳；跃；蹦；突然猛烈地移动", "si": [58], "r": "spr(迸发)+ing→水涌出/春萌发", "dists": [1291, 1148, 3441]}, {"w": "surveillance", "phon": "[sɜrˈveɪləns]", "def": "n.监视；监督；监控", "si": [24], "dists": [1019, 705, 2815]}, {"w": "chain", "phon": "[tʃeɪn]", "def": "n.链条；链子v.用铁链锁住", "si": [63], "dists": [2383, 1955, 2049]}, {"w": "glue", "phon": "[ɡlu]", "def": "n.胶；胶水v.胶合；粘合；紧附于", "si": [63], "dists": [2412, 2398, 1633]}, {"w": "shortfall", "phon": "[ˈʃɔrtfɔl]", "def": "n.不足；差额；亏空", "si": [60], "dists": [723, 1678, 1393]}, {"w": "soak", "phon": "[səʊk]", "def": "v.浸泡；吸收n.浸泡", "si": [84], "dists": [445, 3486, 3291]}, {"w": "carbon", "phon": "[ˈkɑrbən]", "def": "n.碳；复写纸", "si": [23, 60], "dists": [1689, 1807, 3114]}], "sents": [{"en": "[[Dawn]] came slowly over our [[street]], and the [[rain]] had left every [[lane]] [[near]] the [[canal]] shining like glass.", "zh": "黎明慢慢爬上我们的街道，雨水把运河附近的每条小巷都冲得像玻璃一样发亮。"}, {"en": "I stood at the kitchen window with warm [[water]] and watched a neighbour [[steer]] his old [[automobile]] around the puddles.", "zh": "我端着温水站在厨房窗前，看一位邻居绕开水洼，把他那辆旧汽车开过去。"}, {"en": "In a town this small, people [[talk]], and by seven the whole block knows whose car is missing.", "zh": "在这么小的镇上，人们都爱聊天，到七点钟整条街都知道谁家的车不见了。"}, {"en": "The trees were still [[bare]], but a few [[bulbs|bulb]] had pushed up through the wet earth.", "zh": "树还光秃秃的，但几颗球茎已经顶破湿润的泥土冒了出来。"}, {"en": "My [[editor]] at the weekly paper had asked me to [[edit]] the county [[fair]] programme, a job that sounded easy and was not.", "zh": "周报的主编让我编辑县集市的节目单，这活儿听起来容易，其实不然。"}, {"en": "Every name had to be checked, every [[date]] confirmed, and every figure traced back to a source.", "zh": "每个名字都得核对，每个日期都得确认，每个数字都得追溯到出处。"}, {"en": "She [[warned|warn]] me that one wrong number could embarrass us [[nationwide]], because our stories now travel far beyond the county line.", "zh": "她提醒我，一个错误的数字就可能让我们在全国范围内丢脸，因为我们的报道如今早已走出县界。"}, {"en": "I had learned to [[value]] her warnings; they had saved me from more than one [[blunder]].", "zh": "我学会了重视她的提醒，它们不止一次让我免于犯下愚蠢的错误。"}, {"en": "That morning she [[cancelled|cancel]] two pages of advertising to [[make]] room for a story that mattered.", "zh": "那天上午她撤掉两页广告，给一篇真正重要的报道腾出版面。"}, {"en": "At noon I drove to the regional science [[Olympiad]], held in the [[bare]] [[hall]] of an old high school.", "zh": "中午我开车去了地区科学奥林匹克竞赛，赛场设在一所老高中的空荡荡的礼堂里。"}, {"en": "Cardboard displays [[occupied|occupy]] every table, and nervous students stood beside them like [[candidates|candidate]] at an interview.", "zh": "每张桌子上都摆满了纸板展品，紧张的学生站在旁边，像面试中的应试者。"}, {"en": "One girl had built a [[flywheel]] from scrap metal and bicycle [[gears|gear]], and it spun so smoothly that a coin on its rim never fell.", "zh": "一个女孩用废金属和自行车齿轮做了一只飞轮，它转得那么平稳，轮缘上的一枚硬币始终没有掉下来。"}, {"en": "A boy explained his [[bipedal]] robot, while another measured the [[physics]] of a skateboard [[jump]] with a homemade sensor.", "zh": "一个男孩讲解他的两足机器人，另一个则用自制传感器测量滑板跳跃的物理规律。"}, {"en": "Their [[coach]], a retired teacher, moved between the tables with a stopwatch.", "zh": "他们的教练是一位退休教师，拿着秒表在各张桌子之间走动。"}, {"en": "I asked each student the same [[question]]: what made you curious first?", "zh": "我问每个学生同一个问题：最初是什么让你产生好奇的？"}, {"en": "A retired professor judged the entries and gave a short [[talk]] on [[protoscience]], the messy stage before an idea becomes a discipline.", "zh": "一位退休教授担任评委，还就“前科学”做了简短发言——那是想法变成学科之前混乱的阶段。"}, {"en": "His [[premise]] was simple: curiosity comes before method, and method comes before proof.", "zh": "他的前提很简单：好奇先于方法，方法先于证明。"}, {"en": "He told the students that [[nature]] does not care about our feelings, and that a beautiful theory can still be wrong.", "zh": "他告诉学生，大自然不在乎我们的感受，再漂亮的理论也可能是错的。"}, {"en": "A [[statistician]] from the state university then presented her [[survey]] of teenage sleep habits.", "zh": "接着，州立大学的一位统计学家介绍了她关于青少年睡眠习惯的调查。"}, {"en": "Her data sat in an open [[database]] that anyone could [[query]], and she judged her own work by plain [[metrics]], admitting that half her [[samples|sample]] came from schools that had [[failed|fail]] to return the forms.", "zh": "她的数据放在任何人都能查询的公开数据库里，她只用朴素的指标衡量自己的工作，并承认有一半样本来自那些没能交回问卷的学校。"}, {"en": "After lunch a teacher showed me the school's [[biomedical]] lab, where a small sensor tracks a patient's heartbeat.", "zh": "午饭后，一位老师带我参观学校的生物医学实验室，那里有一枚小传感器在追踪病人的心跳。"}, {"en": "The device was cheap, but its accuracy was [[uncertain]], and the teacher admitted it plainly.", "zh": "那设备很便宜，但准确性不确定，老师也坦率地承认了这一点。"}, {"en": "On the roof, a [[satellite]] dish pointed at the sky, waiting for data that arrived once a [[day]].", "zh": "屋顶上，一只卫星天线指向天空，等待每天只到一次的数据。"}, {"en": "The school had cut its [[carbon]] emissions by a third, mostly by repairing old boilers and sealing windows.", "zh": "学校把碳排放削减了三分之一，主要靠修理旧锅炉和封堵窗户。"}, {"en": "The same cameras that watched the corridors also handled [[surveillance]] of the parking lot, a fact some parents disliked.", "zh": "监视走廊的那些摄像头也负责停车场的监控，这一点让一些家长不满。"}, {"en": "There was no clear [[legal]] rule about how long the footage could be kept, and that [[absence]] of a rule worried me more than the cameras themselves; [[control]] without consent is not safety.", "zh": "录像能保存多久，并没有明确的法律规定，而这种规则的缺失比摄像头本身更让我担心——未经同意的控制并不是安全。"}, {"en": "On the way home I stopped at a diner and ordered a [[hamburger]], which arrived in a [[pan]] too hot to touch.", "zh": "回家的路上，我在一家小餐馆点了个汉堡，它盛在一只烫得不能碰的平底锅里端上来。"}, {"en": "The [[cook]] added [[salt]] and a slice of [[mandarin]] to the salad, an odd [[pair]] that somehow worked.", "zh": "厨师往沙拉里加了盐和一片橘子，这一奇怪的搭配居然还不错。"}, {"en": "I [[tasted|taste]] it, then asked for the recipe, and he laughed and said there was none.", "zh": "我尝了尝，然后要食谱，他笑着说根本没有。"}, {"en": "At home my roommate was [[washing|wash]] a [[vase]] her grandmother had [[painted|paint]], and she had begun to [[knit]] a scarf.", "zh": "回到家，室友正在洗一只她祖母画过的花瓶，还开始织一条围巾。"}, {"en": "The flat felt [[cozy]] that evening, warm and a little crowded.", "zh": "那晚公寓里很舒适，暖和，也略微拥挤。"}, {"en": "A [[pair]] of [[sandals|sandal]] by the door were the only signs of our hurry.", "zh": "门口的一双凉鞋是我们匆忙出门的唯一痕迹。"}, {"en": "My brother called from the city, and his [[absence]] at dinner had left an empty chair that no one mentioned.", "zh": "哥哥从城里打来电话，他晚餐时的缺席留下一把没人提起的空椅子。"}, {"en": "He is [[gay]], and our parents' slow acceptance has been, I think, the bravest thing they have ever done.", "zh": "他是同性恋，而父母缓慢的接纳，我想，是他们做过的最勇敢的事。"}, {"en": "He [[teaches|teach]] [[languages|language]] at a secondary school, and he says the work gives him more [[joy]] than money ever could.", "zh": "他在一所中学教语言，他说这份工作给他的快乐超过金钱所能给予的。"}, {"en": "He believes that [[education]] should make people [[stronger|strong]], not merely more employable, and that [[knowledge]] without sympathy is a dangerous tool.", "zh": "他相信教育应该让人更强大，而不仅仅是更易就业；他也认为没有同理心的知识是危险的工具。"}, {"en": "I told him about the science [[fair]], and he said the best students are always the ones who [[dare]] to look foolish.", "zh": "我跟他说了科学展的事，他说最好的学生总是那些敢让自己看起来像个傻瓜的人。"}, {"en": "Before we hung up, he asked me to [[hand]] the phone to our mother, who was crying quietly in the kitchen.", "zh": "挂电话前，他让我把手机递给妈妈，她正在厨房里悄悄流泪。"}, {"en": "On Thursday I covered a [[rally]] for a neighbour recovering from [[cancer]], held in the church [[hall]].", "zh": "周四，我采访了一场为一位癌症康复邻居举办的集会，地点在教堂礼堂。"}, {"en": "Her family had raised money by selling [[lottery]] tickets and cakes, and a local [[band]] played old songs.", "zh": "她的家人靠卖彩票和蛋糕筹款，一支本地乐队演奏了老歌。"}, {"en": "She spoke in a [[faint]] voice, but her [[joy]] was unmistakable.", "zh": "她声音微弱，但喜悦是掩盖不住的。"}, {"en": "She said illness had taught her that [[well-being]] is not a luxury but a daily [[effort]], and that the body is more [[vulnerable]] than we like to admit.", "zh": "她说疾病教会她，幸福安康不是奢侈，而是每天的努力；身体比我们愿意承认的更脆弱。"}, {"en": "The room was full of people who had lost someone, and the feeling was [[overwhelming]]; no one there was rich, yet everyone gave something, and I thought them all [[deserving]] of more than they had.", "zh": "屋里坐满了失去过亲人的人，那种情绪令人难以承受；在场没有人富有，可每个人都拿出了些什么，我觉得他们都值得比现有更多的回报。"}, {"en": "My younger sister, who [[teaches|teach]] [[ballet]] on Saturdays, came with me and cried without embarrassment.", "zh": "我妹妹每周六教芭蕾，她跟我一起去了，毫不难为情地哭了。"}, {"en": "She has an [[enviable]] calm on stage, though backstage she is a nervous wreck.", "zh": "她在台上有一种令人羡慕的镇定，尽管在后台她紧张得一塌糊涂。"}, {"en": "The dancers moved in slow [[waves|wave]] across the floor, their [[heels|heel]] striking the wood like soft rain.", "zh": "舞者们在地板上缓缓起伏，脚跟敲击木地板，像轻柔的雨声。"}, {"en": "The [[ritualistic]] bow at the end lasted longer than the dance itself, and she stood so [[slim]] and straight that she seemed made of wire.", "zh": "结尾仪式般的鞠躬比舞蹈本身还长，她站得那么纤细笔直，仿佛是用铁丝做成的。"}, {"en": "Afterwards we sat in the car in a [[daze]], and a [[searing]] [[pain]] in my knee reminded me that I had never been a dancer.", "zh": "之后我们恍惚地坐在车里，膝盖上一阵灼痛提醒我，我从来不是跳舞的料。"}, {"en": "On Friday I helped an old friend trace his [[genealogy]] in the courthouse basement.", "zh": "周五我在法院地下室帮一位老朋友追溯他的家谱。"}, {"en": "His great-grandfather had come from a village [[abroad]] and had worked on the [[railroad]] for thirty years.", "zh": "他的曾祖父来自国外的一个村庄，在铁路上干了三十年。"}, {"en": "The clerk, a [[stern]] woman with reading glasses, gave us one hour and a stack of ledgers.", "zh": "那位书记员是个戴老花镜的严厉女人，只给了我们一小时和一摞账簿。"}, {"en": "We found the same name spelled three ways, a common [[quirk]] of old records, and the discovery made us laugh.", "zh": "我们发现同一个名字有三种拼法，这是旧档案常见的怪癖，这发现让我们笑了。"}, {"en": "The [[judiciary]] keeps order in the courtroom, but paperwork, my friend joked, keeps order in history.", "zh": "司法系统维持法庭的秩序，而我朋友开玩笑说，文书维持着历史的秩序。"}, {"en": "I [[quoted|quote]] one line in my notebook and later wrote a short [[satire]] about the whole afternoon.", "zh": "我在笔记本里引用了一句话，后来还就那个下午写了一篇短短的讽刺小品。"}, {"en": "On Saturday I walked along the old [[rail]] line that once carried coal to the [[canal]].", "zh": "周六，我沿着那条曾把煤运到运河的旧铁轨散步。"}, {"en": "The [[landscape]] on both sides had gone wild, and [[native]] grasses and [[thorny]] bushes covered the ground where the tracks used to run.", "zh": "两侧的风景已变得野性十足，本土的野草和多刺的灌木覆盖了曾经铺着铁轨的地面。"}, {"en": "[[Sand]] from the river had piled up against the bridges, and old ties lay in the grass like bones.", "zh": "河里的沙子堆在桥边，旧枕木躺在草里，像一堆骨头。"}, {"en": "An old [[man]] with a [[cane]] told me the line had carried wheat and people, and that it was all [[waste]] now.", "zh": "一位拄着藤杖的老人告诉我，这条线曾运过小麦和人，如今全成了废物。"}, {"en": "A [[spring]] ran under the path, so clear that I could see the small stones at the bottom.", "zh": "一股泉水在小路下流过，清澈得能看见底部的碎石。"}, {"en": "Beyond the fields, the [[land]] sloped toward the [[ocean]], though you could not see it from here.", "zh": "田野之外，土地向海洋倾斜，尽管从这里看不见海。"}, {"en": "The paper's Monday story was about a factory that had hidden a [[shortfall]] in its [[carbon]] reports.", "zh": "报纸周一的报道讲的是一家工厂隐瞒了碳排放报告中的亏空。"}, {"en": "The company [[imported|import]] parts from three countries and paid almost no [[tax]] in this one.", "zh": "这家公司从三个国家进口零件，却在这个国家几乎不缴税。"}, {"en": "Its [[managers|manage]] had [[faked|fake]] a certificate, an [[egregious]] error that the state now calls fraud.", "zh": "它的管理层伪造了一份证书，这个极其恶劣的错误如今被州里称为欺诈。"}, {"en": "They tried to [[glue]] the story together with a single press release, but the [[chain]] of evidence was easy to follow.", "zh": "他们想用一份新闻稿把事情糊过去，但证据链很容易就能追下去。"}, {"en": "The factory is [[large]] enough to employ half the town, which makes the case [[harder|hard]] than it looks; [[necessity]], one worker told me, is a poor excuse for a lie, and [[regrettably]] the fine was small and the jobs stayed.", "zh": "这家工厂大到雇了半座镇子的人，这让案子比看上去更难办；一名工人告诉我，需要不是撒谎的好借口，遗憾的是罚款很少，工作也保住了。"}, {"en": "[[Public]] reaction was quieter than I expected; most people simply wanted the jobs to remain [[unchanged]].", "zh": "公众的反应比我预想的平静，多数人只是希望这些工作保持原样。"}, {"en": "The mayor gave a [[verbal]] promise to review the permits; a written record, he said, was not [[necessary]].", "zh": "市长口头承诺会重新审查许可证；他说书面记录没有必要。"}, {"en": "His [[rank]] in the party protects him, and his answers are [[unchangeable]] once recorded.", "zh": "他在党内的地位保护着他，而他的回答一旦记录下来就不可更改。"}, {"en": "I tried to [[imagine]] what I would have done in his place, and I could not be sure.", "zh": "我试着想象如果换作我会怎么做，却无法确定。"}, {"en": "We [[made|make]] a chart of the emissions and printed it on the front page; it was the [[last]] story I wrote that week.", "zh": "我们做了一张排放图表印在头版；那是我那周写的最后一篇稿子。"}, {"en": "That night the newsroom [[team]] stayed late, and I [[watched|watch]] the cleaning staff [[deliver]] bundles of papers to the loading dock.", "zh": "那天夜里，新闻编辑室的团队留到很晚，我看着清洁工把一捆捆报纸送到装卸口。"}, {"en": "A courier [[knocked|knock]] on the glass door, [[puffed-out]] from running up the stairs.", "zh": "一名快递员敲响玻璃门，跑上楼梯让他气喘吁吁。"}, {"en": "The rain had cut [[visibility]] on the highway, so his [[journey]] had taken twice as long.", "zh": "雨降低了高速公路上的能见度，所以他的路程花了两倍时间。"}, {"en": "Across the street, a [[bar]] was still open, and a [[quick]] glance at my [[watch]] told me it was nearly two.", "zh": "街对面有家酒吧还开着，我匆匆瞥了眼手表，快到两点了。"}, {"en": "A glass case held a rusted [[lance]] and a rusty saddle from the old cavalry days.", "zh": "一只玻璃柜里陈列着一柄生锈的长矛和一副旧骑兵时代的马鞍。"}, {"en": "The curator, a patient man, said the collection had begun as one man's [[quest]] to save the town's memory.", "zh": "馆长是个有耐心的人，他说这批收藏始于一个人拯救小镇记忆的追寻。"}, {"en": "He told us the population had grown [[eightfold]] in twenty years, then [[fallen|fall]] just as fast.", "zh": "他告诉我们，人口在二十年间增长了八倍，随后又以同样快的速度下降。"}, {"en": "I put my [[palm]] on the cool glass, and my own reflection stared back; my mouth was dry, and I swallowed the last of my [[saliva]].", "zh": "我把手掌贴在冰凉的玻璃上，自己的倒影也回望着我；我口干舌燥，咽下了最后一点口水。"}, {"en": "Outside, the wind had begun to [[conspire]] with the clouds, and the light turned green.", "zh": "外面，风开始与云层合谋，天色变绿了。"}, {"en": "On Sunday my aunt invited us to a [[banquet]] for her church group, and the tables were crowded with [[Midwestern]] food.", "zh": "周日，姑姑请我们参加她教会团体的宴会，桌上摆满了美国中西部的家常菜。"}, {"en": "The conversation turned to the science fair, and an uncle [[challenged|challenge]] the girls' results as [[unnatural]].", "zh": "话题转到科学展上，一位叔叔质疑那些女孩的结果“不自然”。"}, {"en": "My sister, who never backs down, asked him whether he would have said the same about a [[male]] student.", "zh": "我妹妹从不退让，她问他，对一个男学生他是否也会这么说。"}, {"en": "[[Gender]], I thought, shapes even the way we doubt a number, and heavy rain had [[hampered|hamper]] the drive home.", "zh": "我想，性别甚至塑造了我们怀疑一个数字的方式；而大雨妨碍了我们开车回家。"}, {"en": "A [[reflex]] made me brake at every crossing, and I tried to [[translate]] the day into notes but stopped halfway.", "zh": "一种本能反应让我在每个路口都踩刹车，我试着把这一天翻译成笔记，却写到一半就停了。"}, {"en": "My editor once said that a good reporter must [[soak]] up detail without drowning in it.", "zh": "主编曾说，好记者必须吸收细节，但不能被细节淹没。"}, {"en": "Looking back, the quiet argument at that table [[foreshadowed|foreshadow]] much of what the paper would cover that autumn.", "zh": "回头看，饭桌上那场安静的争论预示了那年秋天报纸要报道的许多事。"}, {"en": "My brother, who had listened to the whole story by phone, told me that [[faith]] is what remains when the evidence runs out.", "zh": "哥哥在电话里听完整件事后告诉我，信念就是证据耗尽之后仍然留下的东西。"}, {"en": "I [[know]] now that a town is not a place but a set of arguments that never quite finish.", "zh": "我现在明白，一座小镇不 ing with a [[strict]] calm.", "zh": "组里的年长者是一位研究视觉三十年的教授，她以严格的冷静主持我们的周一例会。"}, {"en": "She [[offered|offer]] me a place on the team studying visual [[perception]], and I [[accepted|accept]] before she finished the sentence.", "zh": "她给了我一个加入视觉感知研究组的名额，她话没说完我就答应了。"}, {"en": "Her [[technique]] was [[old-fashioned]] but precise, and she insisted that we learn the [[technic]] of asking small questions.", "zh": "她的技术方法老派却精确，她坚持让我们学会问小问题的技巧。"}, {"en": "[[Access]] to the scanner was limited, so we booked it in [[slots|slot]] of two hours and often worked [[late]].", "zh": "扫描仪的使用权限有限，所以我们以两小时为一个时段预约，常常工作到很晚。"}, {"en": "Language was a [[barrier]] at first; when I could not explain myself, I learned to [[hide]] my panic behind a joke.", "zh": "语言起初是一道障碍；当我解释不清时，我学会用玩笑掩藏慌张。"}, {"en": "Our experiment asked whether the [[subconscious]] mind can notice a change in an [[image]] before the eyes report it.", "zh": "我们的实验想弄清：潜意识能否在眼睛报告之前察觉图像的变化。"}, {"en": "A small [[electronic]] device made a [[beam]] of light [[vibrate]] at a fixed rate, and a camera recorded the response.", "zh": "一个小型电子装置让一束光以固定频率振动，摄像机记录下反应。"}, {"en": "The brain's [[neural]] activity was noisy, and every cough in the corridor could [[distort]] the signal.", "zh": "大脑的神经活动很嘈杂，走廊里每一声咳嗽都可能扭曲信号。"}, {"en": "We [[generated|generate]] [[thousands|thousand]] of trials to fix a [[baseline]], then compared each new trial with it.", "zh": "我们生成数千次试验来确立一个基线，再把每次新试验与它比较。"}, {"en": "The change was [[rapid]] but tiny, and it took months to [[harness]] it into a result we could trust.", "zh": "变化迅速却极细微，我们花了好几个月才把它转化为可信的结果。"}, {"en": "The lab next door kept a [[captive]] [[rat]] that had lived there longer than most students.", "zh": "隔壁实验室养着一只被关起来的老鼠，它在那里待的时间比大多数学生都长。"}, {"en": "It was an [[omnivore]] with a taste for [[raisins|raisin]] and a tail like a small [[brush]].", "zh": "它是杂食动物，爱吃葡萄干，尾巴像一把小刷子。"}, {"en": "Its diet was kept to a strict [[ratio]] of fat and protein, and its data was [[pure]] enough to publish.", "zh": "它的饮食被严格控制在脂肪与蛋白质的比例上，它身上的数据纯净得足以发表。"}, {"en": "I once brought it a spoon of [[cream]], which was against the rules and [[worth]] the risk; the [[raid]] on the fridge felt like a small crime.", "zh": "我曾给它带过一勺奶油，这违反规定，却值得冒险；那次对冰箱的突袭像一桩小小的犯罪。"}, {"en": "The [[staple]] of its diet was dry grain, which it would [[lay]] in a corner and guard for hours.", "zh": "它日常的主食是干谷物，它会把谷物堆在角落里守上好几个小时。"}, {"en": "A [[net]] over the cage kept it from escaping, and there was no [[shortcut]] to cleaning it; someone had to [[care]] for it every day.", "zh": "笼子上罩着网防止它逃跑，清理起来也没有捷径，每天都得有人照顾它。"}, {"en": "My [[neighbour]], a farmer with a gray [[beard]], owned forty [[acres|acre]] of flat land behind my [[cottage]].", "zh": "我的邻居是个留灰胡子的农民，在我小屋后面拥有四十英亩平地。"}, {"en": "He [[hauled|haul]] [[lumber]] in an old truck and [[burned|burn]] brush at the edge of the field every autumn.", "zh": "他用一辆旧卡车拖运木材，每年秋天都在田边烧灌木。"}, {"en": "The [[weather]] that month was [[harsh]]: hot days, cold nights, and a wind that never stopped.", "zh": "那个月的天气很恶劣：白天炎热，夜里寒冷，风从不停。"}, {"en": "The truck could barely [[bear]] the weight of the wood, and he drove it slowly, as if he had all the time in the world.", "zh": "那辆卡车几乎承受不住木头的重量，他开得很慢，仿佛有取不完的时间。"}, {"en": "Sometimes I heard him singing [[far-off]] songs in a language I could not place, and I wondered about the [[geography]] of his life.", "zh": "有时我听见他唱遥远的歌，用我听不出是哪里的语言，我会想象他一生走过的地理。"}, {"en": "The [[neighbor]] on the other side said the farm was haunted, though she had never seen the [[ghost]]; the [[homeowner]] laughed and said ghosts do not pay rent.", "zh": "另一边的邻居说那座农场闹鬼，尽管她从没见过鬼；房主则笑着说鬼可不付房租。"}, {"en": "Each spring [[thousands|thousand]] of birds [[migrate]] through the [[Netherlands]], and an [[environmentalist]] group [[counts|count]] them.", "zh": "每年春天成千上万的鸟迁飞经过荷兰，一个环保团体负责清点它们。"}, {"en": "The local [[government]] wanted to widen the road, which the group saw as a threat to a [[rare]] species.", "zh": "当地政府想拓宽公路，而这个团体认为这威胁到一个稀有物种。"}, {"en": "A [[lawmaker]] proposed a [[permanent]] ban on night traffic, but the farmers called it an [[onerous]] [[punishment]].", "zh": "一位立法者提议永久禁止夜间通行，农民们却说这是繁重苛刻的惩罚。"}, {"en": "At the hearing the environmentalists were [[overwhelmingly]] in favour, while the truck drivers were not.", "zh": "听证会上，环保人士压倒性地赞成，而卡车司机们则相反。"}, {"en": "The two sides had become [[foes|foe]], and [[neither]] would move.", "zh": "双方成了敌人，谁也不肯让步。"}, {"en": "I went to the hearing out of curiosity, and the [[debate]] was stranger than I expected: one speaker said the road would [[harm]] the birds, and another said the birds would simply move.", "zh": "我出于好奇去听了听证会，那场辩论比我预想的更奇怪：一位发言者说公路会伤害鸟类，另一位说鸟自己会搬走。"}, {"en": "Both claims were [[rational]] on the surface, but each rested on a [[base]] of half-finished evidence.", "zh": "两种说法表面上都合乎理性，但各自都建立在不完整的证据基础之上。"}, {"en": "The chairman [[struggled|struggle]] to [[justify]] a decision that would please nobody, and his [[just]] tone only made the room angrier.", "zh": "主席努力为一个谁都不会满意的决定辩护，他那种公正的语气反而让会场更愤怒。"}, {"en": "It was [[absurd]], really: a [[string]] of numbers had [[pulled|pull]] two villages apart, and no one could say where [[justice]] lay.", "zh": "这实在荒唐：一串数字把两个村子拉开了距离，却没人说得清正义站在哪里。"}, {"en": "I sat [[alongside]] a young mother who said the whole argument needed a [[punch]] of honesty, and I wrote that down.", "zh": "我坐在一位年轻母亲旁边，她说这场争论需要一记诚实的重拳，我把这句话记了下来。"}, {"en": "Back at the [[office]], the lab's finances were worse than the road debate.", "zh": "回到办公室，实验室的财务状况比那场公路辩论还糟。"}, {"en": "Our grant had been [[underfunded|underfund]] for a [[decade]], and the department carried a [[debt]] it could not repay.", "zh": "我们的经费十年来一直不足，系里背着一笔还不清的债。"}, {"en": "We had to [[cope]] with old equipment and [[deal]] with suppliers who charged by the hour.", "zh": "我们得应付老旧设备，还得跟按小时收费的供应商打交道。"}, {"en": "The [[cost]] of a new sensor had [[skyrocketed|skyrocket]], and the company could no longer [[manufacture]] the old part, so my [[purchase]] request sat on a desk for weeks.", "zh": "新传感器的价格飞涨，公司也不再生产旧零件，所以我的采购申请在办公桌上搁了好几周。"}, {"en": "A [[corporation]] offered to sponsor us [[via]] its foundation, but only if we used their software, which felt like a trap.", "zh": "一家公司提出通过旗下基金会赞助我们，但条件是用他们的软件，这感觉像个陷阱。"}, {"en": "The old scanner needed a full [[overhaul]], and in our [[haste]] to [[save]] money we had stopped maintaining it; the whole situation was an [[indictment]] of how science is funded.", "zh": "旧扫描仪需要彻底检修，而我们为了省钱匆忙停止维护它；整个局面本身就是对科研资助方式的一纸控诉。"}, {"en": "A [[veteran]] science writer visited the [[studio]] to record a short talk for the radio.", "zh": "一位资深科学作家来到录音棚，为电台录制一段短讲。"}, {"en": "She had spent her [[career]] avoiding [[fame]], and she spoke in a [[manner]] that made complicated ideas sound simple.", "zh": "她整个职业生涯都在避免出名，她说话的方式能让复杂的想法听起来简单。"}, {"en": "Her [[style]] was [[elegant]] but plain, and her [[layout]] for the script left no [[blank]] space.", "zh": "她的风格优雅而朴素，她为讲稿做的版式没有留下一处空白。"}, {"en": "She said a good script should sound like speech, not like a [[copy]] of a textbook.", "zh": "她说好的讲稿听上去应该像说话，而不像教科书的复制品。"}, {"en": "The studio was [[stuffy]], so she asked for the window to be opened.", "zh": "录音棚里很闷，于是她让人把窗户打开。"}, {"en": "Before the interview she warned me about [[buzzwords|buzzword]]: they make a sentence sound scientific without making it clear.", "zh": "采访前她提醒我提防流行术语：它们让句子听起来科学，却并不清楚。"}, {"en": "Her [[vocabulary]] was wide but never showy, and she [[paraphrased|paraphrase]] every hard term before using it.", "zh": "她的词汇量很大却从不炫耀，每用一个难懂的术语前，她都会先转述一遍。"}, {"en": "I tried to [[imitate]] her, and the result was a stiff little paragraph that [[said|say]] nothing.", "zh": "我试着模仿她，结果写出一段僵硬又言之无物的小文字。"}, {"en": "My [[parent]] used to give me the same advice about letters, and I had forgotten it.", "zh": "我父亲（或母亲）以前写信时也给过我同样的建议，而我早已忘了。"}, {"en": "On Wednesday I taught a group of [[undergraduates|undergraduate]] how to run the basic test.", "zh": "周三我教一群本科生怎么跑那个基础测试。"}, {"en": "They were quick and careless, and one of them [[unplugged|unplug]] the machine while it was recording.", "zh": "他们手快又粗心，其中一个在机器录制时拔掉了电源。"}, {"en": "I had to [[strip]] the ruined data and start again, which took the whole afternoon.", "zh": "我只得剥除损坏的数据重新开始，这花掉了整个下午。"}, {"en": "Their questions were better than their technique, and one of them [[corrected|correct]] a mistake in my code.", "zh": "他们的问题比技术好，其中一个还纠正了我代码里的一处错误。"}, {"en": "One asked whether the [[study]] would ever produce a real [[improvement]] in medicine, and I said I hoped so.", "zh": "有人问这项研究是否真能给医学带来改进，我说希望如此。"}, {"en": "The department was [[awaiting|await]] news of the grant renewal, and the [[second]] review had not yet arrived.", "zh": "系里在等待经费续期的消息，第二份评审意见还没有到。"}, {"en": "I emailed the funding office to [[inquire]], and received an automatic reply.", "zh": "我发邮件向资助办公室询问，收到一封自动回复。"}, {"en": "We kept working [[steadily]] in the meantime, because stopping was not an option.", "zh": "与此同时我们稳定地继续工作，因为停下来不是一个选项。"}, {"en": "In June I was invited to a conference abroad, and the paperwork was [[cumbersome]].", "zh": "六月我受邀去国外参加一个会议，手续繁复得令人头疼。"}, {"en": "The [[visa]] form asked for details of every trip I had taken in ten years.", "zh": "签证表格要求填写我十年内每一次出行的细节。"}, {"en": "I filled it in twice, made a [[copy]], paid the fee by [[card]], and mailed it with a photograph I did not like.", "zh": "我填了两遍，复印了一份，用银行卡付了费，还附上一张我不喜欢的照片寄了出去。"}, {"en": "Two weeks later I [[got|get]] a message saying the visa was ready, and I carried it in my [[purse]] like a small passport.", "zh": "两周后我收到消息说签证好了，我把它像一本小护照一样放在钱包里。"}, {"en": "At the airport I sat [[aboard]] the plane beside a [[teenager]] in a [[very]] old jacket.", "zh": "在机场，我坐在飞机上，旁边是一个穿着很旧夹克的少年。"}, {"en": "He asked where the sea ended, and the plane began to [[march]] down the runway before I could answer.", "zh": "他问海到哪里为止，我还没来得及回答，飞机已经开始沿跑道前行。"}, {"en": "The conference hall was full of [[parallel]] sessions, and I could not decide which talk to attend.", "zh": "会议大厅里全是同时进行的分会场，我拿不定主意去听哪一场。"}, {"en": "A [[laureate]] gave the opening lecture on the physics of music and the mathematics of rhythm.", "zh": "一位桂冠得主做了开幕讲座，讲音乐的物理学和节奏的数学。"}, {"en": "She argued that beauty is not a decoration but a [[core]] part of scientific thinking, an [[unconventional]] claim in that room.", "zh": "她主张美不是装饰，而是科学思维的核心部分——在那个房间里，这是个不合常规的说法。"}, {"en": "Her talk had no slides and no [[scale]] on any axis; she simply played a recording and let the light [[die]] behind the screen.", "zh": "她的讲座没有幻灯片，任何坐标轴上也没有刻度；她只是放了一段录音，让光在幕布后暗下去。"}, {"en": "I wanted to [[weep]] and could not say why, and [[far]] from home I felt both free and weightless.", "zh": "我想哭，却说不清为什么；远离家乡，我感到既自由又轻飘飘的。"}, {"en": "I felt the old panic in my chest, the one that used to [[stun]] me in seminars.", "zh": "我感到胸口一阵旧日的恐慌，那种在研讨课上曾让我发懵的感觉。"}, {"en": "We ended up talking for an hour, and he offered to [[swap]] data with our lab.", "zh": "我们最后聊了一个小时，他提出和我们实验室交换数据。"}, {"en": "He said science advances when rival groups [[unite]] around a shared [[element]] of doubt, a view I found hard to [[accord]] with at first.", "zh": "他说科学之所以进步，是因为对立的研究组围绕共同的怀疑要素联合起来，这个观点起初让我难以认同。"}, {"en": "That evening I walked along a canal, and the [[scene]] was so calm that I could hear the [[beat]] of my own heart.", "zh": "那天傍晚我沿运河散步，景色宁静得让我能听见自己的心跳。"}, {"en": "On Saturday I visited an exhibition that tried to [[launch]] a dialogue between artists and scientists.", "zh": "周六我去看了一个试图在艺术家和科学家之间发起对话的展览。"}, {"en": "A [[generous]] donor had given the museum a small [[ruby]], a [[bunch]] of fossils, and a [[carrier]] full of old slides.", "zh": "一位慷慨的捐赠者送给博物馆一颗小红宝石、一束化石和一个装满旧幻灯片的提箱。"}, {"en": "The curator argued that [[mankind]]'s [[survival]] depends less on clever machines than on the [[rate]] at which we learn to share knowledge.", "zh": "馆长认为，人类的生存更多取决于我们学会分享知识的速度，而不是聪明的机器。"}, {"en": "She was a vocal [[advocate]] of open data, [[whereas]] the university wanted to keep its results private.", "zh": "她公开主张数据开放，而大学却想保密自己的研究成果。"}, {"en": "One exhibit, a [[weak]] projector behind a sheet, offered a [[reinterpretation]] of the moon landing as a [[fantasy]] about collective hope.", "zh": "一件展品是幕布后面一台微弱的投影仪，它把登月重新诠释为关于集体希望的幻想。"}, {"en": "The room was [[cool]] and quiet, and a thin man with an athlete's [[physique]] stood [[on]] a chair to fix the machine, ignoring the [[intrusiveness]] of the museum's cameras.", "zh": "房间里凉爽安静，一个体格像运动员的瘦男人站在椅子上修机器，毫不在意博物馆摄像头的侵扰。"}, {"en": "I asked the curator what [[genre]] the exhibition belonged to, and she said it belonged to none.", "zh": "我问馆长这个展览属于什么类型，她说它不属于任何类型。"}, {"en": "She said every generation must [[strive]] to explain science in its own language, or the explanation will [[wear]] thin and become a slogan.", "zh": "她说每一代人都必须努力用自己的语言解释科学，否则解释会渐渐磨损，变成一句口号。"}, {"en": "In the worst [[scenario]], she added, people stop asking and simply trust whoever shouts loudest.", "zh": "她还说，在最糟的情况下，人们会停止追问，只去相信喊得最响的人。"}]}, {"key": "三星词汇 Day 05 List 10", "words": [{"w": "counter", "phon": "[ˈkaʊntər]", "def": "n.柜台；对立面v.反驳；抵消adv.相反地", "si": [5], "dists": [1449, 1875, 822]}, {"w": "counterculture", "phon": "[ˈkaʊntərkʌltʃər]", "def": "n.反主流文化；反正统文化", "si": [5], "dists": [3448, 411, 305]}, {"w": "decent", "phon": "[ˈdis(ə)nt]", "def": "adj.像样的；体面的；正派的", "si": [1], "dists": [636, 2232, 2772]}, {"w": "far-reaching", "phon": "[ˌfɑrˈritʃɪŋ]", "def": "adj.深远的；影响深远的", "si": [8], "dists": [2089, 1549, 12]}, {"w": "gift", "phon": "[ɡɪft]", "def": "n.礼物；天赋", "si": [7], "dists": [3259, 2422, 2027]}, {"w": "have", "phon": "[hæv]", "def": "v.有；吃；得到", "si": [0], "dists": [2452, 1473, 995]}, {"w": "impact", "phon": "[ˈɪmpækt]", "def": "n.冲击（力）；影响力v.冲击；撞击；对…产生影响", "si": [4], "dists": [1135, 866, 646]}, {"w": "lead", "phon": "[lid]", "def": "v.领导；带领；导致n.铅", "si": [10], "dists": [3049, 1715, 1474]}, {"w": "marine", "phon": "[məˈrin]", "def": "adj.海的；与海有关的n.水兵；海军陆战队士兵；舰队；海运业", "si": [3, 10], "dists": [366, 315, 2365]}, {"w": "never", "phon": "[ˈnevər]", "def": "adv.从未；决不", "si": [0, 4], "dists": [397, 2653, 1877]}, {"w": "open", "phon": "[ˈəʊpən]", "d 设备", "si": [88], "r": "port(搬运)+able(能)→可搬运的", "dists": [3001, 95, 1822]}], "sents": [{"en": "I [[have]] [[never]] been good at starting over, so moving to a small [[country]] town at thirty-four felt [[bold]] and foolish at once.", "zh": "我从来都不擅长重新开始，所以三十四岁时搬到一个小镇，既显得大胆又显得愚蠢。"}, {"en": "The paper's [[newsroom]] sat above a [[newsstand]], and my new colleagues gave me a [[decent]] desk by the window.", "zh": "报社的新闻编辑室在一个书报亭楼上，新同事给了我一张靠窗的还不错的桌子。"}, {"en": "They said the town was [[open]] to [[newcomers|newcomer]], though older residents still [[weighed|weigh]] every accent and every pair of shoes.", "zh": "他们说这个镇子对新来的人很开放，尽管年长的居民仍会掂量你的口音和鞋子。"}, {"en": "My first assignment was to cover a [[marine]] research station that had just opened on the coast.", "zh": "我的第一个任务是采访一座刚在海岸边开放的海洋研究站。"}, {"en": "Public interest in the project was [[never]] strong, and the station's work had little [[impact]] on daily life.", "zh": "公众对这个项目的兴趣从来不浓，研究站的工作对日常生活影响甚微。"}, {"en": "Behind the [[counter]] of the station's small cafe worked a man in his sixties who had once lived in a [[counterculture]] commune.", "zh": "研究站小咖啡馆的柜台后面，有位六十多岁的男人，他年轻时曾住在反主流文化的公社里。"}, {"en": "He told me the commune had tried to live on [[raw]] vegetables and open conversation, and that both had proved harder than expected.", "zh": "他告诉我，那个公社曾尝试靠生蔬菜和坦率的交谈生活，结果两样都比预想的难。"}, {"en": "He had a [[gift]] for describing failure without self-pity, and I liked him at once.", "zh": "他有种不带自怜地讲述失败的天赋，我立刻喜欢上了他。"}, {"en": "His stories had a [[far-reaching]] effect on the way I saw the town.", "zh": "他的故事对我看待这座小镇的方式产生了深远影响。"}, {"en": "I asked if he ever missed that life, and he said [[never]] for a day.", "zh": "我问他是否怀念那种生活，他说一天也没有。"}, {"en": "The station's director [[led|lead]] me through a corridor of tanks and pipes, and explained that her [[subfield]] of [[marine]] biology had changed completely in ten years.", "zh": "研究站的站长带我穿过摆满水箱和管道的走廊，并解释说她的海洋生物学分支领域十年间彻底变了。"}, {"en": "[[Part]] of the work was public education, and part was pure research with no clear product.", "zh": "一部分工作是公众教育，另一部分是没有明确产品的纯研究。"}, {"en": "She was [[tempted|tempt]] to take an industry grant, but the terms would have tied her data to a company's interests.", "zh": "她曾想接受一笔企业资助，但那些条款会把她的数据绑在公司的利益上。"}, {"en": "The lab was half [[underground]], and the air smelled of salt and electricity.", "zh": "实验室有一半在地下，空气里有盐和电的味道。"}, {"en": "A recent [[amendment]] to the funding rules had made such deals harder, which she counted as a small [[victory]].", "zh": "最近对资助规则的一处修订让这类交易更难达成，她把这算作一场小小的胜利。"}, {"en": "Against the [[backdrop]] of the harbour, the old [[campus]] looked more like a [[hotel]] than a school.", "zh": "以港口为背景，那座旧校园看起来更像酒店而不是学校。"}, {"en": "A [[block]] of [[new]] flats had been built on the land where the [[library]] once stood.", "zh": "一片新公寓建在了图书馆曾经所在的地块上。"}, {"en": "The director tried to [[coax]] the council into funding a new lab, but the meeting produced nothing; the [[creation]] of the station had already cost a fortune, and the expense was [[devastating]] for a town this small.", "zh": "站长试图哄劝议会为一个新实验室出资，但会议毫无结果；研究站的创建已花掉一大笔钱，对一个这么小的镇子来说，这笔开支是毁灭性的。"}, {"en": "Her questions were designed to [[elicit]] facts, not to trap anyone, and she treated every rumour as a possible [[falsehood]].", "zh": "她的提问是为了引出事实，而不是给人设套；她把每条传闻都当作可能的谎言来对待。"}, {"en": "With her [[foresight]], she had saved the station's records before the flood, and I [[envied|envy]] that kind of patience.", "zh": "凭着先见之明，她在洪水前保存了研究站的档案，我羡慕那种耐心。"}, {"en": "The station's status was [[government-defined]], which meant its budget could change with every election, and its mission was [[distinct]] from the university's, though the two shared a laboratory.", "zh": "研究站的地位由政府界定，这意味着它的预算会随每次选举变动；它的使命与大学不同，尽管两者共用一个实验室。"}, {"en": "That dependence produced a constant [[insecurity]], and a [[lawsuit]] against a former supplier only made things worse.", "zh": "这种依赖造成了持续的不安全感，而一场针对前供应商的诉讼只让情况更糟。"}, {"en": "The most [[lucrative]] contract had gone to a firm that promised to turn seaweed into fuel.", "zh": "最赚钱的合同给了一家承诺把海藻变成燃料的公司。"}, {"en": "Reaching a [[million]] samples had been a [[milestone]], but the celebration was a [[packed]] room full of [[onion]] soup and paper plates.", "zh": "样本达到一百万曾是一个里程碑，可庆祝活动只是一间挤满人的屋子，摆着洋葱汤和纸盘子。"}, {"en": "Someone had left a [[pile]] of dishes in the sink, and nobody wanted to wash them.", "zh": "有人在水槽里留下一堆碗碟，谁也不想洗。"}, {"en": "A [[renowned]] [[architect]] designed the new wing, and he arrived on campus with a portfolio and an assistant.", "zh": "一位著名建筑师设计了新侧楼，他带着作品集和一名助手来到校园。"}, {"en": "His plan [[presupposed|presuppose]] that the town would grow, which everyone doubted.", "zh": "他的方案假定小镇会发展壮大，而所有人都对此存疑。"}, {"en": "He spoke to a group of [[pupils|pupil]] from the local [[school]] and asked them what a building should do; his answer was [[reliance]] on light and air, not on expensive machines.", "zh": "他对当地学校的一群小学生讲话，问他们一栋建筑应该做什么；他的答案是依靠光线和空气，而不是昂贵的机器。"}, {"en": "The council chose to [[invest]] [[slowly|slow]], one [[step]] at a time, and the architect [[swallowed|swallow]] his disappointment.", "zh": "议会选择慢慢投入，一步一步来，建筑师吞下了失望。"}, {"en": "He had never wanted a [[throne]] of his own, he said, only a building that people would use.", "zh": "他说他从不想要属于自己的王座，只想要一栋人们会用的建筑。"}, {"en": "On weekends I played the [[traveller]], taking the bus into the [[countryside]] with a notebook and a bottle of water.", "zh": "周末我当起旅行者，带着笔记本和一瓶水坐公交去乡下。"}, {"en": "The service was [[unpopular]] with local people, but it [[carried|carry]] students and farmers alike.", "zh": "这项服务不受当地人欢迎，但它既载学生也载农民。"}, {"en": "A [[vocal]] group had campaigned for a new line, [[whereby]] the bus would [[reach]] the [[farther]] villages.", "zh": "一个发声响亮的团体一直在争取一条新线路，借这条线公交车能开到更远的村庄。"}, {"en": "The [[commission]] met in the old station building, where an iron [[bed]] frame still stood in the corner.", "zh": "委员会在旧车站大楼里开会，角落里还立着一副铁床架。"}, {"en": "The [[elite]] of the town ignored the debate, and the rest simply waited.", "zh": "镇上的精英阶层无视这场争论，其余的人只是等待。"}, {"en": "My editor had a habit of [[hawking|hawk]] his own opinions as if they were headlines, and when a [[leak]] appeared in the council's budget he [[giggled|giggle]] and said the truth always finds a door.", "zh": "我的主编有个习惯，把自己的观点像头条一样叫卖；当议会预算出现泄露时，他咯咯笑着说真相总能找到出口。"}, {"en": "He [[marked|mark]] the passage in red and told me to follow it up, which I did the next morning.", "zh": "他用红笔标出那一段，让我继续追查，第二天早上我就去了。"}, {"en": "The [[newly]] elected mayor was a fan of [[opera]], and her first speech quoted an aria nobody knew.", "zh": "新当选的市长是个歌剧迷，她的首次演讲引用了一首没人知道的咏叹调。"}, {"en": "Her plan received only [[partial]] support, and the [[subsequent]] debate [[tended|tend]] to drift into personal insults.", "zh": "她的方案只得到部分支持，随后的辩论往往滑向人身攻击。"}, {"en": "It was a [[weird]] week, and I [[learned|learn]] more from the arguments than from the documents.", "zh": "那是个古怪的一周，我从争论里学到的东西比从文件里学到的还多。"}, {"en": "At [[nightfall]] a [[couple]] from the newsroom took me to a bar where the owner [[carved|carve]] his name into the wall.", "zh": "黄昏时分，新闻编辑室的一对情侣带我去了一家酒吧，老板把自己的名字刻在墙上。"}, {"en": "They told me that [[courage]] in this job means asking the question everyone [[else]] is avoiding.", "zh": "他们告诉我，这份工作里的勇气意味着问出所有其他人都在回避的问题。"}, {"en": "I [[decided|decide]] to try it the next day, and the [[haze]] over the harbour made the [[market]] look like a painting.", "zh": "我决定第二天就试试，港口上的薄雾让集市看起来像一幅画。"}, {"en": "The smell of [[newsprint]] and coffee [[gave|give]] the office a comfortable gravity.", "zh": "新闻纸和咖啡的气味给了办公室一种令人安心的分量感。"}, {"en": "My colleague [[leaned|lean]] across the table, said the town's only [[vice]] was gossip, and told me I would learn to love it.", "zh": "我的同事探身越过桌子，说这镇子唯一的恶习就是闲话，还说我早晚会爱上它。"}, {"en": "The station [[operated|operate]] on a budget that was, in plain terms, a [[puzzle]].", "zh": "研究站的运转预算，说白了，就是一道谜题。"}, {"en": "Its director [[reacted|react]] to every cut with the same calm, and never [[undermined|undermine]] a colleague in public.", "zh": "站长对每一次削减都以同样的平静回应，从不在公开场合削弱同事。"}, {"en": "A [[science]] writer added [[subtitles|subtitle]] to the station's videos, which helped the public understand the work.", "zh": "一位科学作家给研究站的视频加上字幕，帮助公众理解这些工作。"}, {"en": "The atmosphere in the room was [[tense]] when the vote was announced, and then everyone [[behaved|behave]] [[well]].", "zh": "宣布投票结果时，屋里的气氛很紧张，随后大家都表现得体。"}, {"en": "The small win was a [[victory]] for patience rather than money.", "zh": "这场小小的胜利靠的是耐心，而非金钱。"}, {"en": "The paper paid in [[cash]] for freelance work, which suited a town with few banks.", "zh": "报社付自由撰稿人的报酬用现金，这倒适合一个银行很少的镇子。"}, {"en": "My first [[course]] in the job was a lesson in listening, and I [[covered|cover]] three meetings a week.", "zh": "我在这份工作里的第一门课是学会倾听，我每周报道三场会议。"}, {"en": "A [[crack]] in the council's account was easy to see once you looked, but the explanation [[eluded|elude]] everyone.", "zh": "议会的账目只要一看就能发现一道裂缝，可其中的解释却让所有人捉摸不透。"}, {"en": "In [[fashion]], the town was twenty years behind, and the market was still the [[marketplace]] of rumour.", "zh": "在时尚上，这座镇子落后二十年，市场仍是传闻的集市。"}, {"en": "The [[head]] of the council resigned, and the story ran on the front page.", "zh": "议会首脑辞职了，这条新闻上了头版。"}, {"en": "The resignation was an [[opportunity]], and I was [[ready]] for it.", "zh": "这次辞职是个机会，而我也准备好了。"}, {"en": "There was something [[subtle]] in the way the mayor avoided the word 'resign'.", "zh": "市长回避“辞职”这个词的方式里，有些微妙的东西。"}, {"en": "Her [[success]] had been built on [[terms|term]] she never explained, and the town began to [[suffer]] for it.", "zh": "她的成功建立在她从未解释过的条件上，镇子开始为此付出代价。"}, {"en": "I began to [[understand]] that a [[well-connected]] friend can be more useful than a good argument.", "zh": "我开始明白，一个人脉广的朋友可能比一番好论证更有用。"}, {"en": "From my window I could see the harbour [[behind]] the roofs, and the [[view]] calmed me.", "zh": "从窗口我能看见屋顶后面的港口，那景色让我平静下来。"}, {"en": "A [[crash]] on the coastal road kept the paper's staff busy for two days, and the story tested every [[craft]] we had.", "zh": "沿海公路上的一场撞车事故让报社的人忙了两天，这条新闻考验了我们所有的本领。"}, {"en": "The [[cast]] of the story included a fisherman, a delivery driver, and a visiting [[headhunter]].", "zh": "这篇报道的“阵容”包括一名渔民、一名送货司机和一位来访的猎头。"}, {"en": "The headhunter was in town to recruit engineers for an [[e-commerce]] firm, part of a national [[craze]] for online shopping.", "zh": "猎头来镇上为一家电子商务公司招工程师，这是全国网购热潮的一部分。"}, {"en": "[[Fast]] money attracted fast talk, and at [[least]] two local shops closed within a month.", "zh": "快钱引来快话，至少两家本地商店一个月内就关门了。"}, {"en": "My colleague announced at a [[party]] that she would [[marry]] her [[partner]] in the spring.", "zh": "我的同事在一次聚会上宣布，她将在春天和伴侣结婚。"}, {"en": "The [[ban]] on [[single-use]] [[cutlery]] was, in [[real]] terms, a small thing.", "zh": "对一次性餐具的禁令，按实际情况看，是件小事。"}, {"en": "But its [[scope]] was wider than expected, and the [[suggestion]] of a total ban caused something close to [[terror]] in the restaurant trade.", "zh": "但它的范围比预想的更广，全面禁止的建议在餐饮业引起了近乎恐慌的情绪。"}, {"en": "Restaurant owners wore the same [[suit]] to every meeting, as if uniforms could win an argument.", "zh": "餐馆老板每次开会都穿同一套西装，仿佛制服能赢得辩论。"}, {"en": "A [[well-educated]] economist offered a different [[viewpoint]], and the debate turned on the cost of paper forks.", "zh": "一位受过良好教育的经济学家提出了不同观点，辩论的焦点转到纸叉的成本上。"}, {"en": "[[Amid]] the shouting, the ban delivered a [[blow]] to the town's confidence, and nobody could agree on a replacement.", "zh": "在叫嚷声中，这项禁令打击了小镇的信心，而谁也不同意用什么替代。"}, {"en": "The council's plan had a [[cap]] on spending, and the [[equation]] was simple: less money, fewer services.", "zh": "议会的方案对开支设了上限，算式很简单：钱更少，服务更少。"}, {"en": "A developer was accused of [[forging|forge]] signatures, and the [[law]] was slow to respond.", "zh": "一名开发商被控伪造签名，而法律反应迟缓。"}, {"en": "The scandal was a [[hindrance]] to the town's attempt to attract investment, and it caused real [[distress]] among shopkeepers; something ugly had begun to [[creep]] into local politics.", "zh": "这桩丑闻妨碍了小镇吸引投资的努力，也让店主们真切地忧虑；某种丑陋的东西开始悄悄渗入当地政治。"}, {"en": "One blogger [[falsely]] claimed that the mayor had taken a bribe, which did nothing to [[incite]] calm.", "zh": "一名博主谎称市长收受贿赂，这丝毫没有起到促进平静的作用。"}, {"en": "The town's credit [[grade]] fell, and a summer course in [[coding]] promised to teach the new literacy to anyone with a laptop.", "zh": "小镇的信用评级下降了，而一门夏季编程课承诺教会任何有笔记本电脑的人这门新读写能力。"}, {"en": "In the [[newsroom]], [[opinion]] was cheap and evidence was expensive.", "zh": "在新闻编辑室里，观点很廉价，证据很昂贵。"}, {"en": "The editor wanted a story that could [[painlessly]] [[please]] both sides, which I said was impossible.", "zh": "主编想要一篇能无痛地取悦双方的报道，我说那不可能。"}, {"en": "He [[pushed|push]] me to find a third angle, and I spent the afternoon in a [[grocery]] store asking shoppers what they thought.", "zh": "他逼我找第三个角度，于是我一下午泡在食品杂货店里问顾客怎么看。"}, {"en": "The [[overarching]] question was whether a town can [[enact]] a rule without punishing its own people.", "zh": "首要的问题是：一个镇子能否制定一条不惩罚自己人的规则。"}, {"en": "A [[cynic]] on the bus told me the answer was no, and I was on the [[verge]] of agreeing.", "zh": "公交车上一个愤世嫉俗的人告诉我答案是否定的，我几乎就要同意了。"}, {"en": "The library had a [[photocopier]] that jammed every morning, and a computer running [[software]] nobody trusted.", "zh": "图书馆有一台每天早上都卡纸的复印机，还有一台运行着谁都不信的软件的电脑。"}, {"en": "My research had reached a [[plateau]], and I needed a small [[nudge]] to finish it.", "zh": "我的研究进入了平台期，需要一点轻推才能完成。"}, {"en": "The paper offered a [[premium]] for stories that could be read on a phone, and the editor wanted an [[upgrade]] to the website.", "zh": "报社为适合手机阅读的报道提供额外奖金，主编还想升级网站。"}, {"en": "Small errors had [[accumulated|accumulate]] in the archive, and no [[algorithm]] could correct them.", "zh": "档案里积累了许多小错误，没有任何算法能纠正它们。"}, {"en": "With the [[advent]] of cheap storage, we could keep everything and understand less.", "zh": "随着廉价存储的到来，我们能把一切都存下来，却理解得更少。"}, {"en": "Rumours were [[rampant]] by Friday, and even the [[renowned]] professor from the station had heard them.", "zh": "到周五，谣言已泛滥成灾，连研究站那位著名教授都听说了。"}, {"en": "He [[snapped|snap]] his fing
