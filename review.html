3029, 2535]}, {"w": "worry", "phon": "[ˈwɜri]", "def": "v.担心；担忧n.担心；忧虑", "si": [83], "dists": [2875, 2320, 2210]}, {"w": "meantime", "phon": "[ˈntaɪm]", "def": "n.期间；与此同时", "si": [83], "dists": [2860, 2997, 850]}, {"w": "crux", "phon": "[krʌks]", "def": "n.关键点；最难点；症结", "si": [34, 64], "dists": [3346, 1690, 475]}, {"w": "inn", "phon": "[ɪn]", "def": "n.客栈；小旅馆", "si": [6], "dists": [969, 3054, 2588]}, {"w": "palace", "phon": "[ˈpæləs]", "def": "n.宫殿；王宫", "si": [11], "dists": [2941, 2965, 1964]}, {"w": "enclose", "phon": "[ɪnˈkləʊz]", "def": "v.围起；附上；封入", "si": [4], "dists": [487, 2704, 307]}, {"w": "merchant", "phon": "[ˈmɜrtʃənt]", "def": "n.商人", "si": [11], "dists": [2687, 2750, 2714]}, {"w": "pilgrim", "phon": "[ˈpɪlɡrɪm]", "def": "n.朝圣者", "si": [14], "dists": [688, 3415, 3269]}, {"w": "thief", "phon": "[θif]", "def": "n.小偷；贼；窃贼", "si": [40], "dists": [1744, 2076, 2308]}, {"w": "although", "phon": "[ɔˈðəʊ]", "def": "conj.虽然；尽管", "si": [52], "dists": [2134, 2019, 2003]}, {"w": "temperature", "phon": "[ˈtemprəˌtʃər]", "def": "n.温度；气温；体温", "si": [52], "dists": [402, 47, 628]}], "sents": [{"en": "The [[train]] came into the [[valley]] late in the afternoon, and I stepped onto the platform with a [[broad]] smile and far too much luggage.", "zh": "火车在傍晚驶进山谷，我带着过分的行李和一脸宽厚的笑走上站台。"}, {"en": "I had left [[Europe]] and a [[city]] job to [[travel]] here, and I did not know how long I would stay.", "zh": "我离开欧洲和一份城里的工作，一路旅行到这里，也不知道自己会待多久。"}, {"en": "The last [[transport]] was a bus [[along]] a road that [[followed|follow]] the river for twenty kilometres.", "zh": "最后一段交通是一辆公共汽车，沿着一条顺着河走了二十公里的路。"}, {"en": "The [[mountain]] rose on both sides, and the [[forest]] above the [[meadow]] was already turning [[brown]].", "zh": "山从两边升起，草地上方的森林已经开始变黄。"}, {"en": "A rock [[formation]] [[enclosed|enclose]] the village like a pair of hands, and the air was thin enough at this [[altitude]] to make me stop and breathe.", "zh": "一片岩层像一双手把村子围住，这里的海拔高，空气稀薄得让我不得不停下喘气。"}, {"en": "The silence [[amazed|amaze]] me; [[within]] an hour I had forgotten the [[traffic]] of the coast.", "zh": "那份安静让我惊讶；不到一个小时，我已经忘了海边的车流。"}, {"en": "My aunt's [[inn]] stood at the end of the lane, a [[simple]] stone house with a [[primitive]] kitchen and a [[rent]] she could no longer afford.", "zh": "我姨妈的客栈在小巷尽头，一座简朴的石头房子，厨房很原始，租金她已经付不起了。"}, {"en": "The [[price]] of repairs was more than the [[money]] she had, and I could see [[mold]] (or [[mould]]) on the north wall the moment we went in.", "zh": "修缮的价格超过她手里的钱，我们一进去，我就看见北墙上的霉。"}, {"en": "We had to [[remove]] the damp plaster, [[discard]] two rotten beams, and [[clean]] every room before the summer.", "zh": "我们得铲掉受潮的灰泥，丢掉两根烂梁，在夏天之前把每个房间都清理干净。"}, {"en": "It was [[tough]] work and no [[luxury]]: for the first week I slept [[alone]] on a floor of boards.", "zh": "这活儿很苦，也谈不上奢华：第一周我就睡在地板上。"}, {"en": "A builder came to [[inspect]] the roof and told us the work would take a month.", "zh": "一个工匠来检查屋顶，说这活得一个月。"}, {"en": "My aunt had been a [[merchant]]'s daughter, and her family had once owned a [[palace]] of a house in the provincial capital.", "zh": "我姨妈曾是一位商人的女儿，她家从前在省城拥有一座宫殿似的宅子。"}, {"en": "She was [[fond]] of saying that her grandmother had married an [[aristocrat]] who lost everything, and that the family [[pride]] survived longer than the fortune.", "zh": "她爱说，她的祖母嫁给了一个失去一切的贵族，而这个家族的自尊比财产活得更久。"}, {"en": "In her [[innermost]] thoughts, she said, she still kept the [[everlasting]] hope of restoring the place.", "zh": "她说，在她内心最深处，她仍抱着把这个地方修复起来的永恒希望。"}, {"en": "Her father had belonged to a [[guild]] of tea traders, and a [[pilgrim]] once told him the house would outlive him.", "zh": "她的父亲曾属于一个茶叶行会，一位朝圣者曾对他说，这房子会比他活得久。"}, {"en": "She would [[bring]] the old chairs down from the attic and [[devote]] the rest of her life to it, as if the [[former]] ballroom could hear her.", "zh": "她会把旧椅子从阁楼搬下来，把余生都献给这里，仿佛那间从前的舞厅还能听见她说话。"}, {"en": "We drew up a [[budget]] that was [[comprehensive]] and painfully [[exact]].", "zh": "我们列了一份全面而精确得令人痛苦的预算。"}, {"en": "Every [[digit]] had to be right, and we could not [[foresee]] the cost of cement in a year of [[inflation]].", "zh": "每一个数字都必须准确，而我们在通货膨胀的一年里无法预见水泥的价格。"}, {"en": "The project would [[develop]] in three stages, and [[even]] the smallest [[form]] of delay would cost us a month.", "zh": "工程分三个阶段推进，哪怕最轻微的一点延误都会让我们多花一个月。"}, {"en": "I had a little savings, but nothing [[comparable]] to the sum we needed; winning the lottery would have been the only [[jackpot]].", "zh": "我有一点积蓄，但远不能和需要的数目相比；中彩票是我们唯一的头奖机会。"}, {"en": "We would [[maximize]] what we could do ourselves and spend [[sparingly]] on the rest.", "zh": "我们能自己做的就尽量做，其余的则省着花钱。"}, {"en": "In June a [[film-making]] crew arrived to [[shoot]] a documentary about the valley, and they asked to use the inn as their base.", "zh": "六月，一个电影摄制组来拍一部关于山谷的纪录片，他们请求把客栈当作基地。"}, {"en": "None of them were [[amateurs|amateur]]; they had a [[repertoire]] of [[foreign]] festivals behind them, and one had won a [[prize]] in [[Europe]].", "zh": "他们都不是业余的；他们有一整套国外电影节的履历，其中一位还在欧洲得过奖。"}, {"en": "Their [[gig]] was small but well paid, and their [[American]] director kept everyone moving with a steady [[prompting]].", "zh": "这份活儿不大但报酬不错，他们的美国导演用稳定的提示让所有人不停运转。"}, {"en": "The only [[nuisance]] was the equipment: a [[driving]] van and a [[redirected|redirect]] generator that hummed all night.", "zh": "唯一讨厌的是设备：一辆开动的货车，还有一台整夜嗡嗡响的改装发电机。"}, {"en": "The whole thing nearly ended as a [[bummer]] when the money ran short, but a sponsor agreed to [[endorse]] the film.", "zh": "当资金短缺时，整件事差点变成一场扫兴的失败，但一位赞助商同意为影片背书。"}, {"en": "A developer wanted the land next to the inn, and his [[agent]] offered my aunt a [[bribe]].", "zh": "一个开发商看上了客栈旁边的地，他的代理人给我姨妈送来了贿赂。"}, {"en": "The [[principal]] of the offer was a new road; the [[principle]] was that no one should be forced to sell.", "zh": "这笔交易的主要部分是一条新路；原则是没有人应该被迫卖地。"}, {"en": "The developer had [[corrupted]] local officials and tried to [[evade]] tax, and his company was a [[taxpayer]] only on paper.", "zh": "这个开发商腐蚀了地方官员，还想逃税，他的公司只在纸面上是个纳税人。"}, {"en": "He filed a [[tort]] claim against us, and the [[filer's|filer]] papers were full of [[private]] details that had nothing to do with the case.", "zh": "他对我们提起了侵权诉讼，而起诉人的文件里满是与案件无关的私人细节。"}, {"en": "We refused to [[renege]] on our promise to the village, and [[eventually]] the [[transaction]] collapsed.", "zh": "我们拒绝背弃对村子的承诺，最终那笔交易崩了。"}, {"en": "Every [[intent]] behind his offer was [[deep-seated]] greed, and we were [[affected]] more than we admitted.", "zh": "他提议背后的每一个意图都是根深蒂固的贪婪，而我们受影响的程度超过我们承认的。"}, {"en": "The village called a meeting, and a [[clergyman]] opened it with a short [[speech]].", "zh": "村里开了会，一位牧师用简短的讲话开场。"}, {"en": "He asked us to [[cite]] [[evidence]] rather than rumour, and to keep the [[moral]] tone of the discussion calm.", "zh": "他要求我们引用证据而不是传闻，并让讨论的道德基调保持平静。"}, {"en": "A [[plurality]] of the villagers wanted to fight, but the [[crux]] of the matter was money, not anger.", "zh": "多数村民想斗到底，但事情的关键是钱，不是怒气。"}, {"en": "We put a [[sign]] at the gate and agreed on a [[convention]] for how the land could be used.", "zh": "我们在门口立了一块牌子，并就土地如何使用达成了一项约定。"}, {"en": "The minutes were [[altogether]] clear, and [[foremost]] among them was the demand for a public [[report]].", "zh": "会议记录完全清楚，其中最首要的是要求一份公开报告。"}, {"en": "One old man said the issue was not [[insignificant]], and that a village without a centre would not last.", "zh": "一位老人说，这件事并非无关紧要，一个没有中心的村子不会长久。"}, {"en": "The developer threatened [[prison]] for my aunt, though she was [[innocent]] of any [[evil]].", "zh": "开发商威胁要让我姨妈进监狱，尽管她根本没有任何邪恶之罪。"}, {"en": "We could not [[differ]] with the facts, only with the interpretation, and his lawyer was an [[outsider]] who knew nothing of the valley.", "zh": "我们无法在事实上有分歧，只能在解释上有分歧，而他的律师是个对山谷一无所知的外人。"}, {"en": "The [[side]] of the road he wanted was ours, and [[thus]] the case turned on a single document that a [[thief]] could have taken in a second.", "zh": "他要的那条路的那一边是我们的，因此案子就落在一份文件上，而那份文件小偷一秒钟就能拿走。"}, {"en": "I began to [[pray]] in a way I had not since childhood, not for victory but for a [[clear]] head.", "zh": "我开始祈祷，那种方式自我童年以后就没有过，不为胜利，只为头脑清醒。"}, {"en": "On [[Saturday]] we took the [[trail]] up the [[mountain]], following a [[brochure]] that promised a view of the whole valley.", "zh": "星期六我们沿着小路上山，手里拿着一本承诺能看到整个山谷的册子。"}, {"en": "My [[foot]] slipped once, and I cut my [[belt]] on a stone.", "zh": "我的脚滑了一下，腰带在石头上划破了。"}, {"en": "At [[altitude]] the air was thin, and we stopped every hundred metres to [[browse]] the [[sight]] of cloud below us.", "zh": "在高海拔处空气稀薄，我们每走一百米就停下来，浏览脚下云层的景象。"}, {"en": "The [[sightseeing]] crowd had gone home, and we had the [[meadow]] to ourselves.", "zh": "观光的游客已经回家，整片草地只有我们。"}, {"en": "From the top the inn looked like a toy, and the [[prize]] for the climb was a silence I have rarely found.", "zh": "从山顶看，客栈像个玩具，而这次攀登的奖赏是我很少遇到的那种安静。"}, {"en": "On the way down a stone [[bumped|bump]] the cart, and the [[wire]] rope snapped.", "zh": "下山时一块石头颠了推车一下，钢丝绳断了。"}, {"en": "I [[shoved|shove]] my aunt clear and took the [[force]] of the fall on my [[shoulder]].", "zh": "我把姨妈推开，自己用肩膀承受了坠落的力量。"}, {"en": "The [[shock]] of the fall left a [[bruise]] across my arm, and for a [[moment]] I could not [[mount]] the bike again.", "zh": "那一摔的冲击在我手臂上留下大片淤青，有一刻我再也跨不上车。"}, {"en": "A [[tear]] in the tarpaulin let the rain in, and we had to [[clamp]] it shut with a piece of wood.", "zh": "防水布上的一道裂口让雨灌了进来，我们只好用一块木头把它夹紧。"}, {"en": "The [[rescue]] team arrived in a jeep, and a [[parachute]] flare lit the [[wreck]] of the cart.", "zh": "救援队开着吉普车赶到，一枚降落伞照明弹照亮了推车的残骸。"}, {"en": "[[Although]] the forecast was good, the [[temperature]] dropped after dark, and the [[evening]] came in [[dim]].", "zh": "尽管预报说天气不错，天黑后气温还是降了下来，傍晚来临时光线昏暗。"}, {"en": "The brown hills turned grey, and I [[clasped|clasp]] my hands around a cup filled to the [[brim]].", "zh": "褐色的山变成灰色，我双手紧握着一只斟满的杯子。"}, {"en": "We sat by the fire and said little, and frost began to [[form]] on the window.", "zh": "我们坐在火边，话很少，窗上开始结霜。"}, {"en": "In the morning the valley was white, and every [[trait]] of the old landscape was softened.", "zh": "早晨山谷一片白，旧日风景的每一处特征都被柔化了。"}, {"en": "The village school had one [[class]] for all the [[children]], and twelve pupils of different ages shared a room.", "zh": "村校只有一个班，所有孩子都在里面，十二个不同年龄的学生共用一间教室。"}, {"en": "The teacher, a young woman from the [[university]], gave a [[lesson]] on rivers, and her [[ambition]] was to send one of them to college.", "zh": "老师是大学来的年轻女人，她讲了一堂关于河流的课，她的抱负是把其中一个孩子送进大学。"}, {"en": "Her [[diet]] was simple: a [[bun]] and tea at noon, and [[pork]] twice a month.", "zh": "她的饮食很简单：中午一个圆面包和茶，一个月吃两次猪肉。"}, {"en": "The [[outpouring]] of support after the fire was [[similar]] to nothing I had seen in the city.", "zh": "那场火灾之后涌来的支持，和我在城里见过的任何东西都不相似。"}, {"en": "Children are [[impressionable]], she said, and a good [[event]] can [[inspire]] them for years.", "zh": "她说孩子是易受影响的，一件好事能激励他们很多年。"}, {"en": "The [[gulf]] between the village and the city was wide, but it was not unbridgeable.", "zh": "村庄和城市之间的鸿沟很宽，但并非不可跨越。"}, {"en": "A [[watcher]] from the reserve came to [[scan]] the ridge for [[endangered]] birds.", "zh": "保护区的一位守望者来扫描山脊，寻找濒危鸟类。"}, {"en": "He said the [[forest]] was full of small life, and that the [[monster]] in local stories was probably a bear.", "zh": "他说森林里满是小生命，当地故事里的怪物很可能是一只熊。"}, {"en": "The [[devil]] is in the details, he added, and the [[crux]] of conservation is not [[ever]] catching the animal but protecting its [[traits|trait]].", "zh": "他又说，魔鬼在细节里，保护的关键从来不是抓住那只动物，而是保护它的特征。"}, {"en": "His team used a [[probe]] and a camera trap, and the [[fuel]] for the trip cost more than the equipment.", "zh": "他的团队用了探针和红外相机，而这趟行程的燃料比设备还贵。"}, {"en": "He opened his [[mouth]] to yawn, then laughed at his own enthusiasm.", "zh": "他张嘴打了个哈欠，然后笑自己的热情。"}, {"en": "Back at the inn I read the news: [[inflation]] was at seven [[percent]], and the [[dollar]] had strengthened again.", "zh": "回到客栈，我读到新闻：通货膨胀率达到百分之七，美元又走强了。"}, {"en": "A [[trillion]] sounds abstract until it reaches a family [[budget]]; then it is a smaller loaf and a colder room.", "zh": "一万亿听起来抽象，直到它落到一个家庭的预算上；那时它就是更小的面包和更冷的房间。"}, {"en": "I tried to [[maximize]] our savings and to [[lessen]] our [[bulk]] purchases, buying rice in small bags.", "zh": "我设法把积蓄最大化，减少大宗采购，买米都买小袋。"}, {"en": "We were [[insatiable]] for good news, and the [[bubble]] of hope grew while our savings [[shrank|shrink]].", "zh": "我们对好消息贪得无厌，希望的泡沫在膨胀，而我们的积蓄在缩水。"}, {"en": "The [[underuse]] of the old barn was a waste, and we decided to turn it into a dining room.", "zh": "旧谷仓使用不足是一种浪费，我们决定把它改成餐厅。"}, {"en": "We spent [[sparingly]] and [[accelerated|accelerate]] the work with our own hands.", "zh": "我们省着花钱，用自己的双手加快进度。"}, {"en": "On [[Monday]] a reporter came to [[print]] a story about the inn, and the piece appeared with a [[negative]] headline.", "zh": "星期一，一位记者来印一篇关于客栈的报道，文章带着一个负面的标题登了出来。"}, {"en": "We could not [[delete]] the article, so we wrote a [[reply]] that was [[responsive]] to each point.", "zh": "我们删不掉那篇文章，就写了一封回应，对每一点都做了回应。"}, {"en": "The [[insensitivity]] of the headline hurt more than the facts, and a [[deep-seated]] suspicion of outsiders surfaced again.", "zh": "标题的麻木不仁比事实更伤人，对外人根深蒂固的怀疑又浮了上来。"}, {"en": "I learned to [[browse]] the comments without reading them, and to offer [[insight]] rather than opinion.", "zh": "我学会浏览评论而不去读它们，只提供见识而不是意见。"}, {"en": "[[Specifically]], we asked readers to visit and see the work for themselves, and the [[clicks|click]] on our page doubled.", "zh": "具体来说，我们请读者亲自来看看这项工程，我们页面的点击量翻了一倍。"}, {"en": "A [[wire]] service picked up the story, and the [[report]] travelled further than we expected.", "zh": "一家通讯社转发了这条报道，它传得比我们预想的远。"}, {"en": "On the [[eve]] of opening, we [[shut]] the door and looked at the empty dining room.", "zh": "开业前夜，我们关上门，看着空荡荡的餐厅。"}, {"en": "It had taken a year, and [[yet]] the building looked as if it had always been this way.", "zh": "这用了一年，可这栋房子看上去仿佛一直就是这个样子。"}, {"en": "We would [[renew]] the lease and [[build]] a small kitchen garden; [[whenever]] it rained, we would work inside.", "zh": "我们要续租，还要建一个小菜园；每逢下雨，我们就在屋里干活。"}, {"en": "The [[watershed]] came when the village voted to protect the land, and the developer sold his option.", "zh": "转折点出现在村里投票保护这片土地的时候，开发商卖掉了他的期权。"}, {"en": "[[Meantime]] there was little to [[assuage]] our [[worry]] except work.", "zh": "与此同时，除了干活，没有什么能缓和我们心里的担忧。"}, {"en": "The inn would not [[repeat]] its old life, but it could [[evolve]] into something calmer and, [[eventually]], into a kind of [[harmony]].", "zh": "客栈不会重复它旧日的生活，但它可以演变成更安静的东西，最终成为一种和谐。"}, {"en": "The [[short]] version of the story is that we stayed.", "zh": "这个故事的简短版本是：我们留了下来。"}, {"en": "The longer version is written on the walls, where [[foreign]] guests have left their names.", "zh": "更长的版本写在墙上，外国的客人把名字留在了那里。"}, {"en": "I do not know whether the [[city]] will call me back, but I have stopped planning my life as a straight line.", "zh": "我不知道城市会不会把我叫回去，但我已经不再把人生规划成一条直线。"}, {"en": "[[Whenever]] I am asked why I came, I say that a place can [[shorten]] a person's [[ambition]] and still make him larger.", "zh": "每当有人问我为什么来，我就说，一个地方可以缩短一个人的抱负，却仍能让他变得更大。"}]}, {"key": "三星词汇 Day 09 List 17", "words": [{"w": "treat", "phon": "[trit]", "def": "v.对待；招待；治疗n.款待", "si": [43], "dists": [2628, 2119, 348]}, {"w": "ample", "phon": "[æmp(ə)l]ˈ", "def": "adj.足够的；丰裕的", "si": [44], "dists": [1098, 2773, 2695]}, {"w": "examine", "phon": "[ɪɡˈzæmɪn]", "def": "v.检验；审查；调查", "si": [35], "dists": [3027, 2773, 1631]}, {"w": "formidable", "phon": "[rmɪdəb(ə)l]ˈfɔ", "def": "adj.可怕的；令人敬畏的；难以对付的", "si": [11], "dists": [735, 1931, 2216]}, {"w": "instant", "phon": "[ˈɪnstənt]", "def": "n.瞬间；立即adj.立即的；即时的", "si": [44], "dists": [427, 69, 2588]}, {"w": "move", "phon": "[muv]", "def": "v.移动；搬家n.行动；移动", "si": [56], "r": "mov(动)+e→移动", "dists": [2501, 2617, 2509]}, {"w": "republic", "phon": "[rɪˈpʌblɪk]", "def": "n.共和国；共和政体", "si": [30], "dists": [1017, 694, 1202]}, {"w": "simulate", "phon": "[ˈsɪmjuleɪt]", "def": "v.假装；冒充；模仿；模拟" mall fine and laughed at my own packing.", "zh": "我的箱子超过了航空公司的重量限制，我付了一点罚款，笑自己打包的水平。"}, {"en": "As a new [[resident]], I promised myself to walk everywhere and to learn the names of the streets before the [[vacation]] season began.", "zh": "作为新居民，我对自己说，要步行去所有地方，并在度假季开始前记住每条街的名字。"}, {"en": "The [[museum]] was a low stone building at the foot of a [[cliff]], with an old [[telescope]] on the roof pointed at the sea.", "zh": "博物馆是一座低矮的石建筑，坐落在悬崖脚下，屋顶上架着一台对着大海的旧望远镜。"}, {"en": "Inside, the air smelled of old [[cloth]] and floor polish, and a [[skull]] of some sea creature hung above the stairs.", "zh": "里面弥漫着旧布料和地板蜡的气味，楼梯上方挂着一只海兽的头骨。"}, {"en": "A [[fossil]] fish lay in a slab of [[stone]] like a shadow frozen in glass.", "zh": "一条鱼化石嵌在石板里，像凝在玻璃中的影子。"}, {"en": "I had studied [[anatomy]] and [[physiology]] at university, so the bones were not a [[mystery]] to me.", "zh": "我在大学学过解剖学和生理学，所以这些骨头对我并不神秘。"}, {"en": "Yet the [[ancient]] handwritten labels made me feel like a beginner again, and I wanted to [[discover]] who had made them.", "zh": "可那些古老的手写标签让我又觉得自己是个新手，我想弄清是谁写的。"}, {"en": "The director, Mrs. Hale, was [[retiring]] in the autumn after forty years, and she wore a heavy wool [[cloak]] even indoors.", "zh": "馆长黑尔太太干了四十年，今年秋天就要退休了，她连在室内也披着厚重的羊毛斗篷。"}, {"en": "She was [[formidable]] in a quiet way: [[frank]] about money, [[sceptical]] (or [[skeptical]]) of fashionable theories, and full of [[refined]] manners.", "zh": "她以一种安静的方式令人敬畏：谈钱直率，对时髦理论持怀疑态度，举止优雅。"}, {"en": "She could [[excel]] at almost any practical task, and her [[skill]] with a broken display case was [[undoubted]].", "zh": "她几乎擅长任何实际工作，修好坏展柜的手艺毋庸置疑。"}, {"en": "Her [[discipline]] was legendary: she arrived at seven, opened the shutters, and read every label aloud.", "zh": "她的自律是出了名的：七点到馆，打开百叶窗，把每张标签都念一遍。"}, {"en": "She never [[profess]]ed to love the past for its own sake; she simply refused to let it fall apart.", "zh": "她从没声称自己是为了过去本身而热爱过去；她只是不肯让它散架。"}, {"en": "A [[savvy]] old woman, she knew every donor and every grudge in town.", "zh": "她是个精明的老太太，镇上每个捐赠者和每桩旧怨她都清楚。"}, {"en": "My first task was a [[request]] for a larger [[reserve]] for repairs.", "zh": "我的第一项任务是申请一笔更大的维修储备金。"}, {"en": "The [[exchequer]] had cut our [[monetary]] support again, and the [[percentage]] was small only on paper.", "zh": "财政部又一次削减了我们的资金支持，那个百分比只在纸面上显得小。"}, {"en": "Every [[fraction]] of a pound mattered, and the [[insurance]] on the collection had risen sharply.", "zh": "每一分钱都重要，而藏品的保险费又猛涨了。"}, {"en": "The repair bills were long [[overdue]], and Mrs. Hale talked about [[proportionality]]: a small museum, she said, should not be judged by the size of its grant.", "zh": "维修账单早就该付了，黑尔太太谈起了相称原则：她说，一座小博物馆不该用拨款的多少来衡量。"}, {"en": "The [[situation]] would [[require]] hard choices, and I spent the evening making lists.", "zh": "这种形势需要做出艰难的选择，我花了一晚上列清单。"}, {"en": "Then a [[benefactor]] appeared, a retired teacher who offered to [[buy]] us a new display case.", "zh": "接着出现了一位捐助者，一位退休教师，主动提出给我们买一只新展柜。"}, {"en": "The gift did not [[disappoint]] me, but it soon [[became|become]] a small [[scandal]].", "zh": "这份礼物没有让我失望，但它很快变成了一桩小丑闻。"}, {"en": "A rival paper claimed that our accounts were full of [[corruption]] and that someone had been [[hacking]] our website.", "zh": "一家竞争对手的报纸声称我们账目里尽是腐败，还说有人入侵了我们的网站。"}, {"en": "Mrs. Hale refused to [[disclose]] the donor's name, and her calm [[disapproval]] of the rumours only made them louder.", "zh": "黑尔太太拒绝公开捐赠者的姓名，而她对谣言的冷静不赞成反而让谣言更响。"}, {"en": "I learned that even a kind act can be twisted into an [[excuse]] for gossip.", "zh": "我明白了，就连善举也能被人扭曲成说闲话的借口。"}, {"en": "The town held a [[forum]] in the church hall, and a [[spokesperson]] for the council agreed to [[show]] up.", "zh": "镇子在教堂礼堂办了一场论坛，市议会的发言人同意出席。"}, {"en": "The room was full of [[buzz]] and [[wordy]] speeches; people wanted an [[answer]], not a lecture.", "zh": "屋里嗡嗡作响，全是冗长的演讲；人们想要一个答案，而不是一堂说教。"}, {"en": "I had prepared an [[anecdote]] about our school visits, and I used it to [[respond]] to a rude question.", "zh": "我准备了一则关于学校参观的轶事，用它回应了一个无礼的问题。"}, {"en": "Later a radio [[anchor]] invited me to [[discourse]] on air for five minutes, and I nearly lost my voice.", "zh": "后来一位电台主持人请我在节目里谈了五分钟，我差点说不出话。"}, {"en": "The new exhibition was to compare a [[tribe]] in [[Asia]] with a [[civilization]] in [[Britain]] and a [[republic]] in old [[France]].", "zh": "新展览打算把一个亚洲部落与不列颠的一个文明、旧法国的一个共和国作比较。"}, {"en": "The carved figures and painted bowls told a story about [[procreation]], harvest and [[myth]].", "zh": "那些木雕人像和彩绘碗讲述着生育、收获和神话的故事。"}, {"en": "Old labels often [[idealized]] the past and present ancient life as a golden age.", "zh": "旧标签常把过去理想化，把古代生活说成黄金时代。"}, {"en": "Slavery was a [[by-product]] of that [[civilization]], and the [[slave]] in the corner of the painting had no name.", "zh": "奴隶制是那个文明的副产品，而画角落里的那个奴隶没有名字。"}, {"en": "We decided not to [[foster]] a comfortable [[myth]]; we would show the whole picture, even the shameful parts.", "zh": "我们决定不去助长一个让人舒服的神话；我们要展示完整的画面，包括羞耻的部分。"}, {"en": "In the back room I began to [[examine]] a box of bones that had never been catalogued.", "zh": "在后室，我开始检查一箱从未编目的骨头。"}, {"en": "The [[process]] was slow: [[pick]] up each [[piece]], [[flip]] it over, and [[picture]] where it once belonged.", "zh": "过程很慢：拿起每一块，翻过来，想象它原本长在哪里。"}, {"en": "A [[slice]] of [[stone]] showed a [[fracture]] that had healed long before the animal died.", "zh": "一片石头上有一道裂痕，在动物死前很久就已愈合。"}, {"en": "I tried to [[simulate]] the fall that caused it, using a [[formula]] from my student [[research]].", "zh": "我试着用学生时代研究里的一个公式，模拟造成这道裂痕的那次跌落。"}, {"en": "Seen from another [[angle]], the [[swath]] of [[dirt]] on the surface was the record of a single storm.", "zh": "换个角度看，表面那条宽宽的泥土带是一场风暴留下的记录。"}, {"en": "A fossil cannot [[reproduce]] anything, but it can [[produce]] a lost climate in your mind.", "zh": "化石不能繁殖任何东西，却能在你脑中造出一个失落的气候。"}, {"en": "[[Instead]] of guessing, I wrote a [[direct]] [[example]] beside each item and dated every note.", "zh": "我没有凭猜，而是在每件物品旁写下一个直白的例子，并给每条笔记标上日期。"}, {"en": "My days settled into a [[busy]] rhythm: open the doors at nine, [[sit]] at the desk, and watch the [[clock]].", "zh": "我的日子进入了忙碌的节奏：九点开门，坐在桌前，盯着时钟。"}, {"en": "At [[mealtime]] I would [[sip]] weak tea and [[treat]] myself to a bun from the bakery next door.", "zh": "吃饭时间，我会小口喝着淡茶，用隔壁面包店的一个小面包犒劳自己。"}, {"en": "There was [[ample]] time to read, and for an [[instant]] I would forget the budget.", "zh": "有充足的时间读书，有那么一瞬间我会忘了预算。"}, {"en": "[[Instead]] of lunch, I sometimes walked along the shore and counted the fishing boats.", "zh": "有时我不吃午饭，沿着海岸散步，数渔船。"}, {"en": "One afternoon a [[troublemaker]] came in with a [[phony]] membership card.", "zh": "一天下午，一个捣乱分子拿着一张假会员卡进来了。"}, {"en": "He tried a [[trick]]: he would distract me with a [[trivial]] question and then [[skip]] past the rope.", "zh": "他使了个花招：用琐碎的问题分散我的注意，然后想跳过围绳。"}, {"en": "I felt a [[slight]] [[anger]] rise, but I kept my voice low.", "zh": "我感到一丝怒气升起，但把声音压低了。"}, {"en": "His [[excuse]] was that he was doing research, but his [[slack]] posture and [[whatever]] answers [[disconcert]]ed me.", "zh": "他借口自己在做研究，可他松垮的姿势和漫不经心的回答让我不安。"}, {"en": "I did not [[bypass]] the rules; I asked him to leave.", "zh": "我没有绕过规定，而是请他离开。"}, {"en": "Later I found a [[weakness]] in our own system: the back door was often left open.", "zh": "后来我发现我们自己制度里的一个弱点：后门常常开着。"}, {"en": "[[Mystery]] is good for a museum, but [[trouble]] is not.", "zh": "神秘感对博物馆是好事，麻烦不是。"}, {"en": "On Sunday I [[climb]]ed the path above the [[cliff]] and sat under a wind-bent [[tree]].", "zh": "周日，我爬上悬崖上方的山道，坐在一棵被风吹弯的树下。"}, {"en": "The [[cloud]]s moved fast, and the wind seemed to [[excite]] the gulls.", "zh": "云走得很快，风似乎让海鸥兴奋起来。"}, {"en": "The [[uplifting]] [[music]] on my phone made me [[cling]] to the moment, and I was [[deeply]] grateful for the silence.", "zh": "手机里令人振奋的音乐让我想紧紧抓住这一刻，我深深感激这份安静。"}, {"en": "[[Since]] I had arrived, I had not once regretted the [[move]].", "zh": "自从来到这里，我一次也没后悔搬过来。"}, {"en": "My [[interest]] in the town was growing, and people had begun to [[interact]] with me as a neighbour rather than a stranger.", "zh": "我对这座镇子的兴趣在增长，人们开始把我当邻居而不是陌生人那样交往。"}, {"en": "The most [[interesting]] thing was that nobody asked why I had come.", "zh": "最有意思的是，没人问我为什么来。"}, {"en": "[[Whatever]] the winter brought, I wanted to stay.", "zh": "无论冬天带来什么，我都想留下来。"}, {"en": "The town's [[fortune]] had once rested on [[coal]], and the mines had closed before I was born.", "zh": "这座镇子的命运曾系于煤炭，而在我出生前矿井就关了。"}, {"en": "Now the shops survived on a thin [[profit]], and the [[trend]] was towards holiday rentals.", "zh": "如今店铺靠着微薄的利润维持，趋势是转向度假出租。"}, {"en": "A new [[suburb]] of holiday flats was spreading along the coast.", "zh": "一片新的度假公寓郊区正沿着海岸蔓延。"}, {"en": "Some families were [[jobless]], and the council's [[climate]] of cuts did not help.", "zh": "有些家庭失业，市议会削减开支的风气也帮不上忙。"}, {"en": "There was an [[excess]] of empty houses and a shortage of affordable ones, while [[obesity]] and cheap food were discussed at every meeting.", "zh": "空房子过多，负担得起的房子却不足；每次开会都在讨论肥胖和廉价食品。"}, {"en": "[[Exercise]] was free, yet few people had the energy to [[exert]] themselves after a long shift.", "zh": "锻炼是免费的，可很少有人在下长班后还有力气去使劲。"}, {"en": "The museum could not [[depress]] the town's mood, but it could [[reinforce]] its pride.", "zh": "博物馆无法压低镇上的情绪，却可以增强它的自豪感。"}, {"en": "A single exhibition would not [[overshadow]] the real problems, but it might help people see them more clearly.", "zh": "一场展览不会让真正的问题黯然失色，却可能帮人们看得更清楚。"}, {"en": "The council had promised to [[liberalize]] the rules for small businesses, a promise repeated so often that it had become a slogan.", "zh": "市议会曾承诺放宽小企业的规定，这个承诺重复得太多，已经成了口号。"}, {"en": "The local paper called it a small [[triumph]].", "zh": "当地报纸称它是小小的胜利。"}, {"en": "In the [[conclusion]] of my report I wrote that [[simplicity]] had saved us: fewer objects, clearer labels, more light.", "zh": "在报告的结尾，我写道是简约救了我们：更少的展品、更清楚的标签、更多的光。"}, {"en": "[[Finally]], the [[undoubted]] success of the school visits gave us confidence to go [[further]].", "zh": "最后，学校参观取得的无疑成功给了我们走得更远的信心。"}, {"en": "[[Further]] funding arrived in September, and we began to look [[forward]].", "zh": "九月又有一笔资金到位，我们开始向前看。"}, {"en": "The job had [[reshape]]d me; I no longer wanted to [[disappear]] into a big city archive.", "zh": "这份工作重塑了我；我不再想消失在大城市的档案馆里。"}, {"en": "[[Except]] for one broken case, nothing went wrong.", "zh": "除了一只破掉的展柜，一切顺利。"}, {"en": "A burst pipe in January would have been a [[disaster]], so we fixed the heating before winter.", "zh": "一月里要是水管爆裂就是一场灾难，所以我们入冬前修好了暖气。"}, {"en": "The museum would [[close]] for two weeks, but it would reopen.", "zh": "博物馆会关闭两周，但它会再开门。"}, {"en": "[[Deprive]]d of money, we had still managed to make something lasting.", "zh": "尽管被剥夺了资金，我们还是做成了某种持久的东西。"}, {"en": "In October the trustees agreed to [[decentralise]] (or [[decentralize]]) part of the collection, lending pieces to village halls.", "zh": "十月，理事会同意把部分藏品分散出去，借给村里的礼堂。"}, {"en": "We wrote a simple [[code]] for handling objects, short enough for a volunteer to learn in a morning.", "zh": "我们写了一套简单的文物处理规范，短到一个志愿者一上午就能学会。"}, {"en": "The [[direct]] benefit was obvious: more people saw the collection, and fewer objects sat in the dark.", "zh": "直接的好处很明显：更多人看到了藏品，更少的东西被放在黑暗里。"}, {"en": "I learned to [[trim]] a label without losing its meaning.", "zh": "我学会了删减标签又不失其含义。"}, {"en": "My last week was spent [[flip]]ping through the visitor book, reading comments in children's handwriting.", "zh": "最后一周，我翻着访客簿，读孩子们笔迹的留言。"}, {"en": "Whatever [[resource]]s the next curator had, I hoped she would keep the back door locked.", "zh": "无论下一任馆长有什么资源，我希望她会让后门锁上。"}]}, {"key": "三星词汇 Day 09 List 18", "words": [{"w": "slip", "phon": "[slɪp]", "def": "v.滑倒；滑落；溜走；悄悄地放n.滑倒；溜走；疏忽；纸片", "si": [0], "dists": [2777, 2935, 2827]}, {"w": "truck", "phon": "[trʌk]", "def": "n.卡车；手推车；敞篷货车v.用卡车运；交易", "si": [0], "dists": [2943, 2810, 182]}, {"w": "cognitive", "phon": "[ˈkɑɡnətɪv]", "def": "adj.认知的；认识的", "si": [2], "dists": [989, 3337, 1925]}, {"w": "discuss", "pho 23], "dists": [3331, 3354, 3302]}, {"w": "bison", "phon": "[ˈbaɪs(ə)n]", "def": "n.野牛（北美或欧洲）", "si": [21], "dists": [3085, 2382, 2253]}, {"w": "collodion", "phon": "[kəˈləʊdiən]", "def": "n.硝化棉；火胶棉", "si": [22], "dists": [3337, 32, 2848]}, {"w": "horseback", "phon": "[ˈhɔrsbæk]", "def": "n.马背；隆起的条状地带adj.骑着马的adv.在马背上", "si": [22], "dists": [2249, 1996, 1880]}, {"w": "butter", "phon": "[ˈbʌtər]", "def": "n.黄油；奶油v.涂黄油于...上", "si": [24], "dists": [3084, 2124, 428]}, {"w": "duchess", "phon": "[ˈdʌtʃəs]", "def": "n.公爵夫人；女公爵", "si": [23], "dists": [70, 1500, 3288]}], "sents": [{"en": "On a [[cold]] December dawn, when [[frost]] glazed every railing, I watched a lorry carrying [[freight]] overtake a heavy [[truck]] while a [[plane]] droned [[overhead]], and a hurrying clerk began to [[slip]] on the black ice.", "zh": "十二月一个寒冷的黎明，霜花覆上了每一道栏杆。我看见一辆满载货物的卡车超过一辆重型货车，一架飞机在头顶嗡嗡掠过，一个行色匆匆的职员开始在暗冰上打滑。"}, {"en": "That [[small]] episode, in a grey industrial [[place]] on the city's edge, captured the [[chronic]] condition of the [[workaholic]] age: persistently elevated [[cortisol]], gnawing [[anxiety]], and the unspoken fear that slowing down means falling behind.", "zh": "发生在城市边缘灰暗工业区的这一小插曲，道出了工作狂时代的积久病症：皮质醇持续偏高、挥之不去的焦虑，以及那种唯恐放慢脚步就意味着落后的、不曾言明的恐惧。"}, {"en": "Researchers who [[discuss]] burnout in strictly [[cognitive]] terms have designed a revealing [[experiment]].", "zh": "那些纯粹从认知角度讨论职业倦怠的研究人员，设计了一项颇具启发性的实验。"}, {"en": "After weeks of careful [[observation]], every [[expert]] recorded how attention and memory cease to [[function]] normally under sustained pressure.", "zh": "经过数周的细致观察，每位专家都记录下注意力和记忆力如何在持续压力下停止正常运作。"}, {"en": "The [[result]] is easy to [[describe]] but painful to [[explain]], for participants who tried to [[interpret]] their own data helped [[reveal]] flaws no questionnaire could fully [[expose]], strengthening the [[argument]] that overwork damages reasoning itself.", "zh": "这一结果描述起来容易，解释起来却令人痛苦，因为那些试图解读自身数据的参与者，反而帮助揭示了任何问卷都无法完全暴露的缺陷，从而强化了“过度工作会损害推理能力本身”这一论点。"}, {"en": "The strain is sharpest in [[two-paycheck]] families, whose [[dual]] workload breeds a quiet [[dissatisfaction]] that spills into [[social]] gatherings and frays [[interpersonal]] trust.", "zh": "这种压力在双职工家庭中最为尖锐：双重的工作负担滋生出一种悄然的不满，蔓延到社交聚会之中，侵蚀着人际信任。"}, {"en": "That strange [[disconnect]] persists even in [[upper]]-middle-class circles, where [[wealth]] buys every comfort except time.", "zh": "即便在上中层阶级的圈子里，这种奇怪的割裂依然存在——财富买得到一切舒适，唯独买不到时间。"}, {"en": "An old [[friend]] of mine, felled by stress-related [[illness]], admitted that he had spent a [[lifetime]] chasing promotion without once daring to [[plan]] the day he would [[retire]].", "zh": "我的一位老友被与压力相关的疾病击倒，他承认自己一辈子都在追逐晋升，却从未敢规划过退休那一天。"}, {"en": "[[Meanwhile]], the [[Internet]] magnifies the malaise.", "zh": "与此同时，互联网放大了这种隐忧。"}, {"en": "Every [[Internet-based]] platform can [[invite]] a celebrity [[interview]], host a fiery [[column]], and publish a sniping [[comment]] within minutes, while each disposable [[factoid]] competes to become the [[arbiter]] of public attention.", "zh": "每一个互联网平台都能在几分钟之内约来一场名人访谈、开设一个火药味十足的专栏、刊发一条冷嘲热讽的评论；与此同时，每一条用过即弃的趣闻都争相成为公众注意力的裁决者。"}, {"en": "Such constant [[interference]] can [[intrude]] into every quiet hour and [[disturb]] even sleep, a condition that the [[sociology]] of digital life now treats as normal.", "zh": "这种无休止的干扰会侵入每一个安静的时刻，甚至扰乱睡眠，而数字生活的社会学如今已把这种状态视为常态。"}, {"en": "I therefore decided to make a [[fresh]] start and seek a [[true]], genuinely [[free]] interval unlike anything I had learned to [[expect]] from the [[future]].", "zh": "于是我决定重新开始，去寻找一段真实而真正自由的时光，一段不同于我已学会对未来所期待的任何事物的时光。"}, {"en": "A professional [[futurologist]] once told me that lives take an unexpected [[turn]], and the [[twist]] I chose was a journey into the desert, where, in the [[aftermath]] of an early sandstorm, I suffered a genuine [[fright]] before meeting [[jolly]] companions who were [[delighted]] to share simple [[fun]] beneath the stars.", "zh": "一位职业未来学家曾告诉我，人生会出现意想不到的转折；而我选择的转折，是一次深入沙漠的旅行——在一场早来的沙尘暴过后，我着实受了一场惊吓，随后遇到一群快活的旅伴，他们欣然与我在星空下同享简单的乐趣。"}, {"en": "Our [[pilot]], a weathered man with a leather [[trunk]] strapped beside him, insisted that we [[rest]] during the [[quiet]] hour before dawn rather than [[hasten]] onward as our permits were about to [[expire]].", "zh": "我们的飞行员是个饱经风霜的人，身旁绑着一只皮箱。他坚持要我们在黎明前最安静的时辰休息，而不是趁着许可证即将到期继续赶路。"}, {"en": "Travelling on a [[shoestring]], I paid in whatever [[coin]] I carried and joined a creaking [[caravan]] halted at a [[roadside]] well, where a [[kind]] woman offered bread while her [[kid]], a solemn boy, stared at [[another]] stranger as though visitors had arrived from the moon.", "zh": "我以极少的盘缠旅行，用身上带着的任何钱币付账，加入了一支在路边水井旁停下的、吱呀作响的商队；在那里，一位善良的妇人端上面包，而她的孩子——一个神情严肃的男孩——盯着又一个陌生人看，仿佛来客是从月亮上降临的。"}, {"en": "The route, historians said, once linked [[Portugal]] to distant outposts where a [[British]] [[Briton]] might serve as a [[soldier]], witness [[combat]], and endure the [[disgrace]] of commanders willing to [[betray]] their own garrisons.", "zh": "历史学家说，这条路线曾把葡萄牙与遥远的前哨据点连接起来；在那些据点，一个来自不列颠的英国人可能以士兵的身份服役，亲历战斗，并忍受那些不惜出卖自家守军的指挥官所带来的耻辱。"}, {"en": "Centuries of trade and [[intermarriage]] explain why traces of that former [[colony]] still [[exist]], stubborn even in ruin; the besieged settlement, at last [[exorable]], negotiated its surrender.", "zh": "数百年的贸易与通婚解释了为何那片旧殖民地的痕迹依然存在，即便沦为废墟也顽固不化；这座被围困的定居点终于被说动，通过谈判接受了投降。"}, {"en": "In [[retrospect]], such patient [[retrospection]] teaches humility to every empire.", "zh": "回首往事，这种耐心的自省向每一个帝国传授谦卑。"}, {"en": "Our own expedition included a [[meteorologist]], a [[zoologist]], and a [[mineralogist]], whose talk drifted from desert [[chemistry]] to the [[cosmos]] itself.", "zh": "我们这支探险队里有一位气象学家、一位动物学家和一位矿物学家，他们的话题从沙漠化学一路飘荡到宇宙本身。"}, {"en": "Watching a satellite trace a faint [[arc]] above the [[planet]], they explained how a [[sonar]] array maps the seabed, how distant galaxies [[spin]], and why a red [[dwarf]] burns for billions of years.", "zh": "望着一颗卫星在行星上方划出一道淡淡的弧线，他们解释声呐阵列如何测绘海床、遥远的星系如何旋转，以及一颗红矮星为何能燃烧数十亿年。"}, {"en": "There was [[plenty]] of time to grasp the real [[extent]] of a universe whose [[total]] age reduces every human calendar to a blink.", "zh": "我们有充裕的时间去领会宇宙真正的广袤——它的总年龄让人类的每一部历法都短如眨眼一瞬。"}, {"en": "Later, crossing a reserve of giant [[redwood]] and low, fragrant [[shrub]], we catalogued riotous [[flora]] and [[fauna]]: a shaggy [[bison]], an escaped [[ostrich]] adopted by an eccentric warden, and timid mammals thick with winter [[fur]].", "zh": "后来，在穿过一片生长着巨型红杉与低矮芬芳灌木的保护区时，我们把缤纷繁茂的动植物一一登记在册：一头毛发蓬乱的野牛、一只被性情古怪的管理员收养的走失鸵鸟，还有长着浓密冬毛的胆怯哺乳动物。"}, {"en": "Beyond a thundering [[waterfall]], we rode [[horseback]] along the ridges, while our photographer, developing each [[snapshot]] in a portable [[darkroom]] with [[collodion]] plates, filed every print in a waterproof [[folder]].", "zh": "在一道水声轰鸣的瀑布之外，我们沿着山脊骑马前行；与此同时，我们的摄影师用火棉胶底片在便携式暗房里冲洗每张快照，再把每一张样片归入一只防水文件夹。"}, {"en": "At dusk an [[entourage]] arrived — a mining [[mogul]], a charming [[rogue]], and a visiting [[duchess]] of distant lineage — filling a restored [[Persian]] [[caravansary]] with laughter.", "zh": "黄昏时分，一队人马到来——一位矿业大亨、一个迷人的无赖，还有一位出身遥远世系的来访公爵夫人——让修复后的波斯商队客栈充满了笑声。"}, {"en": "The keeper melted [[butter]] over steaming [[rice]], ladled fragrant [[soup]], broke bars of dark [[chocolate]], and refused to [[poach]] the river trout his guests requested.", "zh": "店主在热腾腾的米饭上化开黄油，舀出香气扑鼻的汤，掰开一块块黑巧克力，却拒绝偷捕客人们点名要吃的河鳟。"}, {"en": "When the musicians struck up, travellers began to [[clap]], and the sheer [[pleasure]] of the evening dissolved every rank.", "zh": "乐师们奏起乐曲，旅人们开始鼓掌，而这个夜晚那份纯粹的快乐消融了一切等级。"}, {"en": "Yet the living world we had come to [[preserve]] is under siege.", "zh": "然而，我们远道而来想要保护的这个生机盎然的世界，正身陷重围。"}, {"en": "Where a [[plant]] once [[flourish]]ed and bore [[fruit]], [[scarcity]] now rules.", "zh": "曾经植物繁茂、果实累累的地方，如今由匮乏主宰。"}, {"en": "Governments that [[dispose]] carelessly of public land promote [[greenwash]] instead of genuine carbon [[sequestration]].", "zh": "那些随意处置公共土地的政府，推行的是“漂绿”，而非真正的碳封存。"}, {"en": "A preventable [[epidemic]] of tobacco-related disease persists wherever visitors [[smoke]] in protected valleys, so [[anti-smoking]] wardens no longer [[fume]] helplessly but enforce a firm rule [[against]] lit cigarettes.", "zh": "只要有游客在受保护的山谷里吸烟，一场本可预防的烟草相关疾病就会持续蔓延；因此，禁烟管理员们不再只是无助地发火，而是执行一条严格的规定：禁止点燃香烟。"}, {"en": "These [[sober]] rules made the journey more, not less, [[enjoyable]].", "zh": "这些冷静的规定让旅途变得更有乐趣，而非更少。"}, {"en": "A [[soothing]] routine offered genuine [[comfort]], kept us [[healthy]], and reminded even the [[young]] among us that a [[hundred]] small disciplines, taken in [[full]] measure, [[plus]] a willingness to pause, provide their own quiet [[reward]].", "zh": "一套抚慰人心的日常节奏带来了真切的安慰，让我们保持健康，甚至提醒我们当中最年轻的人：上百项微小的自律，若能十足充分地践行，再加上愿意停下脚步的心态，自会给予人悄然的回报。"}, {"en": "Sleep grew deep and [[sound]], judgment became [[solid]], and the path, once rough, grew steadily [[smooth]].", "zh": "睡眠变得深沉而酣畅，判断力变得扎实，而那条曾经崎岖的小路，也日渐平整起来。"}, {"en": "I had expected to [[dislike]] such restraint, even to feel [[distaste]] for its [[infuriating]] rigidity, and during the first [[uneasy]] days it was [[apparent]] that old habits die hard.", "zh": "我本以为自己会厌恶这种克制，甚至会对它那令人恼火的刻板感到憎恶；在最初那些不安的日子里，积习难改这一点显而易见。"}, {"en": "What followed was [[astonishing]]: silence, [[genuinely]] welcomed, began to [[infuse]] the camp with something close to [[soul]], and when a storm tore our map, no guide needed to [[plead]] or utter a desperate [[plea]].", "zh": "随之而来的一切令人惊讶：受到真诚欢迎的沉默，开始把一种近乎灵魂的东西注入营地；当暴风雨撕碎我们的地图时，没有一位向导需要恳求，也无需发出绝望的哀求。"}, {"en": "The [[claimant]] to leadership brandished an [[invalid]] compass and was gently relieved of command.", "zh": "那个觊觎领导权的人挥舞着一只失灵的罗盘，随即被温和地解除了指挥权。"}, {"en": "Back home, the scholars who [[fund]] fieldwork and [[collect]] oral histories know how to [[combine]] rigour with wonder, yet universities [[expend]] vast sums and [[expand]] campuses to [[invent]] metrics and [[introduce]] audits that no [[successful]] teacher trusts.", "zh": "回到国内，那些资助实地考察、采集口述历史的学者懂得如何把严谨与惊叹结合起来；然而大学耗费巨资、扩建校园，为的是发明各种衡量指标、推行连一位成功教师都不信任的考核审计。"}, {"en": "We treat education like a [[performer]]'s [[tournament]], a [[play]] staged for anxious [[playgoing]] parents, forgetting that a genuine [[playgoer]] attends for revelation rather than ranking.", "zh": "我们把教育当作一场演员的锦标赛、一场为焦虑的看戏家长们搭台上演的戏剧，却忘记了真正的戏迷到场是为了寻求启示，而非为了排名。"}, {"en": "So when I began to [[return]], I resolved to [[review]] my priorities, [[revise]] my schedule, [[revive]] neglected friendships, and [[revitalize]] the neighbourhood garden — small projects that cannot [[solve]] everything but can [[finish]] what they start.", "zh": "所以，当我开始返程时，我决心重新审视自己的轻重缓急，修订日程安排，重拾被疏忽的友谊，让社区花园重焕生机——这些小小的计划不能解决一切，却能善始善终。"}, {"en": "Travellers who [[come]] home from such [[experience]] learn one [[important]] lesson: to [[sort]] signal from noise and [[retain]] what matters.", "zh": "从这样的经历中归家的旅人，会学到重要的一课：从噪声中分拣出信号，留住真正重要的东西。"}, {"en": "[[Thankfully]], that lesson arrived before my patience, like my visa, ran out.", "zh": "庆幸的是，这一课在我的耐心——就像我的签证一样——耗尽之前到来了。"}, {"en": "Now a narrow [[slit]] of dawn crosses my desk, and ambition in [[disguise]] still whispers that the [[plain]] life wastes [[genius]].", "zh": "如今，一道狭窄的晨曦横过我的书桌，而乔装打扮的野心仍在低语：平淡的生活会浪费天赋。"}, {"en": "Yet a mere [[handful]] of unhurried mornings, a brisk [[shower]], and the [[color]] of wet stone — call it [[colour]] too, for both spellings hold — persuade me otherwise.", "zh": "然而，仅仅几个不慌不忙的清晨、一阵清爽的阵雨，以及湿石头的颜色——拼作 color 也好，colour 也罢，两种拼写都成立——便把我说服了。"}, {"en": "An [[intricate]], [[soft]] joy is the [[sole]] reward for those who neither [[explode]] with frustration nor [[disregard]] their limits.", "zh": "一种细腻而温柔的喜悦，是那些既不因挫败而暴怒、也不无视自身局限之人所能得到的唯一回报。"}, {"en": "With [[pluck]] we may build [[better]] habits, shed the [[delusion]] of endless growth, [[discontinue]] pointless meetings, and let the office [[backlog]] wait.", "zh": "凭着勇气，我们或许可以养成更好的习惯，抛却无限增长的错觉，停止毫无意义的会议，让办公室里积压的工作暂且等一等。"}]}, {"key": "三星词汇 Day 10 List 19", "words": [{"w": "int  "adj.牛奶的；乳品的n.乳品店", "si": [11], "dists": [2545, 881, 3328]}], "sents": [{"en": "In the high desert of [[Arizona]], where a [[scattered]] line of homesteads clings to the [[rim]] of a red sandstone [[ridge]], a narrow [[road]] follows a shallow [[river]] across the open [[prairie]].", "zh": "在亚利桑那州的高原沙漠上，一排稀稀落落的农舍紧贴着红色砂岩山脊的边缘，一条狭窄的公路顺着一条浅浅的小河穿过开阔的草原。"}, {"en": "Life [[around]] here has never been easy, yet every [[inhabitant]] of the small [[community]], whether a lifelong [[dweller]] or a recent arrival, speaks of the landscape with stubborn affection.", "zh": "这里的生活从来都不容易，然而这个小社区的每一位居民——无论世居于此的老住户还是新近到来者——谈起这片土地时都带着一种执拗的眷恋。"}, {"en": "Twenty years ago a food-processing [[company]] employed half the town; when it closed, the [[tragedy]] was not a single catastrophe but a slow [[doom]].", "zh": "二十年前，一家食品加工公司雇佣着镇上一半的人；它倒闭时，悲剧并非一场突如其来的浩劫，而是一种缓慢的覆灭。"}, {"en": "The [[workday]] vanished for hundreds of [[unemployed]] workers, [[monthly]] rents went unpaid, and the [[workload]] of caring for families fell heavily on women.", "zh": "数百名失业工人失去了工作日，月租无人缴纳，照料家庭的重担重重地压在妇女身上。"}, {"en": "Neither the [[poor]] nor the once [[rich]] were spared, although the [[wealthy]] landowners could at least move elsewhere to rebuild.", "zh": "穷人和曾经的富人都未能幸免，尽管富有的地主至少还能搬到别处重建生活。"}, {"en": "During the [[interim]] years, healthcare became the cruellest burden.", "zh": "在这段过渡的岁月里，医疗成了最残酷的负担。"}, {"en": "Elderly residents with [[arthritis]] relied on [[medicaid]] and cheap [[medication]] from the lone [[drugstore]], where every patented [[drug]] seemed designed to empty a working man's [[pocket]].", "zh": "患关节炎的老年居民依靠医疗补助和镇上唯一一家药店里的廉价药物维持，而那里的每一种专利药似乎都旨在掏空一个劳动者的口袋。"}, {"en": "The pharmacist would [[occasionally]] waive a fee, and small mercies of that kind kept the town's [[spirit]] from breaking entirely.", "zh": "药剂师偶尔会免去一笔费用，正是这类小小的善意使小镇的精神没有彻底崩溃。"}, {"en": "Then Daniel, an [[upstart]] engineer in his late twenties, chose to [[arrive]] home rather than chase a coastal career.", "zh": "后来，年近三十的新锐工程师丹尼尔选择回到家乡，而不是去沿海追逐事业。"}, {"en": "His [[ride]] into town ended at his grandmother's porch, where he talked of [[broadband]] cables, [[mobile]] classrooms and data links fast enough to [[download]] a lecture in seconds.", "zh": "他搭车回到镇上，行程的终点是祖母家的门廊；在那儿，他谈起宽带电缆、移动教室，以及几秒之内就能下载完一场讲座的数据链路。"}, {"en": "Skeptics laughed at [[rocket]] science on the prairie, but Daniel insisted that connectivity could [[revolutionize]] the town and make a once-impossible [[dream]] genuinely [[possible]].", "zh": "怀疑者们嘲笑在草原上搞尖端科技，但丹尼尔坚持认为，互联互通能够彻底改变小镇，让曾经不可能的梦想真正成为可能。"}, {"en": "The [[farm]] belt surrounding the town still produced [[corn]], [[wheat]], [[cotton]] and [[soybean]] crops, while irrigated fields yielded [[potato]] rows and a family [[dairy]] delivered milk at dawn.", "zh": "小镇周围的农业带依然出产玉米、小麦、棉花和大豆，灌溉田里长出一排排土豆，一家家庭乳品店在黎明时分送奶。"}, {"en": "Farmers continued to [[sow]] winter rye and bale the leftover [[straw]], following rhythms older than any startup.", "zh": "农民们继续播种冬黑麦，把剩余的秸秆打捆，遵循着比任何初创公司都古老的节律。"}, {"en": "When rains finally [[pour]]ed, they would [[pound]] the hardpan, [[splash]] against the eaves and [[drain]] away within hours; in dry months farmers had to [[squeeze]] every [[drip]] from the aquifer and watch the soil [[suck]] moisture from perforated hoses.", "zh": "雨水终于倾盆而下时，会猛砸在硬磐上，溅打屋檐，不出几个小时便排流殆尽；干旱的月份里，农民不得不从含水层中挤出每一滴水，眼看着土壤从带孔的水带中吸取水分。"}, {"en": "A [[ripe]] tomato therefore tasted of patience as much as of sun.", "zh": "因此，一颗熟透的番茄尝起来，耐心的滋味与阳光的滋味一样多。"}, {"en": "A bitter [[divide]] soon separated those who trusted Daniel's plan from those who saw it as fantasy.", "zh": "一道尖锐的分歧很快把信任丹尼尔计划的人和把它视为幻想的人分隔开来。"}, {"en": "Water [[policy]], land policy and broadband subsidies became one tangled [[issue]], and every [[item]] on the council agenda seemed to [[involve]] the same quarrel.", "zh": "水政策、土地政策和宽带补贴纠缠成同一个复杂问题，议会议事日程上的每一项似乎都牵涉同样的争吵。"}, {"en": "Daniel's [[point]] was simple: access to information was a civic [[right]], not a privilege.", "zh": "丹尼尔的观点很简单：获取信息是一项公民权利，而非特权。"}, {"en": "Reformers grew [[righteous]], the demand grew [[urgent]], and each [[policymaker]] in the state capital began to feel the pressure.", "zh": "改革者们变得义愤填膺，诉求变得日益紧迫，州府的每一位决策者都开始感受到压力。"}, {"en": "Admittedly, the economics were [[complex]].", "zh": "诚然，其中的经济账错综复杂。"}, {"en": "The sheer [[complexity]] of federal grants can [[complicate]] even modest projects, and no one could [[assess]] or [[evaluate]] the scheme without honest data.", "zh": "联邦拨款本身的极端复杂就足以让哪怕规模不大的项目也举步维艰；没有真实可靠的数据，谁也无法评估这一方案。"}, {"en": "[[Perhaps]] a smaller pilot was wiser; [[either]] path, the council admitted, carried risk, and nobody could honestly claim the plan was [[complete]].", "zh": "或许先搞一个更小的试点更为明智；市议会承认，两条路都有风险，也没有人能诚实地声称这个计划已经完备。"}, {"en": "A few elders continued to [[doubt]] whether fibre optic cables belonged beneath cattle trails.", "zh": "几位长者仍在怀疑，光纤电缆是否该埋在牛走的小道下面。"}, {"en": "A [[rival]] telecom firm soon arrived to [[compete]], masquerading as a white knight.", "zh": "一家竞争的电信公司很快赶来分一杯羹，把自己伪装成白衣骑士。"}, {"en": "Every [[bidder]] promised the sky, and one [[giant]] corporation made an [[offering]] that included a [[handsome]] signing bonus and a pledge to [[double]] local speeds within a year.", "zh": "每一个竞标者都许下天大的诺言，一家大公司开出的条件包括一笔丰厚的签约奖金，以及一年内将本地网速提升一倍的承诺。"}, {"en": "Its claims of [[costless]] installation proved [[illusory]], however, and its [[overly]] polished executives left behind only thicker contracts.", "zh": "然而，其所谓免费安装的说法被证明只是幻影，那些过于光鲜的高管只留下了更厚的合同。"}, {"en": "At the town-hall meetings residents dared to [[ask]] questions and [[complain]] about past betrayals.", "zh": "在市政厅会议上，居民们敢于提出问题，抱怨过去遭受的一次次背叛。"}, {"en": "Daniel's [[persuasion]] rested on evidence rather than slogans; he asked listeners to [[refrain]] from applause until the end and [[explicitly]] listed what each household would pay.", "zh": "丹尼尔的说服力建立在证据而非口号之上；他请听众们等到最后再鼓掌，并明确列出每户人家将要支付的费用。"}, {"en": "Questions that were [[irrelevant]] he answered politely rather than dismissing as [[pointless]], and his [[pointed]] replies restored a [[common]] sense that facts still mattered.", "zh": "对于无关紧要的问题，他也礼貌作答，而不是斥之为毫无意义；他一针见血的回答恢复了人们的一种共识——事实依然重要。"}, {"en": "The surrounding hills were notoriously [[fire-prone]], and a single lightning strike could [[pose]] a lethal threat, with dry grass serving as both [[source]] and fuel.", "zh": "周围的山丘是出了名的火灾高发区，一次雷击就可能构成致命威胁，干枯的野草既是火源又是燃料。"}, {"en": "Wildfire is a strange [[weapon]]: it carries no [[poison]] yet [[spread]] with equal cruelty, and a long [[spell]] of heat can [[terrify]] even veterans.", "zh": "野火是一种奇异的武器：它不含毒药，却以同样的残忍蔓延；而长时间的持续高温，连经验丰富的老手也会心惊胆寒。"}, {"en": "Winds [[spook]]ed the ranch horses, and ember clouds glowed red in the night.", "zh": "大风让牧场的马群受惊，余烬汇成的云团在夜色中泛着红光。"}, {"en": "The emergency forced everyone to [[refocus]].", "zh": "这场紧急情况迫使所有人重新集中注意力。"}, {"en": "Neighbours helped [[arrange]] evacuation rosters and [[pool]] equipment, building a [[robust]] volunteer network that did not wait for official orders.", "zh": "邻里们帮忙安排疏散名单、凑集设备，建起一个强大的志愿者网络，不等官方命令便自行行动。"}, {"en": "Crews managed to [[disengage]] the town's solar [[circuit]] before flames reached the substation, cutting [[power]] manually; families learned which doors to [[lock]] and which roads to use, [[otherwise]] risking entrapment in the smoke.", "zh": "抢修队在大火逼近变电站之前设法切断了镇上的太阳能电路，以手动方式断电；家家户户弄清了该锁哪些门、走哪些路，否则就有可能在浓烟中被困。"}, {"en": "Recovery revealed the [[role]] technology could play.", "zh": "灾后恢复展现了技术所能发挥的作用。"}, {"en": "Daniel helped a cooperative [[post]] job openings online, negotiate a [[raise]] for care workers and watch local wages [[rise]] as remote contracts appeared.", "zh": "丹尼尔帮助一家合作社在网上发布招聘信息，为护工争取加薪，并眼看着随着远程合同的出现，本地工资不断上涨。"}, {"en": "New questions did [[arise]]—about data privacy and absentee landlords—and the changes could [[arouse]] suspicion, yet success continued to [[spur]] initiative.", "zh": "新的问题确实出现了——关于数据隐私和在外房东——这些变化也可能引起猜疑，但成功仍在不断激发人们的主动性。"}, {"en": "The [[drive]] to rebuild would [[span]] an entire generation.", "zh": "重建的动力将跨越整整一代人。"}, {"en": "An [[art]] collective invited a local [[poet]] to read at the reopening [[concert]], and every regular [[concertgoer]] recognised someone on stage.", "zh": "一个艺术团体邀请一位本地诗人在重新开幕的音乐会上朗诵，而每位常来的音乐会观众都能认出台上的某个人。"}, {"en": "The [[line-up]] mixed [[romantic]] ballads with [[postmodern]] electronic pieces; the [[spotlight]] favoured no [[popular]] celebrity but the teachers and mechanics in the [[dress]] circle.", "zh": "演出阵容把浪漫民谣与后现代电子乐曲混搭在一起；聚光灯没有偏爱任何流行名流，而是眷顾了前排正厅里的教师和技工。"}, {"en": "As the [[mood]] softened, children danced without self-consciousness.", "zh": "随着气氛柔和下来，孩子们毫不忸怩地跳起舞来。"}, {"en": "A student newspaper chose to [[document]] the recovery, and a long [[article]] became a minor [[revelation]].", "zh": "一份学生报纸选择记录这场复苏，一篇长文成了小小的启示。"}, {"en": "It showed that the [[irresponsibility]] of distant officials, not local laziness, had deepened the crisis; readers no longer felt judged by a [[jury]] of strangers.", "zh": "它表明，加深危机的是远方官员的不负责任，而非本地人的懒惰；读者们不再觉得自己正受一群陌生人组成的陪审团审判。"}, {"en": "Paranoia about a corporate [[spy]] quietly died, and the town regained its moral [[compass]], its ambition aimed forward like an [[arrow]] rather than backward in blame.", "zh": "对企业间谍的偏执悄然消散，小镇重新找回了道德罗盘，它的抱负像一支箭一样指向前方，而不是回头沉溺于指责。"}, {"en": "The [[domain]] of nature, that wider [[sphere]] in which every human [[kingdom]] is finally embedded, did not vanish during the crisis.", "zh": "自然的领域——那个人类的一切王国最终都嵌于其中的更广阔的范围——在危机期间并未消失。"}, {"en": "Ecologists counted a [[single]] surviving colony of an endangered [[species]] in the canyon—the [[third]] such census in a [[dozen]] years—and learned to [[compare]] census figures that [[fluctuate]] with the rains.", "zh": "生态学家在峡谷中清点出某一濒危物种仅存的一个种群——这是十二年来第三次此类普查——并学会比较随雨水多少而波动的普查数据。"}, {"en": "The [[internal]] logic of the ecosystem, its [[inherent]] discipline, began at the [[root]] of every blighted bush.", "zh": "生态系统的内在逻辑，它固有的秩序，始于每一丛枯萎灌木的根部。"}, {"en": "A trained [[eye]] could [[spot]] minute changes, [[pore]] over petal samples and watch seeds [[drift]] on the [[round]] thermals above the cliffs.", "zh": "训练有素的眼睛能察觉细微的变化，仔细研读花瓣样本，注视着种子在悬崖上方环形的上升热气流中飘荡。"}, {"en": "Maria nursed her [[spouse]] through chemotherapy, slipping a wedding [[ring]] back onto his thin finger and placing a [[rose]] beside his plate on good mornings.", "zh": "玛丽亚照料丈夫度过化疗，把婚戒重新套上他消瘦的手指，在他状态好的早晨把一枝玫瑰放在他的餐盘旁。"}, {"en": "Some days hope seemed to [[roll]] away like a loose [[rock]]; when his weight continued to [[drop]], she felt her own [[posture]] sag and her face grow [[drawn]].", "zh": "有些日子，希望似乎像松动的岩石一样滚走；当他的体重持续下降，她感到自己的身姿也蔫了下来，面容日渐憔悴。"}, {"en": "She refused to [[drag]] her grief through every conversation, refused to [[spit]] bitterness at the healthy, and treated self-pity as a [[silly]] luxury, even when a sudden [[rip]] in the clinic's budget threatened to [[arm]] every pessimist with fresh evidence and pull the whole household [[down]].", "zh": "她不肯让悲伤拖进每一次谈话，不肯把苦涩吐向健康的人，而把自怜视为一种愚蠢的奢侈——即便诊所预算突然裂开大口，威胁着要用新证据武装每一个悲观者、把整个家庭拖垮时，她依然如此。"}, {"en": "Online retailers would [[overpack]] trivial goods, persuading people to [[spend]] beyond need and, [[unintentionally]], to [[downgrade]] their own standards of sufficiency.", "zh": "网络零售商总是把微不足道的商品过度包装，劝人们超出需要地花钱，并无意识中降低了自己对“够用”的标准。"}, {"en": "The debate could [[draw]] in even the young, and it sometimes [[split]] families; a former Olympic [[athlete]] on the council argued with striking [[clarity]] that to [[simplify]] life was not poverty but a mature [[conception]] of freedom.", "zh": "这场辩论甚至能把年轻人也卷进来，有时还让家庭产生分歧；市议会中的一位前奥运选手以惊人的清晰条理论证道，简化生活不是贫穷，而是对自由的成熟理解。"}, {"en": "[[Aside]] from a few libertarians, most voters accepted that [[space]]—quiet, uncluttered, shared—was itself a kind of wealth.", "zh": "除了少数自由意志主义者，大多数选民都认同：空间——安静、整洁、共享的空间——本身就是一种财富。"}, {"en": "By the [[successive]] harvests that followed, the [[population]] had stabilized.", "zh": "到了此后接连而来的一个个收获季，人口已经稳定下来。"}, {"en": "No one pretended that a fibre cable was a magic [[spear]] or that every utility [[pole]] along the highway guaranteed happiness.", "zh": "没有人假装一根光缆是魔法长矛，也没有人假装公路沿线的每一根公用事业电线杆都能保证幸福。"}]}, {"key": "三星词汇 Day 10 List 20", "words": [{"w": "dry", "phon": "[draɪ]", "def": "adj.干的v.变干", "si": [35], "dists": [3327, 2545, 1177]}, {"w": "effect", "phon": "[ɪˈfekt]", "def": "n.影响；作用；效果；效应v.引起；实现；使生效", "si": [0], "r": "ef(出)+fect(做)→做出来的结果", "dists": [392, 567, 2962]}, {"w": "practice", "phon": "[ˈpræktɪs]", "def": "n.练习；实践；惯常做法v.练习；从事；习惯做", "si": [1], "dists": [466, 2608, 2565]}, {"w": "route", "phon": "[rut]", "def": "n.路线；途径", "si": [0], "dists": [3134, 1763, 3245]}, {"w": "spymaster", "phon": "[ˈspaɪmæstər]", "def": "n.间谍组织的首脑", "si": [40], "dists": [1697, 2767, 2118]}, {"w": "asteroid", "phon": "[ˈæstərɔɪd]", "def": "n.小行星", "si": [37], "r": "aster(星)+oid(像)→像星的", "dists": [819, 821, 3431]}, {"w": "due", "phon": "[du]", "def": "adj.预期的；应给的；到期的", "si": [1], "dists": [1299, 1046, 3205]}, {"w": "praise", "phon": "[preɪz]", "def": "v.赞美；赞扬n.赞美；赞扬", "si": [13], "dists": [975, 3217, 1942]}, {"w": "stable", "phon": "[ˈsteɪb(ə)l]", "def": "adj.稳定的；牢固的；稳重的n.马厩；畜舍", "si": [4], "dists": [1388, 3406, 3423]}, {"w": "condition", "phon": "[kənˈdɪʃ(ə)n]", "def": "n.状态；条件；环境v.使适应；影响；保养", "si": [33], "dists": [171, 264, 32]}, {"w": "dumb", "phon": "[dʌm]", "def": "adj.哑的；沉默的；愚笨的", "si": [4], "dists": [1046, 3209, 3334]}, {"w": "row", "phon": "[rəʊ]", "def": "n.排；划船；吵闹v.划船；吵架", "si": [3], "dists": [2311, 1630, 1407]}, {"w": "staff", "phon": "[stæf]", "def": "n.职员；全体职工；棍棒；拐杖v.为…配备职员", "si": [8], "dists": [295, 1350, 3421]}, {"w": "astray", "phon": "[əˈstreɪ]", "def": "adv.迷路地；误入歧途地adj.迷路的；误入歧途的", "si": [3], "dists": [791, 1739, 23]}, {"w": "precious", "phon": "[ˈpreʃəs]", "def": "adj.珍贵的；宝贵的", "si": [49], "dists": [183, 823, 1560]}, {"w": "royal", "phon": "[ˈrɔɪəl]", "def": "adj.皇家的；盛大的", "si": [38], "dists": [180, 3290, 3287]}, {"w": "stage", "phon": "[steɪdʒ]", "def": "n.阶段；时期；舞台v.举行；上演", "si": [2], "dists": [3410, 824, 3336]}, {"w": "durable", "phon": "[ˈdʊrəb(ə)l]", "def": "adj.耐用的；持久的", "si": [ si": [22], "r": "vid(看)+eo→能看的影像", "dists": [2004, 1504, 1411]}, {"w": "however", "phon": "[haʊˈevər]", "def": "adv.不过；然而；无论如何；不论到什么程度", "si": [48], "dists": [3004, 967, 2910]}, {"w": "bag", "phon": "[bæɡ]", "def": "n.袋子；手包", "si": [31], "dists": [1923, 1527, 1158]}, {"w": "quit", "phon": "[kwɪt]", "def": "v.停止；辞职；离开", "si": [33], "dists": [3102, 729, 1752]}, {"w": "bit", "phon": "[bɪt]", "def": "n.小块；少许；片刻v.咬；叮；上钩； “bite”的过去式", "si": [41], "dists": [2108, 987, 2048]}, {"w": "among", "phon": "[əˈmʌŋ]", "def": "prep.在…之间", "si": [52], "dists": [2603, 706, 3434]}, {"w": "town", "phon": "[taʊn]", "def": "n.镇；城镇；市镇", "si": [39], "dists": [2402, 2160, 136]}, {"w": "might", "phon": "[maɪt]", "def": "v.可能；也许；应该； “may”的过去式n.威力；强大力量", "si": [49], "dists": [3186, 2657, 2366]}, {"w": "badly", "phon": "[ˈbædli]", "def": "adv.坏地；严重地；非常；极度", "si": [29], "dists": [3374, 2233, 1806]}, {"w": "tide", "phon": "[taɪd]", "def": "n.潮汐；潮流", "si": [38], "dists": [1047, 2250, 1978]}], "sents": [{"en": "The [[preface]] of adult life opens when a graduate must choose a [[route]] whose long-term [[effect]] no teacher can fully [[predict]].", "zh": "当一名毕业生不得不选择一条其长远影响连任何老师都无法完全预测的道路时，成年生活的序幕便就此拉开。"}, {"en": "A [[first-timer]] in the labour market is [[due]] to discover that sustained [[practice]] outweighs raw talent, and that diplomas alone seldom secure a rewarding career.", "zh": "初入劳动力市场的人终会发现，持续的练习胜过天生的才华，而单凭文凭很少能谋得一份有价值的事业。"}, {"en": "At this [[stage]], achievement demands [[stamina]] rather than a sudden [[rush]] of enthusiasm.", "zh": "在这个阶段，成就需要的是持久的耐力，而非一阵突如其来的热情。"}, {"en": "Young people who [[prefer]] shortcuts often wander [[astray]], mistaking a [[row]] of certificates for genuine competence.", "zh": "偏爱走捷径的年轻人往往误入歧途，把一长串证书错当成真正的能力。"}, {"en": "It is [[dumb]] to assume that a [[stable]] salary guarantees security, yet [[during]] every downturn anxious graduates cling to precisely that illusion.", "zh": "以为稳定的薪水就能保证安稳是愚蠢的，然而在每一次经济下行中，焦虑的毕业生恰恰死死抱着这一幻想不放。"}, {"en": "A [[steelworker]] in an industrial [[province]] may watch the [[crude]] output of his [[durable]] craft displaced by machines.", "zh": "工业省份里的一名钢铁工人，或许会眼睁睁看着自己耐久手艺所出产的粗制品被机器取代。"}, {"en": "When a plant grinds to a [[standstill]], [[unemployment]] rises [[alarmingly]], and the [[statistics]] released by the [[state]] document the damage.", "zh": "当工厂逐渐陷入停顿时，失业率便以惊人的速度攀升，国家发布的统计数据记录下了这一损害。"}, {"en": "The [[underlying]] lesson is that no [[standard]] of living preserves itself.", "zh": "其背后的教训是：没有哪种生活水平能够自行维持下去。"}, {"en": "Companies that [[run]] on [[autopilot]], whose [[staff]] treat daily work as a lifeless [[rut]], soon [[ruin]] their own prospects.", "zh": "那些靠自动驾驶模式运转、员工又把日常工作当作毫无生气的老一套的公司，很快就会毁掉自己的前途。"}, {"en": "A worker's [[duty]] is not merely to [[attend]] the office but to [[prepare]] for change.", "zh": "工人的职责不仅仅是到办公室上班，还要为变化做好准备。"}, {"en": "Every [[member]] of an organization should [[consider]] whether habitual routines accelerate or obstruct [[progress]].", "zh": "组织中的每一个成员都应当思考：习惯性的例行公事究竟是在加速还是在阻碍进步。"}, {"en": "[[Confidence]] grows from systematic [[training]], not from empty [[rhetoric]].", "zh": "信心来自系统的训练，而非空洞的言辞。"}, {"en": "A [[confident]] professional keeps a [[journal]], reviews mistakes honestly, and refuses to [[indulge]] in self-pity.", "zh": "自信的专业人士坚持写日志，诚实地复盘错误，并拒绝沉溺于自怜。"}, {"en": "That [[attitude]] converts each setback into a [[useful]] lesson, while sincere [[praise]], when finally earned, can be accepted with humility.", "zh": "这种态度把每一次挫折都转化为有益的教训；而当真诚的赞美终于凭努力赢得时，也能以谦逊之心坦然接受。"}, {"en": "By contrast, a [[dishonest]] employee may [[steal]] [[credit]] belonging to colleagues or [[overpay]] associates from company funds.", "zh": "相比之下，不诚实的员工可能会把属于同事的功劳窃为己有，或动用公司资金向关系户支付过高的报酬。"}, {"en": "When investigators [[oversee]] the books, an [[audit]] often exposes the [[stain]].", "zh": "当调查人员审查账目时，审计往往会让污点暴露出来。"}, {"en": "Wrongdoers may hire an [[attorney]], threaten to [[sue]], or bargain for [[consent]], but documentary [[proof]] rarely vanishes.", "zh": "作恶者也许会聘请律师、威胁起诉，或是讨价还价谋求私了，但书面证据很少会凭空消失。"}, {"en": "Beyond the courtroom, citizens [[protest]] when a powerful [[predator]] exploits public trust.", "zh": "在法庭之外，当有权有势的掠夺者滥用公众信任时，公民便会奋起抗议。"}, {"en": "A [[democrat]] who genuinely believes in [[unity]] must defend honest institutions instead of excusing corruption for partisan gain.", "zh": "真正信奉团结的民主人士必须捍卫诚信的制度，而不是为了一党之私纵容腐败。"}, {"en": "An elected [[steward]] of public resources should never treat tax revenue as private [[moola]], for governing is not an [[auction]] where policy goes to the highest bidder.", "zh": "掌管公共资源的民选管理者绝不应把税收当作私人钱财，因为治国并非一场政策归最高出价者所有的拍卖。"}, {"en": "The digital era can [[augment]] human capacity enormously.", "zh": "数字时代能够极大地增强人类的能力。"}, {"en": "A single [[website]] or mobile [[program]] may [[contain]] more knowledge than an old library, while a carefully designed [[programme]] of study can reach a global [[audience]].", "zh": "一个网站或一款手机程序所能容纳的知识，或许比一座老图书馆还要多；而一套精心设计的学习课程则可以触达全球受众。"}, {"en": "Yet learners must [[stay]] [[awake]], because endless [[video]] clips [[consume]] attention that deep reading requires.", "zh": "然而学习者必须保持清醒，因为无穷无尽的视频片段会消耗深度阅读所需要的注意力。"}, {"en": "A [[screen]] may deliver an [[immersive]] [[attraction]], but [[bite-sized]] entertainment frequently becomes a [[trap]].", "zh": "屏幕也许能带来沉浸式的吸引，但短小零碎的娱乐往往会变成一个陷阱。"}, {"en": "[[Initially]], such platforms feel richly rewarding: every [[photograph]] of a holiday or a meal wins instant approval.", "zh": "起初，这类平台让人觉得回报丰厚：每一张度假或用餐的照片都能立刻赢得赞许。"}, {"en": "Posters [[confuse]] personal [[attractiveness]] with social [[status]], forgetting that online glamour is merely [[skin-deep]].", "zh": "发帖者把个人魅力与社会地位混为一谈，却忘记了网络上的光鲜不过是肤浅的表象。"}, {"en": "Going [[offline]] for intervals is no disgrace; it gives the [[prefrontal]] cortex room to recover, and even a hyper-[[connected]] society still requires periods of silence.", "zh": "不时离线并非耻辱；它让前额叶皮层有恢复的空间，即便是一个高度互联的社会也仍然需要静默的时光。"}, {"en": "Take the [[automotive]] sector, where a restored [[vehicle]] can [[fetch]] a remarkable price.", "zh": "以汽车行业为例：一辆经过修复的汽车能卖出惊人的价钱。"}, {"en": "Manufacturers once pledged lifelong employment; today that [[promise]] has grown fragile.", "zh": "制造商们曾承诺终身雇佣；如今，这一承诺已变得脆弱不堪。"}, {"en": "Executives who [[award]] themselves generous bonuses while plants close display [[disrespect]] for loyalty, and a redundant [[fitter]] feels the [[sting]] of betrayal [[badly]].", "zh": "高管们在工厂相继倒闭之际给自己发放丰厚奖金，表现出对忠诚的漠视，而被裁撤的钳工则深切地尝到了被背叛的刺痛。"}, {"en": "[[Economically]], households adapt by watching every [[buck]] and by distinguishing lasting [[property]] from passing fads.", "zh": "在经济层面，各个家庭靠看紧每一美元、靠区分持久的财产与昙花一现的时尚来适应时世。"}, {"en": "True [[happiness]] is rarely a designer [[bag]], and a ripe [[berry]] shared with friends may give more pleasure than hoarded [[stock]].", "zh": "真正的幸福很少是一只名牌包；与朋友分享的一颗成熟浆果，也许比囤积的股票带来更多快乐。"}, {"en": "In [[spite]] of relentless advertising, people can learn to be [[content]] with enough.", "zh": "尽管广告无休无止、铺天盖地，人们仍然可以学会知足于所拥有的一切。"}, {"en": "Before they [[quit]] compulsive shopping, consumers should examine the [[condition]] that drives it.", "zh": "在戒掉强迫性购物之前，消费者应当审视驱使这种行为的心理状态。"}, {"en": "Marketers [[unleash]] a [[strategy]] of [[entitlement]], suggesting that everyone deserves luxury beyond their means, and the [[expression]] of identity through brands is treated as an [[absolute]] right.", "zh": "营销者祭出一套“应得感”策略，暗示每个人都配得上超出自身财力的奢侈品，而借助品牌来表达身份也被当成一种绝对的权利。"}, {"en": "Without discipline, even a [[dry]], careful budget can crumble into [[dust]].", "zh": "若缺乏自律，即便是一份冷静、审慎的预算也可能崩塌成尘土。"}, {"en": "Beyond personal finance, a [[biologist]] studying [[ecology]] observes how species share a fragile [[site]].", "zh": "除个人理财之外，研究生态学的生物学家会观察各个物种如何共享一处脆弱的栖息地。"}, {"en": "A distant [[asteroid]] or a warming [[sea]] recalls that [[prehistoric]] extinctions were terrifyingly real.", "zh": "遥远的小行星或不断变暖的海洋提醒人们：史前的物种灭绝曾真实得令人恐惧。"}, {"en": "Every [[star]] visible on a [[starry]] night obeys physical laws older than the [[tide]], and villagers along the [[Avon]] ding]] security with answers that remain [[broadly]] credible, for trust is the essential [[precondition]] of freedom—more [[precious]] than temporary [[glory]] and never to be seized through [[might]].", "zh": "他们必须随时准备就安全问题作答，而答案必须始终大体可信，因为信任是自由不可或缺的前提——它比一时的荣耀更加珍贵，也绝不能凭借武力夺取。"}, {"en": "Reform will not [[happen]] by itself while citizens slump on the [[couch]] and wait for heroes.", "zh": "当公民瘫在沙发上等待英雄降临时，改革不会自行发生。"}, {"en": "[[Immediately]] after an election, the [[average]] citizen must remain alert instead of growing [[lazy]].", "zh": "选举刚刚结束，普通公民就必须保持警觉，而不是变得懈怠。"}, {"en": "Communities that [[rid]] themselves of apathy will [[welcome]] difficult argument and count engaged deliberation [[among]] their most [[worthwhile]] pursuits.", "zh": "摆脱了冷漠的社区会乐于接纳艰难的论辩，并把全身心投入的审慎商议视作最值得追求的活动之一。"}]}]};

function lemmas(low){
  const c=new Set([low]);const add=x=>c.add(x);
  if(low.endsWith('ies')&&low.length>4)add(low.slice(0,-3)+'y');
  if(low.endsWith('ied')&&low.length>4)add(low.slice(0,-3)+'y');
  if(low.endsWith('es')&&low.length>3){add(low.slice(0,-2));add(low.slice(0,-1));}
  if(low.endsWith('s')&&!low.endsWith('ss')&&low.length>3)add(low.slice(0,-1));
  if(low.endsWith('ing')&&low.length>5){add(low.slice(0,-3));add(low.slice(0,-3)+'e');if(low.length>6&&low[low.length-4]===low[low.length-5])add(low.slice(0,-4));}
  if(low.endsWith('ed')&&low.length>4){add(low.slice(0,-2));add(low.slice(0,-1));if(low.length>5&&low[low.length-3]===low[low.length-4])add(low.slice(0,-3));}
  if(low.endsWith('er')&&low.length>4)add(low.slice(0,-2));
  if(low.endsWith('est')&&low.length>5)add(low.slice(0,-3));
  if(low.endsWith('ly')&&low.length>3)add(low.slice(0,-2));
  return c;
}

function dueData(){

const sess=document.getElementById('sess');

function wordOf(k){const p=k.split('/');return DATA.lists[+p[0]-1].words.find(w=>w.w===p[1]);}
function openNew(n){openNew2([n]);}
/* 连续学习会话：新词 + 每5分钟原地复习本周期词 + 每30分钟(按总计时)复习30分钟池，直到两个List学完，全部进12h队列 */
function openNew2(lists){
  const items=[];lists.forEach(n=>DATA.lists[n-1].words.forEach(w=>{const k=n+'/'+w.w;if(!RV.words[k])items.push({k,n,wd:w});}));
  if(!items.length){toast('这些 List 已全部学完');return;}
  S={mode:'new2',lists,queue:items,idx:0,again:[],cycle:[],bucket:[],doneCount:0,phase:'study',touched:[],total:items.length,pending30:false,finalFlush:false,n5:0,n30:0,study:null,label:''};
  startSess('📖 今日学习 · '+lists.map(n=>'List'+String(n).padStart(2,'0')).join('+'));
}
function openRevGroup(n,s){
  const keys=[];const now=Date.now();
  Object.keys(RV.words).forEach(k=>{const st=RV.words[k];const d0=nextDue(st);if(st.s===s&&d0!==null&&+k.split('/')[0]===n&&now>=d0)keys.push(k);});
  if(!keys.length){toast('该组没有到期词');renderDash();return;}
  S={mode:'rev',n,queue:shuffle(keys.map(k=>({k,n,wd:wordOf(k)}))),again:[],idx:0,total:keys.length,touched:[]};
  startSess('复习 · List '+String(n).padStart(2,'0')+' · '+LAB[s]);
}
function openRevAll(){
  const dd=dueData();const keys=[];dd.groups.forEach(g=>g.keys.forEach(k=>keys.push(k)));
  if(!keys.length){toast('没有到期词');return;}
  S={mode:'rev',n:0,queue:shuffle(keys.map(k=>({k,n:+k.split('/')[0],wd:wordOf(k)}))),again:[],idx:0,total:keys.length,touched:[]};
  startSess('复习 · 全部到期');
}
function startSess(label){
  document.getElementById('dashWrap').style.display='none';
  sess.style.display='block';
  S.label=label;
  S.sessStart=Date.now();
  if(S.mode==='new2'){S.cycleStart=S.sessStart;S.next30=S.sessStart+30*6e4;}
  setPhaseUI();
  if(S.timerInt)clearInterval(S.timerInt);
  S.timerInt=setInterval(()=>{
    const el=document.getElementById('cTimer');
    if(el&&S.cardStart)el.innerHTML='⏱ 思考中 <b>'+((Date.now()-S.cardStart)/1000).toFixed(1)+'</b> 秒';
  },100);

function fmtHMS(ms){const s=Math.floor(ms/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0');}
function fmtMS(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function setPhaseUI(){
  if(S.mode!=='new2'){sess.className='';document.getElementById('sMode').textContent=S.label;return;}
  sess.className=S.phase==='r5'?'ph-r5':(S.phase==='r30'?'ph-r30':'');
  document.getElementById('sMode').textContent=S.phase==='r5'?'🔄 5分钟周期复习':(S.phase==='r30'?'🔄 30分钟周期复习':S.label);
}
/* 总计时 & 周期倒计时（学习阶段每5分钟触发周期复习；总计时每30分钟触发30分钟池复习） */
function tickS2(){
  if(!S)return;
  const now=Date.now();
  const elT=document.getElementById('sTotalT');if(elT)elT.textContent=fmtHMS(now-S.sessStart);
  if(S.mode!=='new2')return;
  const elC=document.getElementById('sCycleT');
  const elP=document.getElementById('sPools');
  if(elP)elP.textContent='5分钟周期池 '+S.cycle.length+' 词 · 30分钟池 '+S.bucket.length+' 词 · 已入12h队列 '+S.doneCount+' 词';
  if(S.phase==='study'){
    const left=5*6e4-(now-S.cycleStart);
    if(elC)elC.textContent=left>0?fmtMS(left):'00:00';
    if(left<=0){
      if(S.cycle.length){startReview('5');return;}
      S.cycleStart=now;
    }
    if(now>=S.next30){S.next30+=30*6e4;if(S.bucket.length){startReview('30');return;}}
  }else{
    if(elC)elC.textContent='复习中';
    if(now>=S.next30){S.next30+=30*6e4;if(S.bucket.length)S.pending30=true;}
  }
}
function startReview(kind){
  const qm=document.getElementById('quizMask');if(qm)qm.classList.remove('show');
  if(S.phase==='study')S.study={queue:S.queue,idx:S.idx,again:S.again};
  S.phase=kind==='5'?'r5':'r30';
  S.queue=shuffle((kind==='5'?S.cycle:S.bucket).slice());
  S.idx=0;S.again=[];
  setPhaseUI();
  toast(kind==='5'?'⏰ 5分钟到了！原地复习本周期 '+S.queue.length+' 词':'⏰ 30分钟到了！复习30分钟池 '+S.queue.length+' 词');
  renderCard();
}
function endReview(kind){
  if(kind==='r5'){S.n5++;toast('✅ 5分钟周期复习完成 · 单词已放入30分钟周期池');}
  else{S.n30++;toast('✅ 30分钟复习完成 · 这些词今天搞定，12小时后见');}
  if(S.pending30&&S.bucket.length){S.pending30=false;startReview('30');return;}
  if(S.finalFlush){checkFinish();return;}
  S.phase='study';S.cycleStart=Date.now();
  S.queue=S.study.queue;S.idx=S.study.idx;S.again=S.study.again;
  setPhaseUI();renderCard();
}
function checkFinish(){
  if(S.cycle.length){startReview('5');return;}
  if(S.bucket.length){startReview('30');return;}

}

function sentHtml(en,target){
  return en.split(/(\[\[[^\[\]]+?\]\])/).map(p=>{
    if(!p.startsWith('[['))return esc(p);
    const form=p.slice(2,-2);
    let low=form.toLowerCase().replace(/’/g,"'").replace(/‑/g,'-');
    const hit=low===target||lemmas(low).has(target);
    return hit?'<mark class="thl">'+esc(form)+'</mark>':esc(form);
  }).join('');
}

  document.getElementById('bQuiz').addEventListener('click',()=>pick('quiz'));
  document.getElementById('bYes').addEventListener('click',()=>pick('yes'));
  document.getElementById('cNext').addEventListener('click',()=>{S.idx++;renderCard();});
}
function answer(a,advance){
  const it=S.queue[S.idx];const now=Date.now();
  if(S.mode==='new2'){
    if(S.phase==='study'){
      const old=RV.words[it.k];
      RV.words[it.k]={t0:(old&&old.t0)||now,t:now,s:0};
      if(a==='no')S.again.push(it);else S.cycle.push(it);
    }else if(S.phase==='r5'){
      const st=RV.words[it.k];st.t=now;
      if(a==='no'){S.again.push(it);}
      else{
        st.s=1;
        const ci=S.cycle.findIndex(x=>x.k===it.k);
        if(ci>=0){S.cycle.splice(ci,1);S.bucket.push(it);}
        if(a==='mid')S.again.push(it);
      }
    }else{ /* r30 */
      const st=RV.words[it.k];st.t=now;
      if(a==='no'){S.again.push(it);}
      else{
        st.s=2;
        const bi=S.bucket.findIndex(x=>x.k===it.k);
        if(bi>=0){S.bucket.splice(bi,1);S.doneCount++;}
        if(a==='mid')S.again.push(it);
      }
    }
    S.touched.push(it.k);save();
    if(advance){S.idx++;renderCard();}
    return;
  }
  if(S.mode==='new'){
    const old=RV.words[it.k];
    RV.words[it.k]={t0:(old&&old.t0)||now,t:now,s:0};
    if(a==='no')S.again.push(it);
  }else{
    const st=RV.words[it.k];st.t=now;
    if(a==='yes')st.s=Math.min(8,st.s+1);
    else if(a==='mid'){st.s=Math.min(8,st.s+1);S.again.push(it);}
    else{st.s=0;S.again.push(it);}
  }
  S.touched.push(it.k);
  save();
  if(advance){S.idx++;renderCard();}
}
/* ---------- 4-choice quiz on "认识" ---------- */
function openQuiz(){
  const it=S.queue[S.idx];const w=it.wd;
  const opts=[{t:true,def:w.def||''}];
  (w.dists||[]).forEach(pi=>{if(POOL[pi])opts.push({t:false,def:POOL[pi].def||''});});
  while(opts.length<4)opts.push({t:false,def:POOL[Math.floor(Math.random()*POOL.length)].def||''});
  shuffle(opts);
  const mask=document.getElementById('quizMask');
  mask.innerHTML='<div class="qbox"><div class="qh">请选出正确释义 · 来自 3 个拼写相似词的干扰项</div>'
    +'<div class="qw">'+esc(w.w)+'</div><div class="qph">'+esc(w.phon||'')+'</div>'
    +'<div class="qask">以下哪一个是 <b>'+esc(w.w)+'</b> 的中文意思？</div>'
    +'<div class="qopts">'+opts.map((o,i)=>'<div class="qopt" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o.def)+'</div>').join('')+'</div>'
    +'<div class="qfb" id="qfb"></div></div>';
  mask.classList.add('show');
  let answered=false;
  mask.querySelectorAll('.qopt').forEach(el=>{
    el.addEventListener('click',()=>{
      if(answered)return;answered=true;
      const i=+el.dataset.i;const correct=opts[i].t;
      const fb=document.getElementById('qfb');
      if(correct){el.classList.add('correct');fb.textContent='✅ 回答正确，已进入下一轮';fb.className='qfb ok';
        setTimeout(()=>{mask.classList.remove('show');if(S&&S.queue[S.idx]===it)answer('yes',false);},650);}
      else{el.classList.add('wrong');
        mask.querySelectorAll('.qopt').forEach(x=>{if(opts[+x.dataset.i].t)x.classList.add('correct');x.classList.add('disabled');});
        fb.textContent='❌ 答错了，正确答案已标绿，本轮再过一次';fb.className='qfb no';
        setTimeout(()=>{mask.classList.remove('show');if(S&&S.queue[S.idx]===it)answer('mid',false);},1100);}
    });
  });
}
function renderDone(){
  if(S.timerInt)clearInterval(S.timerInt);
  /* 整轮完成：本轮所有作答词的「重新计时基准」统一更新为现在（5分钟/30分钟轮次的相对计时起点） */
  const rnow=Date.now();S.touched.forEach(k=>{const st=RV.words[k];if(st)st.t=rnow;});
  if(S.checkKey){RV.checks[S.checkKey]=rnow;}
  save();
  document.getElementById('sBarFill').style.width='100%';
  document.getElementById('sProg').textContent='本轮完成';
  const totalSec=(Date.now()-S.sessStart)/1000;
  const mm=Math.floor(totalSec/60),ss=Math.round(totalSec%60);
  const avg=(totalSec/S.total).toFixed(1);
  const timeLine='<p>⏱ 本轮总用时 <b>'+(mm?mm+'分':'')+ss+'秒</b> · 共 <b>'+S.total+'</b> 词 · 平均 <b>'+avg+'</b> 秒/词</p>';
  let msg='';
  if(S.mode==='new2'){
    msg='<p><b>'+S.lists.map(n=>'List '+String(n).padStart(2,'0')).join(' + ')+'</b> 全部拿下！</p>'
      +timeLine
      +'<p>新学 <b>'+S.total+'</b> 词 · 过程中完成 5分钟周期复习 <b>'+S.n5+'</b> 轮 · 30分钟周期复习 <b>'+S.n30+'</b> 轮</p>'
      +'<p>📦 全部单词已进入「<b>12小时后</b>」复习队列——按首次学习总时间计算，到点本页响铃提醒，之后按 1天 → 2天 → 4天 → 7天 → 15天 推进。</p>';
  }else if(S.mode==='new'){
    msg='<p><b>List '+String(S.n).padStart(2,'0')+'</b> 新学完成，'+S.total+' 词已进入记忆周期。</p>'
      +timeLine
      +'<p>⏰ 5 分钟倒计时已从现在开始，到点会响铃提醒（在其它页面右下角也会弹出提醒）。<br>之后：30分钟（按本轮完成重新计时）→ 12小时起按首次学习总时间推进 1天 / 2天 / 4天 / 7天 / 15天。</p>'
      +'<p class="muted">建议现在顺手读一遍对应埋词短文加深印象：List'+String(S.n).padStart(2,'0')+'.html</p>';
  }else{
    msg='<p>本轮 <b>'+S.total+'</b> 词复习完成！下一轮倒计时已从现在开始重新计时。</p>'+timeLine+'<p class="muted">12小时及以后的轮次按首次学习总时间计算；未到期的词会在计划页显示倒计时。</p>';
  }
  document.getElementById('cardBox').innerHTML='<div class="done"><h2>🎉 本轮完成</h2>'+msg+'<div style="margin-top:18px;display:flex;gap:10px;justify-content:center"><button class="btn" id="doneBack">返回计划页</button>'
    +(BACK?'<button class="btn g" id="doneRet">← 返回 '+esc(BACK)+'</button>':'')+'</div></div>';
  document.getElementById('doneBack').addEventListener('click',exitSess);
  if(BACK)document.getElementById('doneRet').addEventListener('click',()=>{location.href=BACK;});
}
document.addEventListener('keydown',e=>{
  if(!S||sess.style.display==='none')return;
  if(e.key===' '||e.key==='Enter'){
    e.preventDefault();
    const card=document.getElementById('fcard');
    if(card&&card.classList.contains('flip')){S.idx++;renderCard();}
    return;
  }
  const map={'1':'bNo','2':'bMid','3':'bQuiz','4':'bYes'};
  if(map[e.key]){const b=document.getElementById(map[e.key]);if(b&&!b.disabled)b.click();}
  if(e.key==='Escape'){const m=document.getElementById('quizMask');if(m.classList.contains('show'))m.classList.remove('show');else exitSess();}
});
setInterval(()=>{if(!S&&sess.style.display==='none'&&RV.start)renderDash();},30000);
renderDash();

</script>
